    title: "Prospective evidence"
    paragraphs:
      - text: "Binding, cryo-EM, modest initial Kd, OrthoRep maturation / TcdB neutralization for selected lineage. Это prospective binding + function, не proof общего превосходства над всеми antibody generators."
