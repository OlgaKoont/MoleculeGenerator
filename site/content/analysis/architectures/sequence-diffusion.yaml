        end
    mermaid_caption: "Схема класса по Austin reverse, Alamdari D3PM, Lisanza Fig. 1b, HuAb Fig. 1, HuDiff Fig. 1a — не копипаст paper figures. Generator отделён от AF/ESM LL и от assay."
    mermaid_source: "Austin reverse; Alamdari Fig. 1C; Lisanza Fig. 1b; HuAb Fig. 1; HuDiff Fig. 1a"
  - id: training
    title: "9. Training procedure"
    paragraphs:
      - text: "Единого split класса нет. Не выводить EvoDiff split из README. Не смешивать UniRef50 с OAS paired."
        source: INTERPRETATION
      - text: "EvoDiff-Seq: 42M UniRef50. 38M: 8×V100 ~2 weeks ~700k steps; 640M: 32×V100 23 days без сходимости (OADM и D3PM-Uniform). MSA 372 296 train / 10 000 val. $t\\sim U\\{1,\\ldots,T-1\\}$ D3PM. Test ppl: sample t, corrupt, one forward; **числа S1 NR**."
        source: PAPER
        locator: "Alamdari Methods training; 42M; 23 days"
      - text: "Симуляция vs wet-lab EvoDiff: pLDDT/scPPL — in silico. Prospective OADM (не D3PM): IDR Cox15; Ca2+; MDM2 BLI — preprint. Не приписывать D3PM."
        source: PAPER
        locator: "EvoDiff-Seq = OADM for downstream"
      - text: "PG: PDB RF set; t uniform [0,T]; 40/30/30 tasks. Unconditional 70–80 aa, 25 steps, filter AF2 pLDDT>90 RMSD<2 Å — **симуляция отбора**, затем expression. Training T — NR."
        source: PAPER
        locator: "Unconditional protein generation filters"
      - text: "HuAb: 80? split HTML не даёт train/val ratio — **NR** besides 22 mAb test. 22 in silico vs 3 ELISA clones — не смешивать."
        source: NR
      - text: "HuDiff: 19:1. Pretrain human paired; finetune mouse ~20k. Nb: VH pretrain then VHH finetune. In silico HuAb348/Humab25 vs HEK BLI 2B04 — разные oracles."
        source: PAPER
        locator: "19:1 splits; Fig. 3 BLI 2B04"
      - text: "Leakage HuAb 22 mAbs vs OAS — NR. HuDiff experimental mAb vs OAS — NR."
        source: NR
      - text: "Self-conditioning: PG да. EvoDiff D3PM — NR. Teacher forcing HuDiff ARDM да."
        source: PAPER
        locator: "Lisanza self-conditioning"
      - text: "Batch: HuDiff 256; HuAb 64; EvoDiff dynamic. CODE NR."
        source: PAPER
        locator: "HuDiff batch 256; HuAb 64"
  - id: inference
    title: "10. Inference and generation"
    paragraphs:
      - text: "Старт D3PM: uniform AA, length from train ≤2048. PG: Gaussian $L\\times 20$ + black-hole. HuAb: aligned CDRs + 149 MASK. HuDiff: CDRs, FR=`#`, $T=F$."
        source: PAPER
        locator: "each Methods sampling start"
      - text: "Алгоритм: D3PM ancestral Cat $T=500$ (не top-k канон). PG $T_{\\mathrm{inf}}$ 10–50 (25 common); GMM optional; clamp logits. HuAb 512 steps, T=0.7/0.65. HuDiff T iterative unmask FR; Nb `inp` flag."
        source: PAPER
        locator: "PG as few as 10 steps Fig. 1c; HuAb 512"
      - text: "Post-hoc **evaluator**: EvoDiff OmegaFold; PG AF2 pLDDT/RMSD/SAP; HuAb ESM LL + Chai; HuDiff OASis/T20/AbNatiV. Pack/relax не канон D3PM. PG FastRelax — NR в Methods как обязательный."
        source: PAPER
        locator: "filter lists Methods"
      - text: "Чего нет: beam как канон; AF recycle в EvoDiff; ELISA-in-the-loop; CFG ELISA. PG recycle 1–3 — train RF, не assay."
        source: PAPER
        locator: "Lisanza recycle training"
      - text: "HuAb ESM rerank — не diffusion. Не называть LL «affinity head» (авторы цитируют корреляции в литературе, не свою SPR loss)."
        source: PAPER
        locator: "log-likelihood scores ranking paragraph"
      - text: "Argmax vs sample: HuAb temperature; D3PM stochastic reverse. PG GMM vs N(0,I)."
        source: PAPER
        locator: "PG GMM2 GMM3"
      - text: "Partial noising PG $\\lambda\\in(0,1]$ sets start $t=\\mathrm{round}(T\\lambda)$ — local redesign, не full $x_T$."
        source: PAPER
        locator: "Partial noising λ"
      - text: "CLI / service internals HuAb — NR."
        source: NR
  - id: conditioning
    title: "11. Conditioning"
    paragraphs:
      - text: "Зажимается: EvoDiff motif AA identities (OADM clamp; D3PM guidance — future, не default). PG: sequence/structure motif, DSSP, hotspots, contig lengths, compositional/charge/hydropathy potentials, multistate DSSP mix 0.25. Hu*: CDRs visible; HuDiff Nb `inp` FR2."
        source: PAPER
        locator: "Lisanza mixing coefficient 0.25; HuDiff inp"
      - text: "Чего нет: ELISA tensor; measured_var EVOLVEpro; epitope graph PALM; CATH как default EvoDiff."
        source: INTERPRETATION
      - text: "Classifier-free guidance: EvoDiff D3PM discussed as future, не реализованный default. PG sequence-based guidance = potentials on $x_0$, не CFG class labels ELISA."
        source: PAPER
        locator: "Alamdari Discussion guidance; Lisanza amino acid potential"
      - text: "Contig RFdiffusion-style: PG да (Methods spans / SI). EvoDiff/HuAb — не contig-string RFD."
        source: PAPER
        locator: "Lisanza unmask spans motif"
      - text: "MSA conditioner EvoDiff-MSA. HuAb unpaired chains. HuDiff paired Ab."
        source: PAPER
        locator: "Alamdari MSA; HuDiff paired OAS"
      - text: "Library $\\mathcal{X}$ не вход D3PM (unconditional length dist). GB1 PG iterative — four sites V39 D40 G41 V54, 96/round ×3 — **tool-specific campaign**, не humanization."
        source: PAPER
        locator: "Iterative guidance GB1 96 designs three rounds"
      - text: "Function keywords ESM3 — не этот класс."
        source: INTERPRETATION
      - text: "HuAb type embedding 0=CDR 1=V — conditioner, не antigen."
        source: PAPER
        locator: "HuAb type layer 0/1"
  - id: complexity
    title: "12. Вычислительная сложность"
    paragraphs:
      - text: "Драйверы: $L$; $T$ (500 D3PM / 512 HuAb / $F$ HuDiff / $T_{\\mathrm{inf}}$ PG); ByteNet vs $O(L^2)$ attn; MSA $64\\times 512$; RF pair; #samples; AF2 filter NFE; assay latency."
        source: INTERPRETATION
      - text: "PG: solutions in as few as 10 steps (Fig. 1c). «Дешевле RFdiffusion» по NFE — не утверждать: paper сравнивает motif success, wall-clock — SI Table 2 **NR**."
        source: PAPER
        locator: "Fig. 1c 10 steps; RFdiffusion better large proteins Supplementary Fig. 5c"
      - text: "EvoDiff 640M ×500 D3PM vs OADM $L$ steps — разные режимы, не «дешевле Cartesian» без NFE table."
        source: INTERPRETATION
      - text: "HuAb: A100 mentioned; train wall-clock — NR. HuDiff batch 256, lr 1e-4 — не sampling GPU-hours."
        source: PAPER
        locator: "HuAb Nvidia A100; HuDiff Adam 1e-4"
      - text: "EvoDiff train 8×/32×V100 — PAPER. Не переносить на HuAb A100."
        source: PAPER
        locator: "Alamdari 8 vs 32 V100"
      - text: "CODE throughput — NR."
        source: NR
  - id: strengths
    title: "13. Преимущества"
    paragraphs:
      - text: "Из постановки: любой subset можно зажать (маска/clamp) без AR order; D3PM оставляет возможность переписать токен каждый шаг (guidance). PG sequence guidance (composition, hydropathy) проще, чем в structure-space DDPM — авторский claim."
        source: PAPER
        locator: "Lisanza sequence space rather than structure space"
      - text: "EvoDiff: sequence-only IDRs, где structure generators typically fail (авторский claim). Wet-lab **OADM**, не D3PM. Не обобщать на класс D3PM."
        source: PAPER
        locator: "IDR inpainting; EvoDiff-Seq OADM"
      - text: "PG: motif AF2 RMSD<2, motif RMSD<1, pAE<5 (in silico); experimental soluble designs, disulfides 3–4 Cys, CD thermostable. **Не** antibody. Не Kd."
        source: PAPER
        locator: "Fig. 4c motif; Cys mass spec 3–4 disulfides"
      - text: "HuDiff: hAb1.2 $K_D$ 0.15 nM vs parent 0.12 nM BLI; 39 mutations; ELISA all five bind. Nb hNb1.1 2.52 nM vs 5.47 nM (54%). **Одна** 2B04 и две Nb серии preprint. Не класс, не HuAb ELISA ng/ml."
        source: PAPER
        locator: "HuDiff Fig. 3d 0.15 vs 0.12; 2.52 vs 5.47"
      - text: "HuAb ELISA EC50 ng/ml: BAMU-16 2.374 vs 16CM 2.610; BAMU-38 2.081 vs 38CM 2.815; BAMU-13 4.519 vs 13CM 3.093 (не лучше chimeric). Не nM Kd. Table S7 BLI NR cells."
        source: PAPER
        locator: "Table 4 EC50"
      - text: "Явно: sequence plausibility / humanness / pLDDT не гарантия стабильности / аффинности / экспрессии / низкой ADA. HuAb Fig. 5 ELBO vs ADA — retrospective 217 therapeutics, не designs BAMU."
        source: PAPER
        locator: "HuAb Fig. 5 ADA 217"
      - text: "Austin: выбор $Q$ — design decision (uniform vs absorbing vs NN). Не универсальный kernel."
        source: PAPER
        locator: "Austin choice of transition matrix important"
      - text: "Не сравнивать PG 68/soluble E. coli с HuDiff nM как один success column."
        source: INTERPRETATION
  - id: limits
    title: "14. Ограничения"
    paragraphs:
      - text: "Математика: D3PM труднее OADM (Alamdari); absorbing фиксирует AA после unmask (плохо для guidance); PG Gaussian на logits ≠ calibrated Cat; ARDM $T=F$ растёт с CDR-graft length."
        source: PAPER
        locator: "OADM easier than D3PM; OADM fixes identity"
      - text: "Представление: нет 3D у EvoDiff/Hu*; PG RF bias; HuAb AHo pad 149; HuDiff IMGT 291 ghosts `-`."
        source: PAPER
        locator: "pad tokens HuDiff"
      - text: "Физика: нет electrostatics PDE. BLOSUM ≠ mutational process в клетке."
        source: INTERPRETATION
      - text: "Данные: UniRef/OAS/PDB biases; HuAb unpaired; HuDiff mouse finetune ~20k; PG no antibody proof."
        source: PAPER
        locator: "Lisanza no antibody-specific; HuDiff 19387"
      - text: "Обобщение: D3PM не выбран для EvoDiff downstream; HuDiff 3 parent series; HuAb 3 ELISA clones; PG miniprotein-scale campaigns."
        source: PAPER
        locator: "three parent HuDiff evidence_summary MATRIX/PAPER"
      - text: "Deployment: EvoDiff MIT preprint; PG MIT+ckpt; HuDiff custom license NR; HuAb commercial service, source NR, GenScript patents pending."
        source: MATRIX
  - id: failures
    title: "15. Failure modes"
    paragraphs:
      - text: "Конкретные ошибки, не «может не сработать»."
        source: INTERPRETATION
    items:
      - "Применить EvoDiff-D3PM API как OADM infill (mutation noise ≠ span MASK)."
      - "Одна $Q_t$ на PG Gaussian и Austin Cat."
      - "Считать ESM LL / pLDDT / OASis измеренным Kd."
      - "Приписать Cox15/MDM2 wet-lab каналу D3PM."
      - "HuDiff как ProGen left-to-right без absorbing FR."
      - "HuAb 22 mAb in silico = 3 ELISA clones."
      - "Humanness / ELBO как clinical ADA для новых BAMU designs."
      - "PG AF2 pLDDT>90 filter как affinity."
      - "Мало D3PM steps ≪500 без paper calibration."
      - "Motif sequence clamp без 3D (EvoDiff) как RFdiffusion scaffolding."
      - "HuAb неполные V (trained on complete AHo 149)."
      - "Сравнить HuDiff 0.15 nM и HuAb EC50 ng/ml как один Kd."
      - "DiffAb joint type channel как sequence-only tool этого id."
      - "UCB на страницу как train (только PG GB1 baseline)."
