sections:
  - id: domain
    title: "1. Область определения"
    paragraphs:
      - text: "Роль — **generator** (density model на дискретной цепи токенов). Не sequential assay loop и не geometric SE(3) inductive bias как определение класса. ProteinGenerator дополнительно декодирует структуру через RoseTTAFold — пересечение с [joint sequence–structure generation](/architectures/joint-sequence-structure-generation.html), не лицензия копировать Cartesian DDPM."
        source: INTERPRETATION
      - text: "Generated state — amino-acid tokens $x_0$ (и, у PG, сопряжённая структура $y$). Intermediate $x_t$ — noisy tokens / scaled logits / [MASK]/`#`, не атомы. Scored embeddings без reverse chain — не этот класс."
        source: PAPER
        locator: "Austin discrete state; Lisanza L×20; Alamdari tokens"
      - text: "Задачи: [general protein sequence generation](/tasks/general-protein-sequence-generation.html) и [motif scaffolding](/tasks/motif-scaffolding.html) ([EvoDiff](/tools/evodiff.html), [sequence-first de novo](/workflows/sequence-first-de-novo.html)); [humanization](/tasks/humanization.html) / [framework redesign](/tasks/framework-redesign.html) ([HuDiff](/tools/hudiff.html), [HuAbDiffusion](/tools/huabdiffusion.html), [humanization-framework](/workflows/humanization-framework.html)); joint/multistate ([ProteinGenerator](/tools/protein-generator.html), [joint-multimodal](/workflows/joint-multimodal-generation.html))."
        source: MATRIX
      - text: "Это **не** [masked-token infilling](/architectures/masked-token-infilling.html) как канон: infill-страница — OADM / ILM / generative MLM. EvoDiff-**D3PM** ($Q$, $T=500$, $x_T$ uniform AA) живёт здесь. OADM у того же tool имеет оба id; уравнения OADM подробно там."
        source: PAPER
        locator: "Alamdari: D3PM only for discrete corruption; OADM for masking"
      - text: "Это **не** [autoregressive generation](/architectures/autoregressive-generation.html) как left-to-right без absorbing FR: ProGen пишет префикс. HuDiff **цитирует** ARDM (Hoogeboom) и также стоит в AR-id каталога — не гадать, что это GPT; train target — order-agnostic unmask FR, не next-token L→R."
        source: PAPER
        locator: "HuDiff Methods vs traditional AR chain rule; extra_constraints"
      - text: "Это **не** [joint sequence–structure diffusion](/architectures/joint-sequence-structure-diffusion.html): DiffAb categorical CDR — **совместный** type+Cα+SO(3) state. Не переносить DiffAb $Q^{\\mathrm{type}}$ как default этого класса. Это **не** [coordinate-diffusion](/architectures/coordinate-diffusion.html) / [frame-diffusion](/architectures/frame-diffusion.html): нет xyz/frames как диффузионный state (PG диффундирует sequence tensor)."
        source: INTERPRETATION
      - text: "Это **не** [protein language models](/architectures/protein-language-models.html) целиком: PLM может быть AR/MLM/frozen $E$. Sequence diffusion задаёт **марковскую** forward/reverse цепь по $t$. ESM LL rerank у HuAbDiffusion — **evaluator**, не generator."
        source: PAPER
        locator: "HuAbDiffusion Variants ranking ESM-1b/1v"
      - text: "Catalog tools: [EvoDiff](/tools/evodiff.html), [HuDiff](/tools/hudiff.html), [HuAbDiffusion](/tools/huabdiffusion.html), [ProteinGenerator](/tools/protein-generator.html). Путают с [RFdiffusion](/tools/rfdiffusion.html) (structure-space), [ProGen](/tools/progen.html), [ESM3](/tools/esm3.html), [DiffAb](/tools/diffab.html) (другой architecture_id)."
        source: MATRIX
  - id: intuition
    title: "2. Интуитивный принцип"
    paragraphs:
      - text: "При inference с $x_T$ (uniform AA, all-MASK, или Gaussian $L\\times 20$) сеть итеративно восстанавливает $x_0$. Меняются **токены** (и у PG — предсказанный fold). Не физическая траектория фолдинга."
        source: INTERPRETATION
      - text: "Четыре несовместимых forward. (i) EvoDiff-D3PM: мутации по $Q$ до uniform. (ii) Absorbing mask: FR → [MASK]/`#`, CDR зажаты (HuAb, HuDiff, EvoDiff-OADM). (iii) ProteinGenerator: Gaussian на scaled one-hot, не Cat $Q$. (iv) DiffAb type channel — joint-страница."
        source: PAPER
        locator: "Alamdari Fig. 1B; Lisanza Eq. 1; HuAb Methods MASK; HuDiff absorbing FR"
      - text: "Рычаг **EvoDiff-D3PM**: выбор Uniform vs BLOSUM $Q$, $T=500$. PAPER. Авторы для downstream взяли **OADM-640M**, не D3PM (ppl и foldability хуже). Guidance как future — D3PM, потому что токен можно править каждый шаг."
        source: PAPER
        locator: "Alamdari selected OADM as EvoDiff-Seq; Discussion guidance fits D3PM"
      - text: "Рычаг **PG**: sqrt noise, self-conditioning, logit clamp $[-3,3]$, guidance potentials (AA composition, charge, hydropathy, DSSP, multistate logit mix), partial noise $\\lambda$. PAPER."
        source: PAPER
        locator: "Lisanza Methods Inference clamp; partial noising λ"
      - text: "Рычаг **HuDiff**: $T=F$ (длина FR), permutation $\\sigma$ FR sites, AbNatiV fine-tune (Gumbel), Nb `de` vs `inp` (сохранить гидрофильный FR2). PAPER."
        source: PAPER
        locator: "t determined by framework length; Nb de/inp"
      - text: "Рычаг **HuAbDiffusion**: $T=512$, temperature 0.7 VH / 0.65 VL, затем ESM log-likelihood **rerank**. PAPER. Rerank ≠ generator."
        source: PAPER
        locator: "HuAb sampling temperatures 0.7 and 0.65; Variants ranking"
      - text: "Предостережение. PPL, OmegaFold/AF pLDDT, motifRMSD, scPerplexity, TM, ESM LL, AbNatiV/OASis, PG design pLDDT, Rosetta **не** $K_d$ / ELISA / BLI / ADA. Humanness ≠ immunogenicity. PG ESM pseudo-perplexity «indicative of experimental success» в цитируемой литературе — не Kd этого класса."
        source: PAPER
        locator: "Lisanza ESM ppl citation; HuAb pLDDT/scPPL tables in silico"
      - text: "EvoDiff Cox15 8/8 и MDM2 BLI — кампании **OADM EvoDiff-Seq**, не D3PM (не переносить на эту страницу как успех D3PM). HuDiff 0.15 nM vs parent 0.12 nM — **experiment** одной murine mAb preprint/journal, не класс."
        source: PAPER
        locator: "Alamdari EvoDiff-Seq = OADM; HuDiff Fig. 3d BLI"
  - id: math
    title: "3. Формальная математическая постановка"
    paragraphs:
      - text: "Сначала родовой D3PM Austin. Затем подтипы с **разными** $Q$/ядрами. Не одна $Q_t$ на EvoDiff, PG и HuDiff. Не подставлять seed one-liner как уравнение инструмента."
        source: INTERPRETATION
      - text: "Формулы, которые **не** являются default этого класса: Ho Cartesian VP-DDPM на xyz; Lipman CFM; UCB (PG сравнивает guidance с qUCB baseline — не train PG); FAPE как уравнение EvoDiff/HuDiff; Meier $\\Delta\\ell$; AR NLL ProGen; DiffAb SO(3)/Cα score; IgLM ILM."
        source: INTERPRETATION
      - text: "FAPE **есть** в train ProteinGenerator (tool-specific) вместе с sequence CE — не родовой loss класса и не EvoDiff. Не сравнивать EvoDiff ppl, PG AF2 filters и HuDiff BLI как один benchmark."
        source: PAPER
        locator: "Lisanza CE on sequence and FAPE on structure"
      - text: "Austin: BERT может быть one-step D3PM; AR — вырожденный discrete diffusion. Это связь классов, не лицензия ставить BERT 15% как EvoDiff-D3PM."
        source: PAPER
        locator: "Austin §4 BERT is a one-step diffusion model"
    equations:
      - latex: "q(x_t\\mid x_{t-1})=\\mathrm{Cat}(x_t;\\, p=x_{t-1}Q_t),\\qquad \\bar Q_t=Q_1\\cdots Q_t"
        caption: "Родовой D3PM (Austin). $Q_t$ — tool-specific. Generic: не checkpoint EvoDiff/HuAb. PG **не** использует эту Cat-$Q$ форму (Gaussian на $L\\times 20$)."
        generic_or_specific: generic
        source: PAPER
        locator: "Austin Eq. after Cat definition; t-step marginal"
        symbols:
          - {sym: "x_t", type: "one-hot token", meaning: "дискретное состояние позиции (или независимо по L)"}
          - {sym: "Q_t", type: "K×K stochastic matrix", meaning: "forward kernel на шаге t"}
          - {sym: K, type: "int", meaning: "размер алфавита"}
        meaning: "Оптимизируется reverse $p_\\theta(x_{t-1}\\mid x_t)$ / $\\tilde p_\\theta(x_0\\mid x_t)$. Семплируется $x_0$ за $T$ шагов. Affinity в $Q$ не входит."
      - latex: "Q_t^{\\mathrm{unif}}=(1-\\beta_t)I+\\beta_t\\mathbf{1}\\mathbf{1}^\\top/K"
        caption: "Родовой uniform kernel (Hoogeboom/Austin). Stationary — uniform. Generic подтип Cat-diffusion."
        generic_or_specific: generic
        source: PAPER
        locator: "Austin Uniform Appendix A.2.1 / Hoogeboom Q"
        symbols:
          - {sym: "\\beta_t", type: "noise level", meaning: "$\\in[0,1]$; schedule tool-specific"}
        meaning: "Forward перемешивает категории равномерно. Не BLOSUM и не Gaussian logits."
    sections:
      - id: math-evodiff-d3pm
        level: 3
        title: "Подтип A — EvoDiff-D3PM Uniform / BLOSUM (не OADM)"
        paragraphs:
          - text: "Hybrid $L_{vb}+\\lambda L_{ce}$, $\\lambda=0$, $T=500$. Uniform: doubly stochastic $Q_t$, schedule $(T-t+1)^{-1}$. BLOSUM62 → softmax → Sinkhorn; $\\beta$-schedule, половина мутаций к $t=250$. Синусоидальный $t$ (не implicit mask count). $x_T$ — uniform AA. Tool-specific [EvoDiff](/tools/evodiff.html). CODE NR."
            source: PAPER
            locator: "Alamdari Methods D3PM λ=0 T=500; Uniform and BLOSUM subsections"
        equations:
          - latex: "\\mathcal{L}=\\mathcal{L}_{vb}+\\lambda\\mathcal{L}_{ce},\\quad \\lambda=0,\\ T=500"
            caption: "EvoDiff-D3PM train (Alamdari). Не OADM $T=L$. Не Austin $\\lambda$ по умолчанию для изображений. $L_{vb}$ три члена как в D3PM; сеть предсказывает $\\tilde p_\\theta(x_0\\mid x_t)$."
            generic_or_specific: "EvoDiff-D3PM [PAPER]; tool-specific"
            source: PAPER
            locator: "Methods hybrid loss; λ=0 all D3PM experiments"
            symbols:
              - {sym: "\\lambda", type: "weight", meaning: "CE auxiliary; выбран 0 после ablation"}
              - {sym: T, type: "int", meaning: "500 mutation steps"}
            meaning: "Train: NLL bound на undo-mutations. Sample: 500 шагов от uniform AA. PPL ≠ fold ≠ Kd."
      - id: math-pg
        level: 3
        title: "Подтип B — ProteinGenerator sequence-space Gaussian (не Cat $Q$)"
        paragraphs:
          - text: "Scaled one-hot: true $=1$, else $-1$ ($\\times 2-1$). Ho forward в непрерывном $L\\times 20$. Sqrt schedule. Loss: CE($x_0$)+FAPE/bond/distogram/lddt на $y$ + KL на $x_{t-1}$. Self-cond. Inference: $x_{t-1}\\sim q(x_{t-1}\\mid x_0)$ лучше чем $q(\\cdot\\mid x_0,x_t)$. Tool-specific [ProteinGenerator](/tools/protein-generator.html)."
            source: PAPER
            locator: "Lisanza Methods Sequence representation Eq. 1; Training; Inference"
        equations:
          - latex: "q(x_t\\mid x_0)=\\mathcal{N}\\bigl(x_t;\\sqrt{\\bar\\alpha_t}x_0,(1-\\bar\\alpha_t)I\\bigr),\\quad x_0\\in\\mathbb{R}^{L\\times 20}"
            caption: "Lisanza Eq. (1). Не Austin Cat. Не xyz coordinate diffusion (state — sequence logits). Training $T$ numeric — NR (SI/README)."
            generic_or_specific: "ProteinGenerator [PAPER]; tool-specific"
            source: PAPER
            locator: "Methods Eq. (1) Ho formulation"
            symbols:
              - {sym: "\\bar\\alpha_t", type: "schedule", meaning: "sqrt noise schedule (ref. 10 in paper)"}
              - {sym: L, type: "length", meaning: "residues"}
            meaning: "Train: предсказать чистую sequence+structure. Sample: $T_{\\mathrm{inf}}$ шагов от Gaussian; часто 25. AF2 filter — evaluator."
      - id: math-huab
        level: 3
        title: "Подтип C — HuAbDiffusion absorbing MASK на FR (не mutation $Q$)"
        paragraphs:
          - text: "D3PM+DiffusionBERT-style: V-region → [MASK], CDR prefix всегда видим. $T=512$. Vocab 26. Не BLOSUM. Не PG Gaussian. Tool-specific [HuAbDiffusion](/tools/huabdiffusion.html). Repo NR."
            source: PAPER
            locator: "Methods discrete Cat Q; CDRs-conditional; 512 steps"
        equations:
          - latex: "x_T^{\\mathrm{FR}}=\\texttt{[MASK]}^{L_{\\mathrm{V}}},\\quad x_t^{\\mathrm{CDR}}=x_0^{\\mathrm{CDR}}\\ \\forall t"
            caption: "Absorbing FR, clamped CDR (HuAb Methods). $L_V=149$ AHo. Не EvoDiff-D3PM uniform AA. Не HuDiff ARDM permutation loss с номером (3)."
            generic_or_specific: "HuAbDiffusion [PAPER]; tool-specific"
            source: PAPER
            locator: "forward noise only on V region; T=512"
            symbols:
              - {sym: "L_{\\mathrm{V}}", type: "int", meaning: "149 aligned V (AHo)"}
            meaning: "Train: unmask FR given CDRs. Sample: 512 steps, T=0.7/0.65. ESM LL — post-hoc evaluator."
      - id: math-hudiff
        level: 3
        title: "Подтип D — HuDiff ARDM absorbing FR (не D3PM $Q_t$)"
        paragraphs:
          - text: "Corrupts FR напрямую (как MLM), не строит $Q_t$. $T=F$ длина FR; $\\sigma\\sim U(S_F)$. Pretrain: $L^{Ab}=F\\cdot L_t + L_{\\mathrm{assistant}}$. Fine-tune: max AbNatiV VH/VL via Gumbel-Softmax. Tool-specific [HuDiff](/tools/hudiff.html). Также architecture_id autoregressive-generation — не ProGen."
            source: PAPER
            locator: "HuDiff Methods Objective function Eqs. 3–8; D3PM constructs Q whereas HuDiff corrupts directly"
        equations:
          - latex: "\\log p(x)\\ge \\mathbb{E}_{t\\sim U(1,\\ldots,F)}[F\\cdot L_t],\\quad L_t=\\frac{1}{F-t+1}\\sum_{k\\in\\sigma(\\ge t)}\\log p(x_k\\mid x_{\\sigma(<t)},x_{\\mathrm{CDR}})"
            caption: "HuDiff pretrain (bioRxiv Eqs. 5–6; Hoogeboom ARDM). $F$=FR length, не 500. Не Austin uniform $Q$."
            generic_or_specific: "HuDiff [PAPER]; tool-specific"
            source: PAPER
            locator: "Methods Eqs. 5–7; t determined by framework length"
            symbols:
              - {sym: F, type: "int", meaning: "число FR позиций (T при inference)"}
              - {sym: "\\sigma", type: "permutation", meaning: "случайный порядок unmask FR"}
            meaning: "Train: order-agnostic FR reconstruction + CDR assistant. Sample: T=F unmask steps from absorbing FR. AbNatiV ≠ Kd."
    tables:
      - headers: ["Постановка", "Train target", "Sampler/декодер", "Что в каталоге"]
        source: INTERPRETATION
        rows:
          - ["Sequence diffusion (эта страница)", "D3PM $L_{vb}$/CE / Gaussian+FAPE / ARDM FR", "T discrete or Gaussian steps", "EvoDiff-D3PM, PG, HuAb, HuDiff"]
          - ["[Masked-token infilling](/architectures/masked-token-infilling.html)", "unmask $s_M\\mid s_{\\setminus M}$", "OADM/ILM/MLM", "EvoDiff-OADM, IgLM, ESM3"]
          - ["[Autoregressive generation](/architectures/autoregressive-generation.html)", "next-token CE L→R", "ancestral prefix", "ProGen; HuDiff также в этом id"]
          - ["[Coordinate diffusion](/architectures/coordinate-diffusion.html)", "score/noise на xyz", "ODE/SDE coords", "RFdiffusion, Chroma — не этот id"]
