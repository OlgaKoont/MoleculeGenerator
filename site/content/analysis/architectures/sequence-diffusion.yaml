  - id: applicability
    title: "17. Где применимо и где не применимо"
    paragraphs:
      - text: "Применимо для sequence-first генерации и motif **sequence** clamp ([EvoDiff](/tools/evodiff.html), [sequence-first-de-novo](/workflows/sequence-first-de-novo.html)); humanization FR от CDR ([HuDiff](/tools/hudiff.html), [HuAbDiffusion](/tools/huabdiffusion.html), [humanization-framework](/workflows/humanization-framework.html)); sequence-space guidance / multistate ([ProteinGenerator](/tools/protein-generator.html)). Задачи [general-protein-sequence-generation](/tasks/general-protein-sequence-generation.html), [humanization](/tasks/humanization.html), [motif-scaffolding](/tasks/motif-scaffolding.html) (sequence-level)."
        source: MATRIX
      - text: "Этим **нельзя** заменять: de novo backbone control ([frame-diffusion](/architectures/frame-diffusion.html), [RFdiffusion](/tools/rfdiffusion.html)); antigen-conditioned Ab 3D ([joint sequence–structure diffusion](/architectures/joint-sequence-structure-diffusion.html)); few-shot ELISA loop ([active-learning](/architectures/active-learning.html)); IF при готовом backbone ([ProteinMPNN](/tools/proteinmpnn.html))."
        source: INTERPRETATION
      - text: "Не использовать D3PM likelihood как Kd. Не использовать HuAb ELBO как ADA новых дизайнов. Нужен binding assay."
        source: MATRIX
      - text: "EvoDiff IDR evidence не делает tool antibody therapeutic generator. PG не имеет antibody wet-lab в primary. HuDiff nM не переносится на HuAb EC50."
        source: INTERPRETATION
