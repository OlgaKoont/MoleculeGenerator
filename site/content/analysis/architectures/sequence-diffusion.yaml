  - id: data-repr
    title: "4. Представление данных"
    paragraphs:
      - text: "Узлы: позиции токенов. Рёбра: ByteNet dilated conv (EvoDiff-Seq), MSA Transformer, RF pair tracks (PG), Transformer/Roformer (HuAb/HuDiff). Time: sinusoidal 1D (EvoDiff-D3PM, HuAb embed time in each block); OADM implicit; PG timestep in sequence template; HuDiff $t$ = сколько FR ещё masked."
        source: PAPER
        locator: "Alamdari sinusoidal vs implicit; HuAb time embedding; Lisanza timestep feature"
      - text: "EvoDiff-Seq: UniRef50, sample length ≤2048. D3PM $K$ = standard AA (+ J,O,U uniform rows; MSA `<GAP>`). Hidden: 38M $d=1020$ 16 layers / 640M $d=1280$ 56 layers. CODE NR."
        source: PAPER
        locator: "Alamdari ByteNet 38M/640M; BLOSUM extra rows"
      - text: "PG: $L\\times 20$ real tensor. DSSP concat 25% train, mask 0–90%. Tasks mix: 40% diffusion, 30% seq2str, 30% fixed-backbone design. Motif: 1–4 spans 4–8 aa или random active-site unmask. Contig — внешний файл/строка, не выученный tensor (CLI NR)."
        source: PAPER
        locator: "Lisanza Training 40/30/30; motif spans"
      - text: "HuAb: OAS 2M H + 2M κ + 2M λ unpaired; AHo 149; North CDR; CDR concat length 64 (H) / 67 (L); vocab 26; input CDR prefix + [SEP] + V. Transformer 12L, 16 heads, $d=1024$. Batch 64 AdamW; lr HTML обрыв — **NR**."
        source: PAPER
        locator: "HuAb Materials dataset; 12 layers 16 heads 1024; batch 64"
      - text: "HuDiff-Ab: IMGT VH 152 + VL 139 = 291; vocab 23 (`-`,`#`,`X`+20 AA). CNN kernel 7. Split pretrain 1,738,321 paired 19:1; finetune mouse 19,387 19:1. Nb length 152. Hidden width Roformer — NR."
        source: PAPER
        locator: "HuDiff Methods 291; 1,738,321; kernel 7"
      - text: "Внешние файлы: PDB для PG templates/hotspots/DSSP; OAS dumps; library CSV нет как вход generator. HuAb service YabXnization — не локальный checkpoint."
        source: PAPER
        locator: "Lisanza optional structural information; HuAb YabXnization URL"
      - text: "Аугментации: EvoDiff MSA Rand vs MaxHamming depth 64×512. PG recycle 1–3 structure; GMM2/GMM3 sampling. HuDiff permutation $\\sigma$ FR. 3D rotation: только PG structure track, не EvoDiff tokens."
        source: PAPER
        locator: "Alamdari MSA 64×512; Lisanza recycle 1–3"
      - text: "Masks: D3PM нет [MASK] канона; absorbing tools — [MASK]/`#` на FR. Classifier-free ELISA — нет."
        source: INTERPRETATION
      - text: "DiffAb type one-hot 21 — не data-repr catalog tools этого id."
        source: INTERPRETATION
  - id: physical-repr
    title: "5. Физическое представление"
    paragraphs:
      - text: "$x_i$ ↔ однобуквенный код (или gap/pad/mask). Assay $y$ (BLI, ELISA, microscopy, CD, SEC) **не** координата диффузии."
        source: INTERPRETATION
      - text: "SE(3): **не применимо** к EvoDiff/HuDiff/HuAb (нет coords в generator state). PG: RF декодирует $y$; диффузионный state — sequence tensor, не IGSO(3). Global rotation ломает PG templates, не EvoDiff tokens."
        source: INTERPRETATION
      - text: "Перестановка residues в биологическом порядке ломает смысл, кроме явного $\\sigma$ HuDiff и OADM. Concat VH||VL: HuDiff-Ab paired 291; HuAb генерирует цепи отдельно (H и L temperatures разные); EvoDiff unpaired UniRef."
        source: PAPER
        locator: "HuDiff paired 291; HuAb 0.7 vs 0.65"
      - text: "Side chains: отсутствуют в EvoDiff/Hu* tokens. PG — в предсказанной структуре RF; pack MPNN не канон (30% train — fixed backbone design task внутри RF)."
        source: PAPER
        locator: "Lisanza 30% fixed backbone sequence design"
      - text: "$x_t$ / `#` / Gaussian logits ≠ фолдинг-траектория и ≠ энергия. AF2/OmegaFold/Chai на generated sequence — **predictor**."
        source: PAPER
        locator: "HuAb Chai pLDDT; Alamdari OmegaFold"
      - text: "Antigen coords: нет у EvoDiff-D3PM/HuAb/HuDiff generator. PG hotspots/DSSP optional. Не ELISA epitope tensor."
        source: PAPER
        locator: "HuDiff CDR-only input; Lisanza hotspot unmask"
      - text: "MSA EvoDiff — evolutionary context, не $y$. Subsample 64."
        source: PAPER
        locator: "Alamdari depth 64"
      - text: "Black-hole init PG structure — математическая заглушка, не физический collapse."
        source: PAPER
        locator: "Lisanza black-hole initialized structure"
  - id: physchem
    title: "6. Физико-химический смысл"
    paragraphs:
      - text: "Нет energy head у EvoDiff-D3PM/HuAb/HuDiff. PG FAPE — геометрический loss RF, не $\\Delta G$ и не SPR. Запрещено писать, что класс «считает $\\Delta G$»."
        source: INTERPRETATION
    physchem:
      - feature: "Identity AA"
        interpretation: "первичная структура"
        encoded: "прямо: Cat tokens / L×20 logits / MASK"
        limitation: "D3PM BLOSUM — статистика подстановок, не mutational chemistry in vivo"
      - feature: "Backbone / frames / torsions"
        interpretation: "3D fold"
        encoded: "EvoDiff/Hu* — не в state; PG — RF decode + FAPE"
        limitation: "pLDDT predictor ≠ crystal; PG design pLDDT ≠ Kd"
      - feature: "Antigen / hotspot"
        interpretation: "интерфейс"
        encoded: "не представлена (Hu*, EvoDiff-D3PM); PG — опциональные templates/hotspots"
        limitation: "humanization tools не antigen-conditioned co-design"
      - feature: "H-bonds / electrostatics / solvation"
        interpretation: "стабильность / NSB"
        encoded: "PG charge/hydropathy guidance косвенно; иначе не явно"
        limitation: "guidance ≠ измеренный pI/SAP как loss EvoDiff"
      - feature: "Evolutionary statistics"
        interpretation: "UniRef / OAS / BLOSUM / germline"
        encoded: "прямо корпуса; BLOSUM Q; AbNatiV fine-tune HuDiff"
        limitation: "OAS unpaired HuAb vs paired HuDiff — разные biases"
      - feature: "Experimental y"
        interpretation: "BLI / ELISA / CD / localization"
        encoded: "не в D3PM/HuAb diffusion loss; HuDiff fine-tune — AbNatiV не BLI; PG iterative GB1 — classifier на fitness, не этот catalog default"
        limitation: "не переносить HuDiff nM на EvoDiff-D3PM"
  - id: learned
    title: "7. Что обучается"
    paragraphs:
      - text: "Параметры $\\theta$ denoiser. Frozen: HuDiff AbNatiV при fine-tune (scores, Gumbel backprop через one-hot). PG — finetune всего RF. Affinity labels в EvoDiff-D3PM / HuAb diffusion **нет**. Negative binders **нет** (кроме искусственного шума)."
        source: PAPER
        locator: "HuDiff Gumbel AbNatiV; Alamdari no assay loss"
      - text: "EvoDiff-D3PM: $L_{vb}$ only ($\\lambda=0$). OADM CE — другой подтип/страница. Adam 1e-4, warmup 16k Seq."
        source: PAPER
        locator: "λ=0; Adam 1e-4 16k warmup"
      - text: "PG: CE sequence + FAPE family + KL $x_{t-1}$. Self-cond. Recycle 1–3. Не ELISA."
        source: PAPER
        locator: "Training CE FAPE KL self-cond"
      - text: "HuAb: discrete diffusion CE (D3PM/DiffusionBERT). Точная $L$ формула с номером Austin в paper не выписана — NR besides absorbing description."
        source: NR
      - text: "HuDiff pretrain ARDM $F\\cdot L_t$ + CDR assistant; finetune max VH/VL AbNatiV. Humanness scores ≠ affinity labels."
        source: PAPER
        locator: "Eqs. 7–8"
      - text: "Pretrain корпуса: UniRef50 42M; PDB+RF data PG; OAS unpaired 6M HuAb; OAS paired 1.74M HuDiff. Не один split."
        source: PAPER
        locator: "each Methods datasets"
      - text: "Fine-tune: HuDiff mouse/VHH; PG DSSP later iterations; EvoDiff scaffolding **без** finetune (same weights). HuAb finetune на ELISA **нет**."
        source: PAPER
        locator: "Alamdari same models unconditional/conditional"
      - text: "Teacher forcing: HuDiff ARDM on remaining masks. PG predicts $x_0$ not teacher-forced tokens. D3PM $x_0$-parameterization Austin (4)."
        source: PAPER
        locator: "Austin Eq. 4 x0 parameterization"
      - text: "CODE optimizers line-by-line — NR."
        source: NR
  - id: forward
    title: "8. Прямой проход и information flow"
    paragraphs:
      - text: "EvoDiff-D3PM: $x_T$ uniform AA → ByteNet($x_t,t$) → sample $x_{t-1}$ ×500 → sequence. OmegaFold / ESM-IF / DR-BERT — **predictor/evaluator**. Не прятать внутрь CNN."
        source: PAPER
        locator: "Alamdari sampling Equation 5; Fig. 2A evaluators"
      - text: "PG: Gaussian $x_T$ + black-hole $y$ → RF predicts $x_0,y$ → noise to $x_{t-1}$ + self-cond → AF2 filter **evaluator** → expression **experiment**. MPNN не обязателен post-hoc (в отличие от RFdiffusion pipeline)."
        source: PAPER
        locator: "Fig. 1b; AF2 filters Methods"
      - text: "HuAb: CDRs + masked V → 512 Transformer steps → ESM-1b/1v LL rank **evaluator** → ELISA/BLI **experiment**. Chai/pLDDT — predictor."
        source: PAPER
        locator: "Fig. 1; Variants ranking"
      - text: "HuDiff: CDRs + `#` FR → Dual CNN + Roformer → unmask order $\\sigma$ $F$ steps → AbNatiV/OASis **evaluator** → BLI **experiment**. `inp` зажимает FR2 Nb."
        source: PAPER
        locator: "Fig. 1a–b; Nb inp"
      - text: "Sequence появляется сразу; geometry — только PG RF decode или внешний AF. Score (ppl, i_pTM-like) — evaluator."
        source: INTERPRETATION
      - text: "EvoDiff-OADM forward — infill-страница, не этот mermaid-канон D3PM."
        source: PAPER
        locator: "OADM T=L"
      - text: "Не прятать ProteinMPNN scPerplexity HuAb внутрь Transformer."
        source: PAPER
        locator: "HuAb scPerplexity ProteinMPNN"
      - text: "CODE graphs — NR."
        source: NR
    mermaid: |
      flowchart TD
        NOISE["x_T: uniform AA or MASK/hash FR or Gaussian Lx20"] --> DEN["Denoiser θ"]
        DEN --> D3["EvoDiff-D3PM: Cat Q T=500 — generator"]
        DEN --> PG["PG: RF predict x0,y then renoize — generator"]
        DEN --> HAB["HuAb: Transformer unmask FR T=512 — generator"]
        DEN --> HD["HuDiff: ARDM unmask FR T=F — generator"]
        D3 --> SEQ["Sequence x0"]
        PG --> SEQ
        HAB --> SEQ
        HD --> SEQ
        PG --> YSTR["RF structure y — entangled decode"]
        SEQ --> LL["PPL / ESM LL / AbNatiV — evaluator"]
        SEQ --> AF["AF2 / OmegaFold / Chai — predictor"]
        YSTR --> AF
        AF --> EXP["ELISA / BLI / CD / microscopy — experiment"]
        subgraph gen ["Generator"]
          DEN
          D3
          PG
          HAB
          HD
        end
        subgraph ev ["Evaluator / predictor"]
          LL
          AF
        end
        subgraph ex ["Experiment"]
