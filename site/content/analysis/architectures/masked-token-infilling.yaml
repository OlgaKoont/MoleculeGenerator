          - ["ESM-2 15% MLM / Meier ESM-1v", "соседний MLM / Δℓ scoring", "нет masked-token-infilling id у ESM-1v tool"]
          - ["AntiFold masked regions", "IF logits", "не UniRef MLM; другой architecture_id"]
          - ["EvoDiff-D3PM", "sequence-diffusion sibling", "не уравнение infill-страницы"]
          - ["Hoogeboom OADM / Austin D3PM papers", "родовые discrete kernels", "номера уравнений без PDF — NR"]
  - id: applicability
    title: "17. Где применимо и где не применимо"
    paragraphs:
      - text: "Применимо для локального sequence redesign при известном контексте: [antibody-sequence-infilling](/workflows/antibody-sequence-infilling.html) ([IgLM](/tools/iglm.html)); sequence-first exploration и motif sequence-clamp ([EvoDiff](/tools/evodiff.html), [sequence-first-de-novo](/workflows/sequence-first-de-novo.html)); multimodal completion ([ESM3](/tools/esm3.html), [joint-multimodal-generation](/workflows/joint-multimodal-generation.html)). Задача [cdr-sequence-generation](/tasks/cdr-sequence-generation.html)."
        source: MATRIX
      - text: "Этим **нельзя** заменять: de novo backbone ([frame diffusion](/architectures/frame-diffusion.html)); antigen-conditioned CDR co-design 3D ([joint sequence–structure diffusion](/architectures/joint-sequence-structure-diffusion.html), [DiffAb](/tools/diffab.html)); few-shot ELISA ([active learning](/architectures/active-learning.html)); zero-shot 19-mutant ranking ([ESM-1v](/tools/esm-1v-efficient-evolution.html)); IF при готовом backbone ([ProteinMPNN](/tools/proteinmpnn.html))."
        source: INTERPRETATION
      - text: "Не использовать IgLM likelihood как specificity к антигену. Нужен antigen structure — не этот класс."
        source: MATRIX
        locator: "antibody-sequence-infilling decision_criteria"
      - text: "EvoDiff IDR/MDM2 evidence не делает инструмент antibody therapeutic generator. ESM3 не имеет primary antibody wet-lab в catalog card."
        source: MATRIX
  - id: method-sources
    title: "18. Методологические источники"
    paragraphs:
      - text: "Foundational: Donahue ILM (цитируется IgLM); Devlin BERT MLM (контраст, не IgLM); Hoogeboom OADM / Austin D3PM (цитируются Alamdari (24)(25)). Catalog: [paper-iglm](/papers/paper-iglm.html), [paper-esm3](/papers/paper-esm3.html), [paper-evodiff](/papers/paper-evodiff.html)."
        source: PAPER
      - text: "Прочитано: IgLM Cell Systems + CODE de819b56; EvoDiff bioRxiv v2 HTML Methods+wet-lab prose; ESM3 bioRxiv (PLM-проход, Science не sync). Pointer-only: Science ESM3 SI; EvoDiff S-tables numbers; evodiff/esm commits; Hoogeboom PDF Eqs."
        source: INTERPRETATION
      - text: "Не библиография всего masked LM: CARP, ESM-MSA как baselines EvoDiff — указаны в paper, не карточки этого id. Не блоги."
        source: INTERPRETATION
