          - ["[ESM3](/tools/esm3.html)", "тот же класс: fill masks", "generative MLM all rates; 1.4/7/98B; multimodal tracks; Biohub/esm commit **NR**; Science SI NR", "Не 15% ESM-2; structure tokens; не antibody-calibrated"]
          - ["[EvoDiff](/tools/evodiff.html)", "OADM absorbing infill", "UniRef50 42M; ByteNet 38M/640M; T=L; inpaint motif/IDR; CODE SHA **NR**; D3PM = другой подтип diffusion", "Не IgLM ILM; wet-lab IDR/Ca2+/MDM2 — preprint, не переносить на IgLM"]
