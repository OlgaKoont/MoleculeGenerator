status_note: "Класс masked-token infilling описан как семейство infill-генераторов, не одна BERT-softmax формула. Прочитаны: Shuai/Ruffolo/Gray IgLM Cell Systems 14, 979–989 (2023) STAR+Results (карточка tools, тот же проход каталога) + Graylab/IgLM @de819b56238b5cb9c23d7a6fec4c55d7fc0395e4; Hayes et al. ESM3 bioRxiv 10.1101/2024.07.01.600583 (generative MLM, variable mask rate; Science 10.1126/science.ads0018 не page-sync); Alamdari et al. EvoDiff bioRxiv 10.1101/2023.09.11.556673 v2 HTML (OADM T=L, inpainting, Methods D3PM vs OADM, wet-lab Cox15/1PRW/MDM2). IgLM Tables S1–S2 не построчно. ESM3 Science SI не close-read. microsoft/evodiff и Biohub/esm commit SHA не аудировались. EvoDiff Table S1–S6 HTML — «View this table», численные ppl/Hamming не транскрибированы. Meier ESM-1v — соседний класс scoring, не catalog tool этого id."
lede: "Masked-token infilling — **generator** (иногда density model) на masked span: восстанавливает $s_M$ при наблюдаемом контексте $s_{\\setminus M}$. Это не inverse folding при фиксированном backbone, не zero-shot $\\Delta\\ell$-ранжирование 19 замен и не affinity predictor. $\\Delta\\mathrm{LL}\\neq\\Delta\\Delta G$."
