            symbols:
              - {sym: T, type: "SE(3)", meaning: "глобальный поворот и сдвиг лабораторной системы"}
            meaning: "Не обучается как constraint-loss; следует из архитектуры. Семплирование sequence не должно зависеть от позы PDB."
      - id: math-ipa
        level: 3
        title: "Подтип B — pair-biased attention / Evoformer-Single + IPA (tFold; tool-specific; AF2 literature)"
        paragraphs:
          - text: "tFold-Ab: ESM-PPI → Evoformer-Single (sequence + pairwise) → IPA structure module → recycle. tFold-Ag docking unit: 32 Evoformer-Single + 8 structure blocks; antibody module frozen при train Ag; antigen features from pretrained AF2 (MSA). Extra sequence recovery head: masked CDR reconstruction + structure supervision (AF-family protocols; exact FAPE weights **NR**). Не копируем SI Algorithm 22. Не Hsu $p(Y\\mid X)$."
            source: PAPER
            locator: "tFold Fig. 3a; Fig. 4a 32+8; Fig. 6a recovery head; Methods dual-task"
        equations:
          - latex: "A_{ij}=\\mathrm{softmax}_j\\bigl(q_i^\\top k_j+b(z_{ij})+\\mathrm{IPA}(T_i,T_j)\\bigr)"
            caption: "Схема класса pair-biased / IPA (INTERPRETATION), не дословный Jumper Algorithm 22 и не display Eq. tFold. $z_{ij}$ — pair track; $T_i=(R_i,t_i)$ local frames; attention на инвариантных расстояниях query/key points; обновление кадров SE(3)-эквивариантно (tFold HTML)."
            generic_or_specific: "schematic [INTERPRETATION]; tFold uses IPA, exact logits NR"
            source: INTERPRETATION
            locator: "tFold structure module IPA citing Jumper; AF2 SI not transcribed"
            symbols:
              - {sym: "z_{ij}", type: "pair embedding", meaning: "Evoformer-Single pairwise representation"}
              - {sym: "T_i", type: "SE(3) frame", meaning: "residue rigid body"}
              - {sym: "b(\\cdot)", type: "pair bias", meaning: "learned function of pair features"}
            meaning: "Train target tFold-Ab — structure (AF-family). Recovery head — masked AA CE. Sampling design — iterative unmask + confidence recycle, затем phage (experiment)."
          - latex: "\\mathrm{AAR}=\\frac{1}{N}\\sum_{i=1}^{N}\\mathbf{1}\\bigl[\\arg\\max_a p_i(a)=y_i^{\\mathrm{obs}}\\bigr]"
            caption: "Amino-acid recovery — ретроспективная метрика IF/design, не $K_D$. AntiFold SI Eq. (3); tFold Fig. 6b CDR-H3 AAR in silico (n=50 SAbDab-22-Design-Ab)."
            generic_or_specific: "metric [SI/PAPER]"
            source: SI
            locator: "AntiFold SI Eq. (3); tFold Fig. 6b"
            symbols:
              - {sym: N, type: "int", meaning: "число оцениваемых позиций (CDR или all)"}
            meaning: "Не оптимизируется как единственный tFold campaign loss; in silico probe."
