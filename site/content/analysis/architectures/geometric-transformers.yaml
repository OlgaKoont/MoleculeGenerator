  - id: data-repr
    title: "4. Представление данных"
    paragraphs:
      - text: "Узлы класса — amino-acid residues (иногда nanobody single chain). Jing/Hsu: proximity graph, $k=30$ nearest Cα. Рёбра Jing: unit vector Cα$_j-$Cα$_i$, 16 Gaussian RBF distances 0–20 Å, sinusoidal sequence-distance $j-i$. Это **вход GVP**, не pair track Evoformer."
        source: PAPER
        locator: "Jing §3.2 k=30; RBF 16 centers 0–20 Å"
      - text: "ESM-IF1 / AntiFold node scalars: $\\{\\sin,\\cos\\}\\circ\\{\\phi,\\psi,\\omega\\}$ (Jing-style dihedrals) + binary mask; vectors: forward/reverse Cα directions + imputed Cβ direction (tetrahedral). Decoder: one-hot AA, causal $i\\to j$ только $i<j$. Hidden $d=512$ — Hsu text (prior); Table A.1 full grid NR."
        source: PAPER
        locator: "Jing node features; Hsu/AntiFold SI 4 GVP + 8+8; d=512 prior Hsu HTML"
      - text: "Time embedding **нет** (это не diffusion/FM). Conditioner tensors: residue masks; chain concat; AntiFold IMGT region strings. ELISA / measured $y$ tensor **нет**."
        source: PAPER
        locator: "AntiFold Fig. 1 region to design; SI masking"
      - text: "Вход сети vs внешний файл: PDB/CIF backbone (N, Cα, C); numbering — IMGT 1–128 для AntiFold region sampling (PAPER/DOC); tFold campaign Table 1 — **Chothia**. Не смешивать IMGT и Chothia без оговорки. Library CSV нет у IF; tFold oligo pools — synthesis after generation, не тензор сети."
        source: PAPER
        locator: "AntiFold IMGT; tFold Table 1 Chothia numbering"
      - text: "AntiFold комплексы: H затем 10 gap tokens (missing coords) затем L — как Hsu complexes. Optional antigen heavy atoms как extra chain (`custom_chain`). Не docking."
        source: SI
        locator: "AntiFold SI concatenated light chain, 10 position padding"
      - text: "tFold-Ab: ESM-PPI sequence/pair features from amino-acid sequence (MSA-free для antibody). tFold-Ag antigen unit: AF2 MSA + pair + initial coords (MSA **есть** у antigen, нет у antibody в Ag module). Epitope — extra inter-chain embedding (tFold-Ag-ppi). Pair representation memory $O(L^2)$."
        source: PAPER
        locator: "tFold-Ab MSA-free ESM-PPI; tFold-Ag antigen AF2 MSA; tFold-Ag-ppi epitope"
      - text: "Размерности tFold Evoformer width / ESM-PPI parameter count в Nat. Commun. HTML **NR** (не выдумывать 650M). tFold-Ag docking: 32 Evoformer-Single blocks + 8 structure blocks — PAPER. tFold-Ab stack depth — NR."
        source: NR
        locator: "tFold-Ab Evoformer-Single block count not in main HTML"
      - text: "Аугментации, меняющие геометрию/токены: Hsu/AntiFold span и shotgun coordinate masks; AntiFold 0.1 Å Gaussian noise на predicted OAS coords; Hsu pLDDT$<90$ mask на predicted train coords (prior). tFold recovery: 30% probability mask CDR AA при co-train (70% keep original). Random rotation как explicit SE(3) aug ESM-IF1 — NR this pass beyond invariance by construction."
        source: PAPER
        locator: "AntiFold SI Gaussian 0.1 Å; tFold Methods 30% CDR mask"
      - text: "Batching Jing CPD (literature): structures grouped by size, max 1800 residues per batch (Appendix D). Hsu/ESM-IF1 batch size — Table A.1 NR. AntiFold: one pass OAS predicted, then SAbDab until 10 epochs without val-loss improvement. tFold: CD-Hit 95% identity, one representative per cluster per epoch."
        source: PAPER
        locator: "Jing Appendix D 1800 residues; AntiFold SI two-phase; tFold Methods CD-Hit 95%"
  - id: physical-repr
    title: "5. Физическое представление"
    paragraphs:
      - text: "Математический $X$ у подтипа A — атомы остова N, Cα, C в лабораторных координатах. $Y$ — идентичность residue (side-chain type), не χ-углы: packing в ESM-IF1/AntiFold отсутствует как decoder. Imputed Cβ vector Jing — тетраэдрическая геометрия, не экспериментальный Cβ."
        source: PAPER
        locator: "Jing backbone-only; AntiFold SI N, Cα, C"
      - text: "Подтип B (tFold-Ab): predicted atomic-level 3D, включая side chains end-to-end (HTML: backbone and side-chain conformations), без Rosetta minimize в отличие от DeepAb/IgFold. Это **predictor output**, не guaranteed crystal pose. tFold-Ag обновляет и antibody, и antigen coords (flexible docking unit)."
        source: PAPER
        locator: "tFold-Ab end-to-end side chains; tFold-Ag updates Ab and Ag structures"
      - text: "SE(3): ESM-IF1 encoder **invariant** к global rotation/translation ($p(Y\\mid TX)=p(Y\\mid X)$) — не equivariant vector head. GVP внутренние $V$ — equivariant к rotations and reflections, пока не спроецированы в local frame. IPA structure module — **equivariant** frame updates (tFold). Global rotation PDB не должна менять IF sequence; должна поворачивать tFold-Ab coords together with input if equivariance holds."
        source: PAPER
        locator: "Jing Eq. 1 reflections; Hsu invariance; tFold IPA SE(3)-equivariant"
      - text: "Перестановка residues ломает пептидную химию и AR order IF. Chain concat H+L с gap tokens — **конвенция**, не физическая симметрия перестановки цепей. tFold nanobody: нет второй Ig chain — другой generated object, чем paired mAb."
        source: PAPER
        locator: "AntiFold SI H+L concat; tFold SAbDab-22H2-Nano"
      - text: "Side chains: отсутствуют в generative state IF; присутствуют в tFold-Ab predicted structure; AntiFold refold RMSD считает backbone N/Cα/C после ABodyBuilder2 — **evaluator**, не AntiFold decoder."
        source: PAPER
        locator: "AntiFold SI RMSD N, Cα, C after ABodyBuilder2"
      - text: "Промежуточный masked node / recycle representation / pair $z_{ij}$ $\\neq$ физическая траектория фолдинга и $\\neq$ энергия. 10 gap tokens $\\neq$ Gly-linker."
        source: INTERPRETATION
      - text: "Chirality: GVP Algorithm 1 equivariant to reflections unless chirality features added — не выдавать автоматическую L-stereo-правильность IF. tFold structure module наследует AF-like frames; stereo failure mode не квантифицирован в HTML (NR)."
        source: PAPER
        locator: "Jing Eq. 1 rotations and reflections"
      - text: "Assay label (SPR $K_D$, phage ELISA OD) **не** координата state сети. Появляется только как внешний experiment после filter."
        source: PAPER
        locator: "tFold Fig. 1b experimental validation downstream of generator+filter"
  - id: physchem
    title: "6. Физико-химический смысл"
    paragraphs:
      - text: "Класс кодирует геометрическую статистику packing и (у tFold) predicted interface. Нет явного energy head: нельзя писать, что сеть «считает $\\Delta G$»."
        source: INTERPRETATION
    physchem:
      - feature: "Amino-acid identity"
        interpretation: "химический тип side chain / sequence token"
        encoded: "прямо как decoder logits (IF) или recovery head (tFold); encoder IF обычно не видит native AA на маске"
        limitation: "CE/recovery ≠ стабильность или $K_D$"
      - feature: "Backbone N/Cα/C and frames"
        interpretation: "пептидная геометрия, φ/ψ, ориентация residue"
        encoded: "прямо coords / dihedral scalars / local frames / IPA $T_i$"
        limitation: "статический snapshot; не MD; IF не двигает backbone"
      - feature: "kNN Cα neighborhood (k=30)"
        interpretation: "локальный packing / contact shell"
        encoded: "прямо как graph edges GVP"
        limitation: "long-range только через Transformer; cutoff ~13 Å (Jing DimeNet comparison)"
      - feature: "Antigen / hotspot / epitope coords or sites"
        interpretation: "интерфейс Ab–Ag"
        encoded: "AntiFold — optional extra chain coords; tFold-Ag-ppi — epitope embedding; Hsu IF1 — complex concat"
        limitation: "не docking energy; не ELISA epitope map"
      - feature: "H-bonds / electrostatics / solvation"
        interpretation: "физические взаимодействия"
        encoded: "не представлены явно; могут быть implicit в structural stats"
        limitation: "нет solvent, glycans, protonation в ESM-IF1/AntiFold"
      - feature: "Side-chain packing / χ"
        interpretation: "стерические clashes rotamers"
        encoded: "tFold-Ab predicted atoms; IF — отсутствует; AntiFold RMSD — post-hoc ABodyBuilder2"
        limitation: "predicted side chains ≠ crystal; packer — evaluator"
      - feature: "Evolutionary statistics"
        interpretation: "семейные частоты AA"
        encoded: "косвенно через CATH/UniRef/OAS/SAbDab sequences; tFold ESM-PPI (ESM-2 further pretrain); IF не MSA at inference"
        limitation: "не замена MSA-based evolutionary coupling как у AF2 antigen unit"
      - feature: "Experimental binding y / SPR / phage"
        interpretation: "измеренная функция"
        encoded: "не в loss IF; tFold train на crystal binders, не на $K_D$; SPR только после display"
        limitation: "нельзя читать log p / ipLDDT как $K_D$"
      - feature: "Pair distogram / $z_{ij}$ / ipLDDT"
        interpretation: "статистика попарных расстояний / model confidence"
        encoded: "learned pair track и confidence head (tFold, AF-like)"
        limitation: "не force field; DockQ correlation ≠ affinity"
  - id: learned
    title: "7. Что обучается"
    paragraphs:
      - text: "Параметры: GVP matrices + Transformer $\\theta$ (подтип A); ESM-PPI (further-pretrained ESM-2) + Evoformer-Single + IPA + recovery head (подтип B). Frozen vs trained: AntiFold fine-tunes весь ESM-IF1 stack (не frozen encoder). tFold-Ag: pretrained tFold-Ab **fixed** while training Ag docking unit. Antigen AF2 unit pretrained, not the IF generator."
        source: PAPER
        locator: "AntiFold FT ESM-IF1; tFold-Ag antibody feature unit remains fixed"
      - text: "Generic loss подтипа A — token CE native sequence (Eq. 1 SI). Negative examples — другие 19 AA на masked/AR позициях, не non-binder antigens. Нет contrastive affinity, нет FAPE в ESM-IF1."
        source: PAPER
        locator: "AntiFold SI loss over masked positions"
      - text: "AntiFold tool-specific: 3:1 CDR vs FR mask sampling weight; span + shotgun (7.5%+7.5%); layer-wise LR $LR_i=LR\\times 0.85^{i}$ ($i=0\\ldots 20$ layers); Gaussian 0.1 Å on predicted coords. Two-phase: one epoch OAS predicted, then SAbDab until 10 epochs no val improvement."
        source: SI
        locator: "AntiFold SI layer-wise decay Eq. (2); two-phase training"
      - text: "Hsu pretrain (prior bioRxiv): CATH experimental + 12M AF2 UniRef50; mix ~1:80 experimental:predicted per epoch; binary token experimental vs predicted; pLDDT$<90$ mask. Fine-tune vs pretrain: AntiFold без ESM-IF1 init — val CDRH3 AAR 31.5% vs 58.4% со всеми augmentations (Table S4 vs S3 narrative). Pretrain — рычаг recovery, не affinity."
        source: PAPER
        locator: "AntiFold Table S4 0.315 CDRH3; main text 31.5% vs 58.4%"
      - text: "tFold-Ab: structure prediction (AF-family supervision; FAPE/distogram weights **NR**). tFold-Ag stage 1 structure only; later stages random CDR masking 30% for joint recovery. Confidence ipTM/ipLDDT — auxiliary heads, не SPR labels."
        source: PAPER
        locator: "tFold three-stage training; 30% mask; established protocols 28, 29"
      - text: "ESM-PPI: further pretrain ESM-2 on monomers **and** multimers — PLM objective (masked/sequence; exact MLM rate **NR** in HTML). Это не geometric transformer loss; pair/structure модули — отдельное обучение."
        source: PAPER
        locator: "tFold ESM-PPI further pre-training monomers and multimers"
      - text: "Jing GVP-GNN CPD (literature): CE на CATH 4.2. MQA: Huber absolute + pairwise ranking on GDT-TS. Не переносить MQA loss на ESM-IF1."
        source: PAPER
        locator: "Jing Appendix D MQA Huber pairwise; CPD NLL"
      - text: "Affinity labels в $\\mathcal{L}$: нет. tFold virtual screen использует confidence trained on binders vs assumed lower scores for non-binders — calibration, не supervised $K_D$."
        source: PAPER
        locator: "tFold trained exclusively on binding pairs; Fig. 5 AUC"
  - id: forward
    title: "8. Прямой проход и information flow"
    paragraphs:
      - text: "Порядок подтипа A: PDB backbone → featurize graph (dihedrals, kNN) → 4 GVP-GNN (scalar+vector) → project vectors into local frames → invariant token sequence → 8 Transformer encoder → 8 AR decoder with causal AA → softmax 20. Sequence появляется в decoder; geometry — только encoder. Likelihood ranking — тот же forward, evaluator."
        source: PAPER
        locator: "AntiFold SI 4 GVP + 8+8; Hsu encoder structure-only"
      - text: "Порядок tFold-Ab: sequence → ESM-PPI (intra/inter-chain features) → Evoformer-Single updates sequence and pair → IPA maps to 3D → recycle previous features/structure. MSA search **нет**. Side chains из structure module, не отдельный packer в сети."
        source: PAPER
        locator: "tFold Fig. 3a four modules; recycling module"
      - text: "Порядок tFold design: FR template + antigen sequence + epitope → tFold-Ag-ppi generator (masked CDRs, iplddt-greedy position, temperature) → predicted complex → filter (tFold-Ag and AlphaFold-Multimer confidence, clash with receptor, novelty edit distance, motif filter, A2binder-like score) → 10k Fabs/target → phage → SPR. Geometric stack здесь generator recovery **и** evaluator; phage — experiment. Не прятать display внутрь «одной IPA сети»."
        source: PAPER
        locator: "tFold Methods candidate selection numbered steps 1–7; Fig. 1a–b"
      - text: "ABodyBuilder2 — train-time structure generator OAS и post-hoc refold evaluator AntiFold, не слой AntiFold inference. AF2 — train corpus Hsu и antigen encoder tFold-Ag, не ESM-IF1 forward."
        source: PAPER
        locator: "AntiFold ABodyBuilder2 train/test; tFold antigen AF2 unit"
      - text: "Не смешивать inverse folding decoder с tFold recycle: у IF backbone clamped; у tFold-Ab coords — выход predictor."
        source: INTERPRETATION
      - text: "Sequence vs geometry vs score: подтип A — geometry только в encoder, sequence в decoder, score = log $p$ той же сети. Подтип B — sequence уже на входе ESM-PPI; geometry появляется в IPA; score = ipLDDT/ipTM/iplddt отдельных голов. Не читать любой score как $K_D$."
        source: PAPER
        locator: "Hsu encoder structure-only; tFold Fig. 3–6 heads"
      - text: "Inverse folding packer, AF check и ABodyBuilder2 refold — внешние модули. Не прятать их внутрь «одной geometric transformer сети», если это другой checkpoint."
        source: INTERPRETATION
      - text: "tFold-Ag antigen path: AF2 MSA features — **другой** pretrained module, frozen wrt design head. Ensemble с AF-Multimer/AF3 выбирает max confidence — evaluator, не generator."
        source: PAPER
        locator: "tFold-Ag antigen AF2 unit; Fig. 4g ensemble"
    mermaid: |
      flowchart TD
        IN["Input: backbone PDB or sequence plus epitope plus FR"] --> BRANCH{"Head type"}
        BRANCH -->|"subtype A IF"| GVP["GVP-GNN encoder kNN"]
        GVP --> INV["Local frames to invariant tokens"]
        INV --> TF["GENERATOR: Transformer AR / masked CE"]
        TF --> Y["Sequence Y"]
        Y --> LL["EVALUATOR: log p / AAR not Kd"]
        BRANCH -->|"subtype B tFold"| PPI["ESM-PPI then Evoformer-Single"]
        PPI --> IPA["IPA structure module plus recycle"]
        IPA --> PRED["PREDICTOR: frames / complex"]
        PRED --> REC["optional recovery head CDRs"]
        REC --> FILT["EVALUATOR: ipLDDT ipTM AF-Multimer"]
        FILT --> PHAGE["EXPERIMENT: phage display"]
        PHAGE --> SPR["EXPERIMENT: SPR competition"]
        LL --> LAB["EXPERIMENT only if user assays"]
    mermaid_caption: "Схема класса по Jing/Hsu/AntiFold SI и tFold Fig. 1/3/4/6 — не копипаст paper figures. Generator, predictor, evaluator и experiment разведены. ProteinMPNN и RFdiffusion не на этой стрелке."
    mermaid_source: INTERPRETATION
  - id: training
    title: "9. Training procedure"
    paragraphs:
      - text: "Hsu (prior bioRxiv HTML + PMLR abstract): CATH 4.3 topology split 80/10/10 — catalog numbers 16153 / 1457 / 1797 structures. UniRef50 AF2, exclude Gene3D HMM hits of val/test CATH topologies (leakage control). Sequences ≤500; Amber-relax predicted. Не README-вывод."
        source: PAPER
        locator: "prior Hsu bioRxiv CATH topology; PMLR abstract 12M predicted structures"
      - text: "Jing CPD (literature, не tool): CATH 4.2 curated by Ingraham, 18204 / 608 / 1120. TS50: filter CATH train at 30% PSIBLAST to TS50 — no canonical split across methods."
        source: PAPER
        locator: "Jing §4 CATH 4.2 sizes; TS50 30% filter"
      - text: "AntiFold: same split as AbMPNN — 2074 SAbDab complexes (protein antigen, resolution $<$5 Å) + 147458 OAS paired ABodyBuilder2 structures; 90% concatenated-CDR identity, 80/10/10. Val/test: drop 1 and 3 structures not modelable with ABodyBuilder2. Independent therapeutic-mAb holdout — NR."
        source: PAPER
        locator: "AntiFold §2.1 Data; SI SAbDab 2074"
      - text: "tFold-Ab structures: SAbDab experimental before 31 Dec 2021 (8264 paired, 1693 heavy-only, 376 light-only after cleaning). Cluster CD-Hit 95% → 2873 clusters; one sample/cluster/epoch. Val: 1 Jan–30 Jun 2022, drop $>$95% ID to train. Test SAbDab-22H2-Ab n=169 and Nano n=73 (1 Jul–31 Dec 2022)."
        source: PAPER
        locator: "tFold Methods datasets antibody structures"
      - text: "tFold-Ag complexes: 4834 Ab–Ag + 1319 nanobody–Ag before 31 Dec 2021; cluster by **antigen** 95% → 2459 clusters. Test cutoff 1 Jul 2022 for fair AF-Multimer/AF3 comparison; drop antigen $>$600 residues, missing interface, $>$50% missing Ab residues. Design campaign additionally fine-tuned generator on epitope-specific SAbDab **prior to 2024** excluding paratope — не тот же split, что 2022 test."
        source: PAPER
        locator: "tFold Methods AbAg datasets; candidate selection step 1 fine-tune before 2024"
      - text: "Симуляция vs wet-lab: CATH/SAbDab AAR, RMSD, DockQ, CASP GDT-TS, virtual-screen AUC — in silico. AntiFold: **нет** prospective wet-lab. tFold: 10000 Fab/target phage then SPR — prospective binding **workflow**, не isolated geometric-net metric. Не смешивать."
        source: PAPER
        locator: "AntiFold no wet-lab; tFold 10000 pairs phage"
      - text: "Teacher forcing: AR decoder Hsu/AntiFold — standard next-token (SI factorization). Self-conditioning как у Proteina — NR для этого класса. tFold recycle — iterative structure, не diffusion time-sample."
        source: PAPER
        locator: "AntiFold Eq. 1 AR; tFold recycling module"
      - text: "Batching / GPU hours: Jing ~2 days Titan X, memory-bound. Hsu/AntiFold/tFold wall-clock train — NR this pass. Не выдумывать."
        source: NR
        locator: "Hsu Table A.1 batch/lr NR; tFold train hardware NR in HTML"
  - id: inference
    title: "10. Inference and generation"
    paragraphs:
      - text: "Старт подтипа A: PDB backbone (solved or predicted); optional partial coord masks; AntiFold IMGT Fv 1–128. Не шум $x_T$ diffusion. Не library 𝒳 EVOLVEpro."
        source: PAPER
        locator: "AntiFold Fig. 1 input PDB"
      - text: "Алгоритм IF: AR decode N→C (комплексы: target chain first, 10 mask tokens between chains — Hsu). Temperature categorical; Hsu recovery $T=10^{-6}$ (почти greedy). AntiFold default $T=0.20$ на выбранных IMGT CDR (CODE CLI / SI sampling). logits scaled as $\\mathrm{logits}/t$ before softmax (ProteinMPNN-style, SI Eq. 7). Top-k — NR as default."
        source: PAPER
        locator: "AntiFold SI temperature 0.20; Hsu T=1e-6 prior"
      - text: "AntiFold masked redesign: sample только выбранные regions; framework fixed unless unmasked. `--esm_if1_mode` — baseline weights, не AntiFold FT (DOC)."
        source: CODE
        locator: "antifold/main.py flags (prior inspection); README"
      - text: "tFold-Ab: MSA-free structure from sequence; recycle previous prediction. Авторы: ~50× vs AF3 server, ~5000× vs AF-Multimer на их Fig. 3b (single A100 + 21 CPU except AF3 server) — **tool-specific runtime**, не аксиома класса, не переносить на ESM-IF1."
        source: PAPER
        locator: "tFold Fig. 3b; 50-fold AF3; 5000× AF-Multimer"
      - text: "tFold design sampler: ~1M candidates / target from 1000 random seeds × 36 FR length combos; iterative position by highest iplddt; temperature on CDR1/2. Single-step recovery даёт повтор «YYY»; step-by-step снижает repeats (PAPER). Не beam search. Не UCB."
        source: PAPER
        locator: "tFold Methods ~1 million; iplddt step-by-step vs YYY motif"
      - text: "Post-hoc evaluator: AntiFold ABodyBuilder2 RMSD; Hsu none in-loop; tFold filter confidence ≥0.7 top 20%, steric clash with receptor/ligand, edit-distance novelty, OAS motif filter, in-house specificity score (A2binder-derived) — **не** generator. AF-Multimer/AF3 — ensemble structure evaluator."
        source: PAPER
        locator: "tFold filter steps 3–6; AntiFold SI refold"
      - text: "Чего в классе нет как стандарт: assay-in-the-loop, contig RFdiffusion, ODE steps, ProteinMPNN random decode order (другой класс). tFold phage panning — experiment after computational shortlist."
        source: INTERPRETATION
      - text: "Multi-state Hsu: geometric mean $p(Y\\mid A)p(Y\\mid B)$ as proxy $p(Y\\mid A,B)$ (prior). Dual PDBFlex — conditioner, не sampler class."
        source: PAPER
        locator: "Hsu multi-state (prior bioRxiv)"
  - id: conditioning
    title: "11. Conditioning"
    paragraphs:
      - text: "Зажимается у подтипа A: backbone coordinates (clamped); partial span masks; chain IDs via concat; optional antigen coords (AntiFold). Не epitope tensor как у tFold-Ag-ppi, если пользователь не подал antigen chain."
        source: PAPER
        locator: "AntiFold optional antigen chain; Hsu partial masks"
      - text: "AntiFold region masks: default CDR1/2/3; IMGT-weighted train masking ≠ inference region string. Nanobody mode — single chain. Classifier-free guidance **нет**."
        source: PAPER
        locator: "AntiFold Fig. 1 specify IMGT region; SI IMGT-weighted train only"
      - text: "tFold зажимает: human FR template (campaign: IGHV3-23/IGKV1-5, IGHJ4/IGKJ1), antigen sequence, specified epitope, CDR length combinations (36; CDR1/2 fixed by V gene, CDR3 from OAS frequencies). Numbering Chothia в Table 1."
        source: PAPER
        locator: "tFold Table 1; Methods 36 most frequent CDR3 combinations"
      - text: "tFold-Ag-ppi / contact: extra structural restraints (epitope sites, optional paratope, optional contact map) в inter-chain embedding. Это не ELISA labels."
        source: PAPER
        locator: "tFold-Ag-ppi epitope; tFold-Ag-contact maps"
      - text: "Чего нет: measured_var / ELISA в attention; CATH label CFG (это Proteina, другой класс); contig map RFdiffusion; UCB acquisition."
        source: INTERPRETATION
      - text: "Hsu dual-state: two PDBFlex conformations (prior Fig. 7) — conditioner на flexible residues, не second assay."
        source: PAPER
        locator: "Hsu Fig. 7 dual-state (prior)"
      - text: "MSA: нет у ESM-IF1/AntiFold inference и у tFold-Ab antibody path. Есть у tFold antigen AF2 unit. Не приписывать MSA conditioner ESM-IF1."
        source: PAPER
        locator: "tFold-Ab MSA-free; tFold-Ag antigen MSA"
      - text: "Hotspot как RFdiffusion residue map — NR для catalog tools этого id. tFold epitope — residue sites on antigen, не diffusion hotspot encoding."
        source: INTERPRETATION
  - id: complexity
    title: "12. Вычислительная сложность"
    paragraphs:
      - text: "Драйверы подтипа A: $L$ residues (Fv ~128 IMGT; complexes + antigen atoms); kNN $k=30$ GVP $O(Lk)$ per layer × 4; Transformer $O(L^2)$ per layer × (8+8); AR decode $O(L)$ steps. Pair memory Evoformer **нет** у ESM-IF1."
        source: PAPER
        locator: "Jing k=30; Hsu 8+8 (prior); AntiFold IMGT 1–128"
      - text: "Драйверы tFold: pair $O(L^2)$ Evoformer-Single; 32+8 blocks на Ag docking unit; recycles; antigen MSA search (доминирует, пока не закэширован). High-throughput vs one antigen: HTML — среднее время на комплекс падает с числом antibodies (Supplementary Fig. 8)."
        source: PAPER
        locator: "tFold-Ag 32+8; Supplementary Fig. 8 amortized antigen"
      - text: "tFold-Ab vs AF-Multimer 5000× и vs AF3 server 50× — author-reported Fig. 3b, **structure prediction**, не generative IF sampling cost. EquiFold 1.02 s vs tFold-Ab 1.15 s на их бенчмарке — не класс-аксиома."
        source: PAPER
        locator: "tFold Fig. 3b; EquiFold 1.02 vs 1.15 s"
      - text: "«Дешевле diffusion» — нет NFE-сравнения GVP-Transformer vs RFdiffusion в прочитанных papers этого класса. Не писать как факт. INTERPRETATION: один AR pass vs $T$ denoise steps — другая постановка, не измерение."
        source: INTERPRETATION
      - text: "Campaign cost tFold: 1M in silico → 10k synthesized Fabs/target × 4 antigens; phage 2–4 rounds; 10 Fc-fusions SPR. GPU train — NR. Library construction Twist oligo pools — experimental logistics, не NFE."
        source: PAPER
        locator: "tFold 10000 Fab; ten Fc-fusions"
      - text: "OOM на больших комплексах — failure mode seed каталога (pair $L^2$). Cropping epitope away — user error, не формула."
        source: INTERPRETATION
  - id: strengths
    title: "13. Преимущества"
    paragraphs:
      - text: "Механизм: local GVP даёт геометрию без voxel CNN; global attention держит masked spans, на которых kNN GNN падает к background perplexity (Hsu Fig. 4, prior). Это следует из постановки encoder+Transformer, не из affinity."
        source: PAPER
        locator: "Hsu Fig. 4 (prior bioRxiv)"
      - text: "Hsu Table 1 (prior): GVP-Transformer native recovery 51.6% на CATH topology-held-out с AF2 mix vs 38.3% CATH-only; buried 72%, surface 39% (PMLR abstract: 51% recovery, 72% buried, almost 10 pp over existing). Не обобщать на antibody CDR без FT."
        source: PAPER
        locator: "PMLR abstract; prior Table 1 51.6% / 38.3%"
      - text: "Jing Table 1: GVP-GNN CATH all recovery 40.2% vs Structured Transformer 36.4% / perplexity 5.29 vs 6.85 — аргумент за GVP слой, не за «Transformer всегда лучше GNN»."
        source: PAPER
        locator: "Jing Table 1 All recovery/perplexity"
      - text: "AntiFold test CDRH3 AAR 60% vs ESM-IF1 43% vs AbMPNN 56% (p$<0.005$ vs ESM-IF1). Mean CDR backbone RMSD after ABodyBuilder2 0.95 vs native 0.63, AbMPNN 0.98. Это retrospective IF, не SPR."
        source: PAPER
        locator: "AntiFold Table 1"
      - text: "tFold-Ab: MSA-free Ab structure; CDR-H3 backbone RMSD 3.01 Å mean on SAbDab-22H2-Ab n=169 (Table 2 narrative). Speed claim Fig. 3b — prediction, не design success."
        source: PAPER
        locator: "tFold antibody RMSD H3 3.01 Å; Fig. 3c"
      - text: "tFold campaign SPR after phage (workflow, не isolated IPA): best reported $K_D$ 45 pM PD-L1, 3.22 nM Flu A (epitope-matched second-best shown in Fig. 1e because top Flu A was off-epitope), 2.0 nM SC2RBD, 81.6 nM PD-1; ten Fc-fusions. SC2RBD-H330 neutralization IC50 0.42 nM. Не переносить на ESM-IF1/AntiFold."
        source: PAPER
        locator: "tFold Fig. 1c–h; Flu A off-epitope exception; Fig. 2d IC50 0.42 nM"
      - text: "Явно: recovery / DockQ / ipLDDT **не** гарантия стабильности, экспрессии, developability или affinity. Hsu: recovery does not guarantee structural similarity of designed sequences (prior). tFold success rate binders ~1.5–4.4%; authors couple to display."
        source: PAPER
        locator: "tFold Discussion 1.5 to 4.4%; Hsu recovery caveat prior"
      - text: "Invariance IF logits к позе PDB — практическое преимущество (не нужно канонизировать ориентацию). Это не термодинамика."
        source: INTERPRETATION
        locator: "follows p(Y|TX)=p(Y|X)"
  - id: limits
    title: "14. Ограничения"
    paragraphs:
      - text: "Математика: schematic IPA ≠ full SI; GVP reflection-equivariance может игнорировать chirality; Hsu Table A.1 NR — нельзя утверждать optimizer defaults; tFold FAPE weights NR."
        source: NR
      - text: "Представление: ESM-IF1/AntiFold backbone-only, нет glycans/PTM/solvent; 10 gap tokens — искусственный разрыв цепи; tFold campaign фиксированный human FR — не произвольный scaffold."
        source: PAPER
        locator: "tFold IGHV3-23/IGKV1-5; AntiFold backbone"
      - text: "Физика/химия: pair/IPA/IF CE ≠ energy function; нет explicit H-bond/electrostatics head. Predicted side chains tFold ≠ crystal."
        source: INTERPRETATION
      - text: "Данные/bias: Hsu AF2-predicted train structures (pLDDT filter); CATH PDB-biased; AntiFold OAS predicted Fv + SAbDab complexes; tFold SAbDab-only vs AF3 broader molecular data — authors: weaker nanobody–Ag. Design fine-tune to 2024 SAbDab — leakage vs therapeutics **NR** полностью."
        source: PAPER
        locator: "tFold nanobody–Ag data scarcity; AntiFold OAS ABodyBuilder2"
      - text: "Обобщение: general IF ≠ antibody CDR without FT (AntiFold ablation 31.5% vs 58.4%). tFold FR-constrained; epitopes absent from SAbDab (MPER PD-1 agonist attempt) → low confidence. Monomeric antigens only; peptide–MHC NR."
        source: PAPER
        locator: "tFold Discussion MPER; peptide-MHC cannot"
      - text: "Deployment: ESM-IF1 MIT (catalog); AntiFold BSD-3-Clause + web; tFold custom Tencent license, commercial partnership. CODE tFold unaudited. Meta ESM repo maintenance / weight hosting — operational risk, не math."
        source: MATRIX
        locator: "tools/*.yaml licenses"
      - text: "tFold filter poorly separates binders sharing identical FRs; confidence weakly sensitive to mutations (authors). AF3 false-positive complexes remain (SC2RBD 3/5 high-confidence non-blockers)."
        source: PAPER
        locator: "tFold Discussion discriminative power; Fig. 2e three non-competitive"
  - id: failures
    title: "15. Failure modes"
    paragraphs:
      - text: "Считать [ProteinMPNN](/tools/proteinmpnn.html) geometric transformer (это GNN IF). Считать весь tFold PLM или весь tFold inverse folding Hsu."
        source: INTERPRETATION
      - text: "Считать AF2/tFold-Ab генератором de novo backbone: это predictors. Считать IF $\\Delta\\log p$, ipLDDT, DockQ, AAR измеренным $K_D$."
        source: INTERPRETATION
      - text: "Приписать tFold SPR одному IPA блоку, игнорируя phage, 10k library, AF-Multimer filter и что highest-affinity Flu A binder был **off-epitope** (Fig. 1e exception)."
        source: PAPER
        locator: "tFold Fig. 1e Flu A highest-affinity off-epitope"
      - text: "Greedy $T\\to 0$ recovery как «лучшая библиотека»: низкая diversity (Hsu recovery protocol). AntiFold T=0.20 — другой режим, не Hsu $10^{-6}$."
        source: PAPER
        locator: "AntiFold SI T=0.20 vs Hsu T=1e-6"
      - text: "Неверный numbering (IMGT vs Chothia vs input PDB) → region masks мимо CDR. Predicted Fv как вход AntiFold без проверки."
        source: PAPER
        locator: "AntiFold IMGT recommended; tFold Table 1 Chothia"
      - text: "Truncated crop / OOM → потеря epitope. Broken equivariance если обойти local-frame projection и кормить raw xyz в Transformer."
        source: INTERPRETATION
      - text: "Library misspecification tFold: unnatural motifs (EEEEE, YYYYY) если не фильтровать; single-step YYY bias. Distribution shift: nanobody design lower success (authors)."
        source: PAPER
        locator: "tFold motif filter; YYY; nanobody limitation"
      - text: "Reflection-flip / wrong chirality если сеть не штрафует (GVP Eq. 1). Using Warszawski Spearman 0.42 as affinity maturation proof — authors contradict (de-selection of dead variants)."
        source: PAPER
        locator: "AntiFold Discussion de-selection; Jing reflections"
    items:
      - "Смешать preprint Hsu bioRxiv pagination с PMLR Table A.1, которого нет в HTML."
      - "Сравнивать AntiFold AAR, tFold SPR и RFantibody yeast как один benchmark (разные generated objects и oracles)."
  - id: tools
    title: "16. Реализации в инструментах"
    paragraphs:
      - text: "Reverse index `architecture_id: geometric-transformers` — три карточки. Foundational methods вне каталога — отдельные строки. Неравные oracles не ставить в колонку «успех»."
        source: MATRIX
    tables:
      - title: "Реализации"
        source: MATRIX
        headers: ["Tool", "Generic architecture", "Tool-specific implementation", "Important difference"]
        rows:
          - ["[ESM-IF1](/tools/esm-if1.html)", "GVP-Transformer IF (подтип A)", "4 GVP-GNN + 8+8 TF, $k=30$, 12M AF2 UniRef50 + CATH; AR $p(Y\\mid X)$; recovery $T=10^{-6}$; complexes 10 mask tokens", "ICML 2022; no primary wet-lab; facebookresearch/esm `2b369911…`, inverse_folding line-audit NR; Table A.1 NR"]
          - ["[AntiFold](/tools/antifold.html)", "тот же стек, antibody FT", "SAbDab 2074 + OAS 147458; 3:1 CDR mask; $T=0.20$; IMGT 1–128; optional antigen", "Bioinformatics Advances; CDRH3 AAR 60%; Spearman 0.42 DMS ≠ $K_D$; no wet-lab; commit 789d467"]
          - ["[tFold](/tools/tfold.html)", "Evoformer-Single + IPA + ESM-PPI (подтип B)", "tFold-Ab predictor; tFold-Ag 32+8; recovery head; epitope-conditioned design + phage", "Nat. Commun.; SPR after display; Flu A top clone off-epitope; commit NR; не Hsu Eq. 1"]
          - ["Jing GVP-GNN (literature, не карточка tools)", "GNN с GVP слоями", "3 GVP message + 3 decoder CPD; MQA Huber GDT-TS; CATH 4.2", "Не Transformer; architecture_id GNN"]
          - ["Ingraham Structured Transformer (literature)", "graph + attention CPD", "2019 ancestor", "Jing: attention hurting vs GNN on CATH; не tool"]
          - ["[ProteinMPNN](/tools/proteinmpnn.html)", "не этот класс", "residue MPNN, random-order AR", "см. GNN / inverse folding"]
          - ["[RFdiffusion](/tools/rfdiffusion.html)", "RF geometric stack as denoiser", "frame diffusion", "не architecture id geometric-transformers"]
          - ["[FlowDesign](/tools/flowdesign.html)", "IPA as flow net", "CFM CDR", "см. flow-matching"]
          - ["AF2 / AF3 (не generators каталога)", "Evoformer + IPA / diffusion", "recycles, MSA", "evaluators / tFold antigen unit / filter ensemble"]
  - id: applicability
    title: "17. Где применимо и где не применимо"
    paragraphs:
      - text: "Применимо: sequence на фиксированном backbone — [ESM-IF1](/tools/esm-if1.html), [AntiFold](/tools/antifold.html), workflow [antibody inverse folding](/workflows/antibody-inverse-folding.html); general fixed-backbone как alternative в [fixed-backbone IF](/workflows/fixed-backbone-inverse-folding.html) (primary там ProteinMPNN). MSA-free Ab/complex prediction и epitope-conditioned design **filters** — [tFold](/tools/tfold.html) / [epitope-mab-tfold](/workflows/epitope-mab-tfold.html)."
        source: MATRIX
        locator: "workflow architecture_ids include geometric-transformers"
      - text: "Задачи: [inverse-folding](/tasks/inverse-folding.html), [antibody-structure-aware-sequence-design](/tasks/antibody-structure-aware-sequence-design.html), [antigen-conditioned-antibody-design](/tasks/antigen-conditioned-antibody-design.html) только если geometric stack реально в пайплайне (tFold-Ag), не ELISA AL."
        source: MATRIX
      - text: "Не применимо как few-shot ELISA active learning (EVOLVEpro / Makowski — другие ids). Не как de novo backbone sampler: для этого [frame diffusion](/architectures/frame-diffusion.html) / [RFdiffusion](/tools/rfdiffusion.html). Не как sequence-only CDR LM: [IgLM](/tools/iglm.html), [PALM-H3](/tools/palm-h3.html)."
        source: INTERPRETATION
      - text: "Не сравнивать AntiFold AAR с tFold SPR и с RFantibody yeast: разные $f$, generated objects и oracles. Не решать codon optimization / expression этим классом."
        source: INTERPRETATION
      - text: "Если нужна новая CDR topology при свободном backbone — не AntiFold (backbone clamped). Если нет структуры Fv — не IF; использовать sequence generator, затем predictor."
        source: PAPER
        locator: "AntiFold backbone-constrained design; tFold needs FR template"
      - text: "tFold custom license: deployment gate, не научный запрет постановки."
        source: MATRIX
        locator: "tools/tfold.yaml commercial review"
  - id: method-sources
    title: "18. Методологические источники"
    paragraphs:
      - text: "Foundational слоя: Jing et al. ICLR 2021 (GVP) — HTML прочитан this pass. Foundational IF+Transformer: Hsu et al. ICML 2022 — PMLR abstract this pass; methods из prior bioRxiv HTML + AntiFold SI. Catalog: AntiFold arXiv HTML+SI this pass; tFold Nat. Commun. HTML this pass."
        source: PAPER
      - text: "Pointer-only: Ingraham NeurIPS 2019; Jumper Nature 2021 полный IPA SI; tFold SI PDF; Hsu PMLR Table A.1; TencentAI4S/tfold code; esm inverse_folding line-audit."
        source: NR
      - text: "Не библиография «всего по geometric deep learning»: TFN, SE(3)-Transformer Fuchs, EGNN — страница SE(3), не этот id. ProteinMPNN Science — GNN/IF pages."
        source: INTERPRETATION
      - text: "Preprint vs journal: Hsu bioRxiv vs PMLR — не сливать Table A.1. AntiFold arXiv vs OUP — OUP HTML inaccessible, numbers from arXiv. tFold journal HTML канон; bioRxiv 2024 не постранично сличен."
        source: INTERPRETATION
