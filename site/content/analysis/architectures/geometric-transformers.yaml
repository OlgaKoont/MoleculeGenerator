status_note: "Класс — семейство сетей (geometric encoder + Transformer / pair track / IPA), не одна generative process и не задача inverse folding. В этом проходе прочитаны: Jing et al. GVP ar5iv HTML 2009.01411 (ICLR 2021: Algorithm 1, Eq. 1–5, protein graph k=30, CATH 4.2 CPD Table 1, MQA CASP); Høie/Hummer et al. AntiFold arXiv HTML 2405.03370 включая Supplementary Methods (Eq. 1 quoting Hsu; 4 GVP + 8+8 Transformer; 10 gap tokens; T=0.20; SAbDab 2074 + OAS 147458); Wu et al. tFold Nat. Commun. HTML 10.1038/s41467-025-67361-9 (Results + Methods: ESM-PPI, Evoformer-Single, IPA structure module, recycle; tFold-Ag 32 Evoformer-Single + 8 structure; phage then SPR). Hsu et al. ICML 2022: в этом проходе — PMLR abstract (PMLR 162:8946–8970) + AntiFold SI Eq. 1; архитектура/splits/recovery — prior catalog close-read bioRxiv HTML 10.1101/2022.04.10.487779 (зафиксирован в analysis/tools/esm-if1.yaml). Не сливать preprint и journal pagination Hsu. PMLR PDF Table A.1 numeric grid NR. AF2 SI Algorithm 22 (полный IPA) не копируется. TencentAI4S/tfold commit NR. facebookresearch/esm inverse_folding/*.py line-audit NR (SHA зафиксирован). OUP AntiFold HTML — Cloudflare, workaround arXiv."
lede: "Geometric transformers — **backbone сети**: Transformer (или AF-like pair track / IPA) получает 3D геометрию (distances, orientations, frames, pair features), а не только sequential position. Это не generative process само по себе, не задача $p(s\\mid x)$, не sequence-only PLM и не predictor affinity."
