sections:
  - id: domain
    title: "1. Область определения"
    paragraphs:
      - text: "Роль в пайплайне — **geometric inductive bias / backbone сети**: слои, которые встраивают 3D distances, orientations, residue frames или pair representations в Transformer (или AF-like pair track + IPA). Сама семья не задаёт $p(\\mathrm{data})$ и не выбирает mutants. Generated или scored state зависит от головы: дискретные AA tokens (inverse folding), обновлённые frames / atomic coords (structure module), либо masked sequence recovery поверх тех же представлений. Это не affinity head и не assay loop."
        source: INTERPRETATION
      - text: "Математический объект входа — residual tokens плюс геометрический encoder $E_{\\mathrm{geom}}(X)$: kNN-граф на Cα (GVP), либо sequence/pair features из PLM + Evoformer (tFold). Выход Transformer — invariant scalars для logits или pair/frame updates. Scored state (log $p$, ipLDDT, ipTM, AAR) — внутренний score, не $K_D$."
        source: PAPER
        locator: "Jing §3 protein graph; Hsu/AntiFold SI GVP then Transformer; tFold Fig. 3a ESM-PPI + Evoformer-Single + IPA"
      - text: "Задачи каталога, куда bias реально входит: [inverse folding](/tasks/inverse-folding.html) и [structure-aware antibody sequence](/tasks/antibody-structure-aware-sequence-design.html) через [ESM-IF1](/tools/esm-if1.html) и [AntiFold](/tools/antifold.html); [antigen-conditioned antibody design](/tasks/antigen-conditioned-antibody-design.html) и [de novo antibody](/tasks/de-novo-antibody-design.html) через workflow [tFold](/tools/tfold.html) / [epitope-mab-tfold](/workflows/epitope-mab-tfold.html), где geometric stack — predictor/recovery, не единственный generator. Не few-shot ELISA AL."
        source: MATRIX
        locator: "architectures/geometric-transformers.yaml applicable_task_ids; workflows antibody-inverse-folding, epitope-mab-tfold"
      - text: "Это **не** [inverse folding](/architectures/inverse-folding.html): IF — задача/факторизация $p(s\\mid x)$, реализуемая и GVP-Transformer, и residue MPNN. Это **не** [graph neural networks](/architectures/graph-neural-networks.html): чистый message passing без global Transformer (ProteinMPNN; Jing GVP-GNN 3+3 / 8+8) живёт там. GVP-слой — encoder этого класса, не тождество «весь Jing = geometric transformer»."
        source: INTERPRETATION
      - text: "Это **не** [SE(3)-equivariant models](/architectures/se3-equivariant-models.html) как класс векторного выхода $f(Rx+t)=Rf(x)+t$: у Hsu после local-frame projection Transformer видит invariant tokens; итоговый $p(Y\\mid X)$ **инвариантен** (AntiFold SI; Hsu Appendix A.3 в prior read). IPA обновляет frames эквивариантно — это подтип пары, не лицензия называть ESM-IF1 equivariant decoder. Это **не** [invariant models](/architectures/invariant-models.html) целиком: invariance — свойство отображения, здесь один из этапов (GVP scalars / pair distances)."
        source: PAPER
        locator: "AntiFold SI rotation/translation invariant encoder; Jing Eq. 1 GVP; tFold IPA SE(3)-equivariant structure module"
      - text: "Это **не** [protein language models](/architectures/protein-language-models.html): ESM-2/ProGen/IgLM — sequence-only. [tFold](/tools/tfold.html) имеет **оба** id: ESM-PPI — PLM-компонент; Evoformer-Single+IPA — этот класс. Не писать «tFold = geometric transformer целиком» и не подставлять Hsu $p(Y\\mid X)$ как уравнение tFold."
        source: PAPER
        locator: "tFold tFold-Ab four modules; extra_constraints this page"
      - text: "Это **не** [frame diffusion](/architectures/frame-diffusion.html) и **не** [flow matching](/architectures/flow-matching.html): там train target — SE(3) score или $v_\\theta\\approx u_t$; RF/IPA там denoiser/drift, **без** architecture_id geometric-transformers у [RFdiffusion](/tools/rfdiffusion.html) и [FlowDesign](/tools/flowdesign.html)."
        source: MATRIX
        locator: "tools/rfdiffusion.yaml; tools/flowdesign.yaml omit this id"
      - text: "Catalog tools с `architecture_id: geometric-transformers`: [ESM-IF1](/tools/esm-if1.html), [AntiFold](/tools/antifold.html), [tFold](/tools/tfold.html). Часто путают с [ProteinMPNN](/tools/proteinmpnn.html) (GNN IF, **нет** этого id), с чистым GVP-GNN Jing (literature, не tool), с AF2/AF3 как «тем же Transformer» без различения predictor vs generator, и с [IgLM](/tools/iglm.html) (PLM, нет 3D bias)."
        source: MATRIX
        locator: "mappings.py esm-if1, antifold, tfold"
      - text: "Seed one-liner $A_{ij}=q_i^\\top k_j+b(d_{ij},R_i^{-1}R_j)$ — **схема pair-biased attention**, не уравнение default ESM-IF1 (там vanilla Transformer на invariant tokens) и не tFold FAPE. Не подставлять как loss каталожного инструмента."
        source: INTERPRETATION
        locator: "seed mathematical_formulation; Hsu/AntiFold SI: generic Transformer after GVP"
  - id: intuition
    title: "2. Интуитивный принцип"
    paragraphs:
      - text: "Обычный Transformer видит порядок токенов и learned positions. Geometric variant добавляет, что residues близки в $\\mathbb{R}^3$ или как ориентированы их frames. Два рабочих механизма в каталоге: (i) локальная геометрия → invariant scalars → global self-attention (GVP-Transformer); (ii) pair track $z_{ij}$ и точки в локальных кадрах (Evoformer / IPA), где attention зависит от инвариантных расстояний, а кадры обновляются SE(3)-эквивариантно."
        source: PAPER
        locator: "Jing motivation CNN vs GNN; Hsu GVP then TF; tFold Evoformer-Single + IPA"
      - text: "На inference меняется то, что умеет голова. IF: фиксированный backbone $X$, сэмплируется sequence $Y$ (AR decode или masked redesign). tFold-Ab: sequence → predicted antibody structure (recycle). tFold design: masked CDR tokens заполняются recovery head при clamped FR/epitope, параллельно предсказывается complex; low ipLDDT маскируются и идут в recycle. Веса $\\theta$ на inference фиксированы."
        source: PAPER
        locator: "AntiFold Fig. 1 sampled sequences; tFold Fig. 1a generator+filter; ipLDDT recycle"
      - text: "Long-range contacts, которые kNN GNN обрезает ($k=30$ у Jing/Hsu), могут пройти через dense attention. Цена — $O(L^2)$ память pair/attention. Jing на CPD наоборот показал, что Structured Transformer (graph + attention) **хуже** GVP-GNN на CATH 4.2 — attention не автоматически лучше GNN; Hsu добавляет Transformer **после** GVP именно ради masked spans."
        source: PAPER
        locator: "Jing Table 1 Structured Transformer vs GVP-GNN; Hsu Fig. 4 span mask (prior bioRxiv read)"
      - text: "Главный эмпирический рычаг **GVP-Transformer**: объём structural data (Hsu: +12M AF2 UniRef50) плюс span-masking, чтобы encoder не видел полный backbone на masked узлах. Главный рычаг **AntiFold**: antibody FT + 3:1 CDR vs FR loss weight + OAS predicted Fv. Главный рычаг **tFold-Ab**: MSA-free ESM-PPI вместо MSA search. Главный рычаг **tFold design**: epitope clamp + ipLDDT filter + phage — не «магия IPA»."
        source: PAPER
        locator: "Hsu predicted structures (PMLR abstract / Table 1 prior); AntiFold §2.2; tFold ESM-PPI vs MSA; Fig. 1 phage"
      - text: "Предостережение по метрикам. Native sequence recovery / AAR, perplexity, IF $\\Delta\\log p$, ABodyBuilder2 RMSD designed vs crystal, tFold backbone RMSD / DockQ / ipLDDT / ipTM / iplddt **не** experimental affinity / $K_D$ / ELISA / BLI / SPR. Spearman 0.42 на Warszawski DMS — retrospective score, авторы: performance driven by de-selecting loss-of-binding variants. tFold SPR nanomolar — **после** phage display и virtual screen, не выход IPA."
        source: PAPER
        locator: "AntiFold Table 1 Sr 0.42 and Discussion de-selection; tFold Fig. 1b phage then SPR"
      - text: "pLDDT AF2 на train Hsu — **входной** RBF feature predicted examples, не выход ESM-IF1. ipLDDT tFold — confidence structure head. Ни один не «считает $\\Delta G$»: energy head в loss этого класса нет."
        source: PAPER
        locator: "Hsu pLDDT as input (prior); tFold ipLDDT / iplddt Fig. 6c"
      - text: "Промежуточные GVP vectors / pair $z_{ij}$ / noisy recycle features $\\neq$ MD-траектория фолдинга и $\\neq$ van der Waals potential. 10 gap tokens между H и L — конвенция представления комплексов, не физический линкер."
        source: PAPER
        locator: "AntiFold SI 10 position padding of gap tokens"
      - text: "Не переносить UCB, DDPM $\\varepsilon$, Meier $\\Delta\\ell$ ESM-1v, FAPE как default GVP-Transformer. FAPE/distogram — AF-family structure losses tFold (weights NR), не train target ESM-IF1."
        source: INTERPRETATION
  - id: math
    title: "3. Формальная математическая постановка"
    paragraphs:
      - text: "Сначала родовая композиция класса. Затем подтипы с **разными** уравнениями: (A) GVP-Transformer IF — [ESM-IF1](/tools/esm-if1.html), [AntiFold](/tools/antifold.html); (B) Evoformer-Single + IPA + optional recovery — [tFold](/tools/tfold.html). Jing GVP Algorithm 1 — слой encoder, не отдельный catalog tool. Не одна seed-формула pair-bias на все."
        source: INTERPRETATION
      - text: "Формулы, которые **не** принадлежат классу как train target / default catalog tool: ProteinMPNN random-order CE; FrameDiff IGSO(3) score; FlowDesign CFM MSE; UCB/EI; Meier masked-marginal $\\Delta\\ell$; ProGen NLL без геометрии; полный AF2 SI IPA listing. Seed $A_{ij}=q^\\top k+b(d,R^{-1}R)$ — схема pair-biased подтипа, **не** уравнение ESM-IF1."
        source: INTERPRETATION
      - text: "Negative / non-binder / ELISA labels в loss GVP-Transformer: **нет** (CE vs native AA). tFold-Ag train — binding complexes from SAbDab; virtual screen позже использует низкий confidence как proxy non-binder, это **не** contrastive affinity loss. Не сравнивать AntiFold AAR, Hsu CATH recovery, tFold DockQ и tFold SPR как один benchmark."
        source: PAPER
        locator: "AntiFold CE on masked positions; tFold training on binding pairs; Fig. 5 virtual screen"
      - text: "Родовая композиция $T_\\theta\\circ E_{\\mathrm{geom}}$ **не** является уравнением default-инструмента: ESM-IF1 оптимизирует AR CE; tFold-Ab — structure losses AF-family; tFold recovery — masked AA CE + structure. Не подставлять seed pair-bias one-liner как loss AntiFold."
        source: INTERPRETATION
      - text: "GVP-GNN-large Hsu (8+8 слоёв, 21M, prior bioRxiv) — всё ещё GNN без Transformer: на CATH-only recovery 42.2% tiny vs 39.2% large (overfit), с AF2 mix large 50.8%. Transformer даёт устойчивость к mask $>5$ AA (Fig. 4). Не путать три Hsu-архитектуры: tiny GVP-GNN, large GVP-GNN, GVP-Transformer (released ESM-IF1 = последняя)."
        source: PAPER
        locator: "prior Hsu Table 1 and Fig. 4; released checkpoint is GVP-Transformer"
      - text: "tFold in silico CDR-H3 AAR 0.302 без prior и 0.317 с epitope (SAbDab-22-Design-Ab n=50) сравнимо с dyMEAN, которому нужен epitope. Авторы: высокий AAR не равен лучшему дизайну. Не подставлять эти доли как SPR hit rate (1.5–4.4% binders after display)."
        source: PAPER
        locator: "tFold Fig. 6b; Supplementary Table 4; Discussion 1.5–4.4%"
      - text: "Jing MQA loss (Huber + pairwise GDT-TS) и CASP correlations **не** train target каталожных IF tools. Не переносить GDT-TS на ESM-IF1."
        source: PAPER
        locator: "Jing Appendix D Eq. 6 Huber pairwise"
      - text: "Invariance $p(Y\\mid TX)=p(Y\\mid X)$ — свойство головы sequence, не лицензия называть ESM-IF1 SE(3)-equivariant generator координат. Equivariant path есть у IPA (tFold) и у внутренних GVP vectors до projection."
        source: PAPER
        locator: "AntiFold SI invariant encoder; tFold IPA equivariant updates"
    equations:
      - latex: "h = T_\\theta\\bigl(E_{\\mathrm{geom}}(X),\\,C\\bigr),\\qquad \\mathrm{out} = H_\\phi(h)"
        caption: "Родовая постановка класса (generic INTERPRETATION). $E_{\\mathrm{geom}}$ кодирует 3D (GVP-GNN / ESM-PPI+Evoformer); $T_\\theta$ — Transformer или pair-updating stack; $H_\\phi$ — task head (AR logits / frames / recovery). Не loss RFdiffusion и не Hsu Eq. 1 целиком."
        generic_or_specific: generic
        source: INTERPRETATION
        symbols:
          - {sym: X, type: "structure or sequence features", meaning: "backbone coords (IF) или sequence(+MSA antigen) (tFold)"}
          - {sym: C, type: "conditioner", meaning: "masks, chain IDs, optional antigen coords / epitope / FR template"}
          - {sym: "E_{geom}", type: "encoder", meaning: "GVP message passing или PLM+pair init"}
          - {sym: "T_\\theta", type: "Transformer / Evoformer / IPA stack", meaning: "global или pair-biased attention"}
          - {sym: "H_\\phi", type: "head", meaning: "softmax AA, structure module, или recovery"}
        meaning: "Обучаются $\\theta,\\phi$ под конкретный loss подтипа. Семплируется выход головы, не «группа SE(3)»."
    sections:
      - id: math-gvp-layer
        level: 3
        title: "Слой GVP (Jing) — encoder, не Transformer"
        paragraphs:
          - text: "Чистый GVP-GNN (Jing CPD/MQA) — страница [GNN](/architectures/graph-neural-networks.html). Здесь слой нужен как геометрический encoder GVP-Transformer. Equivariance к rotations **and** reflections (Eq. 1). Chirality не штрафуется Algorithm 1."
            source: PAPER
            locator: "Jing Eq. 1; Algorithm 1; §3.2 protein graph"
        equations:
          - latex: "V_h=W_h V,\\quad s'=\\sigma\\bigl(W_m[\\|V_h\\|_2;s]+b\\bigr),\\quad V'=\\sigma^+(\\|W_\\mu V_h\\|_2)\\odot(W_\\mu V_h)"
            caption: "Jing Algorithm 1 (сжато). $s\\in\\mathbb{R}^n$ invariant, $V\\in\\mathbb{R}^{\\nu\\times 3}$ equivariant. Hsu/AntiFold добавляют этот encoder перед Transformer. Не ΔG."
            generic_or_specific: generic
            source: PAPER
            locator: "Jing Algorithm 1; Eq. 1"
            symbols:
              - {sym: "s,V", type: "R^n and R^{ν×3}", meaning: "scalar and vector channels at node/edge"}
              - {sym: "W_h,W_\\mu,W_m", type: "matrices", meaning: "channel maps; не сферические гармоники TFN"}
              - {sym: "\\sigma,\\sigma^+", type: "nonlinearities", meaning: "scalar gate; vector gated by row-wise norm"}
            meaning: "Слой. Jing CPD loss — AR sequence CE на CATH; MQA — Huber на GDT-TS. Не catalog IF tool."
      - id: math-gvp-transformer
        level: 3
        title: "Подтип A — GVP-Transformer inverse folding (ESM-IF1 / AntiFold; tool-specific)"
        paragraphs:
          - text: "Seq2seq encoder–decoder. Encoder: 4 GVP-GNN на kNN graph ($k=30$), change of basis векторных фич в локальные N–Cα–C frames → invariant scalars → 8 Transformer encoder + 8 AR decoder, 8 heads, $d=512$, $\\approx 142$M. $p(Y\\mid X)=p(Y\\mid TX)$ для $T\\in\\mathrm{SE}(3)$. Span mask до 30 AA, 15% coords; masked nodes исключаются из GVP, в Transformer — нули. **Не** уравнение tFold. Table A.1 optimizer/batch/lr — NR."
            source: PAPER
            locator: "AntiFold SI architecture citing Hsu; prior Hsu bioRxiv §GVP-Transformer, Appendix A.2–A.3"
        equations:
          - latex: "p_\\theta(Y\\mid X)=\\prod_{i=1}^{n}p_\\theta(y_i\\mid y_{<i},X),\\qquad \\mathcal{L}=-\\sum_i\\log p_\\theta(y_i^\\star\\mid y_{<i}^\\star,X)"
            caption: "Hsu / AntiFold SI Equation (1). $X$ — backbone N, Cα, C ($3n$ coords). Порядок — последовательность цепи (не random MPNN order). Tool-specific ESM-IF1; AntiFold наследует факторизацию, меняет данные и маски."
            generic_or_specific: "ESM-IF1/AntiFold [PAPER/SI]; tool-specific"
            source: SI
            locator: "AntiFold Supplementary Methods Eq. (1) citing Hsu et al."
            symbols:
              - {sym: Y, type: "AA sequence", meaning: "включая concatenated Fv с gap tokens у AntiFold"}
              - {sym: X, type: "backbone coords", meaning: "N, Cα, C; optional antigen heavy atoms (AntiFold)"}
              - {sym: n, type: "int", meaning: "длина токен-цепочки (с padding комплексов)"}
            meaning: "Оптимизируется token CE. Семплируется categorical из softmax (temperature); recovery Hsu $T=10^{-6}$."
          - latex: "p(Y\\mid X)=p(Y\\mid TX)\\qquad\\forall T\\in\\mathrm{SE}(3)"
            caption: "Инвариантность IF выхода. Transformer сам по себе не SE(3)-equivariant: инвариантность — GVP + local frames. Не equivariant vector decoder."
            generic_or_specific: "ESM-IF1 [PAPER]; tool-specific"
            source: PAPER
