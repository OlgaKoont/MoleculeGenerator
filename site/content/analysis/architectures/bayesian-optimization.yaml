lede: "Bayesian optimization — **sequential design loop**: вероятностный surrogate даёт posterior $p(f\\mid D_t)$, acquisition $a$ выбирает следующий query. Это не generator backbone, не greedy ranking по $\\hat y$ и не affinity predictor. Released [EVOLVEpro](/tools/evolvepro.html) **не** GP-BO: experimental path — RF + top-$N$ $\\hat y$."
