  - id: applicability
    title: "17. Где применимо и где не применимо"
    paragraphs:
      - text: "Применимо, когда есть дорогой oracle, ограниченный бюджет queries и surrogate с **честным** $\\sigma$: chimera libraries, pool-based mutants, latent sequence design. Концептуально [few-shot active learning](/tasks/few-shot-active-learning.html) и [ML-guided directed evolution](/tasks/ml-guided-directed-evolution.html). Практический released loop каталога — [EVOLVEpro](/tools/evolvepro.html) greedy RF, см. [active learning](/architectures/active-learning.html), **не** этот id."
        source: MATRIX
      - text: "Workflow [few-shot active learning](/workflows/few-shot-active-learning.html) в YAML **не** несёт architecture_id BO: proposal stage помечен AL. Не утверждать, что workflow «использует GP-UCB»."
        source: MATRIX
        locator: "workflows/few-shot-active-learning.yaml architecture_ids"
      - text: "Запрет: [de novo backbone](/tasks/de-novo-backbone-generation.html) — [frame diffusion](/architectures/frame-diffusion.html) / [RFdiffusion](/tools/rfdiffusion.html). Epitope-conditioned antibody 3D — [RFantibody](/tools/rfantibody.html). Sequence LM без labels — [zero-shot](/architectures/zero-shot-mutation-scoring.html). Inverse folding redesign — [AntiFold](/tools/antifold.html) / [ProteinMPNN](/tools/proteinmpnn.html)."
        source: MATRIX
      - text: "Запрет: выдавать NEHVI/UCB за измеренный $K_d$. Запрет: humanization CNN ([Humatch](/tools/humatch.html)) как BO. Запрет: BindCraft filter cascade как GP-BO."
        source: INTERPRETATION
      - text: "Нельзя решать codon/CHO/secretion этим классом. Нельзя сравнивать Romero $T_{50}$ с Makowski dual-improved IgG % как один успех."
        source: INTERPRETATION
