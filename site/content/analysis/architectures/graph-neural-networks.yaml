status_note: "Класс — message passing на графе residues/atoms, не одна generative process и не задача inverse folding. В этом проходе: Dauparas et al. ProteinMPNN — Science HTML + catalog CODE close-read dauparas/ProteinMPNN @8907e667 (protein_mpnn_utils.py, protein_mpnn_run.py, training/README.md); SI PDF / Fig. S1 не постранично. LigandMPNN — Nature Methods HTML 10.1038/s41592-025-02626-1 (Methods: три графа, M=25, encoder 3+2, packing как отдельная сеть, split 317/74/83); preprint 10.1101/2023.12.22.573103 не сличать с journal pagination; dauparas/LigandMPNN line-audit NR. dyMEAN — arXiv HTML 2302.00203 (Eqs. 1–24, Theorem 4.1, Table 1/3/4/6, Appendix F hyperparameters); PMLR kong23c PDF не постранично; thunlp-mt/dymean CODE NR. Chroma — Nature HTML 10.1038/s41586-023-06728-8 (Fig. 1: random long-range GNN denoiser + отдельная design GNN после backbone; 310 designs; crystals 8TNM/8TNO); SI Tables 2–3 / Appendices E–G graph widths NR; generatebio/chroma commit NR. Gilmer ICML 2017 — pointer (Chroma refs 30), full text unread. Не ставить GVP-Transformer / FAPE / UCB / VP-SDE как default этого класса."
lede: "Graph neural networks (GNN / MPNN) — **слой сообщений** на графе residues или atoms: локальный geometric inductive bias, из которого делают generator только после decode head. Это не задача $p(s\\mid x)$, не dense pair Transformer, не SE(3)-класс как таковой и не diffusion process."
