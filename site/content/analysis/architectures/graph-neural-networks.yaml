        level: 3
        title: "Смежные постановки, которые нельзя смешивать"
        paragraphs:
          - text: "Таблица ниже — не бенчмарк инструментов. Generated object, oracle и split разные. ProteinMPNN не имеет `se3-equivariant-models` id; ESM-IF1 не имеет `graph-neural-networks` id."
            source: INTERPRETATION
        tables:
          - caption: "Смежные постановки, которые нельзя смешивать"
            source: INTERPRETATION
            headers: ["Постановка", "Train target", "Sampler / декодер", "Что в каталоге"]
            rows:
              - ["GNN / MPNN (эта страница)", "зависит от головы: CE IF / Huber co-design / (Chroma) diffusion ELBO на coords", "AR random order; AME+Kabsch; или GNN внутри reverse SDE", "proteinmpnn, ligandmpnn, dymean, chroma"]
              - ["[Inverse folding](/architectures/inverse-folding.html) как задача", "$p(s\\mid x)$ CE", "любой IF decoder", "ProteinMPNN и ESM-IF1 — разные architecture_id"]
