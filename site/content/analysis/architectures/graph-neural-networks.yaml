  - id: data-repr
    title: "4. Представление данных"
    paragraphs:
      - text: "Узлы ProteinMPNN: residues. Рёбра: kNN по Cα (released $k=48$ из checkpoint `num_edges`; класс `__init__` default $k=64$ **не** используется, если загружен checkpoint). Признаки ребра: 25 расстояний между N/Cα/C/O/virtual Cβ пар $i,j$; same-chain binary; relative sequence index, cap $\\pm 32$. Hidden 128; vocab 21; $\\approx 1.68$M (Table 1 exp. 4) vs 1.66M в тексте LigandMPNN — округление / retrained split, не выдумывать третье число."
        source: PAPER
        locator: "Dauparas Fig. 1, Table 1; CODE ProteinMPNN.__init__; protein_mpnn_run.py k_neighbors=checkpoint['num_edges']"
      - text: "LigandMPNN protein graph: те же 25 residue–residue distances. Protein–ligand: каждый residue ↔ $M=25$ ближайших ligand atoms (virtual Cβ–ligand). Per-residue fully connected ligand graph на этих $M$ atoms; node ligand = element one-hot; edges = distances (+ sin/cos ligand в N–Cα–C frame). Encoder: 3 protein MPNN layers dim 128 + 2 protein–ligand blocks; 2.62M параметров. Protein-neighbor $K$ в Algorithm 7 — символ, численное значение **NR** (не приравнивать молча к 48)."
        source: PAPER
        locator: "LigandMPNN Fig. 1; Methods architecture; Algorithm 7 EncLayer"
      - text: "dyMEAN: вершина = $(h_i\\in\\mathbb{R}^d, X_i\\in\\mathbb{R}^{3\\times c_i})$. Три графа: epitope $\\mathcal{G}_E$, antibody $\\mathcal{G}_A$, shadow paratope $\\mathcal{G}_S$. kNN по min pairwise atom distance (Eq. 1), $k=9$ (Table 6 `k_neighbors`). Три global nodes (heavy, light, epitope) + связь heavy–light globals. Channel attribute $d=16$ (Appendix B). Hidden 128, embed 64, n_layers 3."
        source: PAPER
        locator: "Kong §3 Eq. 1; Appendix F Table 6; Appendix B d=16"
      - text: "Chroma: random graph с long-range connectivity (N-body statistics); не полный pair track AF2. Ширины слоёв / число рёбер на узел — SI Tables 2–3, **NR**. Design network — «similar graph neural-network architecture» + conditional sequence/side-chain layers (Nature; SI Figs. 7, 8, 15 не транскрибированы)."
        source: PAPER
        locator: "Ingraham Nature architecture paragraph; SI cited, widths NR"
      - text: "Time embedding: у IF MPNN **нет** diffusion $t$. У Chroma denoiser $t$ входит в $\\hat x_\\theta(x_t,t)$ — это признак **diffusion**, не родовой GNN. dyMEAN iteration index $t=1..T$ — progressive full-shot decode, не noising time."
        source: PAPER
        locator: "Ingraham Fig. 1a; Kong Eq. 14"
      - text: "Вход сети vs внешний файл. PDB/CIF numbering, IMGT position $r_i$ (dyMEAN embeddings), design JSONL ProteinMPNN, ligand coords из PDB HETATM, contig RFdiffusion — preprocessor. Library CSV / ELISA table — **не** тензор этого класса. SAbDab summary — фильтр датасета dyMEAN, не слой."
        source: INTERPRETATION
      - text: "Маски. ProteinMPNN: decode mask / chain encoding / tied positions. LigandMPNN: $Y_m$ ligand atom mask. dyMEAN: paratope `[MASK]` type; cosine unmask schedule train (90%→0%). Chroma: diffusion conditioner primitives (symmetry, motif, shape) — не MPNN mask, а guidance reverse SDE."
        source: PAPER
        locator: "CODE protein_mpnn_run.py; LigandMPNN Notation Y_m; Kong Appendix F unmask; Ingraham conditioners"
      - text: "Аугментации, меняющие геометрию. Gaussian noise на backbone (±ligand) при train IF. LigandMPNN: 2–4% protein residues как extra context ligand atoms (recovery почти не растёт, но включает sidechain-as-context inference). dyMEAN: coords normalize to $\\mathcal{N}(0,I)$; SI conserved-residue template; affinity task — Gaussian disturbance known complex (Appendix D). Не путать noise с MD."
        source: PAPER
        locator: "LigandMPNN Methods augmentation; Kong §4.1 normalize; Appendix D"
      - text: "Размерности, которых нет в прочитанном тексте, не выводятся: LigandMPNN protein $K$; Chroma GNN width; ProteinMPNN SI Fig. S1A точные точки k-sweep beyond «saturates 32–48»; dyMEAN $d$ hidden beyond Table 6 128."
        source: NR
  - id: physical-repr
    title: "5. Физическое представление"
    paragraphs:
      - text: "Математический state IF-GNN: токены $s$ на backbone, который считается данным в Å. Virtual Cβ — tetrahedral construction из N/Cα/C, не экспериментальный Cβ глицина. Ligand atoms $Y$ — ядра непротеиновых атомов в том же кадре, что и protein (кристалл/модель), не docked-on-the-fly, если пользователь не подставил pose."
        source: PAPER
        locator: "Dauparas virtual Cβ; LigandMPNN Fig. 1"
      - text: "dyMEAN $X_i$ — Cartesian ядер всех атомов residue. Paratope в paper = CDR-H3 (можно расширить маски). Epitope = 48 residues closest to antibody (Kong following Shan 2022) — это **определение датасета**, не физический epitope mapping эксперимента."
        source: PAPER
        locator: "Kong §3; §5 epitope 48"
      - text: "Chroma $x_t$ — noisy backbone coords (polymer-correlated). Промежуточный $x_t$ **не** MD-траектория фолдинга и не энергия. Design-net sequence — дискретная identity на уже выбранном $x_0$."
        source: PAPER
        locator: "Ingraham Nature Fig. 1a"
      - text: "SE(3). ProteinMPNN: **invariant** features (расстояния, offsets) → sequence invariant к глобальному повороту, если preprocessor не сломан. Перестановка residues ломает chain index / AR order, не «S_N-симметрию белка». Chain concat — конвенция батча, не линкер."
        source: INTERPRETATION
      - text: "dyMEAN Theorem 4.1: sequence paratope invariant, docked structure equivariant к E(3) epitope (и независимо к инициализации antibody). Обмен epitope↔antibody только через $h$ shadow paratope, не через $X$."
        source: PAPER
        locator: "Kong Theorem 4.1; §4.3 information exchanging"
      - text: "Chroma: equivariant reconstruction from predicted inter-residue geometries (Nature). Точная группа (SE(3) vs E(3)/reflections) в SI — NR this pass. Не приписывать ProteinMPNN vector equivariance."
        source: PAPER
        locator: "Ingraham Nature equivariant layers sentence"
      - text: "Side chains. ProteinMPNN: **отсутствуют** в state (pack post-hoc Rosetta/другой packer = evaluator). LigandMPNN: sequence generator не содержит $\\chi$; packing network предсказывает mixture circular normals $\\chi_{1..4}$ AR по углам (все $\\chi_1$, затем $\\chi_2$, …). dyMEAN: side chains **в state** ($c_i$). Chroma: side chains в design network после backbone, не в diffusion $x_t$ (по постановке Nature)."
        source: PAPER
        locator: "LigandMPNN packing paragraph; Kong full-atom; Ingraham design network"
      - text: "Masked token / embedding $h_i$ / noisy $x_t$ $\\neq$ физическая траектория и $\\neq$ $\\Delta G$. Predicted Shan $\\Delta\\Delta G$ dyMEAN — scalar surrogate на графе, не SPR."
        source: INTERPRETATION
      - text: "Chirality: invariant-distance MPNN не содержит явного зеркального канала; E(3) dyMEAN включает reflections в группе Theorem 4.1. Проверялся ли каждый checkpoint на mirrored PDB — **NR**."
        source: NR
  - id: physchem
    title: "6. Физико-химический смысл"
    physchem:
      - feature: "Identity AA"
        interpretation: "тип residue; packing complementarity к окружению"
        encoded: "прямо как discrete decode / CE; dyMEAN softmax на paratope каждый iteration"
        limitation: "AAR / recovery ≠ Kd; unigram CDR-H3 (ARDG***DY) уже даёт 39.61% AAR на RAbD"
      - feature: "Backbone / frames / torsions"
        interpretation: "остов и χ"
        encoded: "ProteinMPNN: backbone coords как условие, не генерируются; LigandMPNN χ — отдельная packing net; dyMEAN full-atom X; Chroma backbone — diffusion, не MPNN-IF"
        limitation: "χ3/χ4 poorly recovered (LigandMPNN HTML); dyMEAN bond Huber ≠ force field"
      - feature: "Antigen / hotspot / ligand coords"
        interpretation: "геометрия партнёра связывания"
        encoded: "LigandMPNN: прямо как Y atoms; dyMEAN: epitope graph + shadow paratope; ProteinMPNN: только если пользователь зажал chain как context backbone, без химии лиганда; Chroma: conditioner / не MPNN-IF"
        limitation: "нужен заданный pose; нет ELISA tensor"
      - feature: "H-bonds / electrostatics / solvation"
        interpretation: "физическая энергия связывания и растворимости"
        encoded: "косвенно через геометрию и native statistics; нет explicit Coulomb/GB head"
        limitation: "нельзя говорить, что MPNN «считает ΔG»"
      - feature: "Entropy / ensemble"
        interpretation: "конформационная и sequence entropy"
        encoded: "косвенно temperature decode; Chroma low-T — diffusion Appendix C, не этот класс"
        limitation: "T=0.1 ProteinMPNN — heuristic, не термодинамический β"
      - feature: "Evolutionary statistics"
        interpretation: "MSA / PSSM / language-model prior"
        encoded: "не представлена в ProteinMPNN/LigandMPNN/dyMEAN train (native PDB identities). Chroma caption/CATH classifiers — semantic conditioners diffusion, не MSA GNN"
        limitation: "не ESM likelihood"
      - feature: "Experimental y (Kd, ELISA, BLI, ΔG assay)"
        interpretation: "измеренная функция"
        encoded: "не в loss IF-GNN; dyMEAN affinity MLP fit к **predicted** ΔΔG Shan/FoldX; Chroma wet-lab — protocol после sampling, не train target GNN"
        limitation: "predicted ΔΔG ≠ SPR; split-GFP ≠ affinity"
    paragraphs:
      - text: "Таблица не утверждает, что класс вычисляет энергию. LigandMPNN authors report experimental binders и X-ray — это **downstream campaigns**, не energy head."
        source: PAPER
        locator: "LigandMPNN abstract; Kong §7 energy reliability"
  - id: learned
    title: "7. Что обучается"
    paragraphs:
      - text: "Параметры $\\theta$: MPNN encoder/decoder (и edge updates у ProteinMPNN), LigandMPNN extra protein–ligand blocks + отдельный packing $\\theta_{\\chi}$, dyMEAN AME + $\\phi_p,\\phi_d$ + Kabsch не обучается (алгоритм), Chroma denoiser $\\theta$ и отдельно design-net $\\theta_{\\mathrm{des}}$. Frozen MSA/PLM **нет** у ProteinMPNN/LigandMPNN/dyMEAN."
        source: PAPER
        locator: "Dauparas 3+3 layers; LigandMPNN 3+2; Kong AME; Ingraham two networks"
      - text: "ProteinMPNN ~1.68M (Table 1 exp. 4); LigandMPNN 2.62M vs retrained ProteinMPNN 1.66M на том же PDB. Chroma / dyMEAN total parameter count в прочитанном HTML — **NR** (не выдумывать)."
        source: PAPER
        locator: "Dauparas Table 1; LigandMPNN parameter sentence"
      - text: "Loss IF: categorical CE native sequence. Negative / non-binder / contrastive / affinity labels **нет**. Tied logits — decode constraint, не contrastive loss."
        source: PAPER
        locator: "Dauparas; LigandMPNN Methods CE"
      - text: "LigandMPNN packing: mixture (3 components) circular normal на $\\chi_{1..4}$; log-probability scores. Это не CE sequence. chi3/chi4 struggle — HTML."
        source: PAPER
        locator: "LigandMPNN packing paragraph"
      - text: "dyMEAN: $\\mathcal{L}_{\\mathrm{seq}}+\\mathcal{L}_{\\mathrm{struct}}+\\mathcal{L}_{\\mathrm{dock}}$. Нет assay labels. Affinity mode: extra MLP $\\hat f_\\theta$ fit к Shan predictor на generated complexes, затем gradient search на init $Z$ (Appendix D Eq. 4) — **другой** objective, surrogate не SPR."
        source: PAPER
        locator: "Kong §4.4; Appendix D"
      - text: "Chroma denoiser: diffusion ELBO / score — **не** эта страница. Design network: sequence + side-chain heads, lineage Ingraham 2019 / ProteinMPNN citations Nature, **не** тот же checkpoint что dauparas/ProteinMPNN."
        source: PAPER
        locator: "Ingraham Nature design network sentence; refs 15, 16, 32"
      - text: "Fine-tune vs pretrain. ProteinMPNN: CATH Table 1 vs production assemblies (25 361 clusters). LigandMPNN: train from PDB biounits 16 Dec 2022, не «FT ProteinMPNN weights» в прочитанном HTML (architecture generalization; retrained ProteinMPNN baseline). dyMEAN: train on SAbDab Nov 2022; cosine unmask. Antibody-specific FT ProteinMPNN в этом классе **нет** как catalog default (AntiFold — другой architecture_id)."
        source: PAPER
        locator: "Dauparas training corpora; LigandMPNN dataset; Kong §5.1 split"
      - text: "Chroma semantic conditioners (CATH, captions) — **отдельные** classifier/caption nets, invertible как guidance. Не путать с GNN loss IF."
        source: PAPER
        locator: "Ingraham Fig. 4; Appendices S–T cited"
      - text: "Negative binders в loss: **нет** ни у одного из четырёх catalog tools как train target этого класса."
        source: PAPER
  - id: forward
    title: "8. Прямой проход и information flow"
    paragraphs:
      - text: "Порядок IF: coords → graph build → encoder MPNN (node+edge) → decoder AR по $\\pi$ → AA logits → sample. Sequence появляется в decoder, не в encoder (encoder не видит unknown design tokens как GT; teacher forcing на уже декодированных). Geometry backbone **не** обновляется."
        source: PAPER
        locator: "Dauparas Fig. 1; CODE EncLayer / DecLayer in utils (ProteinMPNN); LigandMPNN Algorithms 10–13"
      - text: "LigandMPNN вставляет protein–ligand encoder после protein encoder, до sequence decoder. Packing net: другой forward после фиксации $S$ — **не** прятать внутрь «одной сети», если веса packing отдельные (HTML: «also trained a sidechain packing neural network»)."
        source: PAPER
        locator: "LigandMPNN Fig. 1; packing paragraph"
      - text: "dyMEAN: SI init $h,X$ → attach shadow paratope → alternate AME on $\\mathcal{G}_A$ and $\\mathcal{G}_E\\cup\\mathcal{G}_S$ copying $h$ (L layers) → $T$ progressive iterations (recompute kNN) → softmax paratope → Kabsch dock. Inverse folding MPNN **не** внутри AME."
        source: PAPER
        locator: "Kong Fig. 3; Eqs. 2–6, 14–19"
      - text: "Chroma: noise backbone → GNN denoiser → consensus structure from inter-residue geometries → **затем** design GNN. AF2/ESMFold refolding в Nature — **evaluator**, не слой denoiser. split-GFP / CD / crystal — **experiment**."
        source: PAPER
        locator: "Ingraham Fig. 1; experimental protocol three steps"
      - text: "Не прятать Rosetta pack, AF2, HDock, Shan ΔΔG, FoldX внутрь generator. Pipeline IgFold→HDock→MEAN→Rosetta в dyMEAN Table 1 — baselines, помечены $*$."
        source: PAPER
        locator: "Kong Table 1 caption"
      - text: "RFdiffusion → ProteinMPNN: два модуля, два architecture_id. На этой странице только второй."
        source: MATRIX
      - text: "FlowDesign использует dyMEAN как **prior**, не как sampler этой страницы (другой architecture_id flow-matching)."
        source: MATRIX
        locator: "catalog FlowDesign; не уравнение здесь"
      - text: "Score / likelihood rerank после семплов — evaluator. ProteinMPNN log p; LigandMPNN confidence 0–100 коррелирует с recovery на test (Fig. 2c), всё ещё не Kd."
        source: PAPER
        locator: "LigandMPNN Fig. 2c"
    mermaid: |
      flowchart TD
        IN["External: PDB CIF ligand pose epitope coords"] --> G["Build graph: kNN residue / 25 ligand NN / shadow paratope / random long-range"]
        G --> ENC["MPNN encoder messages"]
        ENC --> SUB{"Subtype"}
        SUB -->|"ProteinMPNN LigandMPNN"| AR["GENERATOR: AR decode random order sequence"]
        SUB -->|"dyMEAN"| AME["GENERATOR: AME iterations update h and X"]
        SUB -->|"Chroma"| DEN["GENERATOR is diffusion: GNN only parametrizes denoiser"]
        AR --> PACK["LigandMPNN chi net or Rosetta pack — packing module"]
        AME --> DOCK["Kabsch native to shadow paratope"]
        DEN --> DES["Design GNN/CRF after backbone — not IF MPNN checkpoint"]
        PACK --> EV["EVALUATOR: AF2 pLDDT scRMSD recovery DockQ Shan ddG"]
        DOCK --> EV
        DES --> EV
        EV --> XP["EXPERIMENT: solubility crystal BLI yeast FP split-GFP"]
    mermaid_caption: "Оригинальная схема класса по Dauparas / LigandMPNN Fig. 1 / Kong Fig. 3 / Ingraham Fig. 1 — не копипаст paper figures. Generator, packing, evaluator и experiment разведены. Chroma diffusion — канон другого класса."
    mermaid_source: INTERPRETATION
  - id: training
    title: "9. Training procedure"
    paragraphs:
      - text: "Единого корпуса класса нет. Split, которого нет в прочитанном тексте, **не** выводится из README."
        source: INTERPRETATION
      - text: "ProteinMPNN Table 1: 19.7k CATH 4.2 80/10/10 **monomers**. Production: assemblies ≤3.5 Å, <10k residues, mmseqs2 30% → **25 361** clusters. Noise 0.02 Å в Table 1 vs released 0.02/0.10/0.20/0.30 Å. Точный listing CATH IDs в SI — NR."
        source: PAPER
        locator: "Dauparas Science training paragraph; training/README.md checkpoints"
      - text: "LigandMPNN: PDB biounits на 16 December 2022, X-ray/cryo-EM ≤3.5 Å, <6000 residues; mmseqs2 30%; exclude HOH/NA/CL/K/BR. Hold-out: 317 small-mol, 74 NA, 83 metal. Retrained ProteinMPNN на том же set без context. 0.1 Å noise. Adam β1=0.9 β2=0.98 ε=1e-9, batch 6000 tokens, 300 000 steps, one A100, AMP + grad checkpoint."
        source: PAPER
        locator: "LigandMPNN Methods dataset / optimizer"
      - text: "dyMEAN: SAbDab November 2022; CDR-H3 clusters BLOSUM62 40% identity (MMseqs2); drop clusters overlapping RAbD; train 3256 Abs / 1644 clusters, val 365 / 182; test RAbD 60. Adam lr $10^{-3}\\to 10^{-4}$, batch 16, 2× RTX 2080 Ti, 200 epochs (CDR-H3 and affinity) / 250 (complex pred). Unmask 90%→0% cosine."
        source: PAPER
        locator: "Kong §5.1; Appendix F"
      - text: "Chroma: PDB 20 March 2022, UniProt 2022_01, PFAM 35; train/test/val IDs Zenodo 10.5281/zenodo.8285077 (из catalog coordinate-diffusion close-read). Resolution filters в Nature Data paragraph — **NR** (SI). Не README."
        source: PAPER
        locator: "Ingraham Nature Data availability; prior catalog note"
      - text: "Teacher forcing: AR IF на GT prefix по $\\pi$. Self-conditioning ProteinMPNN — **NR**. dyMEAN progressive full-shot с soft embedding predicted $p_i$ (Eq. after 15), не AR token-by-token по цепи."
        source: PAPER
        locator: "Kong prediction §4.4"
      - text: "Что симуляция vs wet-lab. Table 1 recovery / RAbD AAR / in silico refolding Chroma — **in silico**. ProteinMPNN Fig. 3–4, LigandMPNN Fig. 4 and «>100 binders», Chroma Fig. 5 split-GFP/CD/crystal — **prospective wet-lab**, не смешивать с recovery. dyMEAN paper **не** содержит wet-lab affinity."
        source: PAPER
      - text: "Leakage. LigandMPNN: nonoverlapping ligand-context hold-out vs 30% seq clusters. dyMEAN: drop same CDR-H3 clusters as RAbD. Unigram ARDG***DY всё равно даёт высокий AAR — metric leakage через motif copying, не обязательно PDB ID leak."
        source: PAPER
        locator: "Kong §7 Data Diversity"
      - text: "Batching ProteinMPNN GPU hours — **NR** (не путать с inference 1.2 s / 100 res vs Rosetta 4.3 min, Science)."
        source: PAPER
        locator: "Dauparas runtime sentence"
  - id: inference
    title: "10. Inference and generation"
    paragraphs:
      - text: "Старт ProteinMPNN: PDB/backbone json; optional CA-only weights. Шум на coords при inference **не** добавляется пользователем по умолчанию (шум был train-time). Design mask; tied positions для homomers."
        source: CODE
        locator: "protein_mpnn_run.py parse / --tied_positions"
      - text: "Алгоритм: sample $\\pi$ (или decode fixed first); temperature softmax, default T=0.1; не beam в released script (NR если есть скрытый beam). top-k — **NR** в прочитанном argparse beyond temperature. Batch нескольких sequences."
        source: CODE
        locator: "protein_mpnn_run.py --sampling_temp default 0.1"
      - text: "LigandMPNN: старт backbone + ligand/NA/metal coords; AR sequence с temperature (Algorithm 13); затем packing net. CPU 0.9 s / 100 residues vs ProteinMPNN 0.6 s (HTML)."
        source: PAPER
        locator: "LigandMPNN speed sentence; Algorithm 13"
      - text: "dyMEAN: incomplete sequence (paratope masked) + epitope structure; SI template init; $T=3$ AME iterations; one complex per forward (не AR residue). kNN rebuild each iteration. Нет beam. Нет AF recycle."
        source: PAPER
        locator: "Kong n_iter=3 Table 6; Eq. 14"
      - text: "Chroma: старт — noisy polymer (correlated diffusion), не MPNN mask. Low-T diffusion sampling (Appendix C). Затем **один** sequence sample per backbone в in silico refolding paragraph. Design network ≠ вызов dauparas/ProteinMPNN, если пользователь сам не подменил."
        source: PAPER
        locator: "Ingraham protocol; one sequence per backbone"
      - text: "Post-hoc evaluator (не generator): AF2/ESMFold/OmegaFold refold; Rosetta pack/FastRelax; clash filters; DockQ; ProteinMPNN likelihood rerank; Shan/FoldX ΔΔG. HDock в dyMEAN baselines — чужой модуль."
        source: INTERPRETATION
      - text: "Чего в классе IF нет: recycle IPA, assay-in-the-loop, UCB, backbone diffusion steps, epitope tensor ELISA. Чего нет у dyMEAN paper: wet-lab SPR. Чего нет у ProteinMPNN: ligand atoms (это LigandMPNN)."
        source: PAPER
      - text: "Tied decoding: average logits then softmax лучше average probabilities для homomers (55% vs 53% vs 52% unconstrained) — Science Fig. 1C / S1C (S1C panel SI NR, число из HTML)."
        source: PAPER
        locator: "Dauparas Fig. 1C"
  - id: conditioning
    title: "11. Conditioning"
    paragraphs:
      - text: "ProteinMPNN зажимает: backbone $x$, позиции с mask=false (включая partner chain при binder IF), tied oligomer indices. Не зажимает: ligand atoms, ELISA, CATH label, epitope embedding отдельным тензором (только если coords партнёра в том же PDB)."
        source: PAPER
        locator: "Dauparas Fig. 1B"
      - text: "LigandMPNN зажимает: backbone + nonprotein atoms $Y$ (small mol / NA / metal). Можно подать sidechain atoms как context (train aug 2–4%). Не зажимает: measured affinity. Pose лиганда — ответственность пользователя; модель не ищет docking."
        source: PAPER
        locator: "LigandMPNN Fig. 1; augmentation"
      - text: "dyMEAN зажимает: epitope graph (48 closest residues в экспериментах paper), incomplete antibody sequence, IMGT-like $r_i$. Paratope masked. Shadow paratope — внутренний механизм, не user ELISA. Classifier-free guidance **нет**."
        source: PAPER
        locator: "Kong task definition; §5 epitope"
      - text: "Chroma conditioners (symmetry, motif, shape, CATH, language) действуют на **diffusion**, не на ProteinMPNN mask. Design network conditioned on sampled backbone. Не приписывать Chroma MPNN-IF contig syntax RFdiffusion."
        source: PAPER
        locator: "Ingraham Fig. 1c, Fig. 3–4"
      - text: "Classifier-free guidance как у diffusion image models — **не** описан для ProteinMPNN. Chroma: composable hard constraints + soft penalties (Appendix M cited), это не CFG dropout class token MPNN."
        source: PAPER
        locator: "Ingraham conditioner framework paragraph"
      - text: "Чего нет: epitope tensor от phage counts; ELISA/BLI labels в forward; hotspot encoding RFdiffusion на этой странице (это другой tool)."
        source: INTERPRETATION
      - text: "Antibody numbering (IMGT) у dyMEAN — embedding $f_{r_i}$, внешняя конвенция файла, не выученный epitope."
        source: PAPER
        locator: "Kong §4.1 h_i^{(0)}"
      - text: "Multistate / symmetry ProteinMPNN: tied decoding + random AR order «to facilitate symmetric 9, 16 and multistate» — LigandMPNN HTML переносит ту же схему. Не UCB."
        source: PAPER
        locator: "LigandMPNN paragraph random AR"
  - id: complexity
    title: "12. Вычислительная сложность"
    paragraphs:
      - text: "Драйверы: $N$ residues (и ligand atoms $M\\times N$ у LigandMPNN), степень kNN $k$, число MPNN layers, AR steps $=N$ (IF), dyMEAN $T\\times$ layers $\\times$ kNN rebuild, Chroma NFE diffusion **плюс** design-net (NFE — не эта страница без SI)."
        source: INTERPRETATION
      - text: "Sparse kNN: encoder $O(N k \\, d)$ на слой, не $O(N^2)$ pair Transformer. Dauparas именно этим мотивируют sparse graph vs structure prediction."
        source: PAPER
        locator: "Dauparas immediate-environment rationale"
      - text: "LigandMPNN: linear in protein length (HTML); extra $[N,M]$ and $[N,M,M]$ ligand blocks, $M=25$. «Дешевле diffusion» как общее утверждение — **не** писать без NFE comparison в paper; LigandMPNN сравнивает себя с ProteinMPNN/Rosetta, не с RFdiffusion steps."
        source: PAPER
        locator: "LigandMPNN linear scaling sentence"
      - text: "Chroma: sub-quadratic $O(N)$ or $O(N\\log N)$ vs typical $O(N^2)$/$O(N^3)$ structure generators (Nature). Это сравнение архитектурного scaling denoiser, не wall-clock MPNN vs diffusion на одном бенчмарке designs. V100 «>3000 residues in a few minutes» — Nature, полный protocol (diffusion+design), не слой GNN изолированно."
        source: PAPER
        locator: "Ingraham Nature scaling paragraph; last paragraph GPU"
      - text: "ProteinMPNN Science: 1.2 s vs Rosetta 4.3 min per 100 residues — PAPER runtime IF vs Rosetta, не vs diffusion."
        source: PAPER
        locator: "Dauparas runtime"
      - text: "dyMEAN vs HERN: Appendix G space complexity (paratope-only hierarchical AR) — qualitative efficiency claim; GPU hours train 200 epochs 2×2080 Ti — PAPER, не сравнивать с ProteinMPNN A100 300k steps как один benchmark."
        source: PAPER
        locator: "Kong Appendix F, G"
      - text: "Wall-clock LigandMPNN GPU train 300k A100 steps — указано устройство, часы **NR**. Assay latency не часть класса."
        source: NR
  - id: strengths
    title: "13. Преимущества"
    paragraphs:
      - text: "Локальный packing inductive bias следует из kNN message passing: sequence design не обязан строить dense pair track. Это механизм, не маркетинг."
        source: PAPER
        locator: "Dauparas sparse graph rationale"
      - text: "Sub-quadratic / linear scaling IF и Chroma random graph — из sparse/random connectivity, не из «магии GNN»."
        source: PAPER
      - text: "ProteinMPNN Table 1 unnoised recovery 50.8% после ablation (distances 49.0% → edge updates 50.5% → random order 50.8%); native recovery 52.4% vs Rosetta 32.9% на 402 monomers — **этот** split, не класс vs ESM-IF1."
        source: PAPER
        locator: "Dauparas Table 1; recovery vs Rosetta sentence"
      - text: "Wet-lab ProteinMPNN (не обобщать на LigandMPNN/dyMEAN/Chroma): median soluble yield 9→247 mg/L на AF-hallucinated set (Fig. 3A); 50/96 redesigns correct oligomer SEC; crystal 2.35 Å / 8CYK; tetrahedral assemblies. Grb2 SH3 BLI — $K_d$ в HTML **NR**. AF2 был фильтром дизайна, не affinity oracle."
        source: PAPER
        locator: "Dauparas Fig. 3–4; catalog tool analysis"
      - text: "LigandMPNN near-ligand recovery 63.3% / 50.5% / 77.5% vs ProteinMPNN 50.5 / 34.0 / 40.6 и Rosetta (abstract). chi1 packing median near small molecules 86.1% vs Rosetta 76.0%. 100-fold cholic-acid affinity — конкретная кампания (Fig. 4 / ref. 4), не класс. PDB 8TAC — DNA binder crystal, не Kd таблицы."
        source: PAPER
        locator: "LigandMPNN abstract; Fig. 3 chi1; Fig. 4; 8TAC sentence"
      - text: "dyMEAN RAbD Table 1: AAR 43.65%, CAAR 28.11%, RMSD 8.11 Å, DockQ 0.409 vs pipeline MEAN* DockQ 0.162 — **in silico**, не SPR. Это не гарантия стабильности/аффинности/экспрессии."
        source: PAPER
        locator: "Kong Table 1"
      - text: "Chroma: 310 proteins expression protocol; crystals UNC_079 / UNC_239 RMSD 1.1 / 1.0 Å (PDB 8TNM, 8TNO). Это protocol diffusion+design-net+likelihood selection **без** AF filter, не доказательство «GNN layer folds proteins»."
        source: PAPER
        locator: "Ingraham Fig. 5; protocol paragraph"
      - text: "Явно: ни recovery, ни DockQ, ни split-GFP, ни predicted $\\Delta\\Delta G$ не гарантируют experimental affinity, developability или epitope correctness."
        source: INTERPRETATION
  - id: limits
    title: "14. Ограничения"
    paragraphs:
      - text: "Математика. kNN cutoff отсекает дальние контакты; AR order-agnostic всё ещё left-to-right в выбранной $\\pi$ (ошибки префикса). dyMEAN Huber на coords ≠ Boltzmann energy. Chroma GNN не отменяет bias polymer prior diffusion."
        source: INTERPRETATION
      - text: "Представление. Residue graph ProteinMPNN не видит clashes sidechain до packing. LigandMPNN требует ligand coords. dyMEAN $c_i$ variable, но epitope=48 heuristic. Chroma SI widths непрочитаны — воспроизведение архитектуры по main text неполное."
        source: PAPER
      - text: "Физика/химия. Нет explicit H-bond/electrostatics/solvation head. Predicted ΔΔG / FoldX — surrogate. LigandMPNN не моделирует induced fit backbone (backbone fixed)."
        source: PAPER
        locator: "LigandMPNN backbone and ligand fixed sentence"
      - text: "Данные/bias. PDB resolution и crystal packing memory → train noise. dyMEAN unigram CDR-H3. Chroma v.1 helix overrepresentation at low T (Supplementary Fig. 11b cited in HTML). LigandMPNN exclude ions HOH/NA/CL/K/BR — не «все гетероатомы»."
        source: PAPER
        locator: "Kong §7; Ingraham helix sentence; LigandMPNN parse exclude list"
      - text: "Обобщение. IF models trained on native backbones; hallucinated/RFdiffusion backbones — distribution shift (ProteinMPNN как раз для этого noise checkpoints, не гарантия). dyMEAN RAbD 60 complexes. Antibody MPNN без SAbDab FT (vanilla ProteinMPNN) — другой режим, чем AntiFold."
        source: INTERPRETATION
      - text: "Deployment. Chroma weights gated. dyMEAN/LigandMPNN code unaudited this pass. ProteinMPNN default `v_48_020` ≠ Table 1 0.02 Å model — silent mismatch если цитировать Table 1 как production."
        source: CODE
        locator: "training/README.md; protein_mpnn_run.py default v_48_020"
  - id: failures
    title: "15. Failure modes"
    paragraphs:
      - text: "Подмена метрики: AAR / LigandMPNN confidence / DockQ / Shan ΔΔG / AF pLDDT как Kd. dyMEAN Table 3 «лучшие ΔΔG» — predicted, и unigram уже близок к AAR Table 1."
        source: PAPER
        locator: "Kong §7 unigram 39.61% AAR"
      - text: "Неверный conditioner: LigandMPNN с пустым/не тем ligand pose; ProteinMPNN на antibody CDR без Ab-specific FT как будто AntiFold; dyMEAN epitope не те 48 residues / неверный numbering IMGT."
        source: INTERPRETATION
      - text: "Truncation sampler: T→0 ProteinMPNN (почти argmax) vs default 0.1; Chroma low-T уменьшает diversity (Nature). Не путать два temperature."
        source: PAPER
      - text: "Library / graph misspecification: k слишком мал (не released 48); забытые tied positions у homomer; LigandMPNN $M$ <<25 на nucleic acids (SI Fig. 1a: NA recovery падает)."
        source: PAPER
        locator: "LigandMPNN SI Fig. 1a prose in HTML"
      - text: "Broken equivariance: dyMEAN без shadow paratope / без sharing (Table 4 DockQ drop); подача antibody и epitope в несогласованных кадрах без механизма SP."
        source: PAPER
        locator: "Kong Table 4 -sharing"
      - text: "Exploitation collapse affinity mode: gradient search на Shan MLP (Appendix D) может эксплуатировать surrogate, не SPR — авторы предупреждают в §7."
        source: PAPER
        locator: "Kong §7; Appendix D"
      - text: "Distribution shift: crystal-refined backbone memorization без train noise; LigandMPNN χ3/χ4; Chroma language/CATH conditioners не всегда совпадают с intended fold (Fig. 4 Ig/β-barrel examples)."
        source: PAPER
        locator: "Ingraham Fig. 4 caption; LigandMPNN chi3/chi4"
      - text: "Путаница инструментов: вызвать ESM-IF1 как «GNN»; считать Chroma «ещё один ProteinMPNN»; сравнивать mg/L ProteinMPNN, 100-fold bile acid, DockQ dyMEAN и split-GFP Chroma как один benchmark."
        source: INTERPRETATION
  - id: tools
    title: "16. Реализации в инструментах"
    paragraphs:
      - text: "Полный reverse index `architecture_id: graph-neural-networks`. Неравные объекты не ставить в одну колонку «успех»."
        source: MATRIX
        locator: "site/src/mappings.py"
    tables:
      - caption: "Catalog tools с этим architecture_id и foundational methods вне карточек"
        source: MATRIX
        headers: ["Tool", "Generic architecture", "Tool-specific implementation", "Important difference"]
        rows:
          - ["[ProteinMPNN](/tools/proteinmpnn.html)", "Residue MPNN + AR decode", "3 encoder + 3 decoder, hidden 128, released k=48, random-order CE, default ckpt v_48_020, T=0.1; CODE 8907e667", "Нет ligand atoms; нет χ; нет E(3) vector update; не GVP-Transformer"]
          - ["[LigandMPNN](/tools/ligandmpnn.html)", "MPNN IF + atomic context", "Три графа, M=25, 3+2 encoder, 2.62M, CE sequence; packing = отдельная circular-normal net; CODE commit NR this pass", "Контекст small mol/NA/metal; не antibody campaign в paper; не dyMEAN docking"]
          - ["[dyMEAN](/tools/dymean.html)", "E(3) multi-channel GNN co-design", "AME Eqs. 8–11, k=9, n_layers=3, T=3, shadow paratope, Kabsch, CE+Huber; CODE NR", "Генерирует coords+seq+pose; predicted ΔΔG ≠ assay; не catalog IF default"]
          - ["[Chroma](/tools/chroma.html)", "GNN denoiser + GNN design-net", "Random long-range graph; design after backbone; SI widths NR; commit NR", "Канон генерации — coordinate diffusion; split-GFP не MPNN-IF; веса gated"]
          - ["Ingraham NeurIPS 2019 Structured Transformer (не карточка tools)", "Graph + attention CPD", "NR this pass (pointer)", "Ancestor ProteinMPNN/Chroma design-net; не ESM-IF1"]
          - ["Jing GVP-GNN CPD (не карточка tools)", "GVP message passing", "См. geometric-transformers / Jing ICLR", "**Не** этот catalog id; не копировать GVP Eq. на ProteinMPNN"]
          - ["Gilmer MPNN 2017 (не карточка tools)", "Generic message passing", "Unread full text", "Схема слоя, не protein design checkpoint"]
          - ["RFantibody sequence stage (не этот architecture_id)", "Вызов vanilla ProteinMPNN", "После RFdiffusion CDRs", "Не добавлять RFantibody в reverse index этого класса"]
  - id: applicability
    title: "17. Где применимо и где не применимо"
    paragraphs:
      - text: "Применимо: [fixed-backbone inverse folding](/workflows/fixed-backbone-inverse-folding.html) (primary ProteinMPNN; LigandMPNN alternative при гетероатомах); sequence stage после [de-novo backbone](/workflows/de-novo-backbone-then-mpnn.html) — как **IF tool**, не как architecture_id workflow (там frame-diffusion). Ligand/NA/metal interfaces при известном pose — LigandMPNN / [functional-site-design](/tasks/functional-site-design.html)."
        source: MATRIX
      - text: "CDR co-design при epitope coords: [cdr-codesign-diffab](/workflows/cdr-codesign-diffab.html) lists dyMEAN as alternative generator; architecture_ids workflow — diffusion/flow/SE(3), не этот id. Использовать dyMEAN как end-to-end full-atom, не как ProteinMPNN."
        source: MATRIX
        locator: "cdr-codesign-diffab.yaml alternatives"
      - text: "Chroma: [joint-multimodal-generation](/workflows/joint-multimodal-generation.html) alternative; канон — joint generation + coordinate diffusion ids. Не решать IF-only задачу «через Chroma GNN» без diffusion protocol."
        source: MATRIX
      - text: "Нельзя: de novo backbone **только** этим классом (нет noise→fold у ProteinMPNN). Для fold — [frame diffusion](/architectures/frame-diffusion.html) / [coordinate diffusion](/architectures/coordinate-diffusion.html) / RFdiffusion."
        source: INTERPRETATION
      - text: "Нельзя: few-shot active learning / ELISA loop — [sequential design](/architectures/sequential-design-loops.html), не MPNN CE. Нельзя: zero-shot mutation scoring как PLM Δℓ — другой класс."
        source: INTERPRETATION
      - text: "Нельзя: считать ESM-IF1/AntiFold/tFold реализациями этого id. Нельзя: affinity maturation по Shan ΔΔG как замену SPR. Нельзя: ligand design без pose (нужен docking/RFdiffusion-AA, не LigandMPNN alone)."
        source: INTERPRETATION
      - text: "Вместо путаницы: antibody IF с SAbDab — AntiFold (geometric-transformers); antigen-conditioned CDR diffusion — DiffAb; all-atom ligand binders — RFdiffusion-AA + LigandMPNN как **два** модуля."
        source: MATRIX
      - text: "Задачи seed `not_for_task_ids`: [few-shot-active-learning](/tasks/few-shot-active-learning.html), [de-novo-backbone-generation](/tasks/de-novo-backbone-generation.html) — GNN-IF их не закрывает; Chroma закрывает backbone через **другой** architecture_id."
        source: MATRIX
        locator: "content/architectures/graph-neural-networks.yaml not_for_task_ids"
  - id: method-sources
    title: "18. Методологические источники"
    paragraphs:
      - text: "Foundational слой: Gilmer et al. 2017 (pointer, unread). Protein graph design: Ingraham et al. NeurIPS 2019 (pointer). Канон IF-GNN каталога: Dauparas Science 2022 — **прочитан** HTML + CODE 8907e667; SI PDF pointer-only."
        source: PAPER
      - text: "LigandMPNN Nature Methods 2025 — **прочитан** journal HTML this pass; preprint не сличен. Packing algorithms в HTML; protein $K$ NR."
        source: PAPER
      - text: "dyMEAN arXiv 2302.00203 HTML — **прочитан** methods/eqs/tables/appendices F–G excerpts; ICML PMLR pointer-only; GitHub unaudited."
        source: PAPER
      - text: "Chroma Nature 2023 HTML — **прочитан** main (GNN role, protocol, wet-lab); SI graph hypers pointer-only. Канонические уравнения diffusion — страница coordinate-diffusion, не дублировать ELBO."
        source: PAPER
      - text: "Не библиография «всего GNN»: EGNN Satorras, TFN Thomas, MEAN Kong 2022 — упоминаются dyMEAN related work, не catalog tools. HERN Jin 2022 — baseline Table 1, не карточка."
        source: PAPER
        locator: "Kong related work / Table 1"
      - text: "Catalog papers: paper-proteinmpnn, paper-ligandmpnn, paper-dymean, paper-chroma. Tool analysis sidecar есть у ProteinMPNN; у LigandMPNN/dyMEAN/Chroma в этом проходе — paper HTML, не tool YAML audit."
        source: MATRIX
