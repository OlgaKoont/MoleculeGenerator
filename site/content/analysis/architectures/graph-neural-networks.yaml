sections:
  - id: domain
    title: "1. Область определения"
    paragraphs:
      - text: "Роль в пайплайне — **geometric inductive bias / message-passing density model**: узлы (residues или atoms) обмениваются сообщениями по sparse рёбрам (kNN, radius, bonds, ligand nearest atoms). Generator появляется только когда к MPNN добавлен decode head: AR sequence (ProteinMPNN / LigandMPNN), iterative full-atom update + Kabsch (dyMEAN), или denoiser/design-net внутри другого generative process (Chroma). Сама семья слоёв не задаёт assay loop и не выбирает mutants по UCB."
        source: INTERPRETATION
      - text: "Generated или scored state зависит от подтипа. ProteinMPNN: дискретные AA tokens при **зафиксированном** backbone $x$. LigandMPNN: то же плюс отдельная сеть $\\chi$-углов при фиксированных backbone и ligand coords. dyMEAN: типы paratope **и** full-atom координаты всего antibody, затем docked pose. Chroma GNN: обновление noisy backbone coords (denoiser) и, отдельно, sequence/side chains (design network) — канон семпла coords принадлежит [coordinate diffusion](/architectures/coordinate-diffusion.html)."
        source: PAPER
        locator: "Dauparas Science Fig. 1; LigandMPNN Nat. Methods Fig. 1; Kong §3 task; Ingraham Nature Fig. 1"
      - text: "Задачи каталога, которые класс реально закрывает как слой: [inverse folding](/tasks/inverse-folding.html) (ProteinMPNN, LigandMPNN); [functional-site-design](/tasks/functional-site-design.html) при **заданном** ligand/NA/metal pose (LigandMPNN); [joint CDR sequence–structure design](/tasks/joint-cdr-sequence-structure-design.html) (dyMEAN). De novo topology из шума — не MPNN-IF; у Chroma это diffusion, не «GNN generates fold from empty graph»."
        source: MATRIX
        locator: "seed applicable_task_ids; reverse index"
      - text: "Это **не** страница задачи [inverse folding](/architectures/inverse-folding.html): $p(s\\mid x)$ можно реализовать GVP-Transformer, ESM-IF1, AntiFold, ProteinMPNN. Класс GNN — про **как** кодируется локальный граф, не про постановку CPD."
        source: INTERPRETATION
      - text: "Это **не** [geometric transformers](/architectures/geometric-transformers.html). ESM-IF1 / AntiFold: GVP-GNN encoder **затем** Transformer на invariant tokens. Нельзя называть ESM-IF1 «просто GNN» и нельзя копировать Hsu $p(Y\\mid X)$ GVP-Transformer на ProteinMPNN."
        source: PAPER
        locator: "Hsu/AntiFold на соседней странице; extra_constraints"
      - text: "Это **не** [SE(3)-equivariant models](/architectures/se3-equivariant-models.html) как класс. ProteinMPNN оперирует **invariant** distances (N/Cα/C/O/virtual Cβ) — не vector channels GVP и не IPA. dyMEAN — E(3)-equivariant multi-channel $X_i$; Chroma denoiser — equivariant reconstruction из inter-residue geometries (Nature). Смешивать четыре статуса в фразу «GNN equivariant» нельзя."
        source: PAPER
        locator: "Dauparas edge features; Kong Theorem 4.1; Ingraham Nature equivariant layers"
      - text: "Это **не** [joint sequence–structure generation](/architectures/joint-sequence-structure-generation.html) и не [joint seq–struct diffusion](/architectures/joint-sequence-structure-diffusion.html). dyMEAN co-design'ит paratope sequence и coords итеративно, но train target — CE + Huber coords/bonds/dock, не DiffAb KL-on-amino-acids. ProteinMPNN **не** семплирует backbone. Chroma jointness = diffusion backbone **плюс** design GNN после, не один MPNN-IF."
        source: PAPER
        locator: "Kong losses §4.4; Ingraham Nature design network after backbone"
      - text: "Это **не** [coordinate diffusion](/architectures/coordinate-diffusion.html) и не [frame diffusion](/architectures/frame-diffusion.html). VP-SDE / DDPM / SE(3) score — train target соседних классов. GNN может **параметризовать** denoiser (Chroma), но уравнение noising не принадлежит этой странице."
        source: INTERPRETATION
      - text: "Catalog tools с `architecture_id: graph-neural-networks`: [ProteinMPNN](/tools/proteinmpnn.html), [LigandMPNN](/tools/ligandmpnn.html), [dyMEAN](/tools/dymean.html), [Chroma](/tools/chroma.html). Часто путают с [ESM-IF1](/tools/esm-if1.html) / [AntiFold](/tools/antifold.html) (geometric-transformers), с [RFdiffusion](/tools/rfdiffusion.html) (frame diffusion; MPNN только post-hoc sequence), с [DiffAb](/tools/diffab.html) (joint diffusion)."
        source: MATRIX
        locator: "site/src/mappings.py"
      - text: "RFantibody и workflow [de-novo-backbone-then-mpnn](/workflows/de-novo-backbone-then-mpnn.html) **используют** ProteinMPNN как sequence stage, но `architecture_ids` RFantibody **не** включают этот класс: генератор fold — diffusion. Не переносить wet-lab RFantibody на «успех GNN-класса»."
        source: MATRIX
        locator: "workflow architecture_ids; RFantibody tool ids"
  - id: intuition
    title: "2. Интуитивный принцип"
    paragraphs:
      - text: "Аминокислота (или атом) «смотрит» на непосредственных соседей по графу. Несколько слоёв расширяют рецептивное поле примерно как глубина × степень, но не дают dense $N\\times N$ pair memory AlphaFold. Dauparas: native identity в основном определяется immediate environment — поэтому sparse graph достаточен для sequence design, в отличие от structure prediction, где нужны дальние контакты."
        source: PAPER
        locator: "Dauparas Science architecture rationale (immediate environment)"
      - text: "При inference меняется **разное**. ProteinMPNN/LigandMPNN: фиксирован $x$ (и ligand $Y$); семплируются токены $s$ по случайному порядку узлов; backbone не двигается. dyMEAN: обновляются и $h_i$, и $X_i$ на $T$ итерациях AME, затем rigid docking Kabsch. Chroma: noisy $x_t\\to\\hat x_0$ через GNN denoiser (это шаг **diffusion**); sequence появляется только в design network на уже выбранном backbone."
        source: PAPER
        locator: "Dauparas Fig. 1; Kong Eqs. 14–19; Ingraham Nature Fig. 1a–b"
      - text: "Главный эмпирический рычаг IF-подтипа — **шум на входных coords при train** и **temperature при decode**. ProteinMPNN Table 1: 0.02 Å Gaussian в ablation vs released checkpoints `v_48_002/010/020/030`; default inference `v_48_020` (0.20 Å). Temperature default 0.1 в run script. LigandMPNN train noise 0.1 Å; recovery падает с ростом шума (как у ProteinMPNN)."
        source: PAPER
        locator: "Dauparas Table 1 vs training/README.md; LigandMPNN Methods noise 0.1 Å; CODE protein_mpnn_run.py --sampling_temp"
      - text: "Рычаг LigandMPNN — **атомарный контекст** $M$ ближайших ligand atoms (лучшее $M=25$ по Supplementary Fig. 1a, панель в SI не перерисована). Без ligand atoms модель вырождается в ProteinMPNN-like на том же PDB split."
        source: PAPER
        locator: "LigandMPNN Nat. Methods Fig. 1 caption; Methods 25 closest"
      - text: "Рычаг dyMEAN — **shadow paratope** (клон paratope у epitope, shared $h$, private $X$) плюс **full-atom** $c_i$ каналов. Ablation Table 4: без full-atom DockQ 0.343 vs 0.409; без sharing 0.356; $T=3$ лучше $T=2/4$ по docking."
        source: PAPER
        locator: "Kong §4.2; Table 4"
      - text: "Рычаг Chroma-GNN — **random long-range edges** (N-body connectivity) вместо полного pair track: sub-quadratic scaling. Это про вычислимость denoiser, не про «GNN лучше diffusion». Low-temperature sampling — модификация **diffusion** process (Appendix C), не temperature AR MPNN."
        source: PAPER
        locator: "Ingraham Nature paragraph scalable architecture; Supplementary Appendix C cited in HTML"
      - text: "Предостережение по метрикам. Sequence recovery / AAR / CAAR, LigandMPNN confidence 0–100, $\\chi_1$ fraction within 10°, log $p(s\\mid x)$, AF2 pLDDT / scRMSD — **не** experimental affinity / $K_d$ / ELISA / BLI. ProteinMPNN wet-lab (solubility, oligomer SEC, crystal, Grb2 BLI) — отдельные кампании, не тождество likelihood. LigandMPNN «>100 experimental binders» и 100-fold cholic-acid — конкретные design campaigns, не класс-benchmark против dyMEAN DockQ."
        source: PAPER
        locator: "Dauparas Fig. 3–4; LigandMPNN abstract / Fig. 4; Kong Table 1 vs §5.3"
      - text: "dyMEAN «affinity optimization» подгоняет MLP к **предсказанному** $\\Delta\\Delta G$ Shan et al. 2022 (и отдельно FoldX в Appendix K). Авторы сами пишут, что computational energy может плохо коррелировать с экспериментом. Это **не** SPR и не loss native CE."
        source: PAPER
        locator: "Kong §5.3; §7 Reliability of Computational Energy Functions"
  - id: math
    title: "3. Формальная математическая постановка"
    paragraphs:
      - text: "Сначала родовая схема слоя. Затем четыре подтипа каталога — **разные train target**. Не подставлять seed one-liner как уравнение default-инструмента. Не переносить FAPE, diffusion score, UCB, MLM $\\Delta\\ell$, Hsu GVP-Transformer на эту страницу без дисклеймера."
        source: INTERPRETATION
      - text: "Формулы ниже, помеченные tool-specific, **не** являются уравнениями «GNN по умолчанию» и не являются уравнениями соседнего catalog tool. ProteinMPNN CE $\\neq$ dyMEAN Huber. Chroma $\\hat x_\\theta(x_t,t)$ $\\neq$ AR $p(s\\mid x)$."
        source: INTERPRETATION
      - text: "Формулы, которые **не** принадлежат default ни одному catalog tool как «уравнение GNN-класса»: FAPE; DiffAb KL-on-amino-acids; FrameDiff DSM на frames; UCB / few-shot AL; Hsu GVP-Transformer $p(Y\\mid X)$; ProteinMPNN seed one-liner без random-order $\\pi$; Chroma polymer VP-SDE как якобы MPNN loss."
        source: INTERPRETATION
      - text: "Gilmer 2017 в этом проходе не читался; родовая схема MPNN помечена INTERPRETATION. Dauparas Table 1 empirically shows encoder **edge updates** (experiment 2: 49.0% → 50.5% unnoised recovery). LigandMPNN EncLayer HTML Algorithm 7 — конкретная реализация $q_{ij}=[v_i,v_j,e_{ij}]$ + sum over $K$ neighbors / scale $s=30$."
        source: PAPER
        locator: "Dauparas Table 1 exp. 2; LigandMPNN Algorithm 7"
      - text: "ProteinMPNN — order-agnostic AR, не N→C как Hsu. Не копировать GVP-Transformer уравнения на этот подтип (extra_constraints)."
        source: PAPER
        locator: "Dauparas Science Fig. 1 vs Hsu/AntiFold SI Eq. 1"
      - text: "LigandMPNN sequence loss = тот же CE, что ProteinMPNN; packing — другой decoder (circular normals). Не склеивать в одно уравнение $\\chi$ и AA."
        source: PAPER
        locator: "LigandMPNN packing paragraph; Methods CE"
      - text: "dyMEAN Theorem 4.1 E(3) — свойство AME+Kabsch, не ProteinMPNN. Affinity Table 3 — Shan surrogate, не loss native CE."
        source: PAPER
        locator: "Kong Theorem 4.1; §5.3"
      - text: "Chroma GNN не делает класс «joint generator»: Nature явно разделяет denoiser graph и design network after backbone. Сравнивать Chroma split-GFP с ProteinMPNN mg/L как один GNN-benchmark нельзя."
        source: PAPER
        locator: "Ingraham Nature Fig. 1; Fig. 5 protocol"
    equations:
      - latex: "m_{ij}^{(\\ell)}=M^{(\\ell)}\\bigl(h_i^{(\\ell)},h_j^{(\\ell)},e_{ij}\\bigr),\\qquad h_i^{(\\ell+1)}=U^{(\\ell)}\\Bigl(h_i^{(\\ell)},\\bigoplus_{j\\in\\mathcal{N}(i)} m_{ij}^{(\\ell)}\\Bigr)"
        caption: "Родовой MPNN (Gilmer schema). $\\oplus$ — sum/mean; $\\mathcal{N}(i)$ — kNN/radius/bond. ProteinMPNN encoder также обновляет рёбра (Table 1 experiment 2). Не уравнение default Chroma ELBO."
        generic_or_specific: generic
        source: INTERPRETATION
        locator: "Gilmer 2017 pointer; Dauparas Table 1 edge updates; LigandMPNN EncLayer HTML Algorithm 7"
        symbols:
          - {sym: "h_i^{(\\ell)}", type: "vector", meaning: "invariant (обычно) hidden узла i на слое ℓ"}
          - {sym: "e_{ij}", type: "vector", meaning: "признаки ребра (distances, same-chain, offset, ligand geometry)"}
          - {sym: "m_{ij}", type: "vector", meaning: "сообщение j→i"}
          - {sym: "M,U", type: "networks", meaning: "message / update MLP"}
          - {sym: "\\mathcal{N}(i)", type: "index set", meaning: "соседи по графу"}
        meaning: "Обучаются параметры слоёв $M,U$ (и heads). Семплируется не этот слой сам по себе, а выход decode head."
    sections:
      - id: math-pmpnn
        level: 3
        title: "Residue MPNN inverse folding (ProteinMPNN; tool-specific)"
        paragraphs:
          - text: "Order-agnostic AR на residue graph. Не N→C Transformer. Не GVP. Ссылка: [/tools/proteinmpnn.html](/tools/proteinmpnn.html)."
            source: PAPER
            locator: "Dauparas Science Fig. 1"
        equations:
          - latex: "p(s\\mid x)=\\prod_{t=1}^{L} p\\bigl(s_{\\pi_t}\\mid s_{\\pi_{<t}}, x\\bigr),\\qquad \\pi\\sim\\mathrm{Unif}(S_L)"
            caption: "Случайная перестановка decode. При inference фиксированный контекст можно декодировать первым (Fig. 1B). $x$ — backbone, не ligand."
            generic_or_specific: tool-specific
            source: PAPER
            locator: "Dauparas Science; /tools/proteinmpnn.html"
            symbols:
              - {sym: "s", type: "discrete sequence", meaning: "AA tokens (20 + X)"}
              - {sym: "x", type: "coordinates", meaning: "backbone N/Cα/C/O (+ virtual Cβ в рёбрах)"}
              - {sym: "\\pi", type: "permutation", meaning: "порядок AR"}
              - {sym: "L", type: "integer", meaning: "число residues (цепи concatenated)"}
            meaning: "Обучается CE на native $s^\\star$. Семплируется $s$ при фиксированном $x$."
          - latex: "\\mathcal{L}=-\\sum_i \\log p(s_i^\\star\\mid s_{\\pi_{<i}}^\\star, x)"
            caption: "Categorical CE / NLL. Label smoothing коэффициент в SI Methods — NR this pass."
            generic_or_specific: tool-specific
            source: PAPER
            locator: "Dauparas; LigandMPNN Methods «categorical cross entropy following ProteinMPNN»"
      - id: math-lmpnn
        level: 3
        title: "Atom-context MPNN (LigandMPNN; tool-specific)"
        paragraphs:
          - text: "Три графа, не один. Sequence decode — тот же random-order AR, что у ProteinMPNN. Packing $\\chi$ — **отдельная** сеть после sequence, mixture of circular normals. Не уравнение ProteinMPNN и не dyMEAN AME. Ссылка: [/tools/ligandmpnn.html](/tools/ligandmpnn.html). Тензор $K$ protein kNN в HTML задан как символ, число — NR."
            source: PAPER
            locator: "LigandMPNN Fig. 1; Methods Algorithms 10–13"
        equations:
          - latex: "Y\\in\\mathbb{R}^{L\\times M\\times 3},\\quad M=25"
            caption: "На каждый residue — $M$ ближайших ligand atoms от virtual Cβ. Protein graph: 25 pairwise distances среди N/Cα/C/O/virtual Cβ для пары residues (это 5×5, не $M$)."
            generic_or_specific: tool-specific
            source: PAPER
            locator: "LigandMPNN Methods Notation; Fig. 1"
            symbols:
              - {sym: "Y", type: "tensor", meaning: "координаты ближайших ligand atoms"}
              - {sym: "L", type: "integer", meaning: "residues"}
              - {sym: "M", type: "integer", meaning: "контекст atoms per residue; лучшее 25"}
            meaning: "Кондиционер геометрии лиганда; не семплируется. Sequence семплируется AR; $\\chi$ — отдельным decoder."
      - id: math-dymean
        level: 3
        title: "Full-atom E(3) multi-channel GNN (dyMEAN; tool-specific)"
        paragraphs:
          - text: "Не IF на фиксированном backbone. Не FAPE. Ссылка: [/tools/dymean.html](/tools/dymean.html)."
            source: PAPER
            locator: "Kong §4"
        equations:
          - latex: "m_{ij}=\\phi_m\\Bigl(h_i^{(l)}, h_j^{(l)}, \\frac{T_R(X_i^{(l)},X_j^{(l)})}{\\|T_R\\|_F+\\epsilon}\\Bigr),\\quad X_i^{(l+1)}=X_i^{(l)}+\\frac{1}{|\\mathcal{N}(i)|}\\sum_j X_{ij}"
            caption: "AME (Kong Eqs. 8–11, сжато). $X_i\\in\\mathbb{R}^{3\\times c_i}$, $c_i$ = число атомов residue. $T_R$ E(3)-invariant, $T_S$ O(3)-equivariant. $\\epsilon=1$."
            generic_or_specific: tool-specific
            source: PAPER
            locator: "Kong §4.3 Eqs. 8–13"
            symbols:
              - {sym: "X_i", type: "matrix 3×c_i", meaning: "координаты атомов residue i"}
              - {sym: "c_i", type: "integer", meaning: "число атомов (full-atom, не фиксировано 4)"}
              - {sym: "T_R,T_S", type: "operators", meaning: "geometric relation / message scaler"}
              - {sym: "\\phi_m,\\phi_x,\\phi_h", type: "MLPs", meaning: "message / coord scale / hidden update"}
            meaning: "Обучаются AME + heads. Семплируются типы paratope (softmax) и обновлённые coords, затем docked $\\tilde X$."
          - latex: "Q,t=\\mathrm{Kabsch}(\\{X_i^{(T)}\\}_{i\\in\\mathcal{V}_P},\\{X_i^{(T)}\\}_{i\\in\\mathcal{V}_S}),\\quad \\tilde X_i=Q X_i^{(T)}+t"
            caption: "Docking: выровнять native paratope на shadow paratope. Не часть ProteinMPNN."
            generic_or_specific: tool-specific
            source: PAPER
            locator: "Kong Eqs. 18–19"
            symbols:
              - {sym: "Q", type: "O(3)", meaning: "ортогональное выравнивание"}
              - {sym: "t", type: "R^3", meaning: "сдвиг"}
              - {sym: "\\mathcal{V}_P,\\mathcal{V}_S", type: "index sets", meaning: "native / shadow paratope"}
            meaning: "Поза комплекса; не energy minimization Rosetta."
          - latex: "\\mathcal{L}_{\\mathrm{seq}}=\\frac{1}{T|\\mathcal{V}_P|}\\sum_{t=1}^{T}\\sum_{i\\in\\mathcal{V}_P}\\ell_{\\mathrm{ce}}(p_i^{(t)},p_i^\\star),\\quad \\mathcal{L}_{\\mathrm{struct}}=\\mathcal{L}_{\\mathrm{coord}}+\\mathcal{L}_{\\mathrm{bond}}"
            caption: "CE на paratope каждый iteration; Huber на coords (Kabsch-aligned GT) и bond lengths. $\\mathcal{L}_{\\mathrm{dock}}=\\mathcal{L}_{\\mathrm{sp}}+\\mathcal{L}_{\\mathrm{dist}}$. Huber $\\delta=1$ (Appendix E)."
            generic_or_specific: tool-specific
            source: PAPER
            locator: "Kong Eqs. 20–24; Appendix E"
      - id: math-chroma
        level: 3
        title: "GNN as denoiser / design-net (Chroma; tool-specific — не CE IF)"
        paragraphs:
          - text: "Train target backbone — **correlated reverse diffusion**, не ProteinMPNN NLL. GNN только параметризует $\\hat x_\\theta(x_t,t)$ на random long-range graph и отдельно design network $p(s,\\chi\\mid x_0)$. Уравнение VP-SDE/ELBO — на [coordinate diffusion](/architectures/coordinate-diffusion.html), не копировать сюда как «GNN loss». Hidden widths — SI Tables 2–3, NR. Ссылка: [/tools/chroma.html](/tools/chroma.html)."
            source: PAPER
            locator: "Ingraham Nature Fig. 1; paragraph design network"
        equations:
          - latex: "\\hat x_\\theta(x_t,t)=\\mathrm{GNN}_{\\mathrm{denoise}}(x_t,t;\\,\\mathcal{G}_{\\mathrm{rand}})"
            caption: "Схема роли (INTERPRETATION записи Nature «parameterize optimal denoiser as random GNN»). Не раскрывать ELBO. Не уравнение ProteinMPNN."
            generic_or_specific: tool-specific
            source: INTERPRETATION
            locator: "Ingraham Nature Fig. 1a–b prose"
            symbols:
              - {sym: "x_t", type: "coords", meaning: "noisy backbone at diffusion time t"}
              - {sym: "\\hat x_\\theta", type: "coords", meaning: "предсказанный чистый backbone"}
              - {sym: "\\mathcal{G}_{\\mathrm{rand}}", type: "graph", meaning: "random long-range graph, N-body connectivity"}
            meaning: "Обучается denoiser (diffusion ELBO — другой класс). Семплируется reverse diffusion; sequence — design GNN после."
