  - id: limits
    title: "14. Ограничения"
    paragraphs:
      - text: "Математика: one-hot Euclidean ≠ categorical FM; geodesic singularities near π (FrameFlow IGSO3 workaround); one-step map inferior; Proteina γ не temperature. Marginal VF не обязан быть OT даже если conditional OT (Lipman)."
        source: PAPER
        locator: "Lipman nevertheless marginal not OT; FrameFlow π degeneracy"
      - text: "Представление: FlowDesign требует Ab–Ag complex (exp. или AF3/dyMEAN); Proteina/FrameFlow — не antibody CDR. Mean-pool нет, но pair $O(N^2)$."
        source: PAPER
        locator: "FlowDesign Discussion incorrect structures"
      - text: "Физика/химия: нет растворителя/гликанов в $v_\\theta$; pack/Rosetta после; straight interpolant clashes."
        source: INTERPRETATION
      - text: "Данные: 20-complex test; SAbDab bias; Ibalizumab-only prospective; Proteina AFDB synthetic. Framework homology leakage NR."
        source: PAPER
        locator: "test 20 complexes"
      - text: "Обобщение: FrameFlow SCOPe L≤128 preliminary vs RFdiffusion (authors: expect underperform RFD, couldn't retrain). Proteina не Abs. Не переносить Ibalizumab ΔIC50 на другие epitopes."
        source: PAPER
