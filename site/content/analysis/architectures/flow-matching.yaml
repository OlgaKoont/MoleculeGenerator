  - id: applicability
    title: "17. Где применимо и где не применимо"
    paragraphs:
      - text: "Применимо: CDR co-design при известном/предсказанном комплексе — [FlowDesign](/tools/flowdesign.html), задачи [joint CDR](/tasks/joint-cdr-sequence-structure-design.html), [joint seq–struct](/tasks/joint-sequence-structure-generation.html); workflow [cdr-codesign-diffab](/workflows/cdr-codesign-diffab.html) как alternative generator."
        source: MATRIX
      - text: "Концептуально (не catalog default pipeline): de novo backbone / motif scaffolding коротким ODE — Proteina/FrameFlow literature. Не ставить их как tools каталога."
        source: INTERPRETATION
      - text: "Запрет: [few-shot AL](/tasks/few-shot-active-learning.html) — [EVOLVEpro](/tools/evolvepro.html). Zero-shot mutation — [ESM-1v](/tools/esm-1v-efficient-evolution.html). Inverse folding при готовом backbone — [ProteinMPNN](/tools/proteinmpnn.html) / [AntiFold](/tools/antifold.html)."
        source: MATRIX
        locator: "seed not_for_task_ids few-shot-active-learning"
      - text: "Запрет: epitope-conditioned de novo Fv без framework — [RFantibody](/tools/rfantibody.html), не FlowDesign. Запрет: выдавать AAR за $K_d$."
        source: INTERPRETATION
      - text: "Нельзя решать codon/CHO/secretion этим классом. Нельзя сравнивать Ibalizumab BLI с Romero $T_{50}$ или EVOLVEpro ELISA как один успех."
        source: INTERPRETATION
      - text: "Если нужен DDPM joint CDR без FM prior — [DiffAb](/tools/diffab.html) (in silico). Если нужен open de novo Ab pipeline — RFantibody, не FlowDesign (workflow decision_criteria)."
        source: MATRIX
        locator: "workflows/cdr-codesign-diffab.yaml decision_criteria"
      - text: "VHH: FlowDesign catalog VHH_relevance null. Не утверждать VHH кампанию."
        source: MATRIX
      - text: "Sequence-only CDR без какой-либо структуры framework (exp. или AF3/dyMEAN) — STAR не стартует; Discussion ожидает AF3 complex."
        source: PAPER
        locator: "Discussion AF3 then FlowDesign"
