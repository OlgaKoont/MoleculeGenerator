sections:
  - id: domain
    title: "1. Область определения"
    paragraphs:
      - text: "Роль в пайплайне — **generator** непрерывного состояния: обучается векторное поле $v_\\theta(x,t)$ (иногда несколько голов F,G,H), которое генерирует плотность-путь $p_t$ от простого $p_0$ к data $p_1$. Sampling — численное интегрирование ODE (Lipman Eq. 1), не reverse DDPM. Это не predictor (AF2 FAPE) и не sequential assay loop."
        source: PAPER
        locator: "Lipman §2 CNF Eq. (1)–(3); §3 FM"
      - text: "Generated state зависит от подтипа: Euclidean $x\\in\\mathbb{R}^{d}$ (часто Cα, Proteina); Riemannian frames $T=(r,x)\\in\\mathrm{SE}(3)^N$ (FrameFlow); joint CDR one-hot $s\\in\\mathbb{R}^{20}$, Cα $x\\in\\mathbb{R}^3$, orientation $O\\in\\mathrm{SO}(3)$ (FlowDesign). Scored state $v_\\theta$ — drift, не $K_d$."
        source: PAPER
        locator: "Proteina §3.2 Cα; FrameFlow §2.1 frames; FlowDesign STAR Transport Mapping"
      - text: "Задачи каталога: [joint CDR sequence–structure](/tasks/joint-cdr-sequence-structure-design.html) и [joint sequence–structure generation](/tasks/joint-sequence-structure-generation.html) через [FlowDesign](/tools/flowdesign.html); workflow [antigen-conditioned CDR co-design](/workflows/cdr-codesign-diffab.html) (FlowDesign — alternative generator, primary в YAML — DiffAb). Seed not_for [few-shot active learning](/tasks/few-shot-active-learning.html)."
        source: MATRIX
        locator: "architectures/flow-matching.yaml applicable_task_ids; workflow tool_ids include flowdesign"
      - text: "Это **не** [coordinate diffusion](/architectures/coordinate-diffusion.html): там train target — score / $\\varepsilon$ / $x_0$ при стохастическом forward SDE. Для Gaussian paths frameworks эквивалентны up to reparameterization (Proteina citing Kingma & Gao; Albergo) — это **не** лицензия копировать DDPM loss на эту страницу."
        source: PAPER
        locator: "Proteina §2 Gaussian flows equivalent up to reparametrizations"
      - text: "Это **не** [frame diffusion](/architectures/frame-diffusion.html): FrameDiff учит SE(3) score; FrameFlow — **другой** train target (geodesic VF) на той же FramePred архитектуре. Это **не** [joint sequence–structure diffusion](/architectures/joint-sequence-structure-diffusion.html): [DiffAb](/tools/diffab.html) — DDPM type+Cα+SO(3), baseline FlowDesign, не FM."
        source: PAPER
        locator: "FrameFlow same architecture as FrameDiff; FlowDesign STAR Diffab ~4M diffusion baseline"
      - text: "Это **не** [joint sequence–structure generation](/architectures/joint-sequence-structure-generation.html) целиком: FM — один из подтипов coupled generation (рядом DiffAb, ESM3). Это **не** [autoregressive structure generation](/architectures/autoregressive-structure-generation.html): PAR может держать FM-decoder, но AR next-scale — другой класс."
        source: INTERPRETATION
      - text: "Catalog tools с `architecture_id: flow-matching`: только [FlowDesign](/tools/flowdesign.html). Часто путают с DiffAb, [RFdiffusion](/tools/rfdiffusion.html), [Chroma](/tools/chroma.html), [BoltzGen](/tools/boltzgen.html) (ids: joint diffusion / coordinate diffusion — **не** FM, methods не говорят иное). [dyMEAN](/tools/dymean.html) — prior FlowDesign, не flow sampler."
        source: MATRIX
        locator: "tools/flowdesign.yaml architecture_ids; boltzgen.yaml omits flow-matching"
      - text: "Proteina / FrameFlow / FoldFlow — foundational literature, **не** карточки tools. Не EVOLVEpro, не UCB."
        source: MATRIX
  - id: intuition
    title: "2. Интуитивный принцип"
    paragraphs:
      - text: "Выбирают условный путь, соединяющий sample из $p_0$ (шум / informative prior) с datapoint $x_1$. Сеть регрессирует **известное** условное поле $u_t(\\cdot|x_1)$ simulation-free: на train ODE не интегрируют. На inference стартуют из $p_0$ и интегрируют выученное $v_\\theta$. При inference меняется состояние $x_t$ вдоль траектории; веса $\\theta$ фиксированы."
        source: PAPER
        locator: "Lipman §3 CFM vs intractable marginal u_t"
      - text: "OT / rectified линейный путь даёт прямые траектории постоянной скорости vs «overshoot» diffusion paths (Lipman Fig. 3). Это мотивация меньшего числа NFE, не физический folding."
        source: PAPER
        locator: "Lipman §4 Example II OT; Fig. 3 straight vs diffusion backtracking"
      - text: "Главный эмпирический рычаг **класса**: выбор $p_0$ и interpolant (не обязан быть $\\mathcal{N}(0,I)$). Главный рычаг **FlowDesign**: informative prior, empirically dyMEAN (retrained without CDR seq/struct) ≈15% AAR vs random на H3. [PAPER]"
        source: PAPER
        locator: "FlowDesign Results four priors; nearly 15% improvement Fig. 2A"
      - text: "Главный рычаг FrameFlow: geodesic interpolant + IGSO(3) $\\sigma=1.5$ на train (избежать geodesic near $\\pi$) при $U(\\mathrm{SO}(3))$ на sampling; Kabsch pre-align noise. [PAPER]"
        source: PAPER
        locator: "FrameFlow IGSO3 σ=1.5 training prior; Kabsch alignment"
      - text: "Главный рычаг Proteina: масштаб (до ~21M структур, transformer до ~400M) + CATH hierarchical CFG; optional $\\gamma<1$ на SDE — empirical noise scale, **не** principled temperature. [PAPER]"
        source: PAPER
        locator: "Proteina contributions (i)–(iv); §3.4 γ not principled temperature"
      - text: "Предостережение по метрикам. AAR, Cα RMSD, Rosetta REF2015 $\\Delta G$/«$\\Delta\\Delta G$», IMP, scRMSD, designability, FPSD, pLDDT **не** experimental affinity / $K_d$ / ELISA / BLI. ODE $x_t$ $\\neq$ MD. One-hot промежуточный $s^t$ $\\neq$ валидная аминокислота до decode. Energy ranking после pack — **evaluator**, не generator."
        source: INTERPRETATION
      - text: "FlowDesign Intro упоминает SPR для Ibalizumab; STAR/Fig. 6 — **BLI** Octet R8 vs CD4 d1–d2. Цитировать assay Fig. 6, не Intro. Neutralization IC50 — отдельный oracle (11 pseudoviruses), не BLI $K_D$."
        source: PAPER
        locator: "FlowDesign Intro SPR; STAR Biolayer interferometry Octet R8; Fig. 6F–J"
      - text: "«Direct matching of discrete distributions» в FlowDesign abstract — one-hot Euclidean MSE на $\\mathbb{R}^{20}$, не Campbell CTMC. Не читать как categorical flow."
        source: PAPER
        locator: "STAR Loss Function MSE on vectorized AA types"
  - id: math
    title: "3. Формальная математическая постановка"
    paragraphs:
      - text: "Сначала родовой CFM Lipman. Затем подтипы с **разными** уравнениями: (A) Euclidean OT-CFM / Proteina Cα; (B) Riemannian SE(3) FrameFlow; (C) FlowDesign joint one-hot+Cα+SLERP — tool [FlowDesign](/tools/flowdesign.html). Не одна seed-формула $x_t=(1-t)x_0+tx_1$ на все."
        source: INTERPRETATION
      - text: "Формулы, которые **не** принадлежат классу как train target / default catalog tool: DDPM $\\varepsilon$-prediction; SE(3) score FrameDiff; DiffAb seq KL; UCB/EI; AF2 FAPE; AR NLL; Meier $\\Delta\\ell$; discrete CTMC rate. Seed one-liner $v\\approx x_1-x_0$ — предел $\\sigma_{\\min}\\to 0$ OT-CFM / rectified flow, **не** уравнение quaternion-loss FlowDesign и не marginal FM Eq. 5."
        source: INTERPRETATION
      - text: "Negative / non-binder / affinity labels в loss $v_\\theta$: **нет**. Пары $(x_0,x_1)$ — prior и datapoint, не docking decoys. Rosetta energy — post-hoc ranker FlowDesign, не слагаемое CFM."
        source: PAPER
        locator: "Lipman CFM on (t,x0,x1); FlowDesign STAR PyRosetta after generation"
      - text: "Не сравнивать Proteina designability %, FrameFlow scRMSD designability, FlowDesign AAR/Rosetta и Ibalizumab BLI как один benchmark: generated object и oracle разные."
        source: INTERPRETATION
      - text: "Lipman также определяет diffusion-style Gaussian paths (Example I, не скопирован здесь): CFM на них — альтернатива score matching, всё ещё $v\\approx u$, не $\\varepsilon$-prediction Ho. Не подменять DDPM loss на эту страницу «потому что Gaussian equivalent»."
        source: PAPER
        locator: "Lipman §4 Example I vs Example II; §5 related work score matching"
    equations:
      - latex: "\\mathcal{L}_{\\mathrm{CFM}}(\\theta)=\\mathbb{E}_{t,q(x_1),p_t(x\\mid x_1)}\\bigl\\|v_t(x)-u_t(x\\mid x_1)\\bigr\\|^2"
        caption: "Родовой Conditional Flow Matching, Lipman Eq. (9). $t\\sim\\mathcal{U}[0,1]$. Marginal FM Eq. (5) с $u_t(x)$ intractable; Thm. 2: одинаковые градиенты. Generic. Не default FlowDesign (там сумма четырёх MSE/SO(3) голов)."
        generic_or_specific: generic
        source: PAPER
        locator: "Lipman Eq. (9); Theorem 2"
        symbols:
          - {sym: t, type: "time", meaning: "в [0,1]; не diffusion noise-level σ_t DDPM, хотя связанные Gaussian paths существуют"}
          - {sym: x, type: "state", meaning: "точка на условном пути"}
          - {sym: "x_1", type: "datapoint", meaning: "sample из unknown q"}
          - {sym: "u_t(\\cdot|x_1)", type: "vector field", meaning: "условное поле, генерирующее p_t(·|x_1)"}
          - {sym: "v_t", type: "network", meaning: "CNF vector field с параметрами θ"}
          - {sym: q, type: "data dist", meaning: "неизвестная плотность; доступны только samples"}
        meaning: "Оптимизируется MSE поля. Семплируется x_1 и x~p_t(·|x_1) на train; на inference интегрируется ODE dx/dt=v_θ."
    sections:
      - id: math-ot
        level: 3
        title: "Подтип A — Euclidean OT-CFM / rectified flow (Lipman; Proteina Cα — literature, не карточка tools)"
        paragraphs:
          - text: "Lipman Gaussian path (10): $p_t(x|x_1)=\\mathcal{N}(x\\mid\\mu_t(x_1),\\sigma_t(x_1)^2 I)$, $\\mu_0=0,\\sigma_0=1$, $\\mu_1=x_1,\\sigma_1=\\sigma_{\\min}$. OT Example II: $\\mu_t=t x_1$, $\\sigma_t=1-(1-\\sigma_{\\min})t$. Proteina: $x_t=t x+(1-t)\\epsilon$, target $x-\\epsilon$; optional distogram CE $t\\ge 0.3$; $p(t)=0.02\\,\\mathcal{U}+0.98\\,\\mathrm{Beta}(1.9,1.0)$. Не FlowDesign. Не SE(3) geodesic."
            source: PAPER
            locator: "Lipman Eq. (10)(20)(23); Proteina Eq. (1) and p(t)"
        equations:
          - latex: "\\psi_t(x_0)=(1-(1-\\sigma_{\\min})t)x_0+t x_1,\\quad \\mathcal{L}_{\\mathrm{OT}}=\\mathbb{E}\\bigl\\|v_t(\\psi_t(x_0))-(x_1-(1-\\sigma_{\\min})x_0)\\bigr\\|^2"
            caption: "Lipman Eq. (22)–(23) OT conditional CFM. Предел $\\sigma_{\\min}\\to 0$: прямая $x_t=(1-t)x_0+t x_1$, $u=x_1-x_0$ (seed / Proteina). Literature-specific instantiation, не quaternion FlowDesign."
            generic_or_specific: generic
            source: PAPER
            locator: "Lipman Eq. (22)–(23)"
            symbols:
              - {sym: "x_0", type: "prior sample", meaning: "обычно N(0,I); Proteina ε"}
              - {sym: "\\sigma_{min}", type: "scalar", meaning: "малая ширина p_1(·|x_1)"}
              - {sym: "\\psi_t", type: "flow", meaning: "OT displacement между двумя Gaussians"}
            meaning: "Оптимизируется VF вдоль прямой. Семплируется ODE с v_θ (Proteina: также SDE Eq. 3)."
      - id: math-se3
        level: 3
        title: "Подтип B — Riemannian FM on SE(3) (FrameFlow; literature, не карточка tools)"
        paragraphs:
          - text: "Prior $p_0=U(\\mathrm{SO}(3))\\otimes\\mathcal{N}(0,I_3)$. Geodesic interpolant Chen & Lipman via FrameFlow Eq. 6. Translations — прямая (7); rotations — exp/log Rodrigues (8). Reparameterization: сеть предсказывает clean $\\hat T_1$, VF $=(\\hat x_1-x_t)/(1-t)$. $t\\sim\\mathcal{U}[0,1-\\epsilon]$, $\\epsilon=10^{-3}$. Clip $1/(1-\\min\\{t,0.9\\})^2$. Rotation loss weight 0.5. Не catalog tool. Не DiffAb SO(3) diffusion."
            source: PAPER
            locator: "FrameFlow Eq. (6)–(12); Loss modifications clip 0.9"
        equations:
          - latex: "T_t=\\exp_{T_0}\\bigl(t\\log_{T_0}(T_1)\\bigr),\\quad \\mathcal{L}_{\\mathrm{SE}(3)}=\\mathbb{E}\\sum_{n=1}^{N}\\Big\\{\\|v_x^{(n)}-\\dot x_t^{(n)}\\|_{\\mathbb{R}^3}^2+\\|v_r^{(n)}-\\dot r_t^{(n)}\\|_{\\mathrm{SO}(3)}^2\\Big\\}"
            caption: "FrameFlow Eq. (6) и (9). $\\dot x=(x_1-x_t)/(1-t)$, $\\dot r=\\log_{r_t}(r_1)/(1-t)$. Literature-specific."
            generic_or_specific: "FrameFlow [PAPER]; literature-specific"
            source: PAPER
            locator: "FrameFlow Eq. (6), (9), (10)"
            symbols:
              - {sym: T, type: "SE(3) frame", meaning: "rotation r + translation x residue n"}
              - {sym: N, type: "int", meaning: "число residues backbone"}
              - {sym: "v_x,v_r", type: "equivariant heads", meaning: "FramePred/IPA"}
            meaning: "Оптимизируется geodesic VF. Семплируется Euler ODE на SE(3)^N."
      - id: math-flowdesign
        level: 3
        title: "Подтип C — joint CDR one-hot + Cα + SLERP (FlowDesign; tool-specific)"
        paragraphs:
          - text: "State residue $i$: type $s_i$ (20 one-hot), Cα $x_i$, orientation $O_i$. CDR index $l+1\\ldots l+m$; context $C$ = remainder of Ab–Ag complex (clamped). Prior $\\mathcal{T}$ vs data $\\mathcal{R}$. Interpolant: linear on $s,x$; SLERP on quaternions $q$. Drift heads F, G, H. AA и Cα — MSE к $(s-T_s)$ / $(x-T_x)$ (prose: difference from initial = ground truth drift). Orientation: quaternion MSE (Grassmann product в HTML назван, формула вырезана) затем SO(3) loss как у DiffAb; $\\alpha+\\beta=1$. Equivariant G: local 3-vector projected by interpolated $O$. Tool-specific [FlowDesign](/tools/flowdesign.html). CODE NR."
            source: PAPER
            locator: "STAR Method of interpolation; Loss Function; Parameterization G local-to-global"
        equations:
          - latex: "s_i^t=(1-t)T_{s_i}+t s_i,\\quad x_i^t=(1-t)T_{x_i}+t x_i,\\quad q_i^t=\\mathrm{SLERP}(T_{q_i},q_i;t)"
            caption: "Реконструкция interpolant из STAR prose (t=0 prior $\\mathcal{T}$, t=1 data $\\mathcal{R}$); display Eq. вырезаны — не выдавать за дословный STAR Eq. 1–3. Не CTMC. Не Lipman $\\sigma_{\\min}$ Gaussian path на one-hot."
            generic_or_specific: "FlowDesign [PAPER prose]; tool-specific"
            source: PAPER
            locator: "STAR interpolation amino acid / Cα / SLERP"
            symbols:
              - {sym: "T_s,T_x,T_q", type: "prior CDR", meaning: "sample from π0|C (dyMEAN/random/KIC/ESM2)"}
              - {sym: s, type: "R^{20}", meaning: "one-hot ground-truth type"}
              - {sym: q, type: "quaternion", meaning: "orientation of data frame"}
            meaning: "На train подаётся interpolant. Оптимизируется сумма drift MSE, не CE."
          - latex: "\\mathcal{L}=\\mathbb{E}_t\\bigl[L_{\\mathrm{seq}}^t+L_{\\mathrm{pos}}^t+\\alpha L_{\\mathrm{qua}}^t+\\beta L_{\\mathrm{ori}}^t\\bigr]"
            caption: "STAR: сумма Eq. (4)–(7) (display NR). α=1, β=0 первые 200k iter; α=0, β=1 последние 5k. Не UCB. Не FAPE."
            generic_or_specific: "FlowDesign [PAPER]; tool-specific"
            source: PAPER
            locator: "STAR Loss Function summing Eq. 4–7; α,β schedule 200000 / 5000"
            symbols:
              - {sym: "L_seq,L_pos", type: "MSE", meaning: "one-hot and Cα drift"}
              - {sym: "L_qua,L_ori", type: "orientation losses", meaning: "quaternion then SO(3); exact latex NR"}
              - {sym: "\\alpha,\\beta", type: "weights", meaning: "in [0,1], sum 1"}
            meaning: "Оптимизируется joint drift. Семплируется T циклов с rescale predicted drift (STAR: ×1/T); one-step допустим, авторы: inferior."
    tables:
      - title: "Смежные постановки, которые нельзя смешивать"
        source: INTERPRETATION
        headers: ["Постановка", "Train target", "Sampler/декодер", "Что в каталоге"]
        rows:
          - ["Flow matching (эта страница)", "$v_\\theta\\approx u_t$ interpolant", "ODE (opt. SDE)", "[FlowDesign](/tools/flowdesign.html); Proteina/FrameFlow не tools"]
          - ["[Coordinate diffusion](/architectures/coordinate-diffusion.html)", "score / ε / x0", "reverse SDE/DDPM", "Chroma, Genie, …"]
          - ["[Frame diffusion](/architectures/frame-diffusion.html)", "SE(3) score", "IGSO(3)+Gaussian reverse", "[RFdiffusion](/tools/rfdiffusion.html), FrameDiff"]
          - ["[Joint seq–struct diffusion](/architectures/joint-sequence-structure-diffusion.html)", "ε-pos + rot + seq KL", "T reverse steps", "[DiffAb](/tools/diffab.html)"]
          - ["Discrete / CTMC FM (Campbell)", "jump rates on tokens", "continuous-time jump process", "не FlowDesign (one-hot MSE)"]
          - ["[AR structure](/architectures/autoregressive-structure-generation.html)", "next-scale AR (+ optional FM decoder)", "few AR steps", "PAR — не catalog tool"]
  - id: data-repr
    title: "4. Представление данных"
    paragraphs:
      - text: "Узлы класса — residues (или Cα points), не atoms обязательно. Pair features: Proteina optional pair track (64-bin distogram); FrameFlow IPA pairs внутри FramePred; FlowDesign $z_{ij}$ distances + dihedrals, 3-layer MLP. Time embedding: да (FlowDesign two linear layers concat; Proteina adaptive LN с $t$)."
        source: PAPER
        locator: "FlowDesign STAR residue/pairwise MLP; Proteina Fig. 5"
      - text: "Tokens sequence: FlowDesign one-hot 20 + all-atom coords and $\\chi$ torsions **входа encoder** (features), но generative state type — one-hot drift, не AR token. Proteina/FrameFlow sequence **не** генерируют (IF post-hoc для designability)."
        source: PAPER
        locator: "FlowDesign residue-level input AA, all-atom, side-chain torsions; Proteina without sequence inputs"
      - text: "Masks: FlowDesign CDR slice vs context $C$. Proteina motif inpainting model encodes masked motif coords. Contig RFdiffusion **нет** у FlowDesign. Classifier-free dropout labels — Proteina CATH, не FlowDesign."
        source: PAPER
        locator: "FlowDesign ℛ vs C; Proteina motif 60M+12M"
      - text: "Вход сети vs файл: SAbDab complexes (PDB) — внешние структуры; CDR indices из numbering схемы paper (Chothia/IMGT NR в HTML — **NR**). Library CSV нет. dyMEAN/KIC/ESM2 priors — внешние генераторы, не слои $v_\\theta$."
        source: NR
        locator: "CDR numbering scheme in FlowDesign HTML — not stated"
      - text: "Размерности: FlowDesign F head output 20; G local 3; H quaternion 4. Hidden IPA width — NR (CODE unaudited). Proteina: transformer $\\approx 200$M+$15$M triangle ($\\mathcal{M}_{\\mathrm{FS}}$) или $400$M+$15$M ($\\mathcal{M}_{21\\mathrm{M}}$); Table 16 hyperparams — Appendix, частично в HTML. FrameFlow 17.4M vs GENIE 4.1M."
        source: PAPER
        locator: "STAR three MLP heads 20/3/4; Proteina §4 M_FS 200M+15M; FrameFlow 17.4M"
      - text: "Аугментации геометрии: Proteina centering + random rotation (approx SO(3) equivariance, Appendix E). FrameFlow CoM subtraction + Kabsch align noise to data на train. FlowDesign: Gaussian noise на dyMEAN prior; mix dyMEAN/random с вероятностью $p$ ($p$ numeric NR, Key Resources stripped)."
        source: PAPER
        locator: "Proteina random rotations; FrameFlow Kabsch; FlowDesign Gaussian noise on dyMEAN; p hyperparameter"
      - text: "Conditioner tensors: FlowDesign $C$ framework+antigen coords/types/orientations. Proteina CAT embeddings + optional self-cond $\\hat x=x_t+(1-t)v_\\theta$. Нет ELISA tensor."
        source: PAPER
        locator: "Proteina self-cond p=0.5"
      - text: "Batching: FrameFlow same-length batches (FrameDiff strategy). Proteina batch/GPU — Table 16, cells NR this pass if not fully parsed. FlowDesign batch — NR."
        source: NR
        locator: "FlowDesign batch size STAR Key Resources stripped"
  - id: physical-repr
    title: "5. Физическое представление"
    paragraphs:
      - text: "Математический $x_t$ — интерполянт в feature space (coords / frames / one-hot), не атомы MD. В $t=1$ Cα+frames задают backbone; side chains FlowDesign — Rosetta pack/relax **после** ODE. Proteina/FrameFlow designability: ProteinMPNN sequences + ESMFold scRMSD — post-hoc **evaluator**."
        source: PAPER
        locator: "FlowDesign STAR after inference Rosetta pack; FrameFlow eval ProteinMPNN+ESMFold"
      - text: "SE(3): FrameFlow — **equivariant** IPA + CoM ⇒ invariant samples (Köhler). Proteina — **approx** via centering + rotation aug (non-equivariant transformer). FlowDesign — local-to-global $O_i$ projection для coord drift (**equivariant claim** STAR). Global rotation ломает Proteina без aug; FrameFlow CoM subspace устойчив по постановке."
        source: PAPER
        locator: "FrameFlow Symmetries; Proteina Appendix E; FlowDesign roto-translation equivariance of G"
      - text: "Перестановка residues ломает positional/IPA index. Chain concat FlowDesign: Ab+Ag в одном комплексе $N$ residues; antigen в $C$, не генерируется."
        source: PAPER
        locator: "FlowDesign N residues complex; C = non-CDR"
      - text: "Side chains: в generative state **отсутствуют** (кроме encoder features FlowDesign). Pack post-hoc. OpenMM/FoldX — Fig. S1 alternative evaluators, не default generator."
        source: PAPER
        locator: "Fig. S1 OpenMM pack / FoldX energy"
      - text: "Промежуточный $x_t$ / soft one-hot $\\neq$ folding trajectory и $\\neq$ энергия. Прямая в координатах режет clashes; peptide bonds не conservируются вдоль Euclidean path (FrameFlow geodesic на frames лучше, но всё ещё не MD)."
        source: INTERPRETATION
      - text: "Clashy FlowDesign samples discarded at inference (STAR). Это filter, не физический potential в $v_\\theta$."
        source: PAPER
        locator: "STAR discarded structures with atomic clashes"
      - text: "Ibalizumab campaign: generated object = HCDR3 sequences in fixed Ibalizumab backbone, не de novo Fv. Complex context required; wrong dock → wrong CDR (Discussion)."
        source: PAPER
        locator: "FlowDesign Discussion relies on Ab–Ag complex"
      - text: "Assay label не входит в state. BLI $K_D$ и IC50 появляются только в wet-lab, после FACS и expression top-10."
        source: PAPER
        locator: "STAR Experimental procedure top 10 mutants expressed"
  - id: physchem
    title: "6. Физико-химический смысл"
    paragraphs:
      - text: "Нет energy head в $v_\\theta$. REF2015 — post-hoc. Запрещено писать, что модель «считает $\\Delta G$»."
        source: PAPER
        locator: "STAR InterfaceAnalyzer REF2015 for ranking"
    physchem:
      - feature: "Identity AA"
        interpretation: "первичная структура CDR / backbone sequence не генерируется Proteina"
        encoded: "прямо: FlowDesign one-hot drift MSE; Proteina/FrameFlow — не представлена в generator (IF после)"
        limitation: "soft $s^t$ не валидный AA; AAR ≠ affinity"
      - feature: "Backbone / frames / torsions"
        interpretation: "Cα и/или SE(3) frames; χ в FlowDesign encoder"
        encoded: "прямо в state (Cα/frames); χ — вход encoder, не ODE state"
        limitation: "pack восстанавливает sc; encoder χ при inference из prior — NR точный источник"
      - feature: "Antigen / hotspot coords"
        interpretation: "эпитоп как часть комплекса"
        encoded: "FlowDesign — прямо clamped в C; Proteina motif optional; FrameFlow this pass — monomers SCOPe"
        limitation: "нет RFantibody hotspot tensor; wrong complex ломает CDR"
      - feature: "H-bonds / electrostatics / solvation"
        interpretation: "интерфейс Ab–Ag"
        encoded: "косвенно через data $x_1$; прямо только Rosetta ranker post-hoc"
        limitation: "REF2015 ≠ measured ΔG/Kd"
      - feature: "Entropy"
        interpretation: "конформационный ансамбль CDR"
        encoded: "не представлена (один ODE sample ≠ ensemble)"
        limitation: "не −TΔS"
      - feature: "Evolutionary statistics"
        interpretation: "ESM-2 prior; SAbDab natural Abs; AFDB Proteina"
        encoded: "косвенно prior/data; ESM2_t30 masked CDR — один из FlowDesign priors (хуже dyMEAN)"
        limitation: "ESM2 prior низкий AAR на H3 (PAPER Fig. 2)"
      - feature: "Experimental y / CATH"
        interpretation: "BLI/FACS не в loss; CATH — fold class"
        encoded: "CATH прямо CFG Proteina; ELISA/BLI не в v_θ"
        limitation: "CATH ≠ function; одна Ibalizumab кампания"
  - id: learned
    title: "7. Что обучается"
    paragraphs:
      - text: "Параметры $\\theta$ векторного поля / голов F,G,H. Frozen: dyMEAN (retrained без CDR, но как prior не backprop через FlowDesign в описании STAR), ESM-2, Rosetta. IPA+MLP FlowDesign обучаются."
