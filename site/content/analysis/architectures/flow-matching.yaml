      - text: "FlowDesign: SAbDab 13279 complexes; drop non-protein antigens and resolution worse than 4 Å; cluster CDR-H3 50% ID MMseqs2; test = 20 complexes distinct clusters; remainder 20:1 train/val. Mean H3 train ≈12.3, test ≈11.3. Leakage: same-cluster H3 excluded; framework/antigen homology **NR**. Ibalizumab: extra filter H3>50% ID to imab, retrain."
        source: PAPER
        locator: "STAR Data Preparation; HIV paragraph MMseqs2 50%"
