        locator: "Lipman OT constant direction VF; FlowDesign prior flexibility"
      - text: "FrameFlow: 100 steps designability 0.77 vs FrameDiff 500 SDE 0.42; 5× fewer timesteps claim vs FrameDiff (abstract). Same architecture. **Не** antibody. scRMSD<2 Å ≠ Kd."
        source: PAPER
        locator: "FrameFlow abstract five times fewer; Table 1 0.77 vs 0.42"
      - text: "Proteina Table 1 (designability-tuned): $\\mathcal{M}_{\\mathrm{FS}}$ $\\gamma=0.35$ 98.2%; FrameFlow 88.6%; RFdiffusion 94.4%; FoldFlow(OT) 97.2%. FPSD vs PDB: FrameFlow 129.9, RFdiffusion 253.7, Proteina $\\mathcal{M}_{\\mathrm{FS}}$ 411.2 — не ранжировать «лучше RFD» по FPSD при tuned γ. Length 800 without triangle. Не antibody."
        source: PAPER
        locator: "Table 1 caption tuned for designability not full distribution"
      - text: "FlowDesign in silico: dyMEAN prior ≈15% AAR vs random H3; mean RMSD 2.291 Å; H3 Cα RMSD average reduction 0.693 Å vs DiffAb; top-1% energy H3 AAR can exceed 60%; 13.11% more CDRH1 samples better energy than native vs DiffAb. AAR/energy ≠ affinity."
