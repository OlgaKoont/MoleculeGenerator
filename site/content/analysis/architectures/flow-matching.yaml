        source: NR
        locator: "FlowDesign STAR no self-conditioning sentence"
      - text: "Parameter count FlowDesign — **NR** (STAR даёт DiffAb ~4M, RefineGNN ~6M, dyMEAN ~2M, HERN ~7M; собственный count нет)."
        source: PAPER
        locator: "STAR Baselines parameter counts; FlowDesign omitted"
