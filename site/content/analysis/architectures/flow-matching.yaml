status_note: "Класс — generator непрерывного (иногда joint sequence–structure) состояния через регрессию векторного поля $v_\\theta\\approx u_t$ и ODE-семплирование, не DDPM score и не assay loop. Прочитаны: Lipman et al. arXiv 2210.02747 HTML/ar5iv (ICLR 2023 pagination не сличена): FM Eq. 5, CFM Eq. 9, OT path Eq. 20–23. Wu et al. FlowDesign bioRxiv 10.1101/2024.11.07.622422 v2 HTML STAR Methods (journal Cell Systems 10.1016/j.cels.2025.101270 PDF/SI не постранично; display math STAR Eq. 1–9 в HTML вырезан). Yim et al. FrameFlow arXiv 2310.05297 HTML §2–3 Table 1. Geffner et al. Proteina arXiv 2503.00710 HTML Eq. 1–4, Table 1 (ICLR 2025). CODE FlowDesign/Proteina/FrameFlow не line-audit (commit NR). Не сливать Intro SPR с Fig. 6 BLI. DiffAb/RFdiffusion/BoltzGen ≠ FM."
lede: "Flow matching — **generator**: нейросеть учит векторное поле $v_\\theta$, транспортирующее prior $p_0$ в data вдоль непрерывного пути; sampling — интегрирование ODE $\\dot x=v_\\theta$ (опционально SDE с тем же marginal). Это не DDPM score/$\\varepsilon$-prediction, не discrete CTMC FM и не affinity predictor."
