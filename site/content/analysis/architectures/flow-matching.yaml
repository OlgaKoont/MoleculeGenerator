        source: PAPER
        locator: "STAR t uniform 0 to 1; Proteina p(t) Beta mix"
  - id: forward
    title: "8. Прямой проход и information flow"
    paragraphs:
      - text: "Train: sample $x_1$ (complex/backbone), sample prior $x_0$, sample $t$, build interpolant, encode, predict $v$, MSE vs $u$. Sequence (FlowDesign) и geometry появляются в одном encoder; score = drift."
        source: PAPER
        locator: "Lipman CFM sampling; FlowDesign Algorithm 1 (figure, not transcribed)"
      - text: "Infer FlowDesign: init CDR from prior → predict drift → rescale $1/T$ → repeat T (AA/Cα multiply; orientations: apply rotation matrix, лучше чем scale $\\theta$) → Rosetta pack/relax → clash discard → optional energy rank. dyMEAN/AF3 — **другой** модуль, если framework не экспериментальный (Fig. 5)."
        source: PAPER
        locator: "STAR Model Training and Inference; Fig. 5 AF3/dyMEAN framework"
      - text: "Infer Proteina: ODE or SDE (3) from noise; optional CFG (4). Sequence появляется только на evaluator (MPNN). Geometry с шага 1."
        source: PAPER
        locator: "Proteina §3.4 sampling"
      - text: "Infer FrameFlow: Euler ODE; ProteinMPNN+ESMFold для Table 1. Не прятать IF внутрь FramePred."
        source: PAPER
        locator: "FrameFlow §3 eval 8 sequences per backbone"
      - text: "Не прятать AF / docking / Rosetta внутрь $v_\\theta$. AF3 — framework structure для sequence-only mode FlowDesign. Docking как отдельный scorer нет в STAR loop."
        source: PAPER
        locator: "Fig. 5 sequence-based design uses dyMEAN or AF3 then FlowDesign"
      - text: "Experiment: Ibalizumab yeast FACS 3 rounds (1 µM / 500 nM / 200 nM CD4), затем Expi293 IgG, BLI, pseudovirus. Не часть ODE."
        source: PAPER
        locator: "STAR Experimental procedure three FACS rounds"
      - text: "Нет beam, нет AF recycle в generator. One-step map FlowDesign — допустимый degenerate sampler, авторы inferior."
        source: PAPER
        locator: "STAR one-step transformation likely inferior"
      - text: "KIC 100 structures/Ab, 50k closure attempts — **prior generator**, не flow."
        source: PAPER
        locator: "STAR KIC 50000 attempts, 100 structures"
    mermaid: |
      flowchart TD
        P0["Prior p0: Gaussian / dyMEAN / KIC / ESM2 / IGSO3"] --> XT["Train interpolant xt"]
        P0 --> ODE["Infer start t=0"]
        CTX["Clamped context C or CATH or none"] --> NET
        XT --> NET["GENERATOR v_theta or heads F G H"]
        ODE --> NET
        NET --> STEP["ODE or Euler step times T"]
        STEP --> X1["State t=1: Cα / frames / one-hot"]
        X1 --> PACK["EVALUATOR: Rosetta pack or MPNN plus ESMFold"]
        PACK --> RANK["Energy or scRMSD rank - not Kd"]
        RANK --> EXP["EXPERIMENT optional: FACS BLI IC50"]
        subgraph genblk ["Generator"]
          NET
          STEP
        end
        subgraph evblk ["Evaluator not generator"]
          PACK
          RANK
        end
        subgraph expblk ["Experiment"]
          EXP
        end
    mermaid_caption: "Схема класса по Lipman §3, FlowDesign STAR inference, FrameFlow §3 — не копипаст Fig. 1 papers. dyMEAN/KIC — prior, не v_θ. Rosetta/MPNN — evaluator. BLI — experiment."
    mermaid_source: INTERPRETATION
  - id: training
