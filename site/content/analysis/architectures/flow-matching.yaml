        source: PAPER
        locator: "FrameFlow §3 3938 examples"
      - text: "Proteina: AFDB-scale up to ~21M synthetic structures (35× vs prior work cited); TED CATH labels; some AFDB unlabeled. LoRA FT on natural designable PDB. Exact PDB ID list — Appendix, NR this pass."
        source: PAPER
        locator: "Proteina 21 million; 35×; TED CATH"
      - text: "Симуляция vs wet-lab: AAR/RMSD/Rosetta/designability/FPSD — in silico. Ibalizumab FACS+BLI+IC50 — prospective wet-lab **одной** кампании. Не смешивать."
        source: INTERPRETATION
      - text: "Batching / time-sampling: см. §7. Teacher forcing нет. Self-cond Proteina/FrameFlow да."
        source: PAPER
      - text: "Baselines FlowDesign retrained on **same** re-split (STAR). DiffAb sampled same N as FlowDesign; non-generative — one output per test Ab."
        source: PAPER
        locator: "STAR Baselines re-partitioned dataset"
