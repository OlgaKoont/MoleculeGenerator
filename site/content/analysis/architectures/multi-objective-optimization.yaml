  - id: learned
    title: "7. Что обучается"
    paragraphs:
      - text: "Класс как таковой не задаёт единый $\\theta$. Обучаются: (A) LDA/NN heads Makowski; (D) CNN-H/L/P Humatch; (C) **ничего** на BindCraft filters (пороги заданы, AF2/MPNN frozen pretrained). Scalarization (B) учит surrogate на $\\tilde y$."
