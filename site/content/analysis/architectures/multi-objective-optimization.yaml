  - id: forward
    title: "8. Прямой проход и information flow"
    paragraphs:
      - text: "Makowski: library → yeast MACS/FACS → deep-seq labels → features → LDA/NN **scorer** → Pareto pick → (optional) UniRep scan novel mutants → IgG **experiment**. Geometry появляется только в post-hoc MOE. AF не в сети."
        source: PAPER
        locator: "Fig. 1 overview"
      - text: "BindCraft: target PDB → AF2-multimer hallucination **generator** → MPNNsol **IF generator** (interface 4 Å clamp) → AF2 monomer **predictor** → Rosetta relax **evaluator** → filters **MOO-C** → SPR/BLI **experiment**. Не прятать MPNN/AF2 внутрь «одной MOO-сети»."
        source: PAPER
        locator: "Fig. 1a; Methods stages"
      - text: "Humatch: paired VH/VL → GL mutations → loop CNN scores → sequence **generator** (edits) → CNN **evaluator**. Binding retention / immunogenicity — обязательный внешний experiment, в primary нет prospective."
        source: PAPER
        locator: "Fig. 2; Discussion lack experimental validation of designs"
      - text: "Sequence vs geometry vs score: Makowski sequence→$\\phi$; BindCraft geometry+sequence в AF2, score после; Humatch sequence→CNN. Affinity assay всегда снаружи MOO-формулы Humatch/filters."
        source: INTERPRETATION
      - text: "Likelihood rerank ESM / ProteinMPNN scPerplexity не канон Makowski. Clash filter BindCraft: trajectories with backbone clashes rejected до MPNN (pLDDT<0.7 or <7 contacts)."
