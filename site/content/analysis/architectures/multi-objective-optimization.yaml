  - id: strengths
    title: "13. Преимущества"
    paragraphs:
      - text: "Из постановки: явный trade-off, если $y$ соизмеримы. Scalarization прячет компромисс; Pareto (подтип A) его показывает. Filters (C) отсекают физически неправдоподобные комплексы до дорогого SPR."
        source: INTERPRETATION
      - text: "Makowski: LDA $\\phi$ с binary labels коррелирует с непрерывным affinity ρ=0.87 ($p=10^{-39}$) и NSB ρ=0.67 на 125 scFabs **вне** 4000. На 41 IgG ρ=0.72 и 0.77. Enrichment не даёт того же. **Одна** кампания emibetuzumab, не класс универсальный."
        source: PAPER
        locator: "Fig. 3C–D; Fig. 4B–C"
      - text: "Makowski EM2: antigen 1.28× WT, NSB 0.30×; EC50 2.4±0.3 nM vs WT 4.4±0.8 nM; CS-SINS <0.35; Tm >75 °C; proliferation assay. Не переносить на другие mAb и не на BindCraft Kd."
        source: PAPER
        locator: "Fig. 6 EM2 numbers"
      - text: "Makowski 29 novel: UniRep LDA ρ=0.46 affinity, 0.43 specificity ($p=0.01$, $0.02$); PhysChem не значим для affinity. Blosum62 gate необходим (без него affinity $p=0.41$)."
        source: PAPER
        locator: "Fig. 5; Blosum62 ablation p=0.41"
      - text: "BindCraft: nanomolar SPR examples; 10–100% experimental success, mean 46.3% на 12 targets; i_pTM отличает on- vs off-target Ig-like (Extended Data Fig. 2h). **Не** antibody. i_pTM $\\neq$ affinity correlation."
        source: PAPER
        locator: "Discussion 46.3%; Supplementary Fig. 6 no affinity correlation"
      - text: "Humatch: overlap 0.77 H / 0.82 L vs experimental humanizations на 25 precursors; ~33 s; joint pairing. Retrospective, не ADA/affinity retention."
        source: PAPER
        locator: "Table 2"
      - text: "Явно: MOO-схема не гарантия стабильности / аффинности / экспрессии / низкой ADA. Makowski authors: WT не на фронте, но dual improvement только у части клонов (37% Fig. 4D)."
        source: PAPER
        locator: "Fig. 4D 37%"
      - text: "T7 34× luciferase / ~98% less immunogenicity E643G — EVOLVEpro preprint, **не** свойство catalog tools этого id."
        source: PAPER
        locator: "Jiang E643G 34x and ~98%"
  - id: limits
    title: "14. Ограничения"
    paragraphs:
      - text: "Математика: incommensurable units; $w$ произвольны; conjunctive filters не показывают фронт (отсекают, не торгуют); greedy Humatch не Pareto CNN-H vs CNN-P; LDA projection ≠ calibrated property в физических единицах."
        source: INTERPRETATION
      - text: "Представление: Makowski 8 sites, unpaired VH; Humatch complete IMGT pad, CDRs frozen ⇒ binding not modeled; BindCraft miniprotein 60–240 aa, not IgG."
        source: PAPER
        locator: "BindCraft 60–240 Discussion; Makowski eight sites"
      - text: "Физика/химия: нет electrostatics PDE. Rosetta mitigates AF2 mutation-insensitivity (Discussion) но dG ≠ Kd. Positive-charge CDR patch — post-hoc Fig. 7, не loss."
        source: PAPER
        locator: "BindCraft AF2 insensitive to point mutations; Makowski Fig. 7 R54G"
      - text: "Данные/bias: emibetuzumab-specific sorts; OAS species mix; artificial bad pairs noise; AF2 complex bias (monomer repredict to reduce). Conserved WT enrichment affinity **and** NSB (Fig. 2)."
        source: PAPER
        locator: "Fig. 2 similar enrichment affinity and NSB"
      - text: "Обобщение: Makowski UniRep novel mutations слабо (ρ~0.45), one mAb. BindCraft not antibody-specific. Humatch designs untested in wet-lab. Не universal co-optimizer."
        source: PAPER
        locator: "Makowski Discussion next step other antibodies; Humatch Discussion"
      - text: "Deployment: Makowski workflow/paper, не packaged tool (MATRIX). BindCraft MIT + PyRosetta terms. Humatch BSD-3 + Zenodo weights. Не therapeutic generator proven."
        source: MATRIX
