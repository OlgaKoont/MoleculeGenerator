      - text: "Makowski: independent LDA per property; NN projector + classification layer, SparseCategoricalCrossentropy, ADAM, 5-fold 3200/800 затем full 4000. UniRep weights **frozen** (babbler64). Negative / low-affinity / high-NSB классы **есть** как binary labels. Contrastive affinity **нет**. ELISA $K_d$ в loss **нет**."
        source: PAPER
        locator: "Methods Model development; SparseCategoricalCrossentropy"
      - text: "Humatch: Adam, binary cross-entropy (Methods), lr $7.5\\times 10^{-5}$, batch 1024. Early stop 3 / 15 epochs. Labels: V-gene / non-human / true vs fake pair. Affinity labels **нет**. Artificial negatives для pairing — да (noisy)."
        source: PAPER
        locator: "Methods Training Adam BCE; CNN-P artificial pairs"
      - text: "BindCraft MOO-слой: trained modules **нет**. AF2/MPNNsol — frozen. Hallucination оптимизирует sequence logits; это generator, не multi-head $y$."
        source: PAPER
        locator: "backprop through AF2 weights; filters predefined"
      - text: "Fine-tune vs pretrain: Makowski UniRep pretrain 20M proteins, LDA на одной кампании emibetuzumab. Humatch OAS pretrain classifiers, humanization — inference. BindCraft не finetune AF2 на target."
        source: PAPER
        locator: "Alley UniRep; OAS; AF2 frozen"
      - text: "EVOLVEpro T7: RF на weighted experimental columns — [tool EVOLVEpro](/tools/evolvepro.html), не этот id. Не копировать как default MOO-сеть каталога."
        source: PAPER
        locator: "Jiang T7; extra_constraints"
