    title: "5. Физическое представление"
    paragraphs:
      - text: "Makowski $s$ ↔ VH CDR mutant emibetuzumab (scFab на дрожжах, затем IgG1). $y_{\\mathrm{aff}}$ ↔ HGFR binding (1 nM single-point или EC50); $y_{\\mathrm{nsb}}$ ↔ ovalbumin / SMP polyspecificity. Не crystal complex в state."
