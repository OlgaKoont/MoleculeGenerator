      - "Переносить Humatch CNN≥0.95 на affinity retention или clinical ADA."
      - "Путать Humatch humanization с Makowski affinity–specificity MOO."
      - "Приписывать EVOLVEpro NSGA; T7 = weighted labels, и tool без этого architecture_id."
      - "Использовать enrichment/frequency вместо LDA (Makowski: affinity vs frequency ρ=0.23 n.s.)."
      - "OneHot-модель для мутаций на нетронутых CDR sites (авторы: невозможно; нужен UniRep/PhysChem)."
      - "Novel mutations без Blosum62≥0 (affinity correlation ломается)."
      - "Humatch на неполных VH/VL (trained on complete sequences only)."
      - "Независимая humanization VH и VL без CNN-P — ровно то, что авторы критикуют у Hu-mAb/Sapiens."
      - "BindCraft без hotspot на «невидимом» сайте: site выбран loss генератора, не epitope ELISA."
      - "Сравнивать 46.3% BindCraft SPR с 37% dual IgG Makowski как один score."
      - "AF3 как drop-in filter (false positives Extended Data Fig. 7c)."
      - "Library misspecification: 8 sites не покрывают VL/Fc developability."
  - id: tools
    title: "16. Реализации в инструментах"
    paragraphs:
      - text: "Полный reverse index. Неравные oracles не в одной колонке «успех». CODE SHA всех трёх — NR."
        source: MATRIX
    tables:
      - headers: ["Tool", "Generic architecture", "Tool-specific implementation", "Important difference"]
        source: INTERPRETATION
        rows:
          - ["[Makowski affinity–specificity](/tools/makowski-affinity-specificity.html)", "Pareto on multi-property $\\hat y$", "LDA/NN on binary deep-seq; OneHot/UniRep-64/PhysChem-26; 4000+125+41+29; emibetuzumab; Tessier GitHub **commit NR**", "Единственный catalog tool с experimental affinity–NSB Pareto; не пакет; один mAb"]
          - ["[BindCraft](/tools/bindcraft.html)", "conjunctive filters on many scores", "AF2 halluc. + MPNNsol + AF2 monomer + Rosetta; Nature filter list; rank i_pTM; CODE **NR**", "Не learned Pareto; generator = AF2; miniprotein; i_pTM≠Kd"]
          - ["[Humatch](/tools/humatch.html)", "greedy multi-score thresholds", "CNN-H/L/P Kidera; GL 0.40; τ=0.95; OAS; 33 s Table 2; no prospective binding; CODE **NR**", "Humanness/pairing ≠ affinity MOO Makowski"]
      - headers: ["Метод вне карточек tools / не этот id", "Зачем указан", "Не делать"]
        source: PAPER
        rows:
          - ["EVOLVEpro T7 20/40/40", "пример scalarization на experimental y", "не ставить architecture_id; не NSGA"]
          - ["NSGA-II / Deb MOEA", "классический Pareto sampler", "нет catalog implementation"]
          - ["ProteinMPNN / AF2", "модули BindCraft", "не уравнение MOO-страницы"]
          - ["Hu-mAb / Sapiens / AbNatiV", "baselines Humatch Table 2", "не этот id"]
          - ["UniRep Alley 2019", "frozen features Makowski", "не affinity head"]
  - id: applicability
    title: "17. Где применимо и где не применимо"
    paragraphs:
      - text: "Применимо, когда есть **несколько измеримых или явно различных scores** и нужно не прятать компромисс: [multi-objective-optimization](/tasks/multi-objective-optimization.html), [specificity-optimization](/tasks/specificity-optimization.html) ([Makowski](/tools/makowski-affinity-specificity.html), [few-shot-active-learning](/workflows/few-shot-active-learning.html)); filter-gate de novo binders ([BindCraft](/tools/bindcraft.html), [miniprotein-binder-bindcraft](/workflows/miniprotein-binder-bindcraft.html)); joint humanness+pairing ([Humatch](/tools/humatch.html), [humanization-framework](/workflows/humanization-framework.html))."
        source: MATRIX
      - text: "Этим **нельзя** заменять: de novo antibody CDR co-design 3D ([joint sequence–structure diffusion](/architectures/joint-sequence-structure-diffusion.html)); single-task few-shot без второго $y$ ([few-shot mutation](/architectures/few-shot-mutation-optimization.html) + [EVOLVEpro](/tools/evolvepro.html)); zero-shot 19-mutant ([ESM-1v](/tools/esm-1v-efficient-evolution.html)); IF при готовом backbone как единственный шаг ([ProteinMPNN](/tools/proteinmpnn.html))."
        source: INTERPRETATION
      - text: "Не использовать Humatch likelihood/CNN как specificity к антигену. Нужен binding assay. Не использовать BindCraft i_pTM как Kd."
        source: MATRIX
      - text: "Makowski evidence не делает метод transferable pretrained generator. BindCraft не antibody therapeutic pipeline. Scalarization EVOLVEpro не отменяет необходимость отдельных assays на каждую компоненту $y$ до взвешивания."
        source: INTERPRETATION
  - id: method-sources
    title: "18. Методологические источники"
    paragraphs:
      - text: "Foundational intuition: vector Pareto (Deb et al. — pointer-only). Catalog: [paper-makowski-affinity-specificity](/papers/makowski-affinity-specificity.html), [paper-bindcraft](/papers/bindcraft.html), [paper-humatch](/papers/humatch.html). T7: [paper-evolvepro](/papers/evolvepro.html) как scalarization example, не reverse-index tool этого id."
        source: PAPER
      - text: "Прочитано: Makowski Nat. Commun. HTML Methods+Results; BindCraft Nature HTML Methods+Discussion; Humatch mAbs HTML Methods+Results; Jiang bioRxiv T7 paragraph. Pointer-only: Makowski SI PDF; BindCraft Supp. Table 1 cells; Humatch SI 1–17; все GitHub commits; NSGA-II PDF; EVOLVEpro Science."
        source: INTERPRETATION
      - text: "Не библиография всего MOO: Salvat deimmunization Pareto, Choi humanization+stability — цитируются Makowski Discussion как low-throughput contrast, не карточки tools."
        source: PAPER
        locator: "Makowski Discussion refs 55–59"
