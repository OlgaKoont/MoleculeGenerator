        source: INTERPRETATION
      - text: "Перестановка CDR residues ломает биологический объект. Concat VH||VL: Makowski unpaired VH library, общий kappa. Humatch **требует** paired complete VH/VL; chain concat с 10 pad — представление CNN-P."
        source: PAPER
        locator: "Makowski scFab VH mutagenesis; Humatch complete sequences only"
      - text: "Side chains: отсутствуют в Makowski LDA state. BindCraft: AF2 all-atom prediction; Rosetta relax двигает SC/BB (InterfaceAnalyzer side-chain and backbone movement enabled). Humatch: sequence-only."
        source: PAPER
        locator: "BindCraft FastRelax InterfaceAnalyzer"
      - text: "Промежуточный $\\phi$, mask, AF2 $x_t$ hallucination ≠ траектория фолдинга и ≠ энергия. LDA projection ≠ $\\Delta G$. i_pTM ≠ $K_d$."
        source: PAPER
