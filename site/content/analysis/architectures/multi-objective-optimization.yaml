sections:
  - id: domain
    title: "1. Область определения"
    paragraphs:
      - text: "Роль в пайплайне — **схема выбора / workflow principle** на векторе целей, не фиксированная neural architecture. Подтипы: (A) Pareto на предсказанных или измеренных $y$; (B) scalarization $w^\\top y$; (C) conjunctive filters $g_i\\le\\tau_i$; (D) greedy по нескольким scores до порогов. Generator, surrogate и assay задаются отдельно."
        source: INTERPRETATION
      - text: "Scored / selected state — варианты $s$ (мутанты CDR, humanized VH/VL, hallucinated binder sequences) плюс вектор свойств $\\hat y(s)$ или constraint scores. Generated tokens/coords **не** определяются этим классом: их даёт library, AF2 hallucination, iterative mutation."
        source: INTERPRETATION
      - text: "Задачи каталога: [multi-objective optimization](/tasks/multi-objective-optimization.html), [specificity](/tasks/specificity-optimization.html) и [polyspecificity](/tasks/polyspecificity-optimization.html) ([Makowski](/tools/makowski-affinity-specificity.html)); [de novo non-antibody binder](/tasks/de-novo-non-antibody-binder-design.html) через filter stage ([BindCraft](/tools/bindcraft.html), [miniprotein BindCraft](/workflows/miniprotein-binder-bindcraft.html)); [humanization](/tasks/humanization.html) / [framework redesign](/tasks/framework-redesign.html) ([Humatch](/tools/humatch.html), [humanization-framework](/workflows/humanization-framework.html)). Workflow [few-shot active learning](/workflows/few-shot-active-learning.html) использует класс, когда proposal Pareto, не когда single $y$."
        source: MATRIX
      - text: "Это **не** [few-shot mutation optimization](/architectures/few-shot-mutation-optimization.html) как постановка «мало labels»: few-shot может быть одноцелевым. Это **не** [active learning](/architectures/active-learning.html): AL выбирает, *какие* $x$ измерить; MOO задаёт, *как* сравнивать несколько $y$. Цикл может содержать оба."
        source: INTERPRETATION
      - text: "Это **не** [bayesian optimization](/architectures/bayesian-optimization.html): BO — sequential design с posterior и acquisition (UCB/EI). Weighted $y$ внутри RF **не** делает метод NSGA и не делает его GP-UCB. Не ставить UCB на эту страницу как train target."
        source: INTERPRETATION
      - text: "Это **не** [inverse folding](/architectures/inverse-folding.html): MPNN в BindCraft переписывает core/surface при зажатом интерфейсе — **другой** модуль. Filter cascade после AF2 monomer — единственная причина, почему BindCraft имеет этот `architecture_id`."
        source: PAPER
        locator: "BindCraft Fig. 1a MPNN then filters; Nature Methods filter list"
      - text: "Catalog tools с `architecture_id: multi-objective-optimization`: [BindCraft](/tools/bindcraft.html), [Humatch](/tools/humatch.html), [Makowski affinity–specificity](/tools/makowski-affinity-specificity.html). Часто путают с [EVOLVEpro](/tools/evolvepro.html) (T7 scalarization, **нет** этого id), NSGA-II литературой, и с «много метрик AF2» как с Pareto-оптимизатором."
        source: MATRIX
      - text: "Пакетного pretrained «MOO generator» нет. Кампания Makowski — один mAb (emibetuzumab). BindCraft — miniprotein binders, не antibody format. Humatch — humanness/pairing, не on-target $K_d$."
        source: PAPER
        locator: "Makowski one antibody case; BindCraft 12 targets non-Ab; Humatch no prospective binding"
  - id: intuition
    title: "2. Интуитивный принцип"
    paragraphs:
      - text: "Несколько свойств конфликтуют: лучший on-target binder может хуже по nonspecific binding, humanness или in silico filters. При inference меняется **множество принятых кандидатов** (фронт, scalar rank, pass/fail, greedy edits), не физика фолдинга."
        source: INTERPRETATION
      - text: "Подтип A (Makowski): бинарные sort-labels → 1D LDA-проекции как proxy непрерывных свойств → scatter affinity vs nonspecific → визуальный Pareto. Inference: выбрать клоны на/около фронта, затем (опционально) предложить *новые* мутации UniRep за пределами library."
        source: PAPER
        locator: "Makowski Fig. 3–4; Results Pareto frontier 4000 sequences"
      - text: "Подтип B (scalarization): пользователь задаёт $w$; surrogate учится на $w^\\top y_{\\mathrm{assay}}$. T7 EVOLVEpro: 20% yield / 40% translation / 40% immunogenicity — PAPER preprint, **не** карточка этого id и **не** NSGA."
        source: PAPER
        locator: "Jiang T7 RNAP paragraph 20%, 40%, and 40%"
      - text: "Подтип C (BindCraft): generator — AF2 backprop; MOO-слой — **жёсткие пороги** на AF2 и Rosetta, затем rank i_pTM. Кандидат либо проходит все фильтры, либо нет. Это conjunctive constraints, не фронт компромиссов affinity vs developability."
        source: PAPER
        locator: "Nature Methods Designs are finally filtered using a set of predefined filters"
      - text: "Подтип D (Humatch): три CNN + germline-likeness; greedy single-point, пока все CNN $\\ge 0.95$ (default). CDRs ignored by default. Это simultaneous thresholds на humanness/pairing, не Pareto affinity–specificity."
        source: PAPER
        locator: "mAbs Fig. 2; Methods until all three CNN target thresholds of 0.95"
      - text: "Главный рычаг **Makowski**: какие sort gates задают binary $y$ (antigen top 50%; PSR top 25% / bottom 10%) и какой feature set (OneHot vs UniRep vs PhysChem). PAPER. Рычаг **BindCraft**: hotspot/length JSON и filter thresholds; rank metric i_pTM. PAPER. Рычаг **Humatch**: target V-genes, GL 0.40, CNN 0.95, max edit 60, CDR freeze. PAPER."
        source: PAPER
        locator: "Makowski FACS gates Methods; BindCraft JSON+filters; Humatch defaults Methods"
      - text: "Предостережение по метрикам **этого класса**. LDA-проекция, OneHot accuracy 93%, Spearman ρ, AF2 pLDDT / i_pTM / i_pAE, Rosetta shape complementarity / interface H-bonds / dG, Humatch CNN-H/L/P, OASis-like humanness, ESM pMMS **не** experimental affinity / $K_d$ / ELISA / BLI / ADA в клинике. BindCraft явно: i_pTM binary predictor of binding activity, **does not correlate with interaction affinity** (Supplementary Fig. 6)."
        source: PAPER
        locator: "Makowski Fig. 3 ρ vs yeast/IgG; BindCraft Discussion i_pTM vs affinity; Humatch no wet-lab Kd"
      - text: "Rosetta interface scores после FastRelax — **evaluator** physics proxy, не измеренный $\\Delta G$ и не SPR. Humatch min(CNN) vs ADA на 211 therapeutics — retrospective association, не immunogenicity assay дизайнов Humatch."
        source: PAPER
        locator: "BindCraft InterfaceAnalyzer; Humatch Fig. 1 Marks ADA set"
  - id: math
    title: "3. Формальная математическая постановка"
    paragraphs:
      - text: "Сначала родовое векторное $y(s)\\in\\mathbb{R}^k$ и доминирование. Затем подтипы с **разными** уравнениями: LDA-Pareto (Makowski); $w^\\top y$ (scalarization, T7); conjunctive $g(s)\\le\\tau$ (BindCraft); greedy multi-score (Humatch). Не одна формула NSGA-II на все три catalog tools. Не подставлять seed one-liner как уравнение инструмента."
        source: INTERPRETATION
      - text: "Формулы, которые **не** являются уравнениями default-инструмента этого класса: UCB/EI; AF2 FAPE как MOO-loss; Meier $\\Delta\\ell$; AR NLL; diffusion score; NSGA crowding distance; BindCraft hallucination loss как «Pareto layer» (это train/design target **генератора**, не класса выбора)."
        source: INTERPRETATION
      - text: "Не сравнивать Makowski 37% dual-improved IgGs, BindCraft 10–100% SPR hit-rate и Humatch mutation overlap 0.77/0.82 как один benchmark: generated object, oracle и split разные."
        source: INTERPRETATION
      - text: "EVOLVEpro T7 — **пример scalarization в литературе каталога**, не строка reverse index этого id. Не приписывать NSGA released EVOLVEpro (см. [active learning](/architectures/active-learning.html))."
        source: PAPER
        locator: "Jiang weighted objective; extra_constraints"
    equations:
      - latex: "y(s)=(y_1(s),\\ldots,y_k(s))\\in\\mathbb{R}^k"
        caption: "Родовой вектор целей. Компоненты — assay labels, surrogate heads или constraint scores; физический смысл задаётся вне класса. Generic: не checkpoint Makowski/BindCraft/Humatch."
        generic_or_specific: generic
        source: INTERPRETATION
        symbols:
          - {sym: s, type: "candidate", meaning: "sequence / mutant / design"}
          - {sym: "y_j", type: "objective j", meaning: "j-е свойство; знак max/min фиксирует постановка"}
          - {sym: k, type: "int", meaning: "число целей"}
        meaning: "Класс не оптимизирует один scalar, пока не выбран подтип B. Семплируется/отбирается множество компромиссов, не одна «лучшая» точка без $w$ или порогов."
      - latex: "s\\succ s'\\iff \\forall j\\ y_j(s)\\ge y_j(s')\\ \\text{and}\\ \\exists j:\\ y_j(s)>y_j(s')"
        caption: "Родовое Pareto-доминирование при максимизации всех координат (для minimize nonspecific binding берут $-y_{\\mathrm{nsb}}$). Generic. Не алгоритм NSGA."
        generic_or_specific: generic
        source: INTERPRETATION
        locator: "Makowski prose: maximum affinities at each level of specificity"
        symbols:
          - {sym: "\\succ", type: "relation", meaning: "строгое доминирование"}
        meaning: "Парето-множество: никакой допустимый $s'$ не доминирует $s$. Отбор, не генерация fold."
    sections:
      - id: math-pareto-lda
        level: 3
        title: "Подтип A — LDA-проекции и Pareto на library (Makowski; tool-specific)"
        paragraphs:
          - text: "Бинарные deep-seq labels → LDA 1D projection per property. Проекция коррелирует с непрерывным yeast/IgG readout, это **не** $K_d$. OneHot не обобщает на новые сайты; UniRep-64 — для novel CDR mutations (Blosum62 $\\ge 0$). Tool-specific [Makowski](/tools/makowski-affinity-specificity.html)."
            source: PAPER
            locator: "Methods Model development LDA; Fig. 3C–D Spearman 0.87 and 0.67"
        equations:
          - latex: "\\phi_j(s)=\\mathrm{LDA}_j\\bigl(x(s)\\bigr),\\quad j\\in\\{\\mathrm{aff},\\mathrm{nsb}\\}"
            caption: "Непрерывная LDA-проекция sklearn SVD solver; $x$ = OneHot / UniRep-64 / PhysChem-26. Не BERT-MLM. Не уравнение BindCraft/Humatch."
            generic_or_specific: "Makowski [PAPER]; tool-specific"
            source: PAPER
            locator: "Methods LinearDiscriminantAnalysis SVD; three feature sets"
            symbols:
              - {sym: "\\phi_j", type: "1D score", meaning: "proxy непрерывного свойства j; cutoff классификации близок к 0, но не точно 0"}
              - {sym: "x(s)", type: "features", meaning: "OneHot VH / 64 UniRep / 26 PhysChem"}
            meaning: "Train: binary CE/LDA на 4000 seq. Select: неDominated в плоскости $(\\phi_{\\mathrm{aff}},\\phi_{\\mathrm{nsb}})$. $\\phi\\neq K_d$."
      - id: math-scalar
        level: 3
        title: "Подтип B — линейная scalarization (родовой; T7 не catalog id)"
        paragraphs:
          - text: "Пользовательские веса сводят вектор к одному train target. T7: yield / translation / immunogenicity = 20/40/40 на **experimental** labels. Не learned Pareto layer. Не Humatch CNN mix (там пороги, не $w$ на ELISA)."
            source: PAPER
            locator: "Jiang T7 weighted 20%, 40%, and 40%"
        equations:
          - latex: "\\tilde y(s)=w^\\top y(s),\\qquad \\sum_j w_j=1,\\ w\\ge 0"
            caption: "Scalarization. Generic подтип. Численные $w=(0.2,0.4,0.4)$ — **только** T7 EVOLVEpro preprint, не BindCraft и не Makowski."
            generic_or_specific: generic
            source: PAPER
            locator: "Jiang T7 objective weights; generic MOO"
            symbols:
              - {sym: w, type: "weights", meaning: "предпочтение пользователя, не физика"}
              - {sym: "\\tilde y", type: "scalar", meaning: "единственный столбец для RF/AL"}
            meaning: "Оптимизируется один weighted assay. Компромисс спрятан в $w$; фронт не строится."
      - id: math-filters
        level: 3
        title: "Подтип C — conjunctive filters (BindCraft; не Pareto-сеть)"
        paragraphs:
          - text: "После AF2-multimer hallucination и MPNNsol (interface 4 Å frozen) — AF2 monomer repredict + Rosetta FastRelax 200 iter + InterfaceAnalyzer. Accept iff все пороги. Rank прошедших: i_pTM. ≤2 MPNN seq на траекторию. Рекомендация: $\\ge 100$ pass, ~300–3000 trajectories, 10 из top-20 i_pTM в assay. Tool-specific [BindCraft](/tools/bindcraft.html). Hallucination loss — **не** уравнение этого подтипа (generator)."
            source: PAPER
            locator: "Nature Methods filter enumeration; 100 designs; 300–3000 trajectories"
        equations:
          - latex: "s\\in\\mathcal{A}\\iff \\bigwedge_{i=1}^{m} \\mathbf{1}\\bigl[g_i(s)\\,\\mathrm{rel}_i\\,\\tau_i\\bigr]"
            caption: "Conjunctive acceptance. Nature list (не workshop): pLDDT $>0.8$; i_pTM $>0.5$; i_pAE $<0.35$; shape complementarity $>0.60$; interface H-bonds $>3$; unsat H-bonds $<4$; surface hydrophobicity $<35\\%$; bound/unbound RMSD $<3.5$ Å; $<3$ Lys and Met at interface. Не $\\max w^\\top g$."
            generic_or_specific: "BindCraft [PAPER]; tool-specific"
            source: PAPER
            locator: "Nature Methods Designs are finally filtered (1)–(9)"
            symbols:
              - {sym: "g_i", type: "AF2/Rosetta scalar", meaning: "evaluator/predictor score, не SPR"}
              - {sym: "\\tau_i", type: "threshold", meaning: "predefined filter; refined during the work"}
              - {sym: "\\mathcal{A}", type: "accepted set", meaning: "кандидаты на wet-lab"}
            meaning: "Не оптимизируется Pareto affinity–developability. Семплирует generator; этот слой отсекает. i_pTM $\\neq K_d$."
      - id: math-humatch
        level: 3
        title: "Подтип D — greedy multi-score до порогов (Humatch; не affinity MOO)"
        paragraphs:
          - text: "GL-matching до 0.40, затем все single-point (CDRs default frozen), scaled net CNN-H/L/P, pick novel top, repeat until все $\\ge 0.95$ или edit 60. Не Pareto трёх CNN. Не Makowski LDA. Tool-specific [Humatch](/tools/humatch.html)."
            source: PAPER
            locator: "mAbs Methods Humatch humanisation logic; Fig. 2"
        equations:
          - latex: "s_{t+1}\\in\\arg\\max_{s'\\in\\mathcal{N}(s_t)} \\mathrm{score}_{\\mathrm{H,L,P,GL}}(s')\\quad\\text{until }\\min(\\mathrm{CNN}_H,\\mathrm{CNN}_L,\\mathrm{CNN}_P)\\ge\\tau"
            caption: "Схематический greedy (точный scaling: net predictions × germline frequencies, затем gap-to-target; Methods). $\\tau=0.95$ default. Не ELISA. Results vs Methods: softmax vs sigmoid на последнем слое — unresolved."
            generic_or_specific: "Humatch [PAPER]; tool-specific"
            source: PAPER
            locator: "Methods net predictions scaled; targets 0.95"
            symbols:
              - {sym: "\\mathcal{N}", type: "neighbors", meaning: "single-point variants; CDR excluded default"}
              - {sym: "\\tau", type: "threshold", meaning: "default 0.95 each CNN"}
            meaning: "Оптимизируются humanness/pairing classifiers. Семплируется путь мутаций. Humanness $\\neq$ immunogenicity $\\neq$ affinity."
    tables:
      - headers: ["Постановка", "Train target", "Sampler/декодер", "Что в каталоге"]
        source: INTERPRETATION
        rows:
          - ["MOO (эта страница)", "зависит от подтипа: LDA/CE, $w^\\top y$, нет (filters), CNN-CE", "Pareto pick / top-$\\tilde y$ / pass-fail / greedy edits", "Makowski; BindCraft filters; Humatch"]
          - ["[Active learning](/architectures/active-learning.html)", "surrogate на накопленном $D_t$", "batch acquisition", "EVOLVEpro; не NSGA"]
          - ["[Few-shot mutation optimization](/architectures/few-shot-mutation-optimization.html)", "fit $f_\\phi(E(s))$ на малом $n$", "rank library", "EVOLVEpro; может быть 1 objective"]
          - ["[Bayesian optimization](/architectures/bayesian-optimization.html)", "GP/posterior NLL", "UCB/EI", "не default EVOLVEpro; не этот id"]
          - ["[Inverse folding](/architectures/inverse-folding.html)", "CE $p(s\\mid x)$", "AR/T decode", "MPNN внутри BindCraft, не MOO-уравнение"]
  - id: data-repr
    title: "4. Представление данных"
    paragraphs:
      - text: "Класс не фиксирует граф. Узлы/рёбра появляются только во **вложенных** генераторах (AF2 pair repr) или CNN (Humatch conv along IMGT). MOO-слой видит векторы scores или sequence features."
        source: INTERPRETATION
      - text: "Makowski: VH 115 aa, Kabat H1–H113. OneHot через sklearn LabelEncoder+OneHotEncoder. PhysChem: 20 AA counts + hydrophobic/amphipathic/polar/charged + ExPASy pI + Kyte–Doolittle mean = 26. UniRep-64 `get_rep()`. Hidden width LDA — sklearn default, NR кроме «1D projection»."
        source: PAPER
        locator: "Methods Molecular feature embedding; 115 residues"
      - text: "Makowski masks: нет diffusion $t$. Labels — presence/absence in FACS bins, не contig file. Внешние файлы: deep-seq FASTQ, emi_binding.csv (Supplemental). PDB numbering library design — chemical rules Zhang et al., не вход LDA."
        source: PAPER
        locator: "Methods deep sequencing processed; Data availability csv"
      - text: "BindCraft сеть (hallucination) принимает target PDB + binder length + optional hotspot residues/chains JSON. Filter tensors: AF2 confidence maps → scalars pLDDT, i_pTM, i_pAE; Rosetta interface features. Точные JSON key names кода — NR."
        source: PAPER
        locator: "Methods input PDB, min/max length, hotspot; filter list"
      - text: "Humatch: pad к 200 частым IMGT (KASearch); paired concat + 10 pad → length 410. AA → 10-D Kidera; pad = zero vector. 40 conv filters, kernel 10, stride 1, ReLU, dropout 0.2, max-pool 2, flatten, dense 300 → C classes. Time embedding нет."
        source: PAPER
        locator: "Methods CNN architecture; 200 vs 410; Kidera"
