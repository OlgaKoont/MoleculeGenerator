status_note: "Класс PLM описан как семейство ролей, не одна сеть. Прочитаны: Nijkamp et al. ProGen2 arXiv 2206.13517 HTML (AR, p0≠p∞); Lin et al. ESM-2 bioRxiv 10.1101/2022.07.20.500902v3 (MLM 15%, UniRef, 8M–15B); Meier et al. ESM-1v bioRxiv 10.1101/2021.07.09.450648 (masked-marginal Δℓ, Eq. 1); Hayes et al. ESM3 bioRxiv 10.1101/2024.07.01.600583 (generative MLM, variable mask rate); Shuai/Ruffolo/Gray IgLM Cell Systems HTML + Graylab/IgLM @de819b56 (ранее); Jiang et al. EVOLVEpro bioRxiv + mat10d/EvolvePro @1c77697 (ранее); PALM-H3 Nat. Commun. HTML 10.1038/s41467-024-50903-y; tFold Nat. Commun. HTML 10.1038/s41467-025-67361-9 (ESM-PPI компонент). ProGen Nature 10.1038/s41587-022-01618-2 — abstract/Data (280M sequences, lysozyme 31.4%, PDB 7RGR); Methods paywall. Hie et al. Nat. Biotechnol. 10.1038/s41587-023-01763-2 HTML timeout. ESM-2/ESM3 journal HTML не сличены постранично с preprint. salesforce/progen и Biohub/esm commit NR this pass."
lede: "Protein language models — семейство **sequence models** над токенами аминокислот. Это не одна роль: (i) generative $p(s)$, (ii) masked infill, (iii) frozen embeddings $E(s)$ для surrogate, (iv) zero-shot $\\Delta\\ell$. Это не structure generator, не affinity predictor и не assay."
