sections:
  - id: domain
    title: "1. Область определения"
    paragraphs:
      - text: "Роль в пайплайне **зависит от головы**, не от слова «PLM». (i) **generator** дискретных AA tokens (AR decode / iterative unmask). (ii) **density model** / infiller masked spans. (iii) **feature extractor**: frozen $E(s)$ для [few-shot](/architectures/few-shot-mutation-optimization.html) / [active learning](/architectures/active-learning.html). (iv) **scorer** zero-shot $\\Delta\\ell$ — канон [zero-shot mutation scoring](/architectures/zero-shot-mutation-scoring.html). [EVOLVEpro](/tools/evolvepro.html) = (iii), **не** (i)."
        source: INTERPRETATION
      - text: "Generated/scored state — токены аминокислот $s\\in\\mathcal{A}^{L}$ и/или contextual embeddings $h_i$. Координаты, frames, torsions **не** входят в sequence-only PLM. ESM3 добавляет discrete structure/function tracks — это уже пересечение с [joint sequence–structure generation](/architectures/joint-sequence-structure-generation.html), не «чистый» sequence LM."
        source: PAPER
        locator: "Hayes ESM3 Fig. 1 tracks; Lin ESM-2 sequence-only MLM"
      - text: "Задачи каталога, которые класс реально закрывает: [general protein sequence generation](/tasks/general-protein-sequence-generation.html) ([ProGen](/tools/progen.html), [ESM3](/tools/esm3.html)), [CDR sequence generation](/tasks/cdr-sequence-generation.html) ([IgLM](/tools/iglm.html), [PALM-H3](/tools/palm-h3.html)), [single-mutation proposal](/tasks/single-mutation-proposal.html) ([ESM-1v efficient evolution](/tools/esm-1v-efficient-evolution.html)), few-shot AL embeddings ([EVOLVEpro](/tools/evolvepro.html)). [De novo antibody](/tasks/de-novo-antibody-design.html) у [tFold](/tools/tfold.html) — **workflow** с PLM-компонентом, не тождество «tFold = PLM»."
        source: MATRIX
      - text: "Это **не** [autoregressive generation](/architectures/autoregressive-generation.html) как отдельный decode-класс: AR — *способ факторизации*, который PLM может использовать, но masked ESM-2 не пишет left-to-right. Это **не** [masked-token infilling](/architectures/masked-token-infilling.html) как единственная задача: infill — *режим inference*, MLM — *train target*."
        source: INTERPRETATION
      - text: "Это **не** [zero-shot mutation scoring](/architectures/zero-shot-mutation-scoring.html): $\\Delta\\ell$ — одно применение pretrained PLM, не определение семейства. Это **не** [few-shot mutation optimization](/architectures/few-shot-mutation-optimization.html): там обучается $f_\\phi$ на labels, PLM обычно frozen. Это **не** [joint sequence–structure generation](/architectures/joint-sequence-structure-generation.html) целиком: DiffAb/FlowDesign не обязаны быть PLM."
        source: INTERPRETATION
      - text: "Это **не** [inverse folding](/architectures/inverse-folding.html): $p(s\\mid X_{\\mathrm{3D}})$. ESM-IF1 — geometric Transformer, **нет** этого `architecture_id`. Не путать ESM-2 embedder EVOLVEpro с ESM-IF1 и не путать ESM3 с ESM-2."
        source: MATRIX
      - text: "Catalog tools с `architecture_id: protein-language-models`: [ProGen](/tools/progen.html), [IgLM](/tools/iglm.html), [ESM3](/tools/esm3.html), [EVOLVEpro](/tools/evolvepro.html), [ESM-1v efficient evolution](/tools/esm-1v-efficient-evolution.html), [PALM-H3](/tools/palm-h3.html), [tFold](/tools/tfold.html). Часто путают с [ProteinMPNN](/tools/proteinmpnn.html) (IF GNN), [EvoDiff](/tools/evodiff.html) (sequence diffusion, другой id), [AntiFold](/tools/antifold.html) (IF)."
        source: MATRIX
      - text: "Литература вне карточек, без которой роли (ii)–(iv) непонятны: ESM-2 (Lin; не catalog tool), ESM-1v (Meier; tool каталога — *pipeline* Hie поверх модели), ESMFold folding head (predictor, frozen LM). ProtGPT2 — pointer, не tool."
        source: PAPER
        locator: "Lin ESM-2; Meier ESM-1v; Nijkamp cites Ferruz ProtGPT2"
  - id: intuition
    title: "2. Интуитивный принцип"
    paragraphs:
      - text: "Self-supervised цель на миллионах sequences заставляет сеть сжимать **эволюционную статистику** токенов: какие аминокислоты совместны в контексте. При inference меняется разное: AR дописывает следующий токен; MLM заполняет маску; frozen encoder выдаёт вектор $E(s)$ без смены весов PLM; zero-shot считает разность лог-вероятностей wt vs mut."
        source: INTERPRETATION
      - text: "Главный рычаг **генераторов**: temperature / nucleus $P$ (ProGen2 Cartesian $T\\times P$; IgLM $T$, top-$p$). Это tokenizer-level entropy, не $kT$ термодинамики."
        source: PAPER
        locator: "Nijkamp §3.4 sampling; IgLM generate defaults (prior CODE)"
      - text: "Рычаг **ESM-2 / ESM-1v как scorer**: masked marginal в мутированных позициях (Meier). Рычаг **EVOLVEpro**: качество и pooling embeddings (preprint: ESM-2 15B, residue average) при **замороженном** PLM; меняется top-layer на labels."
        source: PAPER
        locator: "Meier Eq. 1; Jiang frozen embeddings + average pool"
      - text: "Рычаг **ESM3**: variable mask-rate generative MLM (не фиксированные 15% BERT) + prompts по tracks; alignment preference pairs по pTM/cRMSD, не ELISA."
        source: PAPER
        locator: "Hayes: supervision across all masking rates; Appendix A.2.2 mix β(3,9)+uniform"
      - text: "Предостережение. Likelihood / perplexity / pMMS / A2binder score / ESMFold pLDDT / AAR **не** experimental affinity / $K_d$ / ELISA / BLI. ProGen2 явно: оценка $p_0$ (train distribution) $\\neq$ стационарное $p^\\infty\\propto f$ (fitness); филогенетический bias."
        source: PAPER
        locator: "Nijkamp §4.1 citing Weinstein et al. 2022, p0 ≠ p∞"
      - text: "ESM-2 contact precision и ESMFold TM — **structure predictor / probe**, не функция белка. tFold SPR nanomolar — после phage display и filter, не выход ESM-PPI. PALM A2binder ранжирует **до** SPR; predicted ΔG/probability ≠ измеренный $K_D$."
        source: PAPER
        locator: "tFold Fig. 1 phage+SPR; PALM Fig. 7e A2binder then SPR"
      - text: "IgLM OASis / SAP / CamSol и ProGen2 IgFold pLDDT на generated Ab — in silico developability/structure, primary IgLM paper без wet-lab binding."
        source: PAPER
        locator: "IgLM Cell Systems: no prospective wet-lab in catalog paper YAML; Nijkamp Fig. 3 SAP/CamSol"
      - text: "Не смешивать causal и masked в «одной интуиции softmax»: двусторонний контекст MLM ≠ left-to-right AR; IgLM infill — AR **после** перестановки span (Donahue ILM), не BERT."
        source: PAPER
        locator: "IgLM STAR ILM; Lin bidirectional MLM"
  - id: math
    title: "3. Формальная математическая постановка"
    paragraphs:
      - text: "У семейства **нет** одного train target. Ниже родовой объект (токены), затем **отдельные** уравнения ролей (i)–(iv) и multimodal MLM. Не писать одну формулу на ProGen, ESM-2 и EVOLVEpro. Не подставлять UCB, FAPE, diffusion score, Lipman CFM как уравнение PLM."
        source: INTERPRETATION
      - text: "Формулы, которые **не** default ни одного catalog tool как «уравнение PLM-класса»: ProteinMPNN random-order CE; FrameDiff IGSO(3); EVOLVEpro UCB (released code — top-$N$ $\\hat y$, не UCB); A2binder regression как generative loss; tFold FAPE structure module."
        source: INTERPRETATION
      - text: "Не сравнивать ProGen lysozyme $k_{\\mathrm{cat}}$, PALM SPR, tFold phage+$K_D$ и EVOLVEpro activity fold-change как один benchmark: generated object, oracle и split разные."
        source: INTERPRETATION
    equations:
      - latex: "s=(s_1,\\ldots,s_L),\\quad s_i\\in\\mathcal{A}"
        caption: "Родовой state sequence-only PLM: дискретная цепочка токенов (AA + specials). Это не loss. Generic."
        generic_or_specific: generic
        source: INTERPRETATION
        symbols:
          - {sym: s, type: "token sequence", meaning: "первичная структура как токены"}
          - {sym: "\\mathcal{A}", type: "alphabet", meaning: "аминокислоты + special (MASK, EOS, tags); размер словаря tool-specific"}
          - {sym: L, type: "int", meaning: "длина в токенах (crop/context window — tool-specific)"}
        meaning: "Оптимизируется CE на токенах выбранной факторизации. Семплируются токены или извлекается E(s). Не Kd."
    sections:
      - id: math-ar
        level: 3
        title: "Роль (i) — autoregressive p(s) (ProGen/ProGen2; IgLM after ILM permute; PALM decoder)"
        equations:
          - latex: "p_\\theta(s\\mid c)=\\prod_{i=1}^{L}p_\\theta(s_i\\mid s_{<i},c)"
            caption: "Causal LM. $c$ — control tags (ProGen), chain/species (IgLM), или encoder antigen (PALM-H3 cross-attention). Не masked ESM-2. Не default EVOLVEpro."
            generic_or_specific: generic
            source: PAPER
            locator: "Nijkamp §2 causal product of conditionals; Madani abstract control tags"
            symbols:
              - {sym: c, type: "conditioner", meaning: "tags / prefix / encoder keys"}
              - {sym: "\\theta", type: "params", meaning: "веса decoder Transformer"}
            meaning: "Train: next-token CE. Sample: ancestral left-to-right (или ILM order). Likelihood на held-out ≠ fitness."
          - latex: "\\mathrm{ppl}(s)=\\exp\\Bigl(-\\tfrac{1}{L}\\sum_{i=1}^{L}\\ln p_\\theta(s_i\\mid s_{<i})\\Bigr)"
            caption: "Perplexity ProGen2 Table 2 (test-max90/max50). Метрика language modeling, не $k_{\\mathrm{cat}}$."
            generic_or_specific: "ProGen2 [PAPER]"
            source: PAPER
            locator: "Nijkamp §4.1 perplexity definition"
            symbols:
              - {sym: "\\mathrm{ppl}", type: "scalar", meaning: "exp mean NLL per token"}
            meaning: "Оценивается $p_0$, не $p^\\infty$."
      - id: math-mlm
        level: 3
        title: "Роль (ii) — masked LM (ESM-2; ESM-1v train; BERT-style 15%)"
        equations:
          - latex: "\\mathcal{L}_{\\mathrm{MLM}}=-\\mathbb{E}_{s,M}\\sum_{i\\in M}\\log p_\\theta(s_i\\mid s_{\\setminus M})"
            caption: "Generic MLM. ESM-2: token в $M$ с вероятностью 15%; из них 80% [MASK], 10% random, 10% unchanged (Lin Appendix). Не causal ProGen. Не ESM3 variable-rate (ниже)."
            generic_or_specific: generic
            source: PAPER
            locator: "Lin ESM-2 MLM paragraph + Appendix 15% BERT noise"
            symbols:
              - {sym: M, type: "index set", meaning: "маскируемые позиции"}
              - {sym: "s_{\\setminus M}", type: "context", meaning: "двусторонний незамаскированный контекст"}
            meaning: "Обучается восстановление токенов. Семплирование полной цепи не определено одним ancestral pass (нужен infill/unmask protocol)."
      - id: math-esm3
        level: 3
        title: "Подтип multimodal generative MLM (ESM3; не 15% BERT)"
        paragraphs:
          - text: "Hayes: supervision **across all possible masking rates**, any-order factorization. Tracks fused: sequence, structure tokens, function. Geometric attention в **первом** блоке. Канон совместной генерации — [joint seq–struct](/architectures/joint-sequence-structure-generation.html); здесь только факт, что это всё ещё masked LM."
            source: PAPER
            locator: "Hayes ESM3 paragraphs after Fig. 1; 80% β(3,9) mean 25% + 20% uniform, overall ~30% (A.2.2)"
        equations:
          - latex: "\\mathbb{E}_{m}\\bigl[-\\log p_\\theta(x_m\\mid x_{\\setminus m})\\bigr],\\quad m\\sim\\mathrm{noise\\ schedule}"
            caption: "Generative MLM ESM3 на всех tracks $x$ (sequence+structure+function). Не ProGen AR. Не EVOLVEpro."
            generic_or_specific: "ESM3 [PAPER]"
            source: PAPER
            locator: "Hayes: generative masked LM across all tracks; mask schedule A.2.2"
            symbols:
              - {sym: x, type: "multimodal tokens", meaning: "AA + VQ structure + function keywords"}
              - {sym: m, type: "mask", meaning: "случайная маска с variable rate"}
            meaning: "Train: CE masked tokens. Sample: iterative unmask any order until $m=\\emptyset$."
      - id: math-frozen
        level: 3
        title: "Роль (iii) — frozen E(s) + surrogate (EVOLVEpro; не generative PLM)"
        equations:
          - latex: "\\hat y(s)=f_\\phi(E_{\\mathrm{frozen}}(s)),\\qquad B_t=\\mathrm{top}_k\\{s\\in U_t:\\hat y(s)\\}"
            caption: "Tool-specific EVOLVEpro default (RF + top-N). $E$ не дообучается на activity. Не UCB. Канон цикла — [active learning](/architectures/active-learning.html)."
            generic_or_specific: "EVOLVEpro [PAPER+CODE]"
            source: CODE
            locator: "Jiang preprint frozen embeddings; evolve.py learning_strategy topn; commit 1c77697"
            symbols:
              - {sym: "E_{\\mathrm{frozen}}", type: "vector", meaning: "PLM embedding (ESM-2 15B average pool в оптимальной preprint-конфигурации)"}
              - {sym: "f_\\phi", type: "regressor", meaning: "sklearn RF experimental path"}
              - {sym: U_t, type: "set", meaning: "ещё не измеренный user library"}
            meaning: "Оптимизируется regressor на assay y. Семплирования токенов LM нет."
      - id: math-zs
        level: 3
        title: "Роль (iv) — zero-shot masked-marginal Δℓ (ESM-1v; Hie pipeline)"
        equations:
          - latex: "\\Delta\\ell(T)=\\sum_{t\\in T}\\bigl[\\log p(x_t=x^{\\mathrm{mt}}_t\\mid x_{\\setminus T})-\\log p(x_t=x^{\\mathrm{wt}}_t\\mid x_{\\setminus T})\\bigr]"
            caption: "Meier Eq. 1. Вход маскируется во всех мутированных позициях; additive для multiple mutations. Канон — [zero-shot scoring](/architectures/zero-shot-mutation-scoring.html). Не train target EVOLVEpro. Не Kd."
            generic_or_specific: generic
            source: PAPER
            locator: "Meier Method Eq. (1)"
            symbols:
              - {sym: T, type: "index set", meaning: "мутированные позиции"}
              - {sym: "x^{\\mathrm{wt}},x^{\\mathrm{mt}}", type: "AA", meaning: "wild-type vs mutant residue"}
            meaning: "Не оптимизируется (pretrained). Ранжируется library substitutions. Spearman к DMS ≠ affinity guarantee."
    tables:
      - caption: "Смежные постановки, которые нельзя смешивать"
        source: INTERPRETATION
        headers: ["Постановка", "Train target", "Sampler/декодер", "Что в каталоге"]
        rows:
          - ["PLM family (эта страница)", "CE AR **или** MLM; либо frozen (нет CE на y)", "AR / unmask / embed / Δℓ — разные головы", "7 tools с этим id"]
          - ["[Autoregressive generation](/architectures/autoregressive-generation.html)", "next-token CE", "left-to-right (или заданный order)", "ProGen, IgLM, PALM decoder; также IF"]
          - ["[Masked-token infilling](/architectures/masked-token-infilling.html)", "обычно MLM / ILM", "fill span / iterative unmask", "IgLM infill, ESM3, EvoDiff (другой id)"]
          - ["[Zero-shot mutation scoring](/architectures/zero-shot-mutation-scoring.html)", "нет task loss", "enumerate 19×pos, rank Δℓ", "ESM-1v efficient evolution"]
          - ["[Few-shot / AL](/architectures/few-shot-mutation-optimization.html)", "surrogate on labels", "top-N / acquisition на пуле", "EVOLVEpro"]
          - ["[Joint seq–struct](/architectures/joint-sequence-structure-generation.html)", "зависит (MLM tracks / DDPM / FM)", "unmask или diffusion", "ESM3 (пересечение); DiffAb ≠ PLM"]
          - ["[Inverse folding](/architectures/inverse-folding.html)", "$\\log p(s\\mid X)$", "AR/random-order decode", "ProteinMPNN, ESM-IF1 — **нет** этого id"]
  - id: data-repr
    title: "4. Представление данных"
    paragraphs:
      - text: "Узлы: позиции последовательности (токены). Рёбра: self-attention, не kNN геометрии (кроме ESM3 geometric attention block 1 и tFold Evoformer после ESM-PPI). Pair tensors ESMFold/tFold — **другой модуль**, не обязательный PLM state."
        source: INTERPRETATION
      - text: "ESM-2: UniRef; even weighting across ~43M UniRef50 clusters from ~138M UniRef90; ~65M unique sequences over training. Crop 1024 tokens; BOS/EOS. 15% mask BERT noise. Hidden width Table S1 **не транскрибирована** (NR)."
        source: PAPER
        locator: "Lin training paragraph; Appendix crop 1024, 15% mask"
      - text: "ESM-1v: UniRef90 2020-03, 98M sequences, ESM-1b architecture, 650M params, five seeds. Context length details сверх architecture ESM-1b — NR this pass."
        source: PAPER
        locator: "Meier ESM-1v paragraph"
      - text: "ProGen2: Uniref90 + BFD30 (BFD30 ~1/3 Uniref90, 30% id, metagenomic); OAS cluster 85% → 554M for ProGen2-OAS. 1–2 character tokens на N- и C-terminus; sequence as-is **and flipped**. Context 1024 (base 2048). Table 1: 151M/764M/2.7B/6.4B."
        source: PAPER
        locator: "Nijkamp §3.2 Data; Table 1"
      - text: "IgLM: BertTokenizerFast; chain `[HEAVY]`/`[LIGHT]` + species; ILM mask length Unif{10..20}. OAS unpaired 809M → 588M cluster → 558M train (prior analysis). CODE `max_length=150` generate."
        source: PAPER
        locator: "IgLM STAR + prior CODE IgLM.py"
      - text: "PALM-H3: antigen sequence → ESM-2 encoder (UniRef50 pretrain, antigen FT); CDR-H3 decoder RoFormer 12 layers; K/V last antigen layer → every decoder cross-attention. OAS first-round: 1 291 060 593 heavy, 210 950 159 light (Methods). COVID second-round: 81 750 886 H, 17 754 502 L."
        source: PAPER
        locator: "PALM Fig. 1 caption; Methods OAS counts"
      - text: "tFold: ESM-PPI further-pretrains ESM-2 on monomers+multimers; затем Evoformer-Single + IPA. Sequence recovery head на masked antibody residues. FR template, epitope, antigen — **внешние** входы workflow, не UniRef crop."
        source: PAPER
        locator: "tFold tFold-Ab four modules; Fig. 6 sequence recovery"
      - text: "EVOLVEpro: вход сети top-layer — **готовая матрица embeddings** + CSV labels; FASTA parent. Library $\\mathcal{X}$ — внешний файл пользователя, не токены LM. DMS vs experimental paths разные (CODE)."
        source: CODE
        locator: "EvolvePro load_experimental_embeddings; commit 1c77697"
      - text: "Аугментации токенов: ProGen2 reverse sequences; ESM-2 random crop; IgLM span shuffle (не биологический splicing). 3D rotation **не применима** к sequence-only. ESM3 structure tokens — local atomic neighborhoods, не MD."
        source: PAPER
        locator: "Nijkamp flipped sequences; Hayes Fig. 1C structure tokenization"
  - id: physical-repr
    title: "5. Физическое представление"
    paragraphs:
      - text: "Математический $s_i$ ↔ residue identity в полипептидной цепи (или special token). Это **не** атом, не rotamer, не assay label. Embedding $h_i$ ≠ энергия и ≠ траектория фолдинга."
        source: INTERPRETATION
      - text: "SE(3): **не применимо** к sequence-only PLM (координат нет). ESM3 geometric attention оперирует local frames из bond geometry — это уже геометрический слой multimodal модели, не инвариантность ESM-2."
        source: PAPER
        locator: "Hayes invariant geometric attention, first block"
      - text: "Перестановка residues в биологическом порядке ломает смысл, кроме явного ILM (IgLM) или random decode IF (другой класс). Concatenation VH||VL: IgLM генерирует цепи **независимо**; paired Fv не один AR-фактор."
        source: PAPER
        locator: "IgLM unpaired chains"
      - text: "Side chains: в state только **тип** AA, не χ angles. Pack / relax / AF — post-hoc **evaluator**. ESM3 decoder восстанавливает all-atom из structure tokens (Hayes); это не ESM-2."
        source: PAPER
        locator: "Hayes structure token decoder <0.5 Å CAMEO reconstruction"
      - text: "Промежуточный masked token / $s_{<i}$ ≠ физическое время синтеза на рибосоме. Reverse-sequence train ProGen2 — вычислительный трюк, не C→N фолдинг."
        source: PAPER
        locator: "Nijkamp §3.2 flipped"
      - text: "tFold generated CDRs на **фиксированном** human FR (IGHV3-23/IGKV1-5 в кампании) — физический объект IgG/Fc-fusion после phage, не «вывод ESM-PPI»."
        source: PAPER
        locator: "tFold design parameters; ten Fc-fusions SPR"
      - text: "PALM-H3 выход — CDR-H3, прививаемый на context/framework; SPR измеряет комплекс Ab–spike, не logit decoder."
        source: PAPER
        locator: "PALM Fig. 7 SPR+pseudovirus"
      - text: "Function keywords ESM3 (InterPro/GO) — семантические теги, не ELISA. Taxonomy track 98B (last 30k steps) — организм, не affinity."
        source: PAPER
        locator: "Hayes InterPro keywords; Appendix taxonomy 30k steps"
  - id: physchem
    title: "6. Физико-химический смысл"
    paragraphs:
      - text: "Нет energy head у sequence LM. «Модель считает ΔG» запрещено, кроме явного A2binder (отдельный regressor на **labels**, не generative PLM)."
        source: INTERPRETATION
    physchem:
      - feature: "Identity AA"
        interpretation: "ковалентная первичная структура"
        encoded: "прямо токеном"
        limitation: "нет rotamers / протонирования"
      - feature: "Backbone / frames / torsions"
        interpretation: "геометрия остова"
        encoded: "sequence-only — не представлена; ESM3 — discrete structure tokens / optional coord prompt; ESMFold — отдельный predictor"
        limitation: "pLDDT ≠ стабильность"
      - feature: "Antigen / epitope / hotspot coords"
        interpretation: "партнёр связывания"
        encoded: "PALM — epitope **sequence** в encoder; tFold — epitope+FR files; ProGen/IgLM/ESM-2 — нет"
        limitation: "sequence epitope ≠ 3D paratope guarantee"
      - feature: "H-bonds / electrostatics / solvation"
        interpretation: "физика связывания"
        encoded: "неявно через corpus co-occurrence; не кулон"
        limitation: "не ΔG"
      - feature: "Entropy / ensemble"
        interpretation: "конформации / diversity library"
        encoded: "косвенно temperature/nucleus sampling"
        limitation: "T softmax ≠ β=1/kT"
      - feature: "Evolutionary statistics"
        interpretation: "MSA-like constraints без явного MSA (ESM-2/1v/ProGen)"
        encoded: "прямо цель MLM/AR на UniRef/OAS/BFD"
        limitation: "p0 ≠ p∞ (ProGen2); phylogeny bias"
      - feature: "Experimental y (Kd, ELISA, activity)"
        interpretation: "измеренная функция"
        encoded: "не в pretrain PLM; EVOLVEpro — labels на surrogate; A2binder — supervised affinity head; Hie/PALM/tFold wet-lab **после** модели"
        limitation: "не выдавать logit за assay"
  - id: learned
    title: "7. Что обучается"
    paragraphs:
      - text: "Роль (i)–(ii): параметры $\\theta$ Transformer (decoder-only или encoder MLM). Negative examples — неправильные токены softmax, **не** non-binder docking decoys и **не** affinity labels."
        source: INTERPRETATION
      - text: "ESM-2: Adam, 500K updates (15B: 270K), batch 2M tokens (15B: 3.2M), crop 1024. ESMFold: **frozen** LM + folding head, FAPE/distogram; MLM loss omitted. Folding head — predictor, не generative PLM."
        source: PAPER
        locator: "Lin Appendix training; ESMFold freeze LM, omit MLM"
      - text: "ESM-1v: 650M, 5 seeds, UniRef90; optional family spiked fine-tune (Meier) — это **не** catalog Hie protocol как обязательный шаг. Ensemble log-odds."
        source: PAPER
        locator: "Meier five models; further training paragraph"
      - text: "ProGen2: Adam, weight decay 0.1, grad clip 0.8–1.0, Table 1 steps/LR. Fine-tune ≤2 epochs, LR/5, Adam moments reset. ProGen-1 Methods dims — **NR** (paywall)."
        source: PAPER
        locator: "Nijkamp Table 1 + §3.3; Madani Methods inaccessible"
      - text: "IgLM: CE next token на ILM-пересталенной ленте. 12 889 600 params (Table 1 prior). Нет antigen в loss."
        source: PAPER
        locator: "IgLM Table 1"
      - text: "PALM: RoFormer MAA (masked AA) pretrain на OAS; затем seq2seq FT paired antigen–CDRH3; A2binder отдельно на affinity/neutralization labels (CoV-AbDab binary, 14H/14L, BioMap ΔG). A2binder **не** generative loss PALM-H3."
        source: PAPER
        locator: "PALM three-step construction; A2binder datasets"
      - text: "EVOLVEpro: $\\theta_{\\mathrm{PLM}}$ frozen; $\\phi$ RF на $(E(s),y)$. Нет contrastive non-binder в default code."
        source: CODE
        locator: "EvolvePro model.py / evolve.py"
      - text: "tFold ESM-PPI: further pretrain ESM-2 monomers+multimers; sequence recovery CE на masked Ab residues **плюс** structure losses в Ag module. ipLDDT — confidence, не Kd."
        source: PAPER
        locator: "tFold ESM-PPI paragraph; Fig. 6 recovery head"
      - text: "ESM3 alignment: preference pairs high pTM / low cRMSD vs worse; IRPO 1000 steps (preprint). Не ELISA fine-tune."
        source: PAPER
        locator: "Hayes preference tuning; IRPO 1000 steps"
  - id: forward
    title: "8. Прямой проход и information flow"
    paragraphs:
      - text: "Общий каркас: tokenize → (optional conditioner tags/encoder) → Transformer blocks → (a) token logits или (b) pooled $E(s)$. Sequence появляется на входе; geometry — только если multimodal/ESMFold/tFold stack. Score affinity — отдельная голова или внешний assay."
        source: INTERPRETATION
      - text: "ProGen/ProGen2: tags+prefix → causal decode → FASTA. Evaluator: AF2 pLDDT/TM (Nijkamp generations), не часть LM."
        source: PAPER
        locator: "Nijkamp §3.4 AF2 on generations"
      - text: "IgLM: infill permute → GPT-2 → span until ANS. Нет IF/docking в сети."
        source: CODE
        locator: "IgLM.infill commit de819b56"
      - text: "ESM-1v Hie pipeline: parent → mask each substitution site → Δℓ rank → **experiment** (unread paper). Не AL loop."
        source: PAPER
        locator: "Meier inference; Hie HTML NR"
      - text: "EVOLVEpro: precomputed $E(s)$ → RF → top-k table. Нет sampling LM."
        source: CODE
        locator: "evolve_experimental"
      - text: "PALM-H3: antigen seq → ESM-2 encoder → RoFormer decoder CDR-H3 → **A2binder rank** (evaluator) → SPR/pseudovirus (experiment)."
        source: PAPER
        locator: "PALM Fig. 1 and Fig. 7"
      - text: "tFold: FR+epitope+antigen → ESM-PPI + recovery/structure → ipLDDT filter (evaluator) → phage (experiment) → SPR. Не прятать phage внутрь «одной PLM»."
        source: PAPER
        locator: "tFold Fig. 1 workflow"
      - text: "ESM3: prompt tracks → geometric attn block 1 → transformer → unmask iterate → structure decoder. GFP spectra — experiment, не logit."
        source: PAPER
        locator: "Hayes Fig. 1A iterative sampling; Fig. 4 GFP"
    mermaid: |
      flowchart TD
        TOK["AA tokens ± tags / antigen seq / mask"] --> ENC["Transformer PLM: AR decoder / MLM encoder / ESM3 fused tracks"]
        ENC --> LOG["Token logits p(s_i)"]
        ENC --> EMB["Embeddings E(s) / h_i"]
        LOG --> AR["Generator: ancestral AR / ILM / iterative unmask"]
        LOG --> ZS["Scorer: masked-marginal Δℓ"]
        EMB --> SUR["Surrogate f_φ — few-shot AL; PLM frozen"]
        AR --> RANK["Optional ranker: A2binder / likelihood / ipLDDT — evaluator"]
        ZS --> EXP["Wet-lab: SPR / neutralization / activity / phage"]
        SUR --> EXP
        RANK --> EXP
        AR --> STR["Optional AF2 / ESMFold / tFold-Ag — predictor/evaluator"]
        STR --> EXP
