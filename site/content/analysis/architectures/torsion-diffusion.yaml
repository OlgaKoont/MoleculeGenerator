          - ["[Coordinate diffusion](/architectures/coordinate-diffusion.html)", "ε-MSE / VP-SDE на xyz", "SDE/DDPM в R^{N×3}", "[Chroma](/tools/chroma.html), [Genie](/architectures/coordinate-diffusion.html) литература"]
          - ["[Frame diffusion](/architectures/frame-diffusion.html)", "IGSO(3)+Gaussian translations", "reverse SE(3) frames", "[RFdiffusion](/tools/rfdiffusion.html), [FrameDiff](/tools/framediff.html)"]
          - ["[AR structure generation](/architectures/autoregressive-structure-generation.html)", "next-angle / next-frame NLL", "N→C teacher forcing; greedy angles", "RamaNet, FoldingDiff AR baseline — не tools"]
          - ["[Inverse folding](/architectures/inverse-folding.html)", "sequence CE при фиксированном backbone", "temperature sampling AA", "[ProteinMPNN](/tools/proteinmpnn.html) — evaluator у Wu"]
  - id: data-repr
    title: "4. Представление данных"
    paragraphs:
      - text: "Узлы FoldingDiff — позиции вдоль цепи с 6-вектором углов, не граф kNN атомов. Рёбер/pairs как у IPA **нет**: bidirectional transformer с relative positional embeddings, attention mask по длине. Размерность входа: 6, линейный upsample к $d=384$. [PAPER]"
        source: PAPER
        locator: "Wu Nature Methods Modeling: d=384, relative PE"
      - text: "Time embedding FoldingDiff: random Fourier features (Tancik / Song) **складываются** с каждым token после upsample. Это не implicit mask-count EvoDiff-OADM."
        source: PAPER
        locator: "Wu Nature Methods timestep Fourier"
      - text: "Jing: вход score — **3D point cloud** conformer + граф $G$; выход — $m$ pseudoscalars на rotatable bonds. Локальная структура $L$ (bond lengths/angles/rings) **не** диффундирует; её семплирует RDKit. Conditioner — молекулярный граф, не epitope tensor."
        source: PAPER
        locator: "Jing §3.2 extrinsic-to-intrinsic; §3 intro p(τ∣L)"
      - text: "Внешние файлы vs тензор сети. FoldingDiff: CATH координаты → тригонометрия углов (внутренняя фича); PDB numbering не conditioner. Якорь реконструкции — координаты N–Cα–C первого residue **1CRN**, фиксированные для всех генераций (preprint Appendix A.1). Это внешний PDB, не learnable token."
        source: PAPER
        locator: "arXiv:2209.15611 Appendix A.1 1CRN Teeter 1984"
      - text: "Размерности, которых нет в источниках: hidden width слоёв transformer FoldingDiff кроме $d=384$ — NR; число слоёв/голов — NR в Nature HTML Methods. Jing ширина TFN — NR без Appendix D close-read."
        source: NR
      - text: "Аугментации, меняющие геометрию. FoldingDiff: crop цепей $>128$ в случайное окно 128 на **каждую** эпоху (меняет какие углы видны). Global rotation **не** нужна (углы инвариантны). Jing: conformer matching на train — подмена ground-truth $C$ синтетическим $\\hat C$ с RDKit $L$ и torsions, минимизирующими RMSD (domain adaptation $p(L)$ vs $\\hat p(L)$)."
        source: PAPER
        locator: "Wu Nature CATH crop; Jing §4.1 conformer matching"
      - text: "Нормализация FoldingDiff: element-wise angular mean $\\mu$ вычитается на train; val/test сдвигаются тем же $\\mu$; inference un-shift $w(x_0+\\mu)$. Не StandardScaler Cartesian."
        source: PAPER
        locator: "Wu Nature Methods zero-mean μ"
      - text: "Маски: variable-length attention masking (train и generation). Нет contig map RFdiffusion, нет CDR clamp DiffAb, нет library CSV. Sequence one-hot отсутствует."
        source: PAPER
        locator: "Wu Nature Methods attention masking"
      - text: "Bond distances: три длины $N_i\\!\\to\\!C\\alpha_i$, $C\\alpha_i\\!\\to\\!C_i$, $C_i\\!\\to\\!N_{i+1}$ фиксируются **средними**, не генерируются (Fig. S1). Точные ангстремы средних — NR без SI numeric."
        source: PAPER
        locator: "arXiv Appendix A.1; Fig. S1 qualitative"
  - id: physical-repr
    title: "5. Физическое представление"
    paragraphs:
      - text: "Математический $x_0$ FoldingDiff ↔ относительная ориентация backbone атомов следующего residue: $\\psi$ ($N_i$-$C\\alpha_i$-$C_i$-$N_{i+1}$), $\\omega$ ($C\\alpha_i$-$C_i$-$N_{i+1}$-$C\\alpha_{i+1}$), $\\phi$ ($C_i$-$N_{i+1}$-$C\\alpha_{i+1}$-$C_{i+1}$), $\\theta_{1,2,3}$ — валентные углы Table 1. Не ↔ assay label."
        source: PAPER
        locator: "Wu Nature Table 1"
      - text: "SE(3): state **invariant** к глобальному повороту и трансляции. Equivariant сеть **не** требуется (FoldingDiff). Что ломает инвариантность: подмена входа на Cartesian (Wu ablation). Перестановка residues ломает цепной порядок углов (это полимер, не облако). Chain concat двух доменов без нового якоря — не описан (multi-chain Wu Discussion: не обрабатывается)."
        source: PAPER
        locator: "Wu Nature representation advantages; Discussion no multi-chain"
      - text: "Jing: score **SE(3)-invariant** и **parity-equivariant** (pseudoscalar torque). Поворот молекулы не должен менять $|\\delta\\tau|$; инверсия знака при $C\\mapsto -C$. Это symmetry energy, не доказанная экспериментальная хиральность белка."
        source: PAPER
        locator: "Jing §3.3 Prop. 2"
      - text: "Side chains: в FoldingDiff state **отсутствуют** (нет $\\chi$, нет R-групп). Packing — post-hoc (FASPR упоминается в refs, не часть sampler). Jing: не-белковые rotatable bonds, включая формально double bonds как rotatable (Appendix F.3 pointer)."
        source: PAPER
        locator: "Wu Nature: do not specify side chain; Jing footnote rotatable"
      - text: "Промежуточный $x_t$ / noisy $\\bm{\\tau}_t$ $\\neq$ физическая траектория фолдинга и $\\neq$ потенциал энергии. Wu: процедура «inspired by» twisting, но «does not directly capture any biophysical folding processes»."
        source: PAPER
        locator: "Wu Nature training paragraph"
      - text: "Реконструкция: итеративное добавление атомов (Parsons NeRF) с фиксированными длинами. Первый residue не кодируется $N-1$ углами — seed 1CRN. Кислород пептида для PyMOL вставляется coplanar trans — **визуализация**, не генерация."
        source: PAPER
        locator: "Wu Nature Methods 3D visualization Corey–Pauling; preprint 1CRN"
      - text: "Clashes: самопересечения встречаются; journal — relaxation SI. Это геометрический decode failure, не ΔG."
        source: PAPER
        locator: "Wu Nature Results clashes; SI Fig. S5 pointer"
      - text: "ω planarity: ω в state явно; маргинал близок к wrapped Gaussian с массой у $\\pm\\pi$ (trans peptide). Нет отдельного hard constraint cis/trans. Chirality Cα не параметризована как отдельный дискрет; она следует из комбинации углов + L-химия только после sequence design."
        source: PAPER
        locator: "Wu Nature Fig. 2b ω wrap; Ramachandran chirality"
  - id: physchem
    title: "6. Физико-химический смысл"
    paragraphs:
      - text: "Нет energy head $\\Delta G$ / $K_d$. Jing Boltzmann variant матчит $e^{-E/kT}$ **малых молекул** через likelihood на торе — не белковый affinity assay. Ниже: как признаки кодируются в **этом** классе."
        source: INTERPRETATION
    physchem:
      - feature: "identity AA"
        interpretation: "последовательность / химия боковых цепей"
        encoded: "не представлена в generator FoldingDiff; Jing — атомный граф малой молекулы (не белок)"
        limitation: "sequence ставит inverse folding (evaluator); AA ≠ affinity"
      - feature: "backbone φ/ψ"
        interpretation: "Ramachandran, вторичная структура"
        encoded: "прямо (dihedrals в 6-векторе FoldingDiff)"
        limitation: "локально верные углы ≠ глобальный fold без корректного порядка"
      - feature: "ω peptide planarity"
        interpretation: "почти трансоидная пептидная связь"
        encoded: "прямо как dihedral; маргинал низкодисперсный wrapped Gaussian"
        limitation: "нет жёсткого cis/trans фильтра; non-physical ω — failure mode"
      - feature: "bond angles θ1–θ3 / bond lengths"
        interpretation: "валентная геометрия N–Cα–C"
        encoded: "θ прямо; длины косвенно (константы средних), не генерируются"
        limitation: "lossy reconstruction с длиной цепи (Fig. S2 TM↓)"
      - feature: "side-chain χ / H-bonds / electrostatics / solvation"
        interpretation: "упаковка, Н-связи, заряд, растворитель"
        encoded: "не представлены в FoldingDiff state"
        limitation: "нельзя утверждать, что модель «считает ΔG»"
      - feature: "antigen / hotspot coords"
        interpretation: "эпитопный интерфейс"
        encoded: "не представлена (нет target conditioner в прочитанных papers)"
        limitation: "класс не закрывает target-conditioned binder"
      - feature: "evolutionary statistics"
        interpretation: "CATH 40% seq-id folds; не MSA LM"
        encoded: "косвенно через эмпирический p(angles∣CATH)"
        limitation: "random 80/10/10 split; не DMS labels"
      - feature: "experimental y (Kd, ELISA)"
        interpretation: "измеренная функция"
        encoded: "не представлена"
        limitation: "scTM / AMR / xTB ≠ wet-lab affinity"
  - id: learned
    title: "7. Что обучается"
    paragraphs:
      - text: "Параметры $\\xi$ / $\\theta$: denoiser углов. FoldingDiff — vanilla transformer + regression head (dense → GELU → LayerNorm → 6 outputs), 14.56M. Jing — TFN atomic convolutions + pseudotorque layer. Frozen modules: нет frozen PLM/AF в train target прочитанных методов."
        source: PAPER
        locator: "Wu Nature 14.56M; Jing §3.4 TFN"
      - text: "Loss generic: denoising на торе (wrapped ε или DSM). Подтип A: $L_w$ smooth L1. Подтип B: $J_{\\mathrm{DSM}}$ с весом $\\lambda(t)$. Energy-based Jing: тот же DSM, но samples из importance-weighted Boltzmann — **не** affinity ELISA."
        source: PAPER
        locator: "Wu L_w; Jing Eqs. 4 and §3.6"
      - text: "Negative / non-binder / contrastive / affinity labels в loss: **нет**. Нет classifier non-binder. Нет ΔΔG head."
        source: PAPER
        locator: "оба Methods: unsupervised diffusion / score matching"
      - text: "Fine-tune vs pretrain. FoldingDiff: один проход CATH 10 000 epochs, checkpoint **1488** (val plateau ~1400; дальше diversity падает). Не reported protein fine-tune на binders. Jing: train GEOM-DRUGS splits Ganea et al.; Boltzmann variant — отдельная процедура resampling."
        source: PAPER
        locator: "Wu Nature checkpoint 1488; Jing §4.2 splits"
      - text: "AR baseline Wu (14.41M, absolute PE, length Fourier, AdamW wd=0.01, batch 256, ckpt 1446) учит **другой** объект — next 6-angles. Не включать его параметры в «что обучается» диффузионного класса, кроме как контраст."
        source: PAPER
        locator: "Wu Nature Methods AR baseline"
      - text: "Self-conditioning / teacher forcing: FoldingDiff diffusion — нет teacher forcing (шум независим по $t$). AR baseline — teacher forcing next-angle. Jing training — sample $t$ uniform, perturb kernel; inference geodesic walk."
        source: PAPER
        locator: "Wu t~U(0,T); Jing §3.1"
      - text: "Не обучается: ProteinMPNN, OmegaFold, AF2, Rosetta, RDKit ETKDG, xTB. Это внешние evaluator / cheminformatics."
        source: INTERPRETATION
      - text: "Не обучается FAPE / distogram / lddt как у RF/AF. Wu прямо выбирает angular L1 вместо «лучше мотивированных» Jing torsional losses."
        source: PAPER
        locator: "Wu Nature: not as well-motivated as Jing 56"
      - text: "Выход сети FoldingDiff — шесть непрерывных чисел на позицию, не категориальный AA и не rotation matrix 3×3."
        source: PAPER
        locator: "Wu Nature regression head six values"
  - id: forward
    title: "8. Прямой проход и information flow"
    mermaid: |
      flowchart TD
        SRC["CATH/PDB angles x0 or RDKit L + tau"] --> FWD["Forward wrap-noise / Brownian on torus"]
        FWD --> XT["xt noisy angles — not MD"]
        XT --> GEN["GENERATOR: transformer nn_xi or TFN score"]
        GEN --> REV["Reverse T steps wrap DDPM or geodesic"]
        REV --> X0["clean angles / tau"]
        X0 --> KIN["Kinematics NeRF or torsion update — decode"]
        KIN --> BB["Cartesian backbone / conformer"]
        BB --> IF["EVALUATOR: ProteinMPNN / sequence"]
        IF --> PRED["PREDICTOR: OmegaFold or AF2"]
        PRED --> SCTM["scTM / TM — not Kd"]
        BB --> CHEM["EVALUATOR Jing: xTB after relax"]
        BB -.-> EXP["EXPERIMENT: absent in Wu/Jing protein-Ab campaigns"]
        subgraph generator ["Generator"]
          GEN
