status_note: "Класс — generator углов на торе/гиперторе с последующей кинематической реконструкцией Cartesian, не SE(3) frames и не next-angle AR. Primary: (i) Jing et al. NeurIPS/arXiv 2206.01729 HTML §§2–3, Eqs. 1–4, Tables 1–3 (small-molecule torsional diffusion; слот каталога ошибочно подписал этот DOI/URL как FoldingDiff); (ii) Wu et al. FoldingDiff Nat. Commun. 15:1059 (2024) HTML Methods+Table 1+Algorithm 1, DOI 10.1038/s41467-024-45051-2 (journal); preprint arXiv:2209.15611 HTML Appendix A (NeRF/1CRN, Fig. S1–S3) не сливать молча с journal pagination. CODE microsoft/foldingdiff и gcorso/torsional-diffusion не line-audit (commit NR). Nature SI PDF clashes Fig. S5 / Table S1 numeric cells не построчно. Protein χ-side-chain diffusion papers не читались. Ни один catalog tool не имеет architecture_id torsion-diffusion."
lede: "Torsion diffusion — **generator** angular state на $S^1$/$\\mathbb{T}^{d}$: wrapped Gaussian или Riemannian score matching по торсионам (и, у FoldingDiff, bond angles), затем kinematics/NeRF в Cartesian. Это не Cartesian DDPM, не residue-frame SE(3) diffusion, не next-angle AR (RamaNet / FoldingDiff AR baseline) и не affinity predictor. Одна $Q_t$ / один score **не** описывает Jing (малые молекулы, $\\bm{\\tau}\\mid L$) и FoldingDiff (белковый backbone, шесть углов на residue)."
