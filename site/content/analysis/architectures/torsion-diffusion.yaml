    mermaid_caption: "Оригинальная схема класса по Wu Methods и Jing §3: generator живёт на торе; kinematics — decode; MPNN/AF/xTB — не часть θ. Не копипаст Fig. 1 papers."
    mermaid_source: INTERPRETATION
    paragraphs:
      - text: "Порядок FoldingDiff train: PDB→углы→zero-mean→sample $t$→wrap-noise→transformer$(x_t,t)$→$L_w$. Geometry Cartesian **не** входит в сеть. Sequence не входит."
        source: PAPER
        locator: "Wu Nature Methods training loop"
      - text: "Порядок FoldingDiff inference: $x_T\\sim w(\\mathcal{N}(0,I))$ → $T$ шагов Algorithm 1 → un-shift $\\mu$ → NeRF от 1CRN seed → backbone N–Cα–C. Затем **отдельный** ProteinMPNN (8 seq, $T=0.1$ Cα mode) и OmegaFold — evaluator."
        source: PAPER
        locator: "Wu Nature Algorithm 1; designability pipeline"
      - text: "Порядок Jing: RDKit $L$ → uniform randomize τ → score на 3D cloud → wrap geodesic update τ → repeat NFE. Не прятать RDKit внутрь «одной сети»."
        source: PAPER
        locator: "Jing §3.2 inference; Appendix C pointer"
      - text: "Где появляется sequence: только post-hoc IF (FoldingDiff) или атомный граф уже дан (Jing molecule). Где geometry: decode после углов (FoldingDiff) или всё время в 3D при torsion updates (Jing). Где score: Jing выход — torsional score; FoldingDiff — ε на углах, не docking score."
        source: INTERPRETATION
      - text: "Relax / clash filter: опциональный evaluator (Wu SI). Не шаг generator'а по умолчанию в Algorithm 1."
        source: PAPER
        locator: "Wu Nature Results: 22.7% without post-processing"
      - text: "Не прятать RFdiffusion / AF recycle внутрь torsion denoiser: их нет в forward pass прочитанных методов."
        source: INTERPRETATION
      - text: "Oxygen insertion для cartoon — post-hoc visualization, не atomistic all-atom generator."
        source: PAPER
        locator: "Wu Nature Methods PyMOL oxygen trans"
      - text: "Experiment box на схеме пуст для белка: Wu/Jing не сообщают prospective wet-lab кампании антител/binders. Не заполнять ELISA."
        source: PAPER
        locator: "Wu in silico only; Jing computational GEOM"
  - id: training
    title: "9. Training procedure"
    paragraphs:
      - text: "Корпус FoldingDiff: CATH v4.3.0 non-redundant, ≤40% sequence identity over 60% overlap (Sillitoe). Исключают цепи $<40$ residues. $>128$ — random crop 128. Итого 30 395 доменов: 24 316 / 3 039 / 3 040 = 80/10/10 **random** split."
        source: PAPER
        locator: "Wu Nature Methods dataset; Data availability CATH 4.3.0"
      - text: "Split leakage: авторы пишут, что test accuracy/reconstruction **не** primary metric, поэтому overlap train/test «не раздувает» заявленные результаты. При этом маргиналы углов и Ramachandran сравниваются с test, а novelty — max TM к **train**. Random split CATH ≠ holdout по superfamily; leakage структурно близких доменов — риск, не измеренный в paper (NR количественно)."
        source: PAPER
        locator: "Wu Nature Methods split caveat"
      - text: "Batching / time-sampling FoldingDiff: $t$ uniform; variable-length mask. Batch size **NR** для основного DDPM (для AR baseline — 256). Optimizer AdamW, LR linear 0→$5\\times 10^{-5}$ за 1000 epochs, затем к 0 за 9000. 10 000 epochs. GPU type / wall-clock train — NR."
        source: PAPER
        locator: "Wu Nature Methods optimizer; AR batch 256 only"
      - text: "Jing: GEOM-DRUGS 304k drug-like, mean 44 atoms, mean $m\\approx 7.9$ torsions; splits как Ganea et al. 2021. Conformer matching только на train. GEOM-XL (>100 atoms) — extrapolation test. Не белковый CATH."
        source: PAPER
        locator: "Jing §4.2; intro m=7.9"
      - text: "Симуляция vs wet-lab. FoldingDiff designability: ProteinMPNN + OmegaFold/AF2 **in silico**. P-SEA, UMAP Gauss integrals — computational. Jing: CREST metadynamics как **ground-truth ensembles** GEOM (дорогое in silico), не wet-lab $K_d$. Prospective expression / SPR — нет в прочитанных текстах."
        source: PAPER
        locator: "Wu Fig. 4a workflow; Jing GEOM CREST"
      - text: "Self-conditioning: не описан у FoldingDiff. Classifier-free guidance: нет. Data augmentation rotation: не нужна для углов."
        source: NR
        locator: "отсутствие в Methods"
      - text: "Фильтры resolution PDB: в Nature Methods не указаны Å cutoffs сверх CATH domain set — NR, не выводить из README GitHub."
        source: NR
      - text: "Jing vs GeoDiff NFE — training/inference эффективность **на GEOM-DRUGS**, не «дешевле RFdiffusion»."
        source: PAPER
        locator: "Jing Table 2"
      - text: "Checkpoint selection FoldingDiff: val loss plateau ~1400; 1488 выбран из‑за diversity, не минимальный train loss. Переобучение по длительности **портит** разнообразие — documented failure of long training, не early-stop по scTM."
        source: PAPER
        locator: "Wu Nature Methods ~1400 / 1488"
  - id: inference
    title: "10. Inference and generation"
    paragraphs:
      - text: "Старт FoldingDiff: wrapped isotropic Gaussian $x_T\\sim w(\\mathcal{N}(0,I))$, не маска AA и не PDB contig. Длина задаётся attention mask / цикл по $l\\in[50,128)$ в экспериментах (10 цепей на каждую длину → 780). [PAPER]"
        source: PAPER
        locator: "Wu Nature Algorithm 1 step 1; sampling 10×[50,128)"
      - text: "Алгоритм: $T=1000$ ancestral шагов с wrap; $\\sigma_t=\\sqrt{(1-\\bar\\alpha_{t-1})/(1-\\bar\\alpha_t)\\cdot\\beta_t}$; $z=0$ на последнем шаге. Temperature softmax / top-k / nucleus — **нет** (непрерывные углы). Beam search — нет."
        source: PAPER
        locator: "Wu Nature Algorithm 1; σ_t formula"
      - text: "Старт Jing: uniform на $\\mathbb{T}^{m}$ при данном $L$ от RDKit. Geodesic random walk; на торе $\\exp_\\tau(\\delta)=\\tau+\\delta \\bmod 2\\pi$. Default quality: 20 steps; даже 5 steps бьют GeoDiff AMR-R в Table 2 (small molecules)."
        source: PAPER
        locator: "Jing §3.1 inference; Table 2"
      - text: "Post-hoc FoldingDiff: NeRF decode; optional relaxation (SI); ProteinMPNN 8 sequences; OmegaFold default `release1`; AF2 без MSA, 15 recycles, model1 only — всё **evaluator/predictor**. scTM $=\\max_i \\mathrm{TMalign}(s,\\hat s_i)$, порог 0.5 как fold."
        source: PAPER
        locator: "Wu Nature designability Methods"
      - text: "Чего в классе нет: assay round, recycle внутри denoiser, epitope clamp, classifier-free guidance (не найден), autoregressive order по residues в **диффузионном** sampler (порядок есть только у AR baseline)."
        source: INTERPRETATION
      - text: "FoldingDiff не генерирует комплексы и лиганды (Discussion). Не использовать как drop-in вместо [RFdiffusion](/tools/rfdiffusion.html) на hotspot binder."
        source: PAPER
        locator: "Wu Nature Discussion: no multi-chain or ligand"
      - text: "AR baseline inference (не этот класс sampler): seed 4 native 6-angle sets + фиксированная $l$ + greedy next-6. Temperature на углах не описана; добавление шума не снимает helix collapse."
        source: PAPER
        locator: "Wu Nature Methods AR generation"
      - text: "Не утверждать wall-clock FoldingDiff: Nature HTML не даёт GPU-hours sampling. Jing Table 2: 4.90 core-sec/conformer при 20 steps на CPU vs GeoDiff 305 — только small-molecule, не переносить на белки."
        source: PAPER
        locator: "Jing Table 2 runtime; FoldingDiff GPU NR"
  - id: conditioning
    title: "11. Conditioning"
    paragraphs:
      - text: "FoldingDiff в paper — **unconditional** backbone generator заданной длины (mask). Нет hotspot, antigen coords, ELISA labels, CATH class token, species, contig. Seed «fixed SS / motif torsions» — возможный рычаг **класса**, не продемонстрированный Methods Wu."
        source: PAPER
        locator: "Wu Nature: unconditionally generated"
      - text: "Length: задаёт число позиций transformer. AR baseline дополнительно Fourier-эмбеддит $l$ в каждый token — это **другая** модель. Для DDPM length = длина $x$."
        source: PAPER
        locator: "Wu AR Methods length Fourier; DDPM mask"
      - text: "Jing conditioner: молекулярный граф $G$ и local structure $L$. Это не epitope. Conformer generation $p_G(\\tau\\mid L)$, не protein motif scaffolding."
        source: PAPER
        locator: "Jing §3 intro"
      - text: "Classifier-free guidance: в прочитанных Methods **не** описан. Не приписывать."
        source: NR
      - text: "Motif clamp координат (как RFdiffusion contig) **нет**: углы не зажимаются по PDB fragment в Algorithm 1. Discussion предлагает future sequence-guided / PPI-biased sampling — не реализованный conditioner paper."
        source: PAPER
        locator: "Wu Nature Discussion future work"
      - text: "Не приписывать epitope tensor / measured_var / library $\\mathcal{X}$. Нет antibody FR/CDR numbering в FoldingDiff CATH domains."
        source: INTERPRETATION
      - text: "Partial noising reconstruction (Appendix: $t=750$ noise then denoise test) — диагностический protocol, не user-facing inpainting API в paper."
        source: PAPER
        locator: "arXiv Appendix A.2 t=750 reconstruction"
      - text: "Shuffling-angles baseline сохраняет маргиналы и Ramachandran, но ломает порядок — показывает, что conditioner «просто правильные углы» недостаточен без sequential arrangement. Это анализ, не inference mode продукта."
        source: PAPER
        locator: "Wu Nature shuffling baseline"
  - id: complexity
    title: "12. Вычислительная сложность"
    paragraphs:
      - text: "Драйверы FoldingDiff: $N$ residues (до 128 в train/gen experiments), $6(N-1)$ углов, $T=1000$ NFE, transformer attention $O(N^2)$ на длину цепи, число samples (780 в бенчмарке). Reconstruction NeRF линейна по атомам backbone."
        source: PAPER
        locator: "Wu Nature T=1000; N≤128"
      - text: "Драйверы Jing: $m$ torsions, NFE 5–20 (не 1000), TFN на $n$ атомах (~44 GEOM-DRUGS), не pair $O(N^2)$ белка 400 aa. Сравнение «на два порядка меньше шагов, чем GeoDiff 5000» — **Jing Table 2**, только small molecules."
        source: PAPER
        locator: "Jing Table 2; §4.3"
      - text: "Не писать «дешевле protein coordinate diffusion» без NFE-сравнения на том же белке. Wu vs ProtDiff — по **доле scTM**, не по wall-clock. GPU hours FoldingDiff — NR."
        source: INTERPRETATION
      - text: "Post-hoc cost: 8× ProteinMPNN + 8× OmegaFold (или AF2 15 recycles model1) на каждый backbone — часто доминирует над 1000 угловых шагов. Это evaluator complexity, не generator."
        source: PAPER
        locator: "Wu Nature 8 sequences; AF2 15 recycles"
      - text: "Assay latency: не применимо (нет wet-lab loop). #rounds active learning: нет."
        source: INTERPRETATION
      - text: "Crop 128 ограничивает применимость к typical natural lengths «several hundred residues» (Discussion) — сложность **обобщения**, не FLOPs."
        source: PAPER
        locator: "Wu Nature Discussion length"
  - id: strengths
    title: "13. Преимущества"
    paragraphs:
      - text: "Из постановки: углы автоматически SE(3)-инвариантны → достаточно transformer без equivariant stack (FoldingDiff). Это механизм, не маркетинг."
        source: PAPER
        locator: "Wu Nature representation advantages"
      - text: "Chirality: Ramachandran воспроизводит RH vs LH helix frequencies; авторы связывают это с отсутствием reflection-equivariance, ломающей хиральность у части Cartesian EGNN. [PAPER] Не гарантия правильной стереохимии после packing."
        source: PAPER
        locator: "Wu Nature Fig. 2c"
      - text: "Bond lengths по построению фиксированы → локальная химия длин связей не взрывается так, как у unconstrained Cartesian (интерпретация механизма; количественный clash rate — SI NR)."
        source: INTERPRETATION
      - text: "FoldingDiff in silico: 177/780 = 22.7% scTM≥0.5 без relax; vs ProtDiff 92/780 ($p=1.8\\times 10^{-8}$, χ²); short ≤70 aa 76/210 vs 36/210; long 87/570 vs 56/570. Oracle = ProteinMPNN+OmegaFold, split = CATH-like lengths 50–128 — **не** сравнивать с RFdiffusion wet-lab. [PAPER]"
        source: PAPER
        locator: "Wu Nature designability paragraph"
      - text: "AF2 без MSA: 163/780 = 20.9% — согласованность oracle, не независимый wet-lab. [PAPER]"
        source: PAPER
        locator: "Wu Nature AlphaFold2 substitution"
      - text: "Jing GEOM-DRUGS Table 1: Coverage recall mean 72.7% vs OMEGA 53.4% при $\\delta=0.75$ Å; AMR-R mean 0.582 vs 0.841. Это **conformer ensembles малых молекул**, не белковый designability. [PAPER]"
        source: PAPER
        locator: "Jing Table 1"
      - text: "Явно: ни 22.7% scTM, ни Jing Coverage **не** гарантируют стабильность экспрессии, affinity или developability. Natives сами дают только 87% scTM — метрика не насыщает физику."
        source: PAPER
        locator: "Wu Nature natives 87% scTM"
      - text: "Меньше степеней свободы, чем all-atom xyz, следует из $d\\ll 3n$ (Jing $m\\approx 7.9$ vs $3n$; FoldingDiff 6 углов vs 9 internals). Это сжатие state, не доказанный выигрыш на antibody CDR."
        source: PAPER
        locator: "Jing intro dimensionality; Wu Fig. S1 6 vs 9"
  - id: limits
    title: "14. Ограничения"
    paragraphs:
      - text: "Математика: wrapped L1 FoldingDiff «not as well-motivated» как Jing DSM; возможна несогласованность $\\beta$ vs $\\beta^2$ в HTML kernel. Рычаг: ошибка раннего угла меняет весь C-terminus (lever arm). [PAPER]"
        source: PAPER
        locator: "Wu Nature Methods + Discussion lever arm"
      - text: "Представление: нет side chains, нет комплексов, нет лиганда; crop 128; seed 1CRN якорит абсолютную позу decode. Multi-chain NR. [PAPER]"
        source: PAPER
        locator: "Wu Nature Discussion"
      - text: "Физика/химия: нет H-bonds/electrostatics/solvation в state; clashes; ω не hard-constrained; $x_t$ ≠ folding path. Jing $E$ — xTB after relax на малых молекулах, не белковый ΔG."
        source: INTERPRETATION
      - text: "Данные/bias: CATH 40% identity, random split, длины 40–128. Designable samples коррелируют с TM к train (Spearman ρ=0.78) — близость к обучающей геометрии, не «магия novelty». [PAPER]"
        source: PAPER
        locator: "Wu Nature Fig. 4c ρ=0.78"
      - text: "Обобщение: β-sheets редки среди designable (16/177 vs 533/603 non-designable содержат sheets, $p=4.6\\times 10^{-91}$). Длина vs scTM Spearman ρ=−0.38. β-barrels / long proteins — Discussion как open. [PAPER]"
        source: PAPER
        locator: "Wu Nature β-sheet paragraph; ρ=-0.38"
      - text: "Deployment: нет catalog tool, нет antibody pipeline, нет CLI-аудита. ProteinSGM 50.5% designability **несравним** (Rosetta fold из constraints). [PAPER]"
        source: PAPER
        locator: "Wu Nature ProteinSGM not directly comparable"
  - id: failures
    title: "15. Failure modes"
    paragraphs:
      - text: "Конкретные режимы, не «может не сработать»."
        source: INTERPRETATION
    items:
      - "Неверный класс: ждать hotspot binder от FoldingDiff (нет target conditioner) — использовать frame diffusion / BindCraft."
      - "Смешать Jing 20 NFE с белковым T=1000 как «всегда дешёвый diffusion»."
      - "Принять AR baseline / RamaNet за этот класс: helix mode collapse (89% scTM, нулевое diversity SS)."
      - "Подмена метрики: scTM / OmegaFold pLDDT / Jing AMR → affinity."
      - "Truncation sampler: остановить FoldingDiff на малом t без paper protocol (не CFG; Algorithm 1 = полный T)."
      - "Lever-arm: локально правдоподобный ψ у N-конца, большой RMSD у C-конца."
      - "Self-clash / chain crossing; «лечится» relax — может увести от generated angles."
      - "Non-physical ω / cis peptide, если wrap sampler не удержал маргинал."
      - "Chirality failure у Cartesian-equivariant соседей (ProtDiff-style) — не лечится, если пользователь подменил state на xyz."
      - "Library misspecification Jing: плохой RDKit $L$ → distribution shift; без conformer matching train/test $L$ расходятся."
      - "CATH length shift: генерация ≫128 без гарантии paper (reconstruction TM падает с длиной даже у lossless-ish repr)."
      - "Over-training FoldingDiff past ~1400 epochs: val не лучше, diversity хуже."
      - "Считать 22.7% свойством класса на антителах: train — CATH domains, не SAbDab."
      - "Вставить DiffAb CDR categorical channel как torsion DDPM."
  - id: tools
    title: "16. Реализации в инструментах"
    paragraphs:
      - text: "Reverse index `architecture_id: torsion-diffusion` **пуст**. Ниже — foundational literature, явно не карточки `/tools`. Не ставить scTM FoldingDiff и wet-lab RFdiffusion в одну колонку успеха."
        source: MATRIX
    tables:
      - title: "Catalog tools с этим architecture_id"
        headers: ["Tool", "Generic architecture", "Tool-specific implementation", "Important difference"]
        rows:
          - ["— (пусто)", "torsion diffusion", "**NR**: нет catalog tool", "Architecture Guide: catalog_tools []"]
      - title: "Литература вне каталога tools"
        headers: ["Method", "Generic architecture", "Implementation (PAPER)", "Important difference"]
        rows:
          - ["FoldingDiff (Wu et al.; не карточка tools)", "wrapped DDPM on torus + NeRF", "6 углов Table 1; T=1000 cosine; transformer 14.56M; CATH 40–128; Algorithm 1; CODE microsoft/foldingdiff commit **NR**", "Белковый backbone; не Jing DSM; не IF внутри θ"]
          - ["Torsional diffusion (Jing et al.; не карточка tools)", "Riemannian DSM on T^m", "τ∣L; RDKit L; TFN+pseudotorque; GEOM-DRUGS; 20 NFE; CODE gcorso/torsional-diffusion commit **NR**", "Малые молекулы; не protein φ/ψ chain; score на xyz cloud"]
          - ["FoldingDiff AR baseline (не карточка tools)", "не этот класс (AR structure)", "next-6-angles, 14.41M, seed 4 residues", "helix collapse; страница [AR structure](/architectures/autoregressive-structure-generation.html)"]
          - ["RamaNet ( Sabban; не карточка tools)", "не этот класс", "LSTM φ,ψ helices — pointer Wu related work, full text **NR**", "AR/GAN, не DDPM"]
  - id: applicability
    title: "17. Где применимо и где не применимо"
    paragraphs:
      - text: "Применимо как **литературный** backbone generator для [de novo backbone](/tasks/de-novo-backbone-generation.html) в постановке «углы → kinematics → IF → fold predictor». Catalog workflow [backbone then MPNN](/workflows/de-novo-backbone-then-mpnn.html) канонически указывает RFdiffusion/FrameDiff — не подменять без явной смены generator."
        source: MATRIX
      - text: "Запрет: [target-conditioned binder](/tasks/target-conditioned-binder-generation.html), de novo antibody с epitope, humanization, CDR sequence infill. Вместо этого — [frame diffusion](/architectures/frame-diffusion.html) / [RFantibody](/tools/rfantibody.html), [joint diffusion](/architectures/joint-sequence-structure-diffusion.html) / [DiffAb](/tools/diffab.html), [sequence diffusion](/architectures/sequence-diffusion.html) для FR."
        source: MATRIX
        locator: "seed not_for_task_ids"
      - text: "Запрет: выдавать Jing conformer generator за белковый design tool каталога. Запрет: решать inverse folding торсионной диффузией (нет sequence head)."
        source: INTERPRETATION
      - text: "Условная применимость будущих motif-torsion clamps — Discussion Wu, не валидированный API. Не обещать scaffolding как у RFdiffusion."
        source: PAPER
        locator: "Wu Nature Discussion future PPI/sequence guidance"
  - id: method-sources
    title: "18. Методологические источники"
    paragraphs:
      - text: "Foundational torus: Jing et al. arXiv:2206.01729 (прочитан HTML Methods/Eqs; слот каталога ошибочно лейблил URL как FoldingDiff). Foundational protein: Wu et al. Nat. Commun. 10.1038/s41467-024-45051-2 (journal HTML Methods+Table 1+Alg. 1 прочитаны); preprint 2209.15611 Appendix A (прочитан HTML). Ho DDPM — pointer. Parsons NeRF 2005 — pointer, не close-read."
        source: PAPER
      - text: "Catalog papers: `paper_ids: []` у seed. Нет `/papers/foldingdiff.html`. CODE repos — pointer-only, commits NR."
        source: MATRIX
      - text: "Не библиография «всего по теме»: Anand–Achim, ProteinSGM, GeoDiff, GeoMol, RamaNet — только границы класса. Side-chain χ diffusion — inaccessible."
        source: INTERPRETATION
