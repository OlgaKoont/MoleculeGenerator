sections:
  - id: domain
    title: "1. Область определения"
    paragraphs:
      - text: "Роль в пайплайне — **generator** (density model на компактном многообразии углов). Сеть обращает wrapped noising / Riemannian Brownian motion по торсионам и выдаёт clean angular state; Cartesian появляется **после** kinematics. Это не sequential assay loop, не geometric SE(3) inductive bias как определение класса (эквивариантный GNN у Jing — модуль score, не state), не scorer аффинности."
        source: INTERPRETATION
      - text: "Generated state — вектор углов на торе: у FoldingDiff $x\\in[-\\pi,\\pi)^{(N-1)\\times 6}$ (три dihedral + три bond angle на шаг цепи); у Jing — $\\bm{\\tau}\\in\\mathbb{T}^{m}$ только по свободно вращаемым связям при **зафиксированной** local structure $L$ (длины, валентные углы, циклы). Intermediate $x_t$ — noisy angles, не атомы и не frames. Sequence tokens в reverse chain **не** входят."
        source: PAPER
        locator: "Wu Nature Table 1 / Results representation; Jing §3 p_G(τ∣L)"
      - text: "Задача каталога, к которой seed относит класс: [de novo backbone generation](/tasks/de-novo-backbone-generation.html). Catalog workflow [de novo backbone → MPNN](/workflows/de-novo-backbone-then-mpnn.html) на практике ставит [frame diffusion](/architectures/frame-diffusion.html) / [RFdiffusion](/tools/rfdiffusion.html), не этот id. Seed явно исключает [target-conditioned binder generation](/tasks/target-conditioned-binder-generation.html): нет hotspot/target tensor в прочитанных методах."
        source: MATRIX
        locator: "architectures/torsion-diffusion.yaml applicable_task_ids / not_for_task_ids"
      - text: "Это **не** [frame diffusion](/architectures/frame-diffusion.html): там state $(R_i,t_i)\\in\\mathrm{SE}(3)$, ядро IGSO(3)/Brownian на вращениях. Внутренние углы FoldingDiff **инвариантны** к глобальному SE(3), поэтому vanilla transformer достаточен; не копировать FrameDiff score сюда."
        source: PAPER
        locator: "Wu Nature: independent reference frame; no equivariant net"
      - text: "Это **не** [coordinate diffusion](/architectures/coordinate-diffusion.html): Cartesian DDPM/SDE шумит $x\\in\\mathbb{R}^{N\\times 3}$. Wu ablation: тот же transformer на Cα xyz **не** учит складку (Fig. S6 journal / Fig. S4 preprint). Jing сравнивает torus vs Euclidean GeoDiff **на малых молекулах**, не на белках."
        source: PAPER
        locator: "Wu Nature Fig. S6; Jing Table 2 GeoDiff 5000 steps"
      - text: "Это **не** [autoregressive structure generation](/architectures/autoregressive-structure-generation.html): next-angle product $p(T_i\\mid T_{<i})$. RamaNet и FoldingDiff **AR baseline** (causal transformer, seed 4 native angle-sets) коллапсируют в одиночные α-спирали — соседний класс, не train target диффузии."
        source: PAPER
        locator: "Wu Nature Fig. 3c / Methods AR baseline; related work Sabban RamaNet"
      - text: "Это **не** [inverse folding](/architectures/inverse-folding.html): ProteinMPNN/ESM-IF1 в FoldingDiff — **evaluator** designability (последовательность по уже сгенерированному backbone). Это **не** [joint sequence–structure diffusion](/architectures/joint-sequence-structure-diffusion.html): DiffAb type+Cα+SO(3) — другой state. Не переносить categorical CDR $Q$."
        source: INTERPRETATION
      - text: "Catalog tools с `architecture_id: torsion-diffusion`: **нет** (reverse index пуст). Не приписывать FoldingDiff / Jing ни [RFdiffusion](/tools/rfdiffusion.html), ни [DiffAb](/tools/diffab.html), ни [Chroma](/tools/chroma.html), ни [FrameDiff](/tools/framediff.html). Часто путают с ProteinSGM (pairwise matrices → Rosetta fold — constraint generator, не прямой torsion DDPM) и с Anand–Achim sequential side-chain angles (другая факторизация, не close-read)."
        source: MATRIX
  - id: intuition
    title: "2. Интуитивный принцип"
    paragraphs:
      - text: "Белок или молекула параметризуется внутренними вращениями. Forward process разрушает углы wrapped-шумом, пока $x_T$ неотличим от wrapped Gaussian / uniform на торе. Reverse предсказывает шум или Riemannian score и шагает по углу. При inference **меняется angular state**; Cartesian и sequence появляются отдельно (NeRF; RDKit $L$; MPNN)."
        source: INTERPRETATION
      - text: "Главный эмпирический рычаг **представления**: перенести SE(3) invariance в координаты (углы не меняются при глобальном повороте/сдвиге), чтобы не строить equivariant denoiser. Wu: подмена углов на Cartesian при том же transformer ломает генерацию. [PAPER]"
        source: PAPER
        locator: "Wu Nature Results: brittle Cartesian substitution; Fig. S6"
      - text: "Рычаг **Jing**: не диффундировать все $3n$ координат, а только $m$ rotatable torsions; $L$ даёт RDKit ETKDG. На GEOM-DRUGS это 20 шагов vs GeoDiff 5000 — сравнение **small-molecule**, не белковый NFE. [PAPER]"
        source: PAPER
        locator: "Jing §1; Table 2 steps 5/10/20 vs GeoDiff 5000"
      - text: "Рычаг **FoldingDiff**: шесть углов на шаг цепи (не только $\\phi,\\psi$). Appendix: фиксировать bond distances средними ещё даёт fold-level reconstruction; оставить только три dihedrals — около половины белков не восстанавливается (Fig. S1). [PAPER preprint SI]"
        source: PAPER
        locator: "arXiv:2209.15611 Appendix A.1 Fig. S1"
      - text: "Имя FoldingDiff — метафора: авторы **прямо** пишут, что noising/denoising **не** моделирует биофизический фолдинг. $x_t$ — артефакт диффузии на торе, не MD-траектория и не энергия."
        source: PAPER
        locator: "Wu Nature Introduction / Designing and training: does not model biophysical folding"
      - text: "Предостережение по метрикам. scTM, TM к train, P-SEA counts, Gauss-integral UMAP, OmegaFold/AF2 confidence, Jing AMR/Coverage и xTB $E,\\mu,\\Delta\\varepsilon$ после relaxation — **evaluator / in silico chemistry**, не experimental $K_d$ / ELISA / BLI. Wu: 87% **нативных** test структур имеют scTM $\\ge 0.5$ — пайплайн хрупок даже на natives."
        source: PAPER
        locator: "Wu Nature designability; Fig. S17 natives 87%"
      - text: "AR baseline FoldingDiff: 89% scTM $\\ge 0.5$ при полном коллапсе в одну α-спираль. Высокий scTM **не** означает полезный generator. Не ставить 22.7% FoldingDiff, hit rate RFdiffusion wet-lab и Jing Coverage в одну колонку «успех»."
        source: PAPER
        locator: "Wu Nature AR 89% / Fig. 3c; 177/780=22.7%"
      - text: "Chirality: FoldingDiff воспроизводит, что правые спирали чаще левых на Ramachandran. Авторы противопоставляют это E(3)-сетям, симметричным к отражению (цитируя Trippe ProtDiff). Это свойство **углового** state, не гарантия L-аминокислот в sequence (sequence нет в generator)."
        source: PAPER
        locator: "Wu Nature Fig. 2c Ramachandran; chirality paragraph"
  - id: math
    title: "3. Формальная математическая постановка"
    paragraphs:
      - text: "Сначала родовой wrapped DDPM на торе. Затем подтипы: (A) FoldingDiff — дискретный Ho на $(N-1)\\times 6$ белковых внутренних углов + wrap $w$ + smooth L1; (B) Jing — непрерывный score matching на $\\mathbb{T}^{m}$ rotatable bonds при фиксированном $L$. Не писать одну «универсальную» $Q_t$. Не подставлять seed one-liner как уравнение инструмента каталога: инструментов нет."
        source: INTERPRETATION
      - text: "Формулы, которые **не** являются уравнениями этого класса и **не** default train target: IGSO(3) FrameDiff; isotropic Cartesian VP-SDE Chroma/Genie; Lipman CFM; UCB; AR NLL / next-angle $L_w$ RamaNet; FAPE predictor; MLM $\\Delta\\ell$; DiffAb categorical type KL; ESM pMMS. AR baseline Wu использует тот же $L_w$, но **другой** sampler (causal next-6-angles) — уравнение соседнего класса."
        source: INTERPRETATION
      - text: "HTML FoldingDiff записывает wrapped kernel с знаменателем $2\\beta_t^2$ при ковариации $\\beta_t I$. Стандартный $\\mathcal{N}(\\mu,\\beta I)$ имеет $2\\beta$ в экспоненте. Цитируем **первую** строку (wrapped $\\mathcal{N}$ с cov $\\beta_t I$) как определение; согласование суммы по $k$ — unresolved typesetting, не «исправляем» формулу."
        source: PAPER
        locator: "Wu Nature/arXiv Methods wrapped N; cf. Jing Eq. 3 uses 2σ²(t)"
      - text: "Jing energy-based Boltzmann (Alg. 1, importance weights на $e^{-E/kT}$) — вариант **того же** torus score, не третья «универсальная» формула белка. Не переносить xTB ensemble properties Jing на FoldingDiff backbones."
        source: PAPER
        locator: "Jing §3.6 Algorithm 1; Table 3 ensemble properties"
    equations:
      - latex: "x\\in\\mathbb{T}^{d},\\quad q(x_t\\mid x_{t-1})=\\mathcal{N}_{\\mathrm{wrapped}}\\bigl(x_t;\\sqrt{1-\\beta_t}\\,x_{t-1},\\,\\beta_t I\\bigr)"
        caption: "Родовой wrapped VP-шаг на торе (Ho mean/variance + periodicity). Train target — denoising на углах. Семплируется reverse с wrap в $[-\\pi,\\pi)$ или geodesic walk. Generic: не checkpoint FoldingDiff, не GEOM-DRUGS Jing."
        generic_or_specific: generic
        source: PAPER
        locator: "Wu Methods q wrapped; Jing Eq. 3 as continuous analogue"
        symbols:
          - {sym: x, type: "T^d", meaning: "angular state (интерпретация d — subtype)"}
          - {sym: x_t, type: "T^d", meaning: "зашумлённые углы на шаге t"}
          - {sym: "\\beta_t", type: "scalar in (0,1)", meaning: "variance schedule шага"}
          - {sym: d, type: "int", meaning: "размерность тора; FoldingDiff (N−1)×6, Jing m rotatable"}
        meaning: "Оптимизируется score/шум на торе. Семплируется траектория углов. Sequence, SE(3) frames, affinity labels в формулу не входят."
      - latex: "X=\\mathrm{kin}(x;\\,\\ell_{\\mathrm{bond}},\\,X_{\\mathrm{seed}})"
        caption: "Родовая реконструкция Cartesian из углов (NeRF/Parsons или relative torsion update). $\\mathrm{kin}$ — не нейросеть generator'а. Generic kinematics; конкретный seed 1CRN / RDKit $L$ — subtype."
        generic_or_specific: generic
        source: PAPER
        locator: "Wu Parsons 2005; Jing Prop. 1 torsion update on point cloud"
        symbols:
          - {sym: X, type: "R^{n×3}/SE(3)", meaning: "Cartesian после реконструкции"}
          - {sym: "\\ell_{bond}", type: "lengths", meaning: "фиксированные длины связей (средние или RDKit)"}
          - {sym: "X_{seed}", type: "coords", meaning: "якорь: 1CRN N-terminus или текущий conformer Jing"}
        meaning: "Не оптимизируется как loss по умолчанию; это decode. Ошибка угла → рычаг в координатах."
    sections:
      - id: math-foldingdiff
        level: 3
        title: "Подтип A — wrapped DDPM белкового backbone (FoldingDiff; не catalog tool)"
        paragraphs:
          - text: "State $x\\in[-\\pi,\\pi)^{(N-1)\\times 6}$. Cosine schedule Nichol, $T=1000$, $s=8\\times 10^{-3}$, clip $\\beta$ к 0.999. Сеть $\\mathrm{nn}_\\xi$ предсказывает $\\varepsilon$, не mean. Wrap $w(x)=((x+\\pi)\\bmod 2\\pi)-\\pi$. Loss — wrapped smooth L1, $\\beta_L=0.1\\pi$; авторы: слабее мотивирован, чем torsional losses Jing, но empirically достаточен. $t\\sim U(0,T)$. Углы zero-mean shift $\\mu$ по train. Literature-specific, не уравнение RFdiffusion."
            source: PAPER
            locator: "Wu Nature Methods; Algorithm 1; λ not used (Ho simplified)"
        equations:
          - latex: "d_w=w\\bigl(\\varepsilon-\\mathrm{nn}_\\xi(w(\\sqrt{\\bar\\alpha_t}x_0+\\sqrt{1-\\bar\\alpha_t}\\varepsilon),t)\\bigr),\\quad L_w=\\begin{cases}0.5 d_w^2/\\beta_L & |d_w|<\\beta_L\\\\ |d_w|-0.5\\beta_L & \\mathrm{otherwise}\\end{cases}"
            caption: "FoldingDiff train target: wrapped smooth L1 на предсказании шума. Не Jing DSM. Не FAPE. Не catalog-tool equation."
            generic_or_specific: "FoldingDiff [PAPER]; literature-specific"
            source: PAPER
            locator: "Wu Nature Methods L_w; β_L=0.1π"
            symbols:
              - {sym: "\\varepsilon", type: "same as x", meaning: "wrapped-normal шум"}
              - {sym: "\\mathrm{nn}_\\xi", type: "transformer", meaning: "denoiser 14.56M, d=384"}
              - {sym: "\\bar\\alpha_t", type: "scalar", meaning: "кумулятивный cosine schedule"}
              - {sym: "\\beta_L", type: "scalar", meaning: "порог smooth L1 = 0.1π"}
              - {sym: w, type: "map to [-π,π)", meaning: "period wrap"}
            meaning: "Обучается шумовой residual на шести углах. Семплируется Algorithm 1, затем NeRF."
      - id: math-jing
        level: 3
        title: "Подтип B — Riemannian score matching на $\\mathbb{T}^{m}$ (Jing torsional diffusion; малые молекулы)"
        paragraphs:
          - text: "Forward: $f=0$, $g=\\sqrt{d\\sigma^2/dt}$, $\\sigma(t)=\\sigma_{\\min}^{1-t}\\sigma_{\\max}^{t}$, $\\sigma_{\\min}=0.01\\pi$, $\\sigma_{\\max}=\\pi$, $t\\in(0,1)$. Prior $p_T$ — **uniform** на компактном $M$, не Gaussian в $\\mathbb{R}^{3n}$. Kernel — wrapped normal на $\\mathbb{R}^m/2\\pi\\mathbb{Z}^m$. Score модель — SE(3)-invariant / parity-equivariant pseudoscalars на **экстраinsic** point cloud. Не FoldingDiff transformer-on-angles."
            source: PAPER
            locator: "Jing §3.1; σ_min/max; §3.3 Prop. 2 parity"
        equations:
          - latex: "p_{t\\mid 0}(\\bm{\\tau}'\\mid\\bm{\\tau})\\propto\\sum_{\\mathbf{d}\\in\\mathbb{Z}^m}\\exp\\bigl(-\\|\\bm{\\tau}-\\bm{\\tau}'+2\\pi\\mathbf{d}\\|^2/(2\\sigma^2(t))\\bigr)"
            caption: "Jing perturbation kernel на гиперторе (Eq. 3). Не cosine β_t FoldingDiff. Не protein N-Cα-C angles."
            generic_or_specific: "Jing [PAPER]; literature-specific"
            source: PAPER
            locator: "Jing Eq. 3"
            symbols:
              - {sym: "\\bm{\\tau}", type: "T^m", meaning: "torsion angles rotatable bonds"}
              - {sym: "\\sigma(t)", type: "noise scale", meaning: "exponential schedule 0.01π…π"}
              - {sym: m, type: "int", meaning: "число свободно вращаемых связей (~7.9 на GEOM-DRUGS)"}
            meaning: "Семплируется geodesic/wrapped random walk по τ при фиксированном L."
          - latex: "J_{\\mathrm{DSM}}(\\theta)=\\mathbb{E}_t\\bigl[\\lambda(t)\\,\\mathbb{E}\\|\\mathbf{s}(\\bm{\\tau}_t,t)-\\nabla_{\\bm{\\tau}_t}\\log p_{t\\mid 0}(\\bm{\\tau}_t\\mid\\bm{\\tau}_0)\\|^2\\bigr]"
            caption: "Jing denoising score matching (Eq. 4). λ(t) precomputed. Не wrapped L1 FoldingDiff. Не energy head ΔG белка."
            generic_or_specific: "Jing [PAPER]; literature-specific"
            source: PAPER
            locator: "Jing Eq. 4"
            symbols:
              - {sym: "\\mathbf{s}", type: "R^m", meaning: "предсказанный torsional score (pseudoscalars)"}
              - {sym: "\\lambda(t)", type: "weight", meaning: "нормировка DSM"}
              - {sym: "\\theta", type: "params", meaning: "веса TFN + pseudotorque"}
            meaning: "Обучается score на торе. Likelihood через probability-flow ODE (Eq. 7) — Jing, не FoldingDiff."
    tables:
      - title: "Смежные постановки, которые нельзя смешивать"
        headers: ["Постановка", "Train target", "Sampler/декодер", "Что в каталоге"]
