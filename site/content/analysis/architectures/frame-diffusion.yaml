status_note: "Класс frame diffusion описан по каталогу RFdiffusion/FrameDiff и Nature RFantibody (HTML частично). Полные Methods RFdiffusion/Watson et al. в этом выпуске не close-read. Не подставлять DiffAb Cα-DPM уравнения как frame diffusion RFdiffusion."
lede: "Frame diffusion моделирует каждый residue как элемент SE(3): ориентация + трансляция. Это generator **геометрии остова**, обычно с отдельным inverse folding для sequence (ProteinMPNN). Не predictor affinity."
