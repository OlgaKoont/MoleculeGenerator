          - ["[Active learning](/architectures/active-learning.html)", "любой surrogate; акцент на $A_t$", "любой batch rule, в т.ч. greedy", "EVOLVEpro также несёт этот id"]
          - ["[Zero-shot scoring](/architectures/zero-shot-mutation-scoring.html)", "нет task $y$; pretrained $\\ell$", "enumerate 19×pos, rank $\\Delta\\ell$/IF", "[ESM-1v](/tools/esm-1v-efficient-evolution.html); [structural evolution](/tools/structural-evolution.html)"]
          - ["[Bayesian optimization](/architectures/bayesian-optimization.html)", "GP/MTGP posterior + $a(\\mu,\\sigma)$", "argmax EI/UCB/NEHVI", "нет catalog tool; EVOLVEpro — контрпример"]
          - ["[MOO](/architectures/multi-objective-optimization.html)", "вектор $y$ / filters / CNN scores", "Pareto / pass-fail / greedy", "Makowski также; BindCraft filters; Humatch"]
