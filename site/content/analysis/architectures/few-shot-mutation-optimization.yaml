sections:
  - id: domain
    title: "1. Область определения"
    paragraphs:
      - text: "Роль в пайплайне — **labelled mutation protocol / sequential design loop** над заранее заданной mutational library $\\mathcal{X}$: (i) собрать experimental $y$ на parent-вариантах; (ii) обучить лёгкий surrogate $f_\\phi$ в feature space $x(s)$; (iii) предложить batch $B\\subset\\mathcal{X}$ (один раз или итеративно). Класс есть постановка данных и выбора, не фиксированная neural architecture и не density model токенов."
        source: INTERPRETATION
      - text: "Generated / selected state — ranked mutants (single- или multi-site substitutions parent'а). Scored state surrogate — скаляр или вектор phenotype $\\hat y$ / LDA-проекция $\\phi$, не coords, не SE(3) frames, не diffusion $x_t$. Вход сети vs файлы: последовательность варианта и таблица labels; embeddings или one-hot считаются с FASTA/CSV, не из PDB numbering как тензора модели."
        source: INTERPRETATION
      - text: "Задачи каталога, которые класс реально закрывает как mutation-optimizer: [few-shot active learning](/tasks/few-shot-active-learning.html), [ML-guided directed evolution](/tasks/ml-guided-directed-evolution.html), [affinity maturation](/tasks/affinity-maturation.html), [combinatorial mutation design](/tasks/combinatorial-mutation-design.html), [off-target optimization](/tasks/off-target-optimization.html) при наличии panel labels. Workflow: [few-shot / labelled mutation optimization](/workflows/few-shot-active-learning.html)."
        source: MATRIX
        locator: "architectures/few-shot-mutation-optimization.yaml applicable_task_ids; tools architecture_ids"
      - text: "Это **не** [zero-shot mutation scoring](/architectures/zero-shot-mutation-scoring.html): там нет task loss на новых $y$; $\\Delta\\ell$ / ESM pMMS — не surrogate этого класса. Science: activity EVOLVEpro-вариантов **не коррелирует** с ESM-2 pMMS (C143 $-0.16$, aCD71 $0.01$ между predicted fitness и predicted activity в latent scan)."
        source: PAPER
        locator: "Science Fig. 2J; figs. S3C and S4E correlations −0.16 and 0.01"
      - text: "Это **не** [active learning](/architectures/active-learning.html) как определение: AL — любой rule выбора следующего batch $A_t$. Few-shot задаёт **режим данных** (мало labels относительно пространства). EVOLVEpro реализует оба; Makowski — library-trained fit + Pareto **без** EVOLVEpro-style rounds по 10 ELISA. Не отождествлять класс с pool-based AL обязательно."
        source: INTERPRETATION
      - text: "Это **не** [bayesian optimization](/architectures/bayesian-optimization.html): BO требует probabilistic posterior и acquisition $a(x;p(f\\mid D))$, использующую uncertainty. Released [EVOLVEpro](/tools/evolvepro.html) — RF + top-$N$ $\\hat y$; колонка `std_predictions` — нули. Не ставить UCB/EI как train target этой страницы."
        source: CODE
        locator: "model.py top_layer y_std_* = np.zeros; evolve.py evolve_experimental regression_type='randomforest'"
      - text: "Это **не** [multi-objective optimization](/architectures/multi-objective-optimization.html) как класс сравнения нескольких $y$: few-shot может быть одноцелевым. Makowski **также** несёт architecture_id MOO (Pareto на $\\phi_{\\mathrm{aff}},\\phi_{\\mathrm{NSB}}$); на этой странице он — подтип labelled mutation, не определение Pareto. Это **не** [protein language models](/architectures/protein-language-models.html) как generator: PLM здесь frozen feature extractor, не decoder."
        source: MATRIX
      - text: "Это **не** de novo topology / [frame diffusion](/architectures/frame-diffusion.html) / [coordinate diffusion](/architectures/coordinate-diffusion.html). Seed: not_for [de novo antibody design](/tasks/de-novo-antibody-design.html). Catalog tools с этим `architecture_id`: [EVOLVEpro](/tools/evolvepro.html), [Makowski affinity–specificity](/tools/makowski-affinity-specificity.html). Часто путают с [ESM-1v efficient evolution](/tools/esm-1v-efficient-evolution.html) (zero-shot) и с GP-UCB Romero (другой класс, не tool)."
        source: MATRIX
  - id: intuition
    title: "2. Интуитивный принцип"
    paragraphs:
      - text: "Интуиция: assay на parent-семействе даёт редкие, но **прямые** числа $y$. Pretrained PLM или sequence features задают координаты, в которых близкие мутанты похожи. Лёгкая голова $f_\\phi$ учит карту «embedding → activity» на этих числах и ранжирует ещё не измеренный пул. При inference меняется не генератор fold, а **кто попал в $D$** и, следовательно, fit $\\phi$; веса PLM не обновляются под $y$ в описанных методах."
        source: PAPER
        locator: "Science Fig. 1A; Makowski Fig. 1 library then models"
      - text: "Два эмпирических режима, которые нельзя слить в «~10 ELISA». EVOLVEpro: low-N итерации («as few as 10 experimental data points per round» — Science intro; DMS-симуляции 16/round). Makowski: 4000 binary deep-seq labels с sorts, затем 125 scFab и 41/29 IgG — это labelled library, не 10 точек ELISA, но всё ещё parent-library supervised mutation, не de novo."
        source: PAPER
        locator: "Science intro as few as 10 per round; Makowski Methods 4000 master set"
      - text: "Главный рычаг EVOLVEpro — **informative frozen embedding** ESM-2 15B mean-pool + iterative labels, не fine-tune 15B на fitness. Science grid: random first round, RF, average embeddings, top-N (fig. S1A). Preprint/journal: PLM representations outperform one-hot/integer на DMS panel."
        source: PAPER
        locator: "Science Results grid search; Fig. 1B ESM-2 15B"
      - text: "Главный рычаг Makowski — **binary sort labels → 1D LDA projection**, которая коррелирует с непрерывным yeast/IgG readout, плюс Pareto. Enrichment/frequency **не** дают той же корреляции. Для выхода за 8 library sites — frozen UniRep-64 и Blosum62 $\\ge 0$ gate, не OneHot."
        source: PAPER
        locator: "Makowski Fig. 3 vs conventional analysis; Fig. 5 UniRep + Blosum62"
      - text: "Предостережение по метрикам. $\\hat y$ RF, LDA $\\phi$, classification accuracy 93%, Spearman на 125 клонах, pLDDT/AF3 post-hoc, ESM pMMS, ELISA IC50-from-curve, single-point 1 nM HGFR, EC50 на beads — **разные объекты**. Ни один internal score не есть experimental $K_d$ / BLI / SPR, пока oracle не измерен. Generator (выбор $B$) $\\neq$ evaluator (AF3, MOE homology) $\\neq$ assay."
        source: INTERPRETATION
      - text: "Science явно: PLM masked reconstruction не обязана совпадать с activity landscape; «in scenarios of correlations … zero-shot may work … enzyme optimization has proven more challenging». Подмена pMMS за affinity для **этого** класса опровергается их же Fig. 2J / 5H."
        source: PAPER
        locator: "Science Discussion PLM limitations; Fig. 2J; Fig. 5H T7 negative correlation 0.13"
      - text: "Makowski явно: LDA projections are «continuous metrics and not actual property values». Single-point antigen 1 nM нормирован к WT/elotuzumab; EC50 только для lead EM1/EM2. Homology MOE (PDB templates 4LIQ/3W2D/4YHL/5NHW) — post-hoc interpretation EM2, не вход LDA."
        source: PAPER
        locator: "Makowski Fig. 3C–D prose; Methods Antibody structural modeling"
      - text: "При inference меняется ranked shortlist. Не меняется topology антитела, не семплируется шум diffusion, нет temperature AR decode. Round 0 EVOLVEpro в победной DMS-конфигурации — **random**, не informative prior medoids (medoids были в grid, не winner)."
        source: PAPER
        locator: "Science Methods summary first-round random vs K-medoids; winning strategy random"
  - id: math
    title: "3. Формальная математическая постановка"
    paragraphs:
      - text: "Сначала родовая постановка класса (fit на $D$, затем selection из $\\mathcal{X}$). Затем подтипы с **разными** уравнениями: (A) EVOLVEpro — frozen mean-pool + RF + top-$n$ iterative, tool [EVOLVEpro](/tools/evolvepro.html); (B) Makowski — binary LDA + Pareto, tool [Makowski](/tools/makowski-affinity-specificity.html). Не одна «универсальная» $f_\\phi(E(s))\\approx y$ на оба. Seed one-liner $f_\\phi(E(s))\\approx y$ — **EVOLVEpro-like**, не Makowski LDA."
        source: INTERPRETATION
      - text: "Формулы, которые **не** являются уравнениями default-инструментов и **не** train target класса: UCB/EI/KG; Meier masked-marginal $\\Delta\\ell$; AF2 FAPE; diffusion score; AR NLL ProGen; MLM infill. Weighted $4\\times$ binding vs expression (Science antibodies) и T7 20/40/40 (preprint) — scalarization **поверх** few-shot fit, не GP-NLL. Не подставлять seed как уравнение Makowski."
        source: INTERPRETATION
      - text: "Negative / non-binder / contrastive affinity labels в **loss головы**: у EVOLVEpro default — **нет** contrastive head; $y$ — scalar activity (в т.ч. низкие значения как ordinary regression). У Makowski binary high/low antigen и high/low NSB **есть** как class labels LDA/NN, это не ELISA $K_d$ negatives и не docking decoys."
        source: PAPER
        locator: "Science RF on continuous y; Makowski Methods label assignment"
      - text: "Не сравнивать Science C143 60 pM / aCD71 19 pM, preprint REGN 63%/11.9 nM, Makowski 37% dual-improved IgG и DMS 2.2-fold vs 7-fold как один benchmark: generated object, oracle и split разные."
        source: INTERPRETATION
      - text: "Science Methods summary Eq. 8 в HTML сломан (`max y_train round k ≤ max y_train round k`); не копировать как закон. Смысл prose: greedy top-n призван растянуть верхний край RF-диапазона между раундами — INTERPRETATION этой фразы, не отдельная формула."
        source: PAPER
        locator: "Science Methods summary Eq. (8) garbled; surrounding top-n prose"
      - text: "CODE симуляции (`dist`, `topn2bottomn2`, `random`, `gp` regressor) **не** меняют родовое уравнение класса и **не** являются default experimental path. `evolve_experimental` всегда RF. Не выдавать MLP `hidden_layer_sizes=(5)` за journal EVOLVEpro."
        source: CODE
        locator: "evolve.py learning_strategy branches; evolve_experimental regression_type='randomforest'"
    equations:
      - latex: "\\phi^{\\star}\\in\\arg\\min_{\\phi}\\sum_{(s,y)\\in D}\\ell\\big(f_{\\phi}(x(s)),y\\big),\\qquad B=A(\\mathcal{X},f_{\\phi},D)"
        caption: "Родовая постановка класса: fit surrogate на labelled set $D$, затем selection rule $A$ (greedy, Pareto, dist, …). $A$ **не** входит в $\\ell$. Generic. Не default UCB. Не уравнение одного tool."
        generic_or_specific: generic
        source: INTERPRETATION
        locator: "класс; конкретика $x,\\ell,A$ — подтипы PAPER/CODE"
        symbols:
          - {sym: s, type: "sequence", meaning: "вариант parent-library"}
          - {sym: y, type: "label", meaning: "experimental scalar или binary class"}
          - {sym: x(s), type: "feature", meaning: "embedding / one-hot / UniRep / PhysChem"}
          - {sym: "f_\\phi", type: "surrogate", meaning: "RF, LDA, NN projector, …"}
          - {sym: D, type: "set", meaning: "накопленные (s,y)"}
          - {sym: "\\mathcal{X}", type: "library", meaning: "допустимые mutants; задаётся заранее"}
          - {sym: A, type: "selection", meaning: "top-n, Pareto, random, dist, …"}
          - {sym: B, type: "batch", meaning: "что идёт в следующий assay"}
        meaning: "Оптимизируется empirical loss головы на D. Семплируется (выбирается) batch B из конечного пула, не de novo tokens."
    sections:
      - id: math-evolvepro
        level: 3
        title: "Подтип A — frozen PLM mean-pool + RF + top-n (EVOLVEpro; tool-specific)"
        paragraphs:
          - text: "Science Methods summary: $x_i=(a_1,\\ldots,a_n)$, ESM-2 15B last layer $E_i\\in\\mathbb{R}^{n\\times d}$, mean-pool $\\bar e_i$. RF $T=100$, criterion Friedman MSE, prediction = среднее деревьев. Top-n по $\\hat y$ на untested. Experimental CODE path **жёстко** `randomforest`. Не UCB. Не уравнение Makowski. Tool-specific [EVOLVEpro](/tools/evolvepro.html)."
            source: PAPER
            locator: "Science Methods summary Use of ESM2 embeddings; EVOLVEpro model; Active learning approach"
        equations:
          - latex: "E_i=\\mathrm{PLM}(x_i)\\in\\mathbb{R}^{n\\times d},\\quad \\bar e_i=\\frac{1}{n}\\sum_{j=1}^{n}E_{ij},\\quad \\hat y(\\bar e)=\\frac{1}{T}\\sum_{t=1}^{T}h_t(\\bar e),\\quad B=\\{s:\\hat y_s\\ge y_{(n)}\\}"
            caption: "Science Methods summary Eq. 1–2, 5, 7. $T=100$. $d$ численно NR. PLM frozen. $y_{(n)}$ — $n$-й по величине $\\hat y$. CODE: sort `y_pred` descending (`learning_strategy=='topn'`)."
            generic_or_specific: "EVOLVEpro [PAPER/CODE]; tool-specific"
            source: PAPER
            locator: "Science Methods summary Eq. (1)(2)(5)(7); CODE model.py RandomForestRegressor; evolve.py topn"
            symbols:
              - {sym: n, type: "int", meaning: "длина варианта"}
              - {sym: d, type: "int", meaning: "hidden dim ESM-2 15B; число NR в HTML"}
              - {sym: "\\bar e", type: "R^d", meaning: "mean-pooled embedding"}
              - {sym: T, type: "int", meaning: "100 trees"}
              - {sym: "h_t", type: "tree", meaning: "bootstrap tree; split by Friedman MSE"}
              - {sym: "y_{(n)}", type: "threshold", meaning: "n-th highest predicted fitness"}
            meaning: "Оптимизируется RF impurity на labelled embeddings. Семплируется top-n untested variants. Posterior σ не используется."
          - latex: "\\min y_{\\mathrm{train}}\\le \\hat y_{\\mathrm{predict}}\\le \\max y_{\\mathrm{train}}"
            caption: "Science Methods summary Eq. 6: RF regression predictions лежат в диапазоне train $y$. Ограничение exploitation, не физический bound affinity."
            generic_or_specific: "EVOLVEpro [PAPER]; tool-specific"
            source: PAPER
            locator: "Science Methods summary Eq. (6)"
            symbols:
              - {sym: "y_{train}", type: "observed activity", meaning: "уже измеренные labels раунда"}
            meaning: "Не калибрует Kd. Объясняет, зачем итерации «растягивают» верх train range."
      - id: math-makowski
        level: 3
        title: "Подтип B — binary LDA projections + Pareto (Makowski; tool-specific)"
        paragraphs:
          - text: "Не EVOLVEpro. Не frozen ESM-2 15B. Features: OneHot (sklearn LabelEncoder+OneHotEncoder), PhysChem-26, или UniRep-64 (`babbler64.get_rep()`, frozen). Независимые LDA на antigen vs NSB, solver SVD, 5-fold 3200/800, затем fit на полном 4000. $\\phi$ — 1D projection, не Kd. Pareto на 4000; 41 IgG near frontier; later UniRep scan novel CDR sites. Tool-specific [Makowski](/tools/makowski-affinity-specificity.html). CODE NR this pass."
            source: PAPER
            locator: "Makowski Methods Model development; Molecular feature embedding"
        equations:
          - latex: "\\phi_j(s)=\\mathrm{LDA}_j\\big(x(s)\\big)\\in\\mathbb{R},\\quad j\\in\\{\\mathrm{antigen},\\mathrm{NSB}\\}"
            caption: "Makowski: sklearn LinearDiscriminantAnalysis SVD; 1D projection для каждой бинарной задачи. Точные scatter-матрицы Fisher в HTML не выписаны — не выдумывать $S_W^{-1}(\\mu_1-\\mu_0)$ как формулу авторов. Не RF EVOLVEpro."
            generic_or_specific: "Makowski [PAPER]; tool-specific"
            source: PAPER
            locator: "Makowski Results LDA paragraph; Methods LDA SVD"
            symbols:
              - {sym: "\\phi_j", type: "scalar projection", meaning: "непрерывный score класса j; не property в nM"}
              - {sym: x(s), type: "feature vector", meaning: "OneHot VH 115 aa или UniRep-64 или PhysChem-26"}
              - {sym: j, type: "task", meaning: "antigen binding vs polyspecificity reagent binding"}
            meaning: "Оптимизируется LDA classification на binary deep-seq. Семплируется (выбирается) Pareto-множество по $(\\phi_{\\mathrm{aff}},\\phi_{\\mathrm{NSB}})$, не top-n одного $\\hat y$."
          - latex: "s\\succ s'\\iff \\big(\\phi_{\\mathrm{aff}}(s)\\ge\\phi_{\\mathrm{aff}}(s')\\ \\land\\ \\phi_{\\mathrm{NSB}}^{\\downarrow}(s)\\ge\\phi_{\\mathrm{NSB}}^{\\downarrow}(s')\\big)\\ \\land\\ \\text{strict in at least one}"
            caption: "Схема Pareto на двух проекциях (NSB «лучше» = ниже nonspecific; знак в HTML как отдельные оси Fig. 4A). Не NSGA-II. Не UCB. INTERPRETATION записи доминирования; авторы описывают фронт prose."
            generic_or_specific: "Makowski [INTERPRETATION of PAPER Fig. 4A]; tool-specific"
            source: INTERPRETATION
            locator: "Makowski Fig. 4A Pareto frontier prose"
            symbols:
              - {sym: "\\succ", type: "dominance", meaning: "лучше по обоим осям co-optimization"}
              - {sym: "\\phi^{\\downarrow}_{NSB}", type: "oriented score", meaning: "направление «лучше = меньше NSB»; калибровка осей — Fig. 4, не формула"}
            meaning: "Выбираются варианты at/near frontier для IgG. Не итеративный EVOLVEpro loop."
