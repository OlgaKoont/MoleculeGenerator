  - id: data-repr
    title: "4. Представление данных"
    paragraphs:
      - text: "Узлы isotropic subtype: residues как точки Cα. Genie $x\\in\\mathbb{R}^{N\\times 3}$. DiffAb generate-mask: $p\\in\\mathbb{R}^{L\\times 3}$ плюс context antigen/framework coords (внешний PDB). Размерности hidden Genie (кроме 4.1M params) в HTML Table 1 не как layer widths — NR сверх сказанного."
        source: PAPER
        locator: "Lin §2.1; Table 1 4.1M"
      - text: "Рёбра/pairs: Genie pair feature network из single rep + FS frames (Fig. 7: $r$ residues, $c_s$, $c_p$, relpos, pdist). Конкретные $c_s,c_p$ в прочитанном HTML как числа слоёв — NR (рисунок есть, таблица ширин не транскрибировалась)."
        source: PAPER
        locator: "Lin Fig. 7 caption; numeric c_s/c_p NR"
      - text: "Chroma: backbone coords (единицы nm в regularized loss); polymer $\\Sigma$; **random graph** с long-range edges (Barnes–Hut-like / sub-quadratic), не полный $N\\times N$ pair track как у AF2. Hidden widths — Nature SI Tables 2–3, **NR**."
        source: PAPER
        locator: "Nature sub-quadratic; bioRxiv random graph; SI Tables 2–3 inaccessible"
      - text: "Time embedding: Genie — sinusoidal encoding шага $t$ в denoiser. DiffAb CODE: $t_{\\mathrm{embed}}=(\\beta,\\sin\\beta,\\cos\\beta)$ к residue features. Chroma — continuous $t\\in(0,1)$ в SDE. Не выдумывать иной dim."
        source: PAPER
        locator: "Lin §2.2; DiffAb dpm_full.py (prior audit); Chroma Appendix A t∈(0,1)"
      - text: "Conditioner tensors Chroma: symmetry tessellation градиента; substructure RMSD; volumetric shape; class logits CATH/PFAM; language captions (ProCap). Это входы **guidance**, не labels ELISA. Файлы: PDB numbering / contig — у RFdiffusion-AA (contigmap в DOC; точный синтаксис README NR this pass)."
        source: PAPER
        locator: "Ingraham Nature Fig. 3; ProCap bioRxiv appendix"
      - text: "RFdiffusion-AA / RFAA predictor (не путать): atom nodes без relative position encoding (permutation-invariant small-molecule graph); residue frames N–Cα–C; ligand tokens from chemical graph. Это описание **RFAA** 3D track; generative RFdiffusion-AA инициализируется теми же весами. Точные tensor shapes SI — NR."
        source: PAPER
        locator: "Krishna preprint RFAA coordinate updates paragraph"
      - text: "Sequence tokens: отсутствуют в Genie diffusion state; Chroma design network **после** backbone (GNN/CRF lineage); DiffAb discrete 20 AA (+ padding 25 types в config); RFdiffusion-AA не диффундирует AA. Library CSV / DMS — **нет** в классе как вход generator."
        source: PAPER
        locator: "Ingraham Nature design protocol; Krishna LigandMPNN after"
      - text: "Аугментации, меняющие геометрию: изотропный DDPM сам по себе ломает bond lengths; Chroma correlated noise сохраняет polymer-scale корреляции, не secondary-structure labels. Global rotation: если сеть не SE(3)-equivariant, нужна augmentation (Genie/Chroma заявляют equivariant layers). Перестановка residue index ломает chain (кроме permutation-invariant atom set лиганда). Crop/size limits RFdiffusion-AA — NR без README audit."
        source: INTERPRETATION
  - id: physical-repr
    title: "5. Физическое представление"
    paragraphs:
      - text: "Математический $x_i\\in\\mathbb{R}^3$ соответствует Cα или backbone атому в лабораторной системе. Это **не** траектория MD-фолдинга: $x_t$ — точка noising process, не физическое время. Embedding denoiser ≠ энергия."
        source: INTERPRETATION
      - text: "SE(3): класс **approx / architecture-dependent**. Изотропный Gaussian prior на абсолютных xyz **не** инвариантен к глобальному сдвигу/повороту без centering или equivariant denoiser. Genie: SE(3)-equivariant denoiser на FS frames, sensitive to reflections (в отличие от EGNN ProtDiff, который даёт left-handed helices — Lin §1). Chroma: equivariant reconstruction из inter-residue geometries (Nature). DiffAb: local-frame ε, world rotation (Prop. 1 на joint-странице)."
        source: PAPER
        locator: "Lin §1 EGNN chirality; Nature equivariant layers"
      - text: "Перестановка residues ломает полимерный порядок и pair/relpos. Concatenation цепей: Chroma семплирует complexes; symmetry conditioner tessellates subunit. Глобальный поворот входа должен поворачивать выходной vector field, если denoiser equivariant; иначе distribution shift."
        source: PAPER
        locator: "Ingraham Nature Fig. 3a symmetry"
      - text: "Side chains: **не** в diffusion state Genie. Chroma — design network после $x$ (sequence + side-chain heads в постановке paper). RFdiffusion-AA — pack/LigandMPNN + FastRelax **post-hoc** (DIG protocol). DiffAb — backbone CDR + type; full-atom pack не обязателен в DPM."
        source: PAPER
        locator: "Nature design network; Krishna LigandMPNN + FastRelax"
      - text: "RFAA **predictor** двигает heavy-atom coords независимыми translational updates (нет residue-relative encoding на атомах лиганда). Это folding/docking head, **не** generative reverse SDE. Не сливать две головы одной статьи."
        source: PAPER
        locator: "Krishna preprint RFAA 3D track"
      - text: "Assay label $y_{\\mathrm{exp}}$ (Kd, ELISA) **не** является компонентом $x$. Conditioner $y$ Chroma — class/shape/symmetry, не measured affinity."
        source: INTERPRETATION
      - text: "Nature: icosahedral пример — 60 subunits и **60 000** total residues (>240 000 atoms в том же абзаце). BioRxiv того же примера пишет 96 000 residues — **не сливать** preprint и journal silently; для каталога цитировать journal 60 000."
        source: PAPER
        locator: "Nature Fig. 3a caption 60,000 residues; bioRxiv 96,000"
      - text: "Физический объект wet-lab Chroma — экспрессируемый белок (split-GFP, CD, DSC, кристалл), не «диффузионная траектория». Физический объект RFdiffusion-AA DIG — белок, связывающий digoxigenin (yeast FACS + FP). Это кампании **конкретных papers**, не свойство любого coordinate DPM."
        source: PAPER
        locator: "Nature Fig. 5; Krishna Fig. 5"
  - id: physchem
    title: "6. Физико-химический смысл"
    paragraphs:
      - text: "Модель **не** «считает $\\Delta G$», пока нет явного energy head. Chroma likelihood — density модели, слабо связанный с экспрессией. GALigandDock — внешний Rosetta evaluator."
        source: PAPER
        locator: "Nature likelihood vs expression; Krishna GALigandDock as score"
    physchem:
      - feature: "Identity аминокислот"
        interpretation: "химический тип residue; определяет side chain после pack"
        encoded: "Genie — не представлена в DPM; Chroma — отдельная design GNN/CRF после coords; DiffAb — discrete канал (joint); RFdiffusion-AA — LigandMPNN post-hoc"
        limitation: "coords-only sample не задаёт sequence; CRF/MPNN ≠ joint p(s,x)"
      - feature: "Backbone / Cα / frames"
        interpretation: "ковалентная геометрия остова; локальная ориентация peptide plane"
        encoded: "прямо: xyz в state; Genie FS frames derived; RFdiffusion-AA ещё Brownian rotations"
        limitation: "isotropic noise ломает bond lengths; FS на терминалях копирует соседа (Genie)"
      - feature: "Antigen / hotspot / ligand coords"
        interpretation: "стереохимия партнёра; карман"
        encoded: "прямо clamp (DiffAb antigen; RFdiffusion-AA ligand); Chroma motif RMSD conditioner"
        limitation: "неверный pose / numbering → карман под чужую химию; нет epitope tensor «из ELISA»"
      - feature: "H-bonds / electrostatics / solvation"
        interpretation: "взаимодействия, определяющие стабильность и связывание"
        encoded: "не представлена как терм generator; косвенно через PDB statistics"
        limitation: "нельзя читать sample как расчёт ΔG или pKa"
      - feature: "Entropy / ensemble"
        interpretation: "конформационная энтропия цепи"
        encoded: "косвенно: Chroma polymer Σ ~ chain + Rg; low-T уменьшает энтропию семплов"
        limitation: "λ0 — sampling hack, не термодинамический β=1/kT эксперимента"
      - feature: "Evolutionary statistics"
        interpretation: "MSA / family"
        encoded: "не MSA-вход Genie/Chroma diffusion; CATH/PFAM classifiers — conditioner labels"
        limitation: "class conditioner ≠ функциональная аннотация гарантия"
      - feature: "Experimental y (Kd, ELISA, BLI)"
        interpretation: "измеренная функция"
        encoded: "не в loss класса"
        limitation: "DIG FP и Chroma split-GFP — отдельные assays papers, не head модели"
  - id: learned
    title: "7. Что обучается"
    paragraphs:
      - text: "Параметры $\\theta$ — веса denoiser геометрии. Frozen vs trained: RFdiffusion-AA **инициализируется** весами RFAA predictor и fine-tune на denoising; RFAA folding head в предикторе — другая задача. Genie — from scratch (Lin: vs RFdiffusion ~59.8M pretrained RF, Genie 4.1M)."
        source: PAPER
        locator: "Lin Table 1 / text 59.8M vs 4.1M; Krishna FT from RFAA weights"
      - text: "Chroma $\\theta$: denoiser $x_\\theta(x_t,t)$. $R$ ковариации fit **offline**, не в том же градиентном шаге. Design network — отдельные sequence/side-chain головы (Ingraham 2019 / ProteinMPNN lineage в постановке Nature), **не** diffusion ELBO."
        source: PAPER
        locator: "bioRxiv A.2 R offline; Nature design network after backbone"
      - text: "Generic loss isotropic subtype — $\\varepsilon$-MSE (Genie). Chroma — weighted ELBO в $z$ плюс regularizer в $x$. RFdiffusion-AA — DDPM denoising protein structures given biomolecular context (точная смесь FAPE vs $x_0$-MSE в Science Methods — **NR**)."
        source: PAPER
        locator: "Lin loss; bioRxiv L_reg; Krishna «denoising diffusion probabilistic model»"
      - text: "**Нет** negative / non-binder / contrastive / affinity labels в diffusion loss прочитанных papers. Negative examples — зашумлённые natives, не docking decoys как class labels."
        source: INTERPRETATION
      - text: "Classifier $p(y\\mid x)$ Chroma, если обучается (ProClass/ProCap), — отдельный модуль guidance, не Kd. Его градиент добавляется на inference."
        source: PAPER
        locator: "Nature programmable; bioRxiv ProCap gradient ×100 anecdote"
      - text: "Fine-tune vs pretrain: Genie-SCOPe vs Genie-SwissProt — разные корпуса, та же 4.1M архитектура. RFdiffusion-AA: pretrain RFAA on PDB assemblies + CSD small molecules, затем FT denoising на protein–small molecule / motif. Chroma train: PDB queried 20 March 2022, UniProt 2022_01, PFAM 35 (Nature Data)."
        source: PAPER
        locator: "Nature Data paragraph; Krishna RFAA training set counts; Lin SCOPe/SwissProt"
      - text: "RFAA predictor train (для контраста, не этот класс): 121 800 protein–small molecule structures / 5 662 clusters (30% seq id), плюс metals и covalent mods — это **predictor** corpus, не обязательный split generator."
        source: PAPER
        locator: "Krishna preprint clustering paragraph"
      - text: "Не переносить sequence CE ProteinMPNN внутрь «что обучается coordinate diffusion». Если пользователь запускает LigandMPNN — это другой `architecture_id` / tool."
        source: INTERPRETATION
  - id: forward
    title: "8. Прямой проход и information flow"
    paragraphs:
      - text: "Порядок класса: (1) старт — isotropic noise, polymer prior $x=Rz$, или Gaussian frames around ligand; (2) denoiser (GNN / IPA / RFAA stack) видит $x_t$ и time; (3) предсказание $\\varepsilon$ или $x_0$; (4) один шаг reverse; (5) clamp motif/ligand; (6) optional classifier guidance / low-T; (7) **sequence module** если есть — отдельно; (8) evaluator AF2 / crystallography / binding assay."
        source: INTERPRETATION
      - text: "Sequence vs geometry: у Genie sequence **не** появляется. У Chroma geometry first, затем design GNN/CRF. У DiffAb sequence logits на каждом шаге joint DPM. У RFdiffusion-AA sequence после LigandMPNN. Не прятать IF/packing/AF/docking внутрь «одной сети», если paper разделяет модули."
        source: PAPER
        locator: "Nature three-step protocol; Krishna LigandMPNN after; Luo joint"
      - text: "Score Chroma conditioner — $\\nabla_x\\log p(y\\mid x)$, не experimental. GALigandDock и AF2 pLDDT стоят **после** генерации как фильтры (RFdiffusion-AA in silico pipeline)."
        source: PAPER
        locator: "Krishna in silico paragraph"
      - text: "RFAA predictor forward (recycles, FAPE) **не** есть forward generative RFdiffusion-AA, хотя веса разделяются инициализацией."
        source: PAPER
        locator: "Krishna: DDPM initialized with RFAA weights"
      - text: "Chroma experimental protocol **намеренно** не фильтровал designs structure-prediction / energetic calculations перед wet-lab (Nature). Это выбор кампании, не обязательное свойство класса."
        source: PAPER
        locator: "Nature: deliberately did not filter by structure prediction"
      - text: "Low-T Chroma: hybrid Langevin + reverse SDE (bioRxiv Appendix B). Без модификации авторы описывают unstructured high-likelihood mass. Это information flow sampling, не изменение architecture."
        source: PAPER
        locator: "bioRxiv low-temperature; unstructured until modification"
      - text: "DiffAb: ResidueEmbedding + PairEmbedding + FullDPM; generate_flag маска; antigen coords в context. HDOCK/PyRosetta в README — **evaluator/optional**, не EpsilonNet."
        source: CODE
        locator: "diffab models; prior tool analysis"
      - text: "Experiment (split-GFP, FP, UV-Vis, crystallography) лежит **вне** mermaid generator. Не рисовать Kd внутри denoiser."
        source: INTERPRETATION
    mermaid: |
      flowchart TD
        START["Старт: N(0,I) Cα / polymer x=Rz / Gaussian cloud around ligand"] --> DEN["Denoiser GNN / IPA / RFAA stack"]
