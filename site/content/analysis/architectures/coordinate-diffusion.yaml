        SEQ --> PACK["Post-hoc pack / FastRelax — не generator"]
        PACK --> EVAL["Evaluator: AF2 pLDDT scRMSD / GALigandDock — не generator"]
        EVAL --> EXP["Experiment: split-GFP / FP / UV-Vis / crystal — не сеть"]
        subgraph gen ["Generator"]
          START
          DEN
          PRED
          STEP
          CLAMP
          GUID
        end
        subgraph ev ["Evaluator / design stage"]
          SEQ
