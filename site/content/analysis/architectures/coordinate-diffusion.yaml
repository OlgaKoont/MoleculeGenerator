        end
    mermaid_caption: "Оригинальная схема класса по Ingraham / Lin / Krishna / Luo, не копия Nature Fig. 1 или Science Fig. 4. Generator отделён от LigandMPNN/AF2/docking и от assay."
    mermaid_source: "Chroma Nature protocol; Genie reverse; RFdiffusionAA Fig. 4A prose; DiffAb FullDPM"
  - id: training
    title: "9. Training procedure"
    paragraphs:
      - text: "Единого корпуса класса нет. Split, которого нет в прочитанном тексте, **не** выводится из README."
        source: INTERPRETATION
      - text: "Chroma: PDB на 20 March 2022, UniProt 2022_01, PFAM 35; train/test/validation PDB IDs на Zenodo 10.5281/zenodo.8285077. Фильтры resolution/redundancy в Nature HTML абзаце Data не детализированы — **NR** (SI)."
        source: PAPER
        locator: "Nature Data availability; Zenodo 8285077"
      - text: "Genie: domains; сравнение Genie-SCOPe vs SwissProt в Table 1 (designability scRMSD / pLDDT и т.д.). Точный SCOPe split listing в прочитанном HTML не копировался построчно — **NR** сверх Table 1 metrics."
        source: PAPER
        locator: "Lin Table 1; split files NR"
      - text: "RFAA predictor clustering: 30% sequence identity; counts 121 800 / 5 662 clusters protein–small molecule (preprint). RFdiffusion-AA FT uses protein–small molecule dataset + motif conditioning. Leakage: preprint Fig. S7 TM to training binders with Tanimoto>0.5 — авторы утверждают, что designs не memorized PDB того же лиганда; точные TM пороги DIG в caption Fig. 5 (purple/blue text) — читать figure, числа nearest TM в HTML как «top 0.59» в старом research YAML **не подтверждались** этим dump → nearest TM DIG **NR** unless figure OCR."
        source: PAPER
        locator: "Krishna clustering; Fig. S7 novelty; DIG nearest TM numeric NR this pass"
      - text: "Time-sampling: Genie $t$ uniform on $\\{1..T\\}$. Chroma $t\\sim\\mathrm{Unif}(0,1)$ в ELBO. Self-conditioning / teacher forcing — **NR** для Chroma/Genie в прочитанных methods."
        source: PAPER
        locator: "Lin training step; bioRxiv L_x expectation"
      - text: "Batching / GPU train Chroma denoiser: **NR** (не путать с V100 **inference** ≥3000 residues). BioRxiv упоминает V100 + Adam для **ProCap** caption model (lr $5\\times10^{-5}$, early stop) — это не обязательно backbone diffusion trainer."
        source: PAPER
        locator: "bioRxiv ProCap training V100; backbone trainer NR"
      - text: "Симуляция vs wet-lab. Genie Table 1 — **in silico** designability. RFdiffusion-AA Fig. 4 — GALigandDock + AF2 self-consistency (**in silico**). Chroma Fig. 5 и RFdiffusion-AA Fig. 5 — **prospective** expression/binding/crystals. Не смешивать."
        source: PAPER
        locator: "Lin Table 1; Krishna Fig. 4 vs Fig. 5; Nature Fig. 5"
      - text: "Ablation семи архитектур Chroma — SI Fig. 22 / Appendix L, **не page-read**. Авторы в Nature заявляют gain в likelihood и in silico refolding без транскрипции таблицы сюда."
        source: NR
        locator: "Nature mentions SI ablation; numbers NR"
  - id: inference
    title: "10. Inference and generation"
    paragraphs:
      - text: "Старт Genie: $x_T\\sim\\mathcal{N}(0,I)$ на каждый Cα; ancestral reverse $T=1000$; на $t=1$ без шума ($\\mu_\\theta$ only)."
        source: PAPER
        locator: "Lin Eq. reverse; T=1000"
      - text: "Старт Chroma: sample from polymer Gaussian prior (correlated), затем reverse SDE или probability-flow ODE; conditioner градиенты каждый шаг; low-T schedule. Nature in-text: ≥3000 residues на V100 за несколько minutes (commodity GPU claim)."
        source: PAPER
        locator: "Nature last paragraph V100; bioRxiv same"
      - text: "Старт RFdiffusion-AA: random Gaussian residue distributions surrounding the small molecule (preprint). Число шагов $T$ в preprint HTML как 100/200 **не найдено** — README tool **NR** this pass, не выводить из чужого research YAML."
        source: PAPER
        locator: "preprint: random gaussian residue distributions; T inference NR"
      - text: "DiffAb: $T=100$ в train/test config (CODE); position /10 Å. generate_flag на CDR. Не beam search language model."
        source: CODE
        locator: "configs/train/codesign_single.yml T=100"
      - text: "Post-hoc pack / FastRelax / clash filter / AF2 / likelihood rerank — **evaluator** или design stage, не reverse kernel. Chroma wet-lab protocol: low-T backbone → design network → select by sequence/structure **likelihood** (не AF2 filter)."
        source: PAPER
        locator: "Nature experimental protocol three steps"
      - text: "Чего в классе **нет** как стандарт: beam search по AA; AF2 recycle внутри denoiser Genie; assay-in-the-loop; UCB. RFdiffusion-AA in silico **использует** AF2 как self-consistency filter — это pipeline paper, не обязательный математический шаг DDPM."
        source: INTERPRETATION
      - text: "Stopping: фиксированный $T$ или $t\\to 0$. Ranking oracles: scRMSD, pLDDT, TM, Chroma likelihood, GALigandDock — пока нет assay, это не Kd."
        source: INTERPRETATION
      - text: "BoltzGen inference — **NR** (methods unread). Не подставлять Chroma ODE как BoltzGen."
        source: NR
  - id: conditioning
    title: "11. Conditioning"
    paragraphs:
      - text: "Зажимается геометрия: motif / partial backbone (Chroma infill DHFR 1DRF; VHH CDR cut — computational). Sequence не зажимается в Genie (её нет). DiffAb: framework + antigen coords, CDR под `mask_generate`."
        source: PAPER
        locator: "Nature Fig. 3b DHFR and VHH; DiffAb generate_flag"
      - text: "RFdiffusion-AA: ligand/cofactor Cartesian + optional protein motif residues. Explicitly conditional training, **не** classifier-free guidance в прочитанном абзаце (авторы противопоставляют guidance-моделям)."
        source: PAPER
        locator: "Krishna: explicitly conditional vs guidance (43)(44)"
      - text: "Chroma $y$: symmetry groups $C_n,D_n,T,O,I$; volumetric shapes; CATH class/topology classifiers; natural-language captions. Classifier-free guidance как отдельный алгоритм Ho–Salimans — авторы bioRxiv обсуждают и **отвергают как недостаточный** для backbone quality, заменяя low-T SDE. Не приписывать CFG как default Chroma без SI."
        source: PAPER
        locator: "bioRxiv: classifier guidance insufficient; low-T instead; Nature Fig. 3"
      - text: "Чего **нет**: ELISA labels в conditioner; epitope tensor RFantibody-style как обязательный вход Chroma; measured_var active learning; UCB. Не приписывать hotspot residue embedding, если paper говорит только ligand graph / contig."
        source: INTERPRETATION
      - text: "Contigmap RFdiffusion-AA — внешний файл спецификации длины/мотива; точный DSL **NR** без DOC audit."
        source: NR
      - text: "Symmetry conditioner Chroma tessellates asymmetric unit в energy/score — это геометрический constraint, не экспериментальный oligomer assay."
        source: PAPER
        locator: "Nature Fig. 3a"
      - text: "Language captions: bioRxiv ProCap масштабирует градиенты ×100 относительно prior, иначе sample ≈ unconditional. Это tool-specific heuristic caption model, не Kd."
        source: PAPER
        locator: "bioRxiv ProCap gradient factor 100"
      - text: "DiffAb не кондиционируется на library $\\mathcal{X}$ mutants. BoltzGen design-specification language — pointer catalog YAML, methods **NR**."
        source: NR
  - id: complexity
    title: "12. Вычислительная сложность"
    paragraphs:
      - text: "Драйверы класса: $N$ residues (или атомов), $T$ шагов / NFE, плотность графа (полный pair $O(N^2)$ vs Chroma random long-range $O(N)$ или $O(N\\log N)$), число траекторий, post-hoc AF2/MPNN, assay latency. All-atom дороже Cα при том же $N$, если state включает атомы — у RFAA predictor atom track; generative AA protein all-atom DDPM как default **не** доказан в прочитанных methods RFdiffusion-AA."
        source: INTERPRETATION
      - text: "Chroma Nature: previous structure generators typically $O(N^2)$ или $O(N^3)$; Chroma sub-quadratic, что авторы связывают с возможностью icosahedral 60 000 residues. Это **заявление paper** про scaling architecture, не независимо измеренный wall-clock каталога."
        source: PAPER
        locator: "Nature intro O(N^2)/O(N^3) vs sub-quadratic; Fig. 3a 60k"
      - text: "«Дешевле diffusion» vs frame models — **не писать** без NFE comparison в paper. Genie vs RFdiffusion: Lin сравнивает **число параметров** 4.1M vs 59.8M и in silico metrics, не wall-clock GPU каталога. Не обобщать как «Genie быстрее RFdiffusion на антителах»."
        source: PAPER
        locator: "Lin parameter count paragraph"
      - text: "V100 «few minutes» для ≥3000 residues — Nature/bioRxiv claim для **Chroma**. Не переносить на DiffAb T=100 или BoltzGen. GPU train times denoiser — NR."
        source: PAPER
        locator: "Nature V100 few minutes"
      - text: "RFdiffusion-AA in silico: 100 unfiltered designs для diversity TM clustering (Fig. S6) — это объём анализа diversity, не cost class. 4 416 DIG clones — экспериментальный масштаб кампании, не NFE."
        source: PAPER
        locator: "Krishna Fig. S6 100 designs; DIG 4416"
      - text: "Wet-lab latency доминирует claims of function. Complexity generator ≠ complexity ITC."
        source: INTERPRETATION
  - id: strengths
    title: "13. Преимущества"
    paragraphs:
      - text: "Прямой sampler $p(x)$ в $\\mathbb{R}^3$ делает естественными **coordinate clamps** (motif, ligand, shape): ограничение лежит в том же пространстве, что и state. Это следует из постановки, не из маркетинга «AI designs proteins»."
        source: INTERPRETATION
      - text: "Polymer $\\Sigma$ Chroma снижает нагрузку выучить chain connectivity с нуля (механизм: correlated noise matches polymer distance statistics). Sub-quadratic graph позволяет крупные комплексы в заявлении авторов."
        source: PAPER
        locator: "Nature Fig. 1a polymer; sub-quadratic"
      - text: "Genie: dual point-cloud forward + FS/IPA reverse даёт Gaussian DDPM без noising rotation matrices, сохраняя angular reasoning. In silico Table 1 — **не** wet-lab и не antibody CDR."
        source: PAPER
        locator: "Lin §1 contribution; Table 1 in silico"
      - text: "Chroma Nature wet-lab (эта кампания, не класс целиком): 310 proteins generated for expression; 172 unconditional 100–450 aa, все выше split-GFP negative control (human β3 adrenergic receptor); 40/42 (95%) semantic CATH set выше control; кристаллы UNC_079 PDB 8TNM RMSD 1.1 Å и UNC_239 8TNO RMSD 1.0 Å; conservative success ~3%, если считать только individually purified. Не обобщать на mAb affinity."
        source: PAPER
        locator: "Nature Fig. 5; 3% conservative; 8TNM/8TNO"
      - text: "RFdiffusion-AA preprint wet-lab (не Science SI): DIG — 4 416 designs yeast FACS; FP $K_d=10$ nM (Fig. 5 caption). Heme: 168 designs selected by AF2/pLDDT/RMSD → 135 expressed E. coli → 96 UV/Vis consistent with CYS-bound heme. Это **не** antibody campaign и не GALigandDock."
        source: PAPER
        locator: "Krishna preprint DIG 4416; Fig. 5 Kd=10nM; heme 168/135/96"
      - text: "Это **не** гарантия стабильности, аффинности, экспрессии для нового кондиционера. Likelihood Chroma не переносится как predictor успеха на второй length set. Internal score ≠ assay."
        source: PAPER
        locator: "Nature likelihood weak / fails on second set"
  - id: limits
    title: "14. Ограничения"
    paragraphs:
      - text: "Математика: isotropic Gaussian ломает локальную стереохимию; misspecification $\\Sigma$ даёт неверный polymer prior; ELBO/likelihood ≠ experimental $\\Delta G$; гибрид RFdiffusion-AA не равен coords-only DDPM, формула Brownian в SI unread."
        source: INTERPRETATION
      - text: "Представление: нет side chains в generator state у Genie/RFdiffusion-AA; ligand pose зафиксирован; DiffAb Cα+frame+type — не эта страница как канон; BoltzGen object NR."
        source: INTERPRETATION
      - text: "Физика/химия: нет явного solvent, протонирования, гликанов, H-bond energy head. Conditioner «shape» не гидродинамика."
        source: INTERPRETATION
      - text: "Данные/bias: PDB (Chroma cutoff 20 Mar 2022); часто встречающиеся лиганды (FAD, SAM) дают менее diverse binders в Fig. S6 preprint — bias familiar pockets. Language conditioner может не быть semantic."
        source: PAPER
        locator: "Krishna Fig. S6 FAD/SAM vs IAI/OQO diversity"
      - text: "Обобщение: нет prospective mAb $K_d$ в разобранных Chroma/Genie papers; VHH CDR infill — figure. RFdiffusion-AA — small-molecule/heme/bilin, не IgG. Не переносить DIG FP на CDR design."
        source: INTERPRETATION
      - text: "Deployment: Chroma weights gated (каталог: API key); RFdiffusion-AA environment/container; BoltzGen preprint. Код Chroma не line-audited."
        source: MATRIX
        locator: "chroma.yaml gated weights"
  - id: failures
    title: "15. Failure modes"
    paragraphs:
      - text: "Ниже — конкретные ошибки пользователя и модели, не общие «может не сработать»."
        source: INTERPRETATION
    items:
      - "Считать [RFdiffusion](/tools/rfdiffusion.html) coords-only generator: канон — [frame diffusion](/architectures/frame-diffusion.html); Gaussian translations ≠ эта страница как default."
      - "Считать [DiffAb](/tools/diffab.html) или [BoltzGen](/tools/boltzgen.html) coords-only: joint type+geometry; BoltzGen methods unread."
      - "Копировать IGSO(3) / Lipman CFM / UCB / ProGen NLL как уравнение этого класса."
      - "Принять Chroma likelihood, AF2 pLDDT, scRMSD, GALigandDock ΔG, conditioner energy за experimental Kd / ELISA."
      - "Запустить isotropic Cα DDPM без equivariance/centering и интерпретировать абсолютные xyz как физический fold (exploded bonds, broken SE(3))."
      - "Неверный ligand conformer / PDB numbering у RFdiffusion-AA → карман под неправильную химию (clamp analogue)."
      - "Считать unconditional Chroma sample «antibody–antigen-like» (Nature Fig. 2a, TM 0.46/0.43 к antigen-like chains) de novo antibody design."
      - "VHH CDR infill Chroma (Fig. 3b) принять за wet-lab antibody campaign."
      - "Игнорировать length–solubility anti-correlation split-GFP (Nature Supplementary Fig. 34) и ждать равного успеха 100 vs 450 aa."
      - "Смешать RFAA predictor FAPE с RFdiffusion-AA generator; ждать sequence из diffusion head."
      - "Truncation sampler / слишком мало T на isotropic DDPM → unstructured cloud; Chroma без low-T — overdispersed unstructured (bioRxiv)."
      - "Library misspecification: ждать epitope-specific mAb от ligand-conditioned RFdiffusion-AA."
      - "Сравнивать Genie Table 1, Chroma split-GFP и DIG FP как один benchmark."
  - id: tools
    title: "16. Реализации в инструментах"
    paragraphs:
      - text: "Таблица — **все** catalog tools с `architecture_id: coordinate-diffusion`. Непрочитанный tool: NR в tool-specific, без выдуманных уравнений. Успех кампаний не ставить в одну колонку."
        source: MATRIX
    tables:
      - caption: "Catalog reverse index"
        source: MATRIX
        headers: ["Tool", "Generic architecture", "Tool-specific implementation", "Important difference"]
        rows:
          - ["[Chroma](/tools/chroma.html)", "correlated Cartesian VP-SDE + post-hoc design GNN/CRF", "polymer Σ=RR⊤; sub-quadratic random graph; classifier guidance; low-T λ; Nature 310 designs / 8TNM / 8TNO", "Staged coords **then** sequence, не joint DPM; weights gated; код SHA NR"]
          - ["[RFdiffusion-AA](/tools/rfdiffusion-aa.html)", "гибрид Gaussian Cα + Brownian SO(3) вокруг clamped ligand", "FT from RFAA; LigandMPNN after; DIG 4416 yeast, FP Kd=10 nM (preprint Fig. 5); heme 168/135/96; Science Methods NR", "Не isotropic all-atom protein DDPM; не antibody; journal ITC не цитировать"]
          - ["[RFdiffusion](/tools/rfdiffusion.html)", "тег из‑за Gaussian translations", "Nature Methods **NR**; канон — [frame diffusion](/architectures/frame-diffusion.html)", "Не писать Ho Cα DDPM как уравнение default checkpoint"]
          - ["[DiffAb](/tools/diffab.html)", "Cα Gaussian **канал** joint DPM", "FullDPM T=100; pos/10 Å; local ε → `apply_rotation_to_vector`; commit `c3e2966601bf8025025ab87717b31b08fdd4834e`", "Канон — [joint](/architectures/joint-sequence-structure-diffusion.html); result tables paper NR"]
          - ["[BoltzGen](/tools/boltzgen.html)", "в матрице tagged coordinate-diffusion", "**NR** methods; не считать coords-only", "Канон ближе joint all-atom; preprint 10.1101/2025.11.20.689494 unread"]
      - caption: "Литература вне карточек tools"
        source: PAPER
        headers: ["Метод", "Роль", "Каталог"]
        rows:
          - ["Genie (Lin & AlQuraishi, ICML 2023)", "канон isotropic Cα DDPM + FS/IPA denoiser; T=1000; 4.1M", "не карточка tools"]
          - ["ProtDiff (Trippe et al.)", "EGNN Cα DDPM; chirality issue per Genie §1", "не catalog tool"]
          - ["Ho et al. 2020 DDPM", "родовой VP", "не белковый tool"]
          - ["RFAA predictor (Krishna)", "folding/docking head, FAPE", "не generator; не путать с RFdiffusion-AA"]
  - id: applicability
    title: "17. Где применимо и где не применимо"
    paragraphs:
      - text: "Применимо: [de novo backbone](/tasks/de-novo-backbone-generation.html) и workflow [de-novo-backbone-then-mpnn](/workflows/de-novo-backbone-then-mpnn.html) (RFdiffusion-AA + LigandMPNN; Chroma своим design net). [Full 3D](/tasks/full-3d-structure-generation.html). [Motif scaffolding](/tasks/motif-scaffolding.html) clamp. [Functional site / ligand](/tasks/functional-site-design.html) у RFdiffusion-AA. [Joint multimodal](/workflows/joint-multimodal-generation.html) для Chroma как staged backbone+sequence, не как DiffAb joint DPM."
        source: MATRIX
      - text: "Частично: [target-conditioned binder](/tasks/target-conditioned-binder-generation.html) — да для small-molecule RFdiffusion-AA и programmable Chroma, **нет** как замена [RFantibody](/tools/rfantibody.html) epitope-conditioned antibody. [Joint CDR](/tasks/joint-cdr-sequence-structure-design.html) — DiffAb, но канон joint-страница; workflow [cdr-codesign-diffab](/workflows/cdr-codesign-diffab.html)."
        source: INTERPRETATION
      - text: "**Нельзя** решать этим классом: [cdr-sequence-generation](/tasks/cdr-sequence-generation.html) без 3D state (для sequence-only — [protein language models](/architectures/protein-language-models.html) / [PALM-H3](/tools/palm-h3.html)). [Few-shot active learning](/tasks/few-shot-active-learning.html) / ELISA loop — [active learning](/architectures/active-learning.html), не DDPM. [Humanization](/tasks/humanization.html). [Codon / CHO / secretion](/tasks/codon-optimization.html). [Zero-shot mutation scoring](/architectures/zero-shot-mutation-scoring.html) как ESM-1v Δℓ."
        source: INTERPRETATION
      - text: "Вместо coords-only для antibody CDR co-design — [joint sequence–structure diffusion](/architectures/joint-sequence-structure-diffusion.html). Для de novo IgG backbone+IF — [frame diffusion](/architectures/frame-diffusion.html) + [inverse folding](/architectures/inverse-folding.html). Для affinity maturation с замерами — assay-loop, не Chroma likelihood."
        source: INTERPRETATION
      - text: "[Universal all-atom binder](/workflows/universal-all-atom-binder.html) / BoltzGen: не утверждать, что workflow = этот класс, пока methods unread."
        source: NR
  - id: method-sources
    title: "18. Методологические источники"
    paragraphs:
      - text: "Прочитаны (full HTML methods/results, не abstract-only): Chroma Nature journal HTML (эксперимент, Data); Chroma bioRxiv Appendix A–B (SDE, ELBO, low-T; SI C–G, L не page-read); Genie arXiv 2301.12485 HTML §§2–4 и Table 1; RFAA/RFdiffusion-AA bioRxiv 2023.10.09.561603 HTML (predictor vs generator, DIG/heme); DiffAb `dpm_full.py` @c3e29666 (ранее). Ho 2020 / Song 2021 — foundational pointers, не белковый close-read beyond citations Chroma."
        source: PAPER
      - text: "Pointer-only / unread: Nature Chroma SI tables; Science 10.1126/science.adl2528 Methods (ITC и journal-only heme crystal RMSD не брать из чужих заметок); RFdiffusion Nature Methods; BoltzGen methods; chroma GitHub; FoldingDiff torsion paper; Protein-Generator (другой architecture_id)."
        source: NR
      - text: "Preprint vs journal: Chroma icosahedral residue count 96k (bioRxiv) vs 60k (Nature) — цитировать Nature. DIG affinity: preprint FP 10 nM; Science ITC, если появится в SI, **не** подставлять из памяти. Не раздувать библиографию всеми protein diffusion 2022–2026."
        source: INTERPRETATION
