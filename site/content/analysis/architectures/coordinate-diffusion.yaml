status_note: "Класс coordinate diffusion описан по Ingraham et al. Chroma Nature HTML (эксперимент, Figs. 2–5) и bioRxiv 10.1101/2022.12.01.518682 Appendix A (VP-SDE, whitening, ELBO); Lin & AlQuraishi Genie arXiv 2301.12485 HTML (Eqs. 1–3, T=1000, Frenet–Serret); Krishna et al. RFAA/RFdiffusion-AA bioRxiv 10.1101/2023.10.09.561603 HTML (Gaussian Cα + Brownian SO(3), LigandMPNN, DIG/heme wet-lab). DiffAb: Cα-канал по Luo NeurIPS 2022 и коду luost26/diffab @c3e2966601bf8025025ab87717b31b08fdd4834e. Nature Chroma SI Tables 2–3 / Appendices C–G, L не page-read. Science 10.1126/science.adl2528 Methods не close-read (цифры DIG/heme — из preprint HTML). RFdiffusion Nature Methods не close-read. BoltzGen 10.1101/2025.11.20.689494 methods unread. generatebio/chroma commit не аудировался (веса gated)."
lede: "Coordinate diffusion — **generator** геометрии: reverse SDE/DDPM на декартовых координатах $x\\in\\mathbb{R}^{N\\times 3}$ (Cα или атомы). Это не density model последовательности, не affinity scorer и не frame diffusion: frames, если есть, **вычисляются из coords** или принадлежат другому каналу."
