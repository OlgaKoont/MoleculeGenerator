sections:
  - id: domain
    title: "1. Область определения"
    paragraphs:
      - text: "Роль в пайплайне — **generator** (иногда density model геометрии): сеть учится обращать forward noising декартовых координат и семплирует $x$ интегратором SDE/ODE/DDPM. Это не sequential design loop (нет UCB/assay round), не geometric inductive bias как отдельный класс ([SE(3)-equivariant models](/architectures/se3-equivariant-models.html) — слой внутри denoiser), не scorer аффинности."
        source: INTERPRETATION
      - text: "Generated state — непрерывные координаты $x\\in\\mathbb{R}^{N\\times 3}$: Cα (Genie, DiffAb position channel) или backbone/heavy atoms (Chroma backbone track). Scored state на шаге $t$ — noisy $x_t$; выход сети — $\\varepsilon_\\theta$, $\\hat x_0$ или score $\\nabla\\log p_t(x)$. Sequence tokens **не** обязаны входить в тот же reverse process."
        source: PAPER
        locator: "Lin §2.1 $x=[x^1..x^N]$ Cα; Ingraham Nature: backbone diffusion then design network"
      - text: "Задачи каталога, которые класс реально закрывает как backbone/geometry generator: [de novo backbone](/tasks/de-novo-backbone-generation.html), [full 3D structure](/tasks/full-3d-structure-generation.html), [motif scaffolding](/tasks/motif-scaffolding.html) через clamp координат, [functional-site / ligand-context](/tasks/functional-site-design.html) у [RFdiffusion-AA](/tools/rfdiffusion-aa.html), [joint sequence–structure](/tasks/joint-sequence-structure-generation.html) только если sequence идёт **отдельным** модулем после coords ([Chroma](/tools/chroma.html)) или параллельным каналом (тогда канон — [joint diffusion](/architectures/joint-sequence-structure-diffusion.html))."
        source: MATRIX
        locator: "seed applicable_task_ids; tool task_ids"
      - text: "Это **не** [frame diffusion](/architectures/frame-diffusion.html): там state $(R_i,t_i)\\in\\mathrm{SE}(3)$, ядро на вращениях — IGSO(3)/Brownian, не «просто Gaussian на xyz». [RFdiffusion](/tools/rfdiffusion.html) помечен обоими `architecture_id` из‑за Gaussian трансляций Cα, но **каноническая** страница инструмента — frame diffusion; не переносить IGSO(3) FrameDiff сюда как train target класса."
        source: INTERPRETATION
      - text: "Это **не** [joint sequence–structure diffusion](/architectures/joint-sequence-structure-diffusion.html): type tokens и SO(3) входят в тот же DPM. [DiffAb](/tools/diffab.html) имеет Cα-канал, но объект генерации — joint type+Cα+orientation. [BoltzGen](/tools/boltzgen.html) в матрице тоже несёт этот id; methods unread — не считать coords-only."
        source: INTERPRETATION
      - text: "Это **не** [flow matching](/architectures/flow-matching.html): там interpolant/ODE без SDE-шума как генератор; не копировать Lipman CFM. Это **не** [torsion diffusion](/architectures/torsion-diffusion.html): state — углы на торе, не Cartesian. Это **не** predictor (AlphaFold2 / RFAA folding head): FAPE и recycle — не reverse diffusion."
        source: INTERPRETATION
      - text: "Catalog tools с `architecture_id: coordinate-diffusion`: [Chroma](/tools/chroma.html), [RFdiffusion-AA](/tools/rfdiffusion-aa.html), [RFdiffusion](/tools/rfdiffusion.html), [DiffAb](/tools/diffab.html), [BoltzGen](/tools/boltzgen.html). Часто путают с [FrameDiff](/tools/framediff.html) (нет этого id; SE(3) frames), с [ProteinMPNN](/tools/proteinmpnn.html) / [LigandMPNN](/tools/ligandmpnn.html) (sequence после геометрии — **evaluator/design stage**, не coordinate DPM), с [Protein-Generator](/tools/protein-generator.html) (`sequence-diffusion`, не этот id)."
        source: MATRIX
      - text: "Литература вне карточек tools, без которой isotropic subtype непонятен: Genie (Lin & AlQuraishi) — Cα DDPM с Frenet–Serret только в denoiser; ProtDiff (Trippe et al., цитируется Genie) — EGNN Cα DDPM. Оба **не** catalog tools."
        source: PAPER
        locator: "Lin §1 ProtDiff; §2 Genie"
  - id: intuition
    title: "2. Интуитивный принцип"
    paragraphs:
      - text: "Forward process разрушает нативную геометрию добавлением шума в $\\mathbb{R}^3$. Сеть учится предсказывать либо шум $\\varepsilon$, либо чистые координаты $x_0$, либо score. Reverse integrator собирает складку из облака точек. При inference меняется **координатный state** $x_t\\to x_{t-1}$; identity аминокислот появляется только если есть отдельный sequence head, CRF/IF после backbone, или параллельный discrete канал."
        source: INTERPRETATION
      - text: "Изотропный Gaussian (Genie; DiffAb position; Ho DDPM) не знает, что белок — полимер: связность цепи и $R_g$ сеть должна выучить с нуля. Главный эмпирический рычаг **Chroma** — informative polymer prior: коррелированный шум с ковариацией collapsed-polymer, чтобы prior уже был chain-like."
        source: PAPER
        locator: "Ingraham Nature Fig. 1a / bioRxiv Appendix C pointer; Genie §2.1 isotropic"
      - text: "Второй рычаг Chroma — **low-temperature** sampling (модифицированный reverse SDE / hybrid Langevin), потому что обычный reverse даёт overdispersed unstructured samples. BioRxiv характеризует 50 000 single-chain и 10 000 complex при $\\lambda_0=10$. Это PAPER, не «температура softmax последовательности»."
        source: PAPER
        locator: "Ingraham bioRxiv low-temperature sampling; λ0=10, 50k/10k"
      - text: "Genie вводит геометрическую асимметрию: forward шумит **точки** Cα (чтобы остаться в Gaussian DDPM), а denoiser строит Frenet–Serret frames из $x_t$ и считает IPA на кадрах. Frames **не** диффундируют. Это не FrameDiff."
        source: PAPER
        locator: "Lin §1 dual representation; §2.2 FS frames"
      - text: "RFdiffusion-AA: старт — Gaussian residue cloud вокруг **зажатого** ligand Cartesian; denoiser (fine-tune RFAA) предсказывает чистую структуру; sequence ставит LigandMPNN **после**. Ligand не семплируется тем же isotropic all-atom DDPM."
        source: PAPER
        locator: "Krishna preprint §RFdiffusionAA; Fig. 4A"
      - text: "Предостережение по метрикам. Likelihood Chroma, conditioner energy, pLDDT, scRMSD, TM к native, GALigandDock $\\Delta G$, FPSD **не** являются experimental affinity / $K_d$ / ELISA / BLI и не являются $\\Delta G$ фолдинга. Nature прямо: likelihood **слабо** предсказывает растворимую экспрессию в одном conditional сете и **не** во втором (длины до 950 а.о.)."
        source: PAPER
        locator: "Ingraham Nature: likelihood weakly predictive / Supplementary Fig. 35"
      - text: "In silico «binding $\\Delta G$» у RFdiffusion-AA — минимум GALigandDock по LigandMPNN sequences; это **evaluator**, не train target diffusion и не ITC. Preprint сравнивает его с heuristic potential protein-only RFdiffusion ($p<1.56\\times 10^{-12}$ на четырёх малых молекулах) — вычислительный oracle, не wet-lab Kd класса."
        source: PAPER
        locator: "Krishna preprint Fig. 4C caption; in silico paragraph"
      - text: "Clamped motif / ligand / symmetry conditioner задаёт геометрическое ограничение sampling, не «энергию связывания». VHH CDR infill у Chroma — computational figure, не SPR-кампания антител."
        source: PAPER
        locator: "Ingraham Nature Fig. 3b VHH CDR rebuild"
  - id: math
    title: "3. Формальная математическая постановка"
    paragraphs:
      - text: "Сначала родовой isotropic VP-DDPM на Cartesian $x$. Затем подтипы: (i) Genie/Ho cosine DDPM; (ii) Chroma correlated polymer VP-SDE; (iii) гибрид RFdiffusion-AA (Gaussian Cα + Brownian SO(3) вокруг clamped ligand); (iv) Cα-канал DiffAb как **канал joint DPM**. Не писать одну «универсальную» формулу на все tools. Не подставлять seed one-liner как уравнение Chroma или RFdiffusion."
        source: INTERPRETATION
      - text: "Формулы, которые **не** являются уравнениями default-инструмента этого класса и **не** train target страницы: IGSO(3) FrameDiff; Lipman CFM / conditional flow matching; UCB; AR NLL ProGen; FAPE (loss **predictor** RFAA/AF2); MLM $\\Delta\\ell$; DiffAb sequence KL как «уравнение coordinate diffusion»."
        source: INTERPRETATION
      - text: "Reverse-time SDE в whitened space (Chroma, Anderson/Song) зависит от score $\\nabla_z\\log p_t(z)$; в $x$-координатах появляется фактор $RR^\\top$ перед $\\nabla_x\\log p_t(x)$ и шум $R\\,d\\bar w$. Probability-flow ODE — детерминированный предел без стохастического члена. Это **не** CFM Lipman и не default sampler DiffAb ($T=100$ ancestral)."
        source: PAPER
        locator: "bioRxiv Appendix A Reverse-time SDE"
      - text: "Gaussian translations RFdiffusion **не** делают эту страницу default для того инструмента: ориентации шумятся как rotations. Не сравнивать Chroma split-GFP, RFdiffusion-AA DIG FP и DiffAb in silico AAR как один benchmark: generated object, oracle и split разные."
        source: INTERPRETATION
    equations:
      - latex: "x\\in\\mathbb{R}^{N\\times 3},\\quad q(x_t\\mid x_0)=\\mathcal{N}\\bigl(\\sqrt{\\bar\\alpha_t}\\,x_0,\\,(1-\\bar\\alpha_t)I\\bigr),\\quad x_t=\\sqrt{\\bar\\alpha_t}\\,x_0+\\sqrt{1-\\bar\\alpha_t}\\,\\varepsilon,\\;\\varepsilon\\sim\\mathcal{N}(0,I)"
        caption: "Родовой isotropic VP/DDPM на декартовых координатах (Ho 2020). Train target — noise-prediction MSE или эквивалентный score matching. Семплируется reverse Gaussian. Generic: не checkpoint Chroma, не RFdiffusion, не BoltzGen."
        generic_or_specific: generic
        source: PAPER
        locator: "Ho DDPM; Lin Genie Eqs. 1–2"
        symbols:
          - {sym: x_0, type: "R^{N×3}", meaning: "чистые координаты (обычно Cα)"}
          - {sym: x_t, type: "R^{N×3}", meaning: "зашумлённые координаты на шаге t"}
          - {sym: "\\bar\\alpha_t", type: "scalar", meaning: "кумулятивный signal scale; α_s=1-β_s"}
          - {sym: ε, type: "R^{N×3}", meaning: "изотропный Gaussian шум"}
          - {sym: N, type: "int", meaning: "число residues (или атомов, если all-atom state)"}
        meaning: "Оптимизируется denoising/score на xyz. Семплируется траектория координат. Sequence, frames SO(3), affinity labels в эту формулу не входят."
    sections:
      - id: math-genie
        level: 3
        title: "Подтип A — isotropic Cα DDPM (Genie; родовой Ho на белках)"
        paragraphs:
          - text: "Genie: cosine variance schedule, $T=1000$. Reverse mean из $\\varepsilon_\\theta$ по формуле Ho. $\\Sigma_\\theta=\\beta_t$. Frames Frenet–Serret строятся из $x_t$, **не** входят в $q(\\cdot)$."
            source: PAPER
            locator: "Lin Eqs. 1–3; T=1000; Σ_θ=β_t"
        equations:
          - latex: "L=\\mathbb{E}_{t,x_0,\\varepsilon}\\Bigl[\\sum_{i=1}^{N}\\lVert\\varepsilon_t-\\varepsilon_\\theta(\\sqrt{\\bar\\alpha_t}x_0+\\sqrt{1-\\bar\\alpha_t}\\varepsilon_t,t)\\rVert^2\\Bigr]"
            caption: "Genie loss (Ho noise prediction), сумма L2 по residues. Не ELBO Chroma. Не DiffAb joint loss. Не catalog-tool equation: Genie не карточка tools."
            generic_or_specific: generic
            source: PAPER
            locator: "Lin §2.4 Loss"
            symbols:
              - {sym: "\\varepsilon_\\theta", type: "network", meaning: "предсказание Cartesian displacement / noise"}
              - {sym: t, type: "int in 1..T", meaning: "равномерно семплируемый шаг; T=1000"}
            meaning: "Обучается ε-MSE. Семплируется ancestral reverse от x_T~N(0,I) по Cα."
      - id: math-chroma
        level: 3
        title: "Подтип B — коррелированный polymer VP-SDE (Chroma)"
        paragraphs:
          - text: "Whitening $z=\\Sigma^{-1/2}(x-b)$, $\\Sigma=RR^\\top$ подгоняется **offline** под статистику полимера (chain + $R_g$), не совместно с $\\theta$. VP-SDE в $z$-пространстве индуцирует коррелированный процесс в $x$. Probability-flow ODE — детерминированный encode/sample. Это **не** isotropic Genie и не IGSO(3)."
            source: PAPER
            locator: "Ingraham bioRxiv Appendix A.1"
        equations:
          - latex: "x=Rz,\\quad \\mathrm{d}z=-\\tfrac{\\beta_t}{2}z\\,\\mathrm{d}t+\\sqrt{\\beta_t}\\,\\mathrm{d}w,\\quad \\mathrm{d}x=-\\tfrac{\\beta_t}{2}x\\,\\mathrm{d}t+\\sqrt{\\beta_t}\\,R\\,\\mathrm{d}w"
            caption: "Correlated VP-SDE Chroma. Эквивалентно $x_t=\\sqrt{\\alpha_t}x_0+\\sqrt{1-\\alpha_t}R\\varepsilon$, $\\varepsilon\\sim\\mathcal{N}(0,I)$, с $x_t\\sim\\mathcal{N}(\\sqrt{\\alpha_t}x_0,(1-\\alpha_t)RR^\\top)$. $R$ — квадратный корень ковариации, не rotation matrix residue frame."
            generic_or_specific: "Chroma [PAPER] generic subtype"
            source: PAPER
            locator: "bioRxiv Appendix A.1; α_t=∫_0^t exp(−β_s)ds"
            symbols:
              - {sym: z, type: "R^{N×3}", meaning: "whitened coords; prior N(0,I)"}
              - {sym: R, type: "matrix", meaning: "Σ^{1/2} polymer covariance factor (offline)"}
              - {sym: "\\Sigma", type: "covariance", meaning: "RR⊤; collapsed-polymer stats"}
              - {sym: "\\beta_t", type: "schedule", meaning: "continuous-time noise rate, t∈(0,1)"}
              - {sym: w, type: "Wiener", meaning: "стандартный винеровский процесс"}
            meaning: "Обучается denoiser x̂_θ / ELBO в z-space. Семплируется reverse SDE или probability-flow ODE на backbone coords; sequence — отдельная design GNN/CRF после."
          - latex: "L_x^{\\mathrm{reg}}(x;\\theta)=-\\mathbb{E}\\Bigl[\\tfrac{\\alpha_t\\beta_t}{2(1-\\alpha_t)^2}\\lVert(R^{-1}+\\omega I)(x_\\theta(x_t,t)-x)\\rVert_2^2\\Bigr]"
            caption: "Regularized ELBO Chroma: смесь whitened и unwhitened reconstruction (абсолютная ошибка в nm). log|det R| константа при fixed R. Не FAPE. Не DiffAb ε-MSE."
            generic_or_specific: "Chroma [PAPER]"
            source: PAPER
            locator: "bioRxiv Appendix A.2 Regularized loss"
            symbols:
              - {sym: "x_\\theta", type: "denoiser", meaning: "предсказание x_0 из (x_t,t)"}
              - {sym: "\\omega", type: "scalar", meaning: "вес x-space; paper: scale so x in nanometers"}
            meaning: "Оптимизируется геометрический denoising backbone. Не affinity labels."
          - latex: "\\nabla_x\\log p_t(x\\mid y)=\\nabla_x\\log p_t(x)+\\nabla_x\\log p_t(y\\mid x)"
            caption: "Classifier guidance (Song et al.), как использует Chroma для programmable y (symmetry, substructure, class, captions). y — не ELISA и не epitope one-hot RFantibody."
            generic_or_specific: "Chroma conditioning [PAPER]"
            source: PAPER
            locator: "Song ICLR 2021; Ingraham Nature programmable conditioners"
            symbols:
              - {sym: y, type: "conditioner", meaning: "symmetry / motif RMSD / CATH / text и т.п."}
            meaning: "Семплирование смещается градиентом conditioner; не train UCB."
      - id: math-rfaa
        level: 3
        title: "Подтип C — гибрид Gaussian Cα + Brownian SO(3) при clamped ligand (RFdiffusion-AA)"
        paragraphs:
          - text: "Preprint: native noising — progressive shrinking + **3D Gaussian noise to the Cα coordinates** and **Brownian motion on the manifold of rotations**. Motifs / ligand coords подаются как context (explicitly conditional FT, не Song guidance). Это **не** isotropic all-atom protein DDPM и не coords-only страница как default RFdiffusion. Sequence не в diffusion loss."
            source: PAPER
            locator: "Krishna preprint paragraph RFdiffusionAA / Fig. 4A"
        equations:
          - latex: "q(t_{i,\\tau}\\mid t_{i,0})=\\mathcal{N}(\\sqrt{\\bar\\alpha}\\,t_{i,0},(1-\\bar\\alpha)I),\\qquad q(R_{i,\\tau}\\mid R_{i,0})=\\mathrm{Brownian}(\\mathrm{SO}(3))"
            caption: "Качественная запись ядра из prose preprint (закрытая форма Brownian на SO(3) в Science SI — NR). Ligand Cartesian clamped. Не копировать IGSO(3) FrameDiff как доказанную формулу этого checkpoint."
            generic_or_specific: "RFdiffusion-AA [PAPER] hybrid; не default isotropic class"
            source: PAPER
            locator: "bioRxiv 2023.10.09.561603 RFdiffusionAA paragraph"
            symbols:
              - {sym: "t_i", type: "R^3", meaning: "Cα / frame translation residue i"}
              - {sym: "R_i", type: "SO(3)", meaning: "ориентация residue frame"}
              - {sym: "\\tau", type: "diffusion time", meaning: "дискретное noising; T inference README NR this pass"}
            meaning: "Обучается denoising protein structure given biomolecular context (FT from RFAA weights). Семплируется backbone вокруг ligand; LigandMPNN — post-hoc sequence."
      - id: math-diffab
        level: 3
        title: "Подтип D — Cα Gaussian как канал joint DPM (DiffAb; не coords-only)"
        paragraphs:
          - text: "В `FullDPM` позиция нормируется на 10 Å; ε позиции предсказывается в локальном кадре и ротируется в world (`apply_rotation_to_vector`). Параллельно — SO(3) и discrete types. Каноническая математика — [joint sequence–structure diffusion](/architectures/joint-sequence-structure-diffusion.html). Здесь только факт: **есть** Cartesian Gaussian канал."
            source: CODE
            locator: "dpm_full.py EpsilonNet; codesign_single.yml T=100, position scale 10 Å; commit c3e29666"
        equations:
          - latex: "p_t=\\sqrt{\\bar\\alpha_t}\\,p_0+\\sqrt{1-\\bar\\alpha_t}\\,\\varepsilon_p,\\quad \\varepsilon_p\\sim\\mathcal{N}(0,I_{L\\times 3})"
            caption: "Позиционный канал DiffAb (тот же VP, что generic). Не уравнение всего DiffAb. Не Chroma Σ."
            generic_or_specific: "DiffAb position channel [CODE+PAPER]; tool-specific joint remainder на joint-странице"
            source: CODE
            locator: "Luo joint DPM; dpm_full.py"
            symbols:
              - {sym: p, type: "R^{L×3}", meaning: "Cα генерируемых CDR residues"}
              - {sym: L, type: "int", meaning: "длина маски generate; не полный антиген"}
            meaning: "Оптимизируется совместно с type/orientation losses. Семплируется CDR geometry+sequence; antigen/framework clamped."
    tables:
      - caption: "Смежные постановки, которые нельзя смешивать"
        source: INTERPRETATION
        headers: ["Постановка", "Train target", "Sampler/декодер", "Что в каталоге"]
        rows:
          - ["Coordinate diffusion (эта страница)", "ε / x0 / score на xyz (± polymer Σ)", "DDPM/SDE/ODE на точках; clamp coords", "Chroma; гибрид RFdiffusion-AA; Cα-канал DiffAb"]
          - ["[Frame diffusion](/architectures/frame-diffusion.html)", "score/x0 на $(R_i,t_i)\\in\\mathrm{SE}(3)$", "reverse на frames; IGSO(3)/Brownian rotations", "RFdiffusion (канон), FrameDiff, RFantibody"]
          - ["[Joint seq–struct diffusion](/architectures/joint-sequence-structure-diffusion.html)", "факторизованный type + geometry", "T шагов joint reverse", "DiffAb (канон), BoltzGen family, AbDiffuser"]
          - ["[Flow matching](/architectures/flow-matching.html)", "vector field interpolant (не SDE-шум)", "ODE / CFM", "FlowDesign / Proteina — не этот класс"]
