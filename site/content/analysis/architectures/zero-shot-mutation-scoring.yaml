status_note: "Класс — scorer substitutions без новых assay labels, не few-shot surrogate и не de novo topology. Прочитаны: Meier et al. ESM-1v bioRxiv 10.1101/2021.07.09.450648 v2 HTML Method §3 masked-marginal (preprint; journal pagination не сличена); Hie et al. Efficient evolution Nat. Biotechnol. HTML Methods+Results (journal 10.1038/s41587-023-01763-2; wild-type-marginal consensus, не Meier Eq. 1); Shanker et al. bioRxiv 10.1101/2023.12.19.572475 HTML Methods+campaign (preprint; Science 10.1126/science.adk8946 HTML Cloudflare — journal body не page-sync; abstract Science: «up to 25-fold» neutralization vs preprint 26-fold). CODE brianhie/efficient-evolution, varun-shanker/structural-evolution, facebookresearch/esm — не line-audit (commit NR). Hie Supplementary Tables 1–12 numeric cells HTML частично; Science SI NR. AntiFold не имеет этого architecture_id."
lede: "Zero-shot mutation scoring — **scorer** (иногда mutation-proposal workflow): ранжирует substitutions parent'а по pretrained likelihood без новых $y$. Это не generator новой topology, не few-shot surrogate на ELISA и не affinity predictor. Masked-marginal Meier, wild-type-marginal Hie и IF $p(x\\mid Y)$ Shanker — **разные** формулы."
