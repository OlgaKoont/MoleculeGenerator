lede: "EVOLVEpro **не** генерирует de novo sequences из шума. Это few-shot **ранжировщик** вариантов в заранее заданном пуле: frozen PLM embeddings + top-layer regressor, итеративно обучаемый на experimental labels. Default acquisition released code — **top-N по $\\hat y$**, не UCB/EI/PI/BALD."
