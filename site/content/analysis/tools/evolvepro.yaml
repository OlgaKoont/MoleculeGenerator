sections:
  - id: what
    title: "1. Что именно делает инструмент"
    paragraphs:
      - text: "**Вход:** parent / WT FASTA, таблица experimental activity по вариантам, матрица PLM embeddings для **того же** набора variant ID. Пул $\\mathcal{X}$ задаётся пользователем (single- и/или multi-mutant файлы)."
        source: CODE
        locator: "evolve_experimental / load_experimental_embeddings"
      - text: "**Выход:** таблица `y_pred` по ещё не измеренным вариантам и ranked shortlist на следующий round. Это **не** sampled FASTA из generative LM и не 3D-структура."
        source: CODE
      - text: "**Фиксируется:** PLM веса (не fine-tune под activity в описанном методе). **Изменяется:** набор измеренных labels и, следовательно, fit top-layer; выбранные mutants для синтеза/assay."
        source: PAPER
        locator: "preprint: frozen embeddings + top layer"
      - text: "**Parent-based optimization**, не de novo topology. Generated object каталога: ranked mutation set / next-round library."
        source: PAPER
  - id: arch-para
    title: "2. Архитектура в одном абзаце"
    paragraphs:
      - text: "Каждый вариант $s$ отображается pretrained protein language model в вектор $E(s)$ (оптимальная конфигурация preprint: ESM-2 15B, residue-pooled **average** embeddings). На накопленных парах $(E(s),y)$ обучается sklearn-регрессор; default и победитель grid search — **RandomForestRegressor**. Следующая партия — $k$ вариантов с наибольшим $\\hat y$ (`learning_strategy='topn'`). Раунд 0 в оптимальной DMS-конфигурации — **random** (не medoids). PLM **не** дообучается на fitness."
        source: PAPER
        locator: "preprint grid search; CODE defaults"
  - id: math-model
    title: "4. Математическая модель"
    paragraphs:
      - text: "Условная плотность fitness **не** моделируется явно в default RF. Оптимизируется регрессия $y\\approx f_\\phi(E(s))$. Selection rule released code:"
        source: CODE
    equations:
      - latex: "\\hat y(s)=f_\\phi(E(s)),\\qquad B_t=\\operatorname{top}_k\\{s\\in U_t:\\hat y(s)\\}"
        caption: "Tool-specific default. $E$ frozen; $f_\\phi$ — RF или другой `regression_type`."
        generic_or_specific: "tool-specific [CODE]"
        source: CODE
        symbols:
          - {sym: E(s), type: vector, meaning: "PLM embedding варианта"}
          - {sym: f_phi, type: function, meaning: "top-layer regressor"}
          - {sym: U_t, type: set, meaning: "ещё не измеренные варианты в таблице embeddings"}
          - {sym: k, type: integer, meaning: "num_mutants_per_round (DMS sim. часто 16; experimental default number_of_variants=12 для печати top)"}
        meaning: "Нет $\\kappa\\sigma(x)$. Переменные `std_predictions` в dataframe — нули."
      - latex: "\\min_\\phi \\sum_{(s,y)\\in D_t} \\ell\\big(y,f_\\phi(E(s))\\big)"
        caption: "Схема обучения top-layer. Для RF $\\ell$ — criterion деревьев (`friedman_mse`), не выписанный авторами как одна формула в preprint HTML."
        generic_or_specific: "tool-specific schema [CODE]"
        source: CODE
    paragraphs:
      - text: "Другие `learning_strategy` в симуляции: `random`, `dist` (max min-Euclidean distance в embedding к train — exploration), `topn2bottomn2`. Это **не** EI/PI. `regression_type` может быть ridge/lasso/elasticnet/linear/neuralnet/randomforest/gradientboosting/knn/gp — но experimental path **жёстко** вызывает `randomforest`."
        source: CODE
        locator: "evolve.py directed_evolution_simulation; evolve_experimental regression_type='randomforest'"
  - id: physical-state
    title: "5. Физическое устройство состояния"
    paragraphs:
      - text: "Состояние цикла: множество sequences (mutation strings), их embeddings, скаляр `activity` (и производные `activity_scaled`, `activity_binary` в DMS-таблицах). Нет atom coordinates, residue frames, torsion, interface tensors. «Мутация» — идентификатор варианта в таблице, не 3D-трансформация."
        source: CODE
  - id: physchem
    title: "6. Физико-химическая интерпретация"
    paragraphs:
      - text: "Sequence compatibility с семейством белка может присутствовать **косвенно** в ESM-2. Fold, packing, H-bonds, электростатика, гидрофобность, конформационные ограничения — **не явные**. Evolutionary prior — в frozen PLM. Функция — **только** в labels. Preprint: activity landscape часто **не коррелирует** или **отрицательно коррелирует** с ESM-2 predicted masked marginal (pMMS) «fitness» — поэтому zero-shot PLM scoring не заменяет AL-цикл."
        source: PAPER
        locator: "preprint Results, PLM fitness vs activity"
  - id: training
    title: "7. Training"
    paragraphs:
      - text: "**PLM:** pretrained (ESM-2 и сравнение ESM-1, UniRep, ProtT5, ProteinBERT, Ankh, one-hot, integer). **Не** fine-tune на activity в описанном методе."
        source: PAPER
      - text: "**Top-layer:** каждый round fit на всех накопленных labels. Grid search на **12 DMS** datasets: победили random first round, random forest, residue-pooled average embeddings, top-N. PCA embeddings **не улучшили** (Methods / Data S1 в preprint)."
        source: PAPER
        locator: "preprint Methods, grid search"
      - text: "DMS-симуляция: 16 mutants/round, порядка 10 раундов; тестировали 10–100/round. Few-shot 5×16 ≈ 80 измеренных vs упоминание порядка pretrain 160/500 в тексте preprint — точные цифры сравнения few-shot vs linear probing см. preprint; здесь не выдумывать сверх HTML."
        source: PAPER
      - text: "Hardware PLM embedding: NR в этом проходе. RF на CPU — лёгкий. Negative sampling как в contrastive learning — нет."
        source: NR
  - id: inference-sec
    title: "8. Inference"
    paragraphs:
      - text: "Подготовка: посчитать embeddings для всего пула; собрать CSV раундов. Кандидаты: все rows без iteration label. Нет diffusion, recycles, temperature decoding. `number_of_variants` в `evolve_experimental` — сколько top строк **напечатать** (default 12), не обязательно бюджет синтеза. В симуляции `num_mutants_per_round` задаёт $|B_t|$."
        source: CODE
      - text: "Prospective preprint: REGN10987 — 11 mutants/round, 5 rounds (не 16). Не путать симуляционный default с каждой кампанией."
        source: PAPER
  - id: why
    title: "10. Почему, по мнению авторов, метод эффективен"
    paragraphs:
      - text: "**Proposed mechanism.** Frozen large PLM даёт informative features даже при десятках labels; лёгкий nonlinear surrogate ловит landscape activity, который **не** совпадает с unsupervised PLM fitness; итеративный отбор направляет бюджет на высокие $\\hat y$."
        source: PAPER
      - text: "**Author claim (preprint).** Few-shot learning с PLM ускоряет directed evolution across proteins, включая antibody example; multi-objective T7 RNAP. Формулировка Science «up to 100×» в матрице сайта **не** верифицирована по журнальному PDF в этом выпуске — не переносить как универсальный antibody result."
        source: PAPER
      - text: "**Evidence.** (i) Retrospective DMS simulations vs random и vs другими эмбеддингами/регрессорами. (ii) Prospective кампании: REGN10987 ELISA vs spike; PsaCas12f; PE2 RT; Bxb1; T7 RNAP. (iii) Ablation-like grid search по strategy/regressor/PLM."
        source: PAPER
      - text: "**Causal support.** Выбор RF + top-N + ESM-2 15B поддержан **grid search на DMS** (ablation-like, не prospective). Prospective gains — overall campaign success, не изолированный абляционный фактор на каждой кампании. Связь «именно average pooling причина» — из grid search, не из мокрой лаборатории."
        source: INTERPRETATION
  - id: ablation
    title: "12. Ablation analysis"
    paragraphs:
      - text: "Preprint grid search на 12 DMS: варьировали first-round strategy, discriminator/regressor, embedding pooling, selection rule, PLM family. Оптимум указан выше. PCA не помог. Это **ретроспективная симуляция**, не wet-lab ablation. Статистика различий между всеми 12 DMS в этом проходе не перенесена таблично из фигур — см. preprint figures / Data S1 (SI файл не скачан)."
        source: PAPER
  - id: absent
    title: "13. What the model does not represent"
    items:
      - "Явный растворитель, протонирование, ионы, гликозилирование, металлы"
      - "Конформационная энтропия и MD"
      - "Структура комплекса и epitope geometry"
      - "Истинная $\\Delta G$ / $K_d$ (ELISA improvement ≠ thermodynamic affinity без отдельной калибровки)"
      - "Экспрессия, агрегация, иммуногенность — кроме случаев, когда они **измерены** как $y$ (T7 multi-objective)"
      - "De novo CDR backbone"
  - id: evidence-lim
    title: "14. Evidence and limitations"
    paragraphs:
      - text: "Prospective antibody example preprint — **REGN10987**, ELISA vs spike, 63% ELISA improvement, IC50 11.9 nM (цифры preprint HTML). Landscape-матрица сайта упоминает **C143** — возможное расхождение версий paper/matrix; Science не сверен. Не обобщать 100× property improvement на все antibodies."
        source: PAPER
      - text: "DMS simulation ≠ новый терапевтический антиген. Assay noise и определение library критичны. Не zero-shot."
        source: INTERPRETATION
  - id: repro
    title: "15. Reproducibility"
    paragraphs:
      - text: "Repo https://github.com/mat10d/EvolvePro commit `1c77697d0c09bf6989a1562a55da99301a12e2cd`. Также встречается https://github.com/idmjky/EvolvePro и Zenodo 10.5281/zenodo.13899358 — не инспектировались целиком. Hardcoded output path в `evolve_experimental` указывает на внутренний кластер `/orcd/archive/...` — практический барьер воспроизведения без правки пути."
        source: CODE
        locator: "default output_dir in evolve.py"
