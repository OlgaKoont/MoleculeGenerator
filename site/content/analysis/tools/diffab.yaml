sections:
  - id: what
    title: "1. Что именно делает инструмент"
    paragraphs:
      - text: "**Вход:** antibody–antigen PDB, heavy/light IDs, config mode. **Выход:** CDR sequence + backbone geometry на маске. **Фиксируется:** framework и antigen (в codesign). Modes: codesign single/multi CDR, abopt, fixbb (sequence only), strpred (structure only). Parent complex-based, не sequence-only de novo."
        source: DOC
  - id: arch-para
    title: "2. Архитектура в одном абзаце"
    paragraphs:
      - text: "`DiffusionAntibodyDesign`: ResidueEmbedding + PairEmbedding + FullDPM. EpsilonNet (GAEncoder, 6 layers) предсказывает rotation update, position epsilon и softmax по 20 АК. T=100. Position normalized /10 Å. Sequence embedding 25 types (padding)."
        source: CODE
  - id: math-model
    title: "4. Математическая модель"
    paragraphs:
      - text: "См. класс [joint sequence–structure diffusion](../architectures/joint-sequence-structure-diffusion.html). Потери rot cosine, pos MSE-on-noise, seq KL posterior. Sampling: полный шум на generate mask, затем 100 denoise steps."
        source: CODE
  - id: physical-state
    title: "5. Физическое устройство состояния"
    paragraphs:
      - text: "На каждом t: (s_t, p_t, v_t) для каждого residue. Context — истинные (или observed) s,p,v. Fitness не в state."
        source: CODE
  - id: physchem
    title: "6. Физико-химическая интерпретация"
    paragraphs:
      - text: "Интерфейс может отражаться в pair geometry. H-bonds/electrostatics — не explicit. Optional PyRosetta binding energy — **external approximate energy**, не learned ΔG."
        source: DOC
  - id: training
    title: "7. Training"
    paragraphs:
      - text: "SAbDab chothia structures + summary TSV. mask_single_cdr. 200k iterations. Точный N комплексов и split hashes — NR без paper/processed data. Fine-tuning from general protein diffusion — не заявлено в просмотренном config (train from DiffAb model type)."
        source: CODE
  - id: inference-sec
    title: "8. Inference"
    paragraphs:
      - text: "100 samples default test config. GPU required (качественно). HDOCK для antigen-only. Ray для parallel relax. Runtime boundary: neural sampling ≠ docking ≠ Rosetta ≠ experiment."
        source: DOC
  - id: why
    title: "10. Почему, по мнению авторов, метод эффективен"
    paragraphs:
      - text: "**Proposed mechanism (from title/README):** antigen-specific co-design via equivariant diffusion so sequence and structure remain consistent. **Author claim:** design and optimization of antibodies with diffusion models (NeurIPS). **Evidence this pass:** in silico / retrospective per catalog; **не** prospective wet-lab в primary paper по YAML/README. **Causal support:** unclear without ablation tables from PDF — marked NR."
        source: NR
  - id: ablation
    title: "12. Ablation analysis"
    paragraphs:
      - text: "Ablations NeurIPS (fixbb vs codesign vs strpred как режимы inference существуют в configs, но количественные таблицы paper не извлечены). Наличие отдельных train flags `train_structure`/`train_sequence` позволяет режимы, не доказывая causal gain на binding."
        source: CODE
  - id: absent
    title: "13. What the model does not represent"
    items:
      - "Экспериментальный binding"
      - "Явный растворитель, гликаны, протоны"
      - "Full conformational ensemble"
      - "Developability"
      - "Unbound antigen без HDOCK/template"
  - id: evidence-lim
    title: "14. Evidence and limitations"
    paragraphs:
      - text: "Archived repo (2023 last commit env.yaml). Energy scores are evaluation. Не сравнивать hit rate с RFantibody prospective campaigns."
        source: INTERPRETATION
  - id: repro
    title: "15. Reproducibility"
    paragraphs:
      - text: "Apache-2.0, weights on Hugging Face luost26/DiffAb. CUDA 11.3 env.yaml. SAbDab download required. Commit `c3e29666`."
        source: DOC
