    generator_or_evaluator: "encoder for generator"
  - module: "FullDPM EpsilonNet"
    model_class: "equivariant denoiser"
    input: "noisy v,p,s + feats + beta"
    output: "updated frames, eps_pos, p(aa)"
    trained_or_frozen: "trained"
    generator_or_evaluator: "generator"
  - module: "HDOCK"
    model_class: "docking"
    input: "unbound antigen + Ab template"
    output: "posed complex"
    trained_or_frozen: "external binary"
    generator_or_evaluator: "external initializer, not neural generator"
