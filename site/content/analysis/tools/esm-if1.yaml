sections:
  - id: what
    title: "1. Что именно делает инструмент"
    paragraphs:
      - text: "**Вход:** backbone N, Cα, C coordinates (не side chains). Комплексы: цепи конкатенируются с **10 mask tokens** между цепями. Частично masked backbone допустим (span mask train)."
        source: PAPER
        locator: "bioRxiv: complexes; span masking up to 30 AA until 15% coords masked"
      - text: "**Выход:** авторегрессивная последовательность $Y$ (sampling или argmax при $T=10^{-6}$ для recovery). Backbone не генерируется."
        source: PAPER
      - text: "Fixed-backbone inverse folding, не de novo fold. Zero-shot mutation scoring через likelihood ratio — **evaluator mode** той же сети, не отдельный affinity head."
        source: PAPER
  - id: arch-para
    title: "2. Архитектура в одном абзаце"
    paragraphs:
      - text: "GVP-GNN encoder извлекает геометрию (rotation-equivariant vectors + invariant scalars). Затем change of basis в **локальные residue frames** → invariant scalars → generic Transformer encoder–decoder (learned positional embeddings, pre-LN). Лучшая модель: **4 GVP-GNN encoder layers, 8 Transformer encoder, 8 decoder, 8 heads, $d=512$, 142M**. Инвариантность $p(Y\\mid X)=p(Y\\mid TX)$ для $T\\in\\mathrm{SE}(3)$ (Appendix A.3)."
        source: PAPER
        locator: "§GVP-Transformer; Appendix A.3"
  - id: math-model
    title: "4. Математическая модель"
    equations:
      - latex: "p_\\theta(Y\\mid X)=\\prod_{i=1}^{n} p_\\theta(y_i\\mid y_{<i}, X),\\qquad \\mathcal{L}=-\\sum_i\\log p_\\theta(y_i^\\star\\mid y_{<i}^\\star,X)"
        caption: "AR encoder–decoder. $X=(x_1,\\ldots,x_{3n})$ — координаты N, Cα, C; $Y$ — native sequence. Порядок — последовательность цепи (не random MPNN order)."
        generic_or_specific: "tool-specific"
        source: PAPER
        symbols:
          - {sym: "X", type: "coordinates", meaning: "backbone atom xyz, 3 atoms × n residues"}
          - {sym: "Y", type: "token sequence", meaning: "amino acids"}
          - {sym: "T", type: "SE(3) transform", meaning: "глобальный поворот/сдвиг входа"}
      - latex: "p(Y\\mid X)=p(Y\\mid TX)\\qquad \\forall T\\in\\mathrm{SE}(3)"
        caption: "Инвариантность выхода. Transformer сам по себе не SE(3)-equivariant: инвариантность обеспечивается GVP + local frames."
        generic_or_specific: "tool-specific"
        source: PAPER
      - latex: "\\mathrm{score}(m)=\\log p(Y^{m}\\mid X^{\\mathrm{WT}})-\\log p(Y^{\\mathrm{WT}}\\mid X^{\\mathrm{WT}})"
        caption: "Zero-shot mutational score (likelihood ratio). $X^{WT}$ — экспериментальная WT-структура. Это **не** $\\Delta\\Delta G$ расчёт."
        generic_or_specific: "tool-specific [PAPER] zero-shot section"
        source: PAPER
  - id: physical-state
    title: "5. Физическое устройство состояния"
    paragraphs:
      - text: "Атомы остова в $\\mathbb{R}^3$; GVP vectors — геометрические направления; scalars — invariant. Sequence — AA identity. pLDDT AF2 — **входной признак** (RBF) для predicted structures, не выход ESM-IF1. 10 gap tokens — цепной разделитель, не физический линкер."
        source: PAPER
  - id: training
    title: "7. Training"
    paragraphs:
      - text: "CATH topology 80/10/10: 16153 / 1457 / 1797. Плюс 12M UniRef50 AF2 structures (Amber-relaxed; sequences ≤500; ranked by MSA Transformer distogram lDDT). Mix per epoch: experimental set + 10% random sample of 12M → ~1:80 experimental:predicted. pLDDT < 90 маскируется (~25% predicted coords). Binary token experimental vs predicted. Span masking: spans ≤30 AA until 15% coords masked."
        source: PAPER
      - text: "Small GVP-GNN (1M, 3+3) **деградирует** на predicted data. Large GVP-GNN (21M, 8+8) и GVP-Transformer **выигрывают**. Overfit CATH-only при scaling 1M→21M (42.2% → 39.2% recovery)."
        source: PAPER
        locator: "Table 1; Fig. 6"
  - id: inference-sec
    title: "8. Inference"
    paragraphs:
      - text: "Sampling из $p(Y\\mid X)$; для max recovery $T=10^{-6}$. Partial backbone: masked nodes excluded from GVP then zeros into Transformer (Appendix A.2). Multi-state: geometric mean of likelihoods $p(Y\\mid A)$ and $p(Y\\mid B)$ как proxy $p(Y\\mid A,B)$."
        source: PAPER
      - text: "Default CLI temperature / batch в этом выпуске: NR (код IF1 не построчно). Не путать с ESM-2 masked LM."
        source: NR
  - id: why
    title: "10. Почему, по мнению авторов, метод эффективен"
    paragraphs:
      - text: "**Mechanism.** Predicted structures ×3 orders of magnitude снимают data bottleneck; GVP даёт геометрию, Transformer — long-range / masked spans, которые чистый GVP-GNN не держит (Fig. 4)."
        source: PAPER
      - text: "**Author claim.** 51% native recovery (72% buried) on structurally held-out backbones; ~10 pp over prior GVP-GNN on CATH-only; generalization to complexes, partial masks, multi-state, zero-shot mutation."
        source: PAPER
      - text: "**Evidence.** Retrospective CATH topology split; ablations Fig. 6 / Table 1 / C.1; zero-shot Rocklin stability, SKEMPI, Starr ACE2–RBD Spearman 0.69 when given RBD+ACE2 coords. **No prospective designed-and-tested binders in this paper.**"
        source: PAPER
      - text: "**Causal support.** Predicted-structure mix — ablation Fig. 6a–b (directly supported). Spearman 0.69 — retrospective correlation, **не** affinity maturation campaign."
        source: INTERPRETATION
  - id: ablation
    title: "12. Ablation analysis"
    paragraphs:
      - text: "CATH-only vs +AF2: GVP-Transformer recovery 38.3% → 51.6%; GVP-GNN-large 39.2% → 50.8%; tiny GVP-GNN 42.2% → 38.6% (деградация). Span vs independent masking: span лучше на длинных масках (Fig. 4). Число GVP layers перед Transformer помогает (Fig. C.1). Complex coords vs single chain: substantial perplexity gain (Table 2). RBM coords / ACE2 coords necessary for RBD affinity correlation (Table 3)."
        source: PAPER
  - id: absent
    title: "13. What the model does not represent"
    items:
      - "Растворитель, протонирование, гликозилирование, кофакторы"
      - "Side-chain packing как отдельный decoder"
      - "Настоящая $\\Delta G$; Spearman на Starr scan ≠ designed antibody Kd"
      - "De novo backbone"
      - "Antibody-specific fine-tune (это ESM-IF1; AntiFold — отдельный FT)"
  - id: evidence-lim
    title: "14. Evidence and limitations"
    paragraphs:
      - text: "Авторы честно показывают, что IF likelihoods коррелируют с некоторыми mutational assays. Это **не** prospective design evidence. AntiFold позже FT эту архитектуру на SAbDab+OAS — см. /tools/antifold.html. Structural evolution (Shanker/Hie Science) использует IF1-complex scoring — отдельный инструмент каталога."
        source: INTERPRETATION
  - id: repro
    title: "15. Reproducibility"
    paragraphs:
      - text: "Weights historically `esm_if1_gvp4_t16_142M_UR50`. Репозиторий esm на 2023-06-27 (commit выше) — maintenance; Meta перемещала модели. Точный inference example в этом выпуске не прогонялся."
        source: CODE
        locator: "repo SHA only"
