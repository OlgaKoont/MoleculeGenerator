sections:
  - id: what
    title: "1. Что именно делает инструмент"
    paragraphs:
      - text: "**Вход:** структура мишени, epitope hotspots, фиксированный antibody framework, длины CDR / contig, формат VHH или scFv. **Выход:** CDR backbones + sequences + комплекс-предложения. **Фиксируется:** framework и target (кроме designed CDRs). De novo CDR-mediated binder, не parent affinity maturation AL."
        source: PAPER
  - id: arch-para
    title: "2. Архитектура в одном абзаце"
    paragraphs:
      - text: "Не одна сеть. (1) SE(3) diffusion denoiser на базе RFdiffusion, fine-tuned на antibody geometry, генерирует CDR frames при clamped FW/target. (2) ProteinMPNN назначает CDR sequences на полученный backbone. (3) Fine-tuned RF2 оценивает комплекс (self-consistency/confidence) и отфильтровывает кандидатов. AF3 — дополнительный retrospective ranker в статье, не generator."
        source: PAPER
  - id: math-model
    title: "4. Математическая модель"
    paragraphs:
      - text: "Точные score-matching уравнения Ab-RFdiffusion в этом выпуске **NR** (Methods). Классово: reverse SE(3) на designed frames. MPNN: $p(s\\mid x_{\\mathrm{bb}})$. RF2: structure/complex prediction loss, **не** $p(K_d)$."
        source: NR
  - id: physical-state
    title: "5. Физическое устройство состояния"
    paragraphs:
      - text: "Стадия 1: noisy/clean residue frames CDRs. Стадия 2: amino-acid tokens. Стадия 3: predicted complex coordinates + confidence maps. Experimental fitness — только после display/SPR/cryo-EM."
        source: PAPER
  - id: physchem
    title: "6. Физико-химическая интерпретация"
    paragraphs:
      - text: "Steric complementarity может отражаться в learned geometry + later RF2. H-bonds/electrostatics/solvation не explicit в diffusion. RF2/AF3 confidence — статистика структур, не ΔG. OrthoRep maturation — **экспериментальная** эволюция после слабых начальных Kd."
        source: PAPER
  - id: training
    title: "7. Training"
    paragraphs:
      - text: "Antibody fine-tune RFdiffusion и RF2; MPNN стандартный sequence recovery. Точные датасеты, фильтры, hardware — NR без Methods. Negative antigens как specificity objective — не описаны как главный loss."
        source: NR
  - id: inference-sec
    title: "8. Inference"
    paragraphs:
      - text: "Кампании статьи: порядка 95 designs low-throughput или ~9000 display per target (цифры каталога/Nature narrative; уточнять по paper figures). Hit rate overall target success 0–2% (каталог). GPU hours/VRAM NR. Отделять diffusion wall-time от MPNN, RF2 recycles, AF3, wet-lab."
        source: PAPER
  - id: why
    title: "10. Почему, по мнению авторов, метод эффективен"
    paragraphs:
      - text: "**Mechanism:** antibody-specific fine-tune diffusion на CDR; hotspot-conditioned epitope; MPNN для sequences; RF2 filter для self-consistent complexes; experimental display/SPR/cryo-EM."
        source: PAPER
      - text: "**Claim:** atomically accurate de novo antibodies (VHH/scFv); некоторые нейтрализующие после maturation (TcdB). Initial affinities often modest (tens–hundreds nM)."
        source: PAPER
      - text: "**Causal support:** prospective binding/structure — **да** для selected designs. Ablation «зачем fine-tune» vs vanilla RFdiffusion — нужно SI; здесь не утверждать цифры. RF2 ranking не доказан как причина binding, только как filter перед экспериментом."
        source: INTERPRETATION
  - id: ablation
    title: "12. Ablation analysis"
    paragraphs:
      - text: "Полные ablation tables Methods/SI в этом проходе не извлечены (NR). Не заполнять вымышленными процентами."
        source: NR
  - id: absent
    title: "13. What the model does not represent"
    items:
      - "Оптимизация humanness CDR"
      - "Явный растворитель, гликаны, Fc-эффектор (если не моделируется отдельно после IgG conversion)"
      - "Конформационная энтропия"
      - "Истинная ΔG"
      - "Гарантия developability/manufacturability"
      - "Free framework redesign"
  - id: evidence-lim
    title: "14. Evidence and limitations"
    paragraphs:
      - text: "Prospective: binders confirmed; cryo-EM для selected; hit rates modest vs miniprotein binder pipelines (authors). Framework fixed. Target holo conformation критичен. Independent validation вне авторов — NR здесь."
        source: PAPER
  - id: repro
    title: "15. Reproducibility"
    paragraphs:
      - text: "MIT, GitHub RosettaCommons/RFantibody, weights claimed in catalog. Commit SHA **NR** (timeout). Inference example не прогонялся в этом выпуске."
        source: NR
