claim_evidence:
  - claim: "Native sequence recovery выше Rosetta на PDB monomers"
    mechanism: "local distance GNN + random AR decode"
    evidence_type: "retrospective benchmark"
    dataset: "402 monomer backbones"
    comparator: "Rosetta PackRotamersMover beta_nov16, one round"
    metric: "52.4% vs 32.9% recovery; 1.2 s vs 4.3 min / 100 res"
    source: PAPER
    locator: "Science Fig. 2A"
    caveat: "Recovery ≠ folding success; зависит от resolution"
  - claim: "Distance features лучше dihedrals/frames как input"
    mechanism: "N/Cα/C/O/Cβ distances"
    evidence_type: "ablation evidence"
    dataset: "CATH single-chain split, Table 1"
    comparator: "baseline Ingraham-style MPNN"
    metric: "41.2% → 49.0% recovery"
    source: PAPER
    locator: "Table 1 experiment 1"
    caveat: "Только in silico recovery"
  - claim: "Random decoding + edge updates улучшают recovery"
    mechanism: "order-agnostic AR; encoder edge updates"
    evidence_type: "ablation evidence"
    dataset: "Table 1 exp. 2–4"
    comparator: "N→C baseline; no edge update"
    metric: "combined 50.8% unnoised"
    source: PAPER
    locator: "Table 1"
    caveat: "Не wet-lab"
  - claim: "MPNN rescues failed AF-hallucinated sequences (solubility/oligomer)"
    mechanism: "sequence redesign on fixed hallucinated backbone"
    evidence_type: "prospective functional validation"
    dataset: "150 AF sequences poorly soluble; 96 MPNN redesigns"
    comparator: "original AF-decoded sequences"
    metric: "median soluble yield 9 → 247 mg/L; 50/96 correct oligomeric state by SEC"
    source: PAPER
    locator: "Fig. 3A"
    caveat: "Успех — sequence на уже заданном fold; не de novo binder campaign как RFantibody"
  - claim: "Atomic accuracy of designed monomer"
    mechanism: "same"
    evidence_type: "prospective functional validation"
    dataset: "one crystallized MPNN monomer (8CYK)"
    comparator: "design backbone"
    metric: "2.35 Å RMSD / 130 residues"
    source: PAPER
    locator: "Fig. 3D"
    caveat: "N=1 crystal in this figure; oligomer structures in Wicky et al. companion"
  - claim: "Rescues Grb2 SH3 peptide-scaffold binder where Rosetta sequence failed"
    mechanism: "IF on Rosetta-built backbone"
    evidence_type: "prospective binding validation"
    dataset: "BLI vs Grb2 C-SH3"
    comparator: "Rosetta design; peptide alone; Asn→Asp knockout"
    metric: "stronger BLI signal than Rosetta sequence; knockout abolishes"
    source: PAPER
    locator: "Fig. 4"
    caveat: "Kd в HTML не приведена численно; не antibody; backbone всё ещё Rosetta"
