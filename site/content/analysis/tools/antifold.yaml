sections:
  - id: what
    title: "1. Что именно делает инструмент"
    paragraphs:
      - text: "**Вход:** PDB/CIF variable domain (IMGT 1–128 рекомендуется для region sampling); цепи H/L или nanobody; optional antigen chain. **Выход:** per-residue log-probabilities/CSV, perplexity, sampled FASTA для выбранных IMGT regions. **Фиксируется:** backbone coordinates. **Изменяется:** amino-acid identities на маске. Parent-based / template-based, не de novo fold."
        source: DOC
        locator: "README Features/Input; PAPER Figure 1 caption"
  - id: arch-para
    title: "2. Архитектура в одном абзаце"
    paragraphs:
      - text: "Fine-tune ESM-IF1: 4 GVP-GNN + 8 Transformer encoder + 8 decoder, инвариантность к rotation/translation входа. Комплекс VH/VL: конкатенация координат L после H с 10 gap tokens (missing coordinates). Обучение CE на masked positions; финальные augmentations: span+shotgun mask, CDR-weighted 3:1, layer-wise LR decay $\\alpha=0.85$, OAS predicted structures. Sampling: $\\mathrm{logits}/t$, default $t=0.20$."
        source: SI
        locator: "Supplementary Methods 0.1.3–0.1.6"
  - id: math-model
    title: "4. Математическая модель"
    equations:
      - latex: "p(Y\\mid X)=\\prod_i p(y_i\\mid y_{<i};X)"
        caption: "AntiFold SI Eq. (1), по Hsu et al."
        generic_or_specific: "ESM-IF1 / AntiFold [SI]"
        source: SI
        symbols:
          - {sym: X, type: coordinates, meaning: "N, Cα, C (и gap как missing coords)"}
          - {sym: Y, type: tokens, meaning: "amino acids"}
      - latex: "\\mathrm{LR}_i = \\mathrm{LR}\\times \\alpha^{i},\\quad \\alpha=0.85,\\; i=0\\ldots 20"
        caption: "Layer-wise decay, SI Eq. (2)."
        generic_or_specific: "tool-specific [SI]"
        source: SI
      - latex: "p_i(a)=\\mathrm{softmax}(\\mathrm{logits}_i)_a,\\quad \\tilde{\\ell}=\\mathrm{logits}/t"
        caption: "SI Eq. (4–5, 7). Temperature как в ProteinMPNN."
        generic_or_specific: "tool-specific [SI]"
        source: SI
      - latex: "\\mathrm{perplexity}=2^{-\\sum_{a=1}^{20}p(a)\\log_2 p(a)}"
        caption: "SI Eq. (6) — энтропийная толерантность позиции, **не** affinity."
        generic_or_specific: "tool-specific [SI]"
        source: SI
  - id: physical-state
    title: "5. Физическое устройство состояния"
    paragraphs:
      - text: "Состояние генерации: дискретная sequence на фиксированных backbone atoms. Side-chain coordinates не сэмплируются. Antigen — дополнительные residues в geometric context, если указан. Experimental fitness не является переменной модели."
        source: PAPER
  - id: physchem
    title: "6. Физико-химическая интерпретация"
    paragraphs:
      - text: "Явно: идентичность АК и геометрия остова. Неявно: статистика antibody structures (SAbDab + OAS/ABB2). Электростатика/растворитель/энтропия не считаются. Antigen chain улучшает **корреляцию** likelihood с lysozyme DMS для CDR, не являясь ΔG."
        source: PAPER
        locator: "Results 3.3"
  - id: training
    title: "7. Training"
    paragraphs:
      - text: "Данные (чтобы сравнить с AbMPNN): 2074 solved SAbDab комплексов (protein antigen, resolution <5 Å, redundancy filter AbMPNN) + 147458 OAS paired, ABB2 models. Split 80/10/10 по 90% concatenated CDR identity (Dreyer et al.)."
        source: PAPER
        locator: "Methods 2.1; SI 0.1.1–0.1.2"
      - text: "Без ESM-IF1 pretraining CDRH3 AAR validation 31.5% vs 58.4% с OAS+augmentations (Tables S1–S4 в SI; цифры из HTML). Early stopping: 10 epochs без снижения val loss."
        source: SI
      - text: "Hardware/time: NR. Negative antigens как specificity loss: не заявлены."
        source: NR
  - id: inference-sec
    title: "8. Inference"
    paragraphs:
      - text: "Default sampling temp 0.20; `--num_seq_per_target` default 0 (только logits). Evaluation в paper: 20 sequences, t=0.20, 56 X-ray <2.5 Å test structures; refold ABodyBuilder2; CDR RMSD после FW align. `--esm_if1_mode` подменяет веса. GPU/MPS поддерживаются README. Batch size default 1."
        source: DOC
  - id: why
    title: "10. Почему, по мнению авторов, метод эффективен"
    paragraphs:
      - text: "**Mechanism:** antibody-specific fine-tune + CDR-weighted masking + predicted structures; ESM-IF1 prior с 12M structures."
        source: PAPER
      - text: "**Claim:** лучше AAR на CDR (CDRH3 60% vs AbMPNN 56% vs ESM-IF1 43% на AbMPNN test, Table 1 HTML) и выше Spearman на Warszawski DMS (0.42 vs ~0.30–0.33); refold RMSD 0.95 vs native ABB2 0.63."
        source: PAPER
      - text: "**Causal support:** ablation masking/OAS/pretrain — **validation AAR** (SI tables), не prospective binding. Overall benchmark Table 1 не изолирует каждый модуль на affinity. Prospective wet-lab designs **отсутствуют** в primary paper."
        source: PAPER
  - id: ablation
    title: "12. Ablation analysis"
    paragraphs:
      - text: "SI Tables S1–S4: span-masking, extra random mask, 3:1 CDR weight, layer-wise decay, OAS predicted structures, train from scratch. Метрика — CDRH3 AAR на **validation**, не Kd. Тест на predicted vs experimental structures: AntiFold ΔAAR ~0.5%, AbMPNN хуже на experimental (−2.7%)."
        source: SI
        locator: "Methods 2.2; Results 3.1"
  - id: absent
    title: "13. What the model does not represent"
    items:
      - "Генерация backbone / новой CDR topology"
      - "Явный растворитель, протонирование, гликаны"
      - "Конформационная энтропия, MD"
      - "Developability, иммуногенность, экспрессия"
      - "Истинная binding free energy (даже при Spearman 0.42 на одном DMS)"
  - id: evidence-lim
    title: "14. Evidence and limitations"
    paragraphs:
      - text: "Авторы обсуждают de-selection loss-of-binding и ортогональность к PLM scores. Independent: README указывает Li et al. 2025 PLOS ONE и Clifford et al. 2025 Sci Adv — **не читались** здесь, не цитировать их цифры."
        source: DOC
      - text: "Ограничения: зависимость от входной структуры и IMGT numbering для regions; dataset bias SAbDab/OAS; likelihood miscalibration вне распределения."
        source: INTERPRETATION
  - id: repro
    title: "15. Reproducibility"
    paragraphs:
      - text: "BSD-3, pip package, webserver OPIG, weights https://opig.stats.ox.ac.uk/data/downloads/AntiFold/models/model.pt . Commit `789d4678`. Colab в README. Training scripts полного fine-tune в просмотренном дереве `antifold/` не выделены как отдельный train.py в listing — воспроизведение **обучения** NR без дальнейшего поиска."
        source: CODE
