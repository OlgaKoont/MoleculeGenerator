lede: "AntiFold — antibody-specific **inverse folding**: fine-tune ESM-IF1 на solved и predicted Fv/VHH. Генерирует sequences (logits / sampled FASTA) при **фиксированном backbone**. Не генерирует структуру. Zero-shot корреляция log-likelihood с DMS affinity — **score**, не demonstrated affinity engineering."
