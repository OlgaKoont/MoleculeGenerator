sections:
  - id: what
    title: "1. Что именно делает инструмент"
    paragraphs:
      - text: "**Вход (infill):** родительская unpaired sequence, chain token (`[HEAVY]`/`[LIGHT]`), species token, полуинтервал `[start, end)` для span. **Вход (generate):** только conditioning tags ± optional prompt."
        source: CODE
        locator: "IgLM.infill / generate"
      - text: "**Выход:** синтетические AA sequences (полная цепь или infilled span). Нет координат, нет paired VH–VL в одном forward (цепи независимы)."
        source: PAPER
      - text: "Parent-based CDR diversification или species-conditioned full-chain generation. Не de novo docked antibody."
        source: PAPER
  - id: arch-para
    title: "2. Архитектура в одном абзаце"
    paragraphs:
      - text: "Decoder-only GPT-2 (HuggingFace `GPT2LMHeadModel`). IgLM: 4 layers, $d=512$, 8 heads, FFN 2048, **12,889,600** params. IgLM-S: 3 layers, $d=192$, 6 heads, FFN 768, **1,439,616**. Токенизатор `BertTokenizerFast` по `vocab.txt` (AA + specials). Infilling Donahue-style: span $S$ заменяется `[MASK]`, исходная последовательность + `[SEP]` + $S$ + `[ANS]`."
        source: PAPER
        locator: "Table 1; STAR Methods; CODE from_pretrained"
  - id: math-model
    title: "4. Математическая модель"
    equations:
      - latex: "A=(a_1,\\ldots,a_n),\\quad m\\sim\\mathrm{Unif}\\{10,\\ldots,20\\},\\quad j\\sim\\mathrm{Unif}\\{1,\\ldots,n-m+1\\}"
        caption: "Train: длина и старт маски. Conditioning tokens $c_c,c_s$ prepend."
        generic_or_specific: "tool-specific"
        source: PAPER
      - latex: "p_\\theta(S\\mid A\\setminus S)=\\prod_{i} p_\\theta(S_i\\mid A\\setminus S, S_{<i})"
        caption: "Infill: генерировать span до `[ANS]`. $A\\setminus S$ содержит фланги, `[MASK]`, `[SEP]`."
        generic_or_specific: "tool-specific"
        source: PAPER
        symbols:
          - {sym: "A", type: "token sequence", meaning: "антитело VH или VL"}
          - {sym: "S", type: "span", meaning: "маскированный участок 10–20 residues при train; при infill — произвольный пользовательский диапазон"}
          - {sym: "c_c,c_s", type: "discrete tags", meaning: "chain and species"}
      - latex: "p(x_i)=\\frac{e^{z_i/T}}{\\sum_j e^{z_j/T}}\\quad\\text{nucleus }P\\text{: оставить минимальный набор с cumul}\\ge P"
        caption: "Inference sampling. Default code: `temperature=1`, `top_p=1`, `max_length=150`."
        generic_or_specific: "tool-specific [PAPER Eq. 6 + CODE generate]"
        source: CODE
      - latex: "\\mathrm{PPL}_{\\mathrm{infill}}=\\exp\\Bigl[-\\frac{1}{N_{S'}}\\sum \\log p(S'_i\\mid \\cdot)\\Bigr]"
        caption: "Infilling perplexity = per-token PPL после `[SEP]` (Eq. 4)."
        generic_or_specific: "tool-specific"
        source: PAPER
  - id: physical-state
    title: "5. Физическое устройство состояния"
    paragraphs:
      - text: "Состояние — дискретная unpaired antibody sequence. Нет атомов, frames, antigen. Species/chain tags — датасетные метки OAS, не 3D. Перестановка span — NLP-трюк, не биологический splicing (V(D)J уже произошёл в train sequences)."
        source: INTERPRETATION
  - id: training
    title: "7. Training"
    paragraphs:
      - text: "OAS unpaired: после фильтра ошибок 809M unique → LinClust 95% → 588M. Random 5% test; 558M train, 1M val. Skew: human heavy ~70%. Split **не** germline-holdout: авторы сознательно оставляют все conserved regions в train."
        source: PAPER
        locator: "STAR: Antibody sequence dataset"
      - text: "Batch 512, 2 grad accum, DeepSpeed, ~3 days × 4×A100. Objective — стандартный AR NLL на перестроенной последовательности (включая infilled span)."
        source: PAPER
  - id: inference-sec
    title: "8. Inference"
    paragraphs:
      - text: "`generate`: sample until `[ANS]` (`eos` = CLS token в коде), `bad_words_ids`, duplicate filter. Full-length sequences из ILM содержат `[MASK]/[SEP]/[ANS]` и **пересобираются**. Prompt из 3 N-terminal residues (Table S2, NR exact motifs here) из-за >40% OAS truncations."
        source: PAPER
        locator: "Full-length antibody generation; CODE _generate"
      - text: "Infill библиотек в статье: 49 Thera-SAbDab mAbs, CDR H3 по Chothia удалён, 1000 seq × {T∈0.8,1.0,1.2} × {P∈0.5,0.75,1.0} = 9000/parent. AF-Multimer pLDDT — **внешний predictor**."
        source: PAPER
  - id: why
    title: "10. Почему, по мнению авторов, метод эффективен"
    paragraphs:
      - text: "**Mechanism.** Bidirectional context для CDR (фланги видны до генерации span) vs left-to-right ProGen2-OAS; species/chain tags vs prompting."
        source: PAPER
      - text: "**Author claim.** Generates full-length and infilled libraries resembling natural antibodies with tunable diversity and improved in silico developability/humanness vs random; could then be experimentally screened."
        source: PAPER
        locator: "Discussion: 'which could then be experimentally screened'"
      - text: "**Evidence.** Infilling PPL vs ProGen2 (Fig. 1D); ANARCI species/chain controllability; germline identity vs T; in silico aggregation/solubility/OASis on 49 therapeutics. **Нет prospective binding/function assay IgLM-designed clones в primary paper.**"
        source: PAPER
      - text: "**Causal support.** Bidirectional vs preceding-only PPL — ablation-like. Developability — in silico scores, не wet-lab. Causal claim 'reduces non-functional fraction vs random libraries' **не** подтверждён экспериментом в этой статье."
        source: INTERPRETATION
  - id: ablation
    title: "12. Ablation analysis"
    paragraphs:
      - text: "IgLM vs IgLM-S (capacity). Bidirectional vs preceding-only infill PPL (Fig. 1D). Temperature / nucleus vs diversity, length, OASis (Figs. 2–3). Нет ablation 'remove species token' с таблицей recovery в извлечённом HTML (NR beyond qualitative rat failure)."
        source: PAPER
  - id: absent
    title: "13. What the model does not represent"
    items:
      - "Структура, antigen, epitope, dock"
      - "Paired chain covariation (unpaired OAS)"
      - "Растворитель, PTM, glycosylation"
      - "Истинная аффинность; AF pLDDT и OASis ≠ Kd / immunogenicity assay"
      - "Developability в CHO как экспериментальный readout"
  - id: evidence-lim
    title: "14. Evidence and limitations"
    paragraphs:
      - text: "Авторы прямо откладывают experimental screening. N-terminal truncations, human-heavy skew, rat generation failure, OAS sequencing error residuals. `max_length=150` в коде может обрезать длинные CDR3. Non-commercial license."
        source: PAPER
  - id: repro
    title: "15. Reproducibility"
    paragraphs:
      - text: "Checkpoints `trained_models/IgLM` и `IgLM-S`. Dataset OAS95: data.graylab.jhu.edu/OAS95.tar.gz (не скачивался). Commit de819b56 — licensing text update (2026-07-20)."
        source: CODE
