  - feature: "species / chain tags"
    interpretation: "репертуарный prior OAS"
    encoded: "прямо как special tokens"
    limitation: "OAS label ≠ ANARCI class (camel↔alpaca)"
  - feature: "span permutation ILM"
    interpretation: "двусторонний sequence context для CDR"
    encoded: "train-time rearrangement"
    limitation: "не физический механизм созревания"
  - feature: "OASis / aggregation predictors in paper"
    interpretation: "in silico developability / humanness"
    encoded: "external evaluators"
    limitation: "не часть generator; не assay"
