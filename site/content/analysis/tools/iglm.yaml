status_note: "Cell Systems HTML (STAR Methods + Results) прочитан. Preprint bioRxiv 10.1101/2021.12.13.472419 использован как согласованный open text. Код `iglm/model/IgLM.py` на commit `de819b56`. Table S1/S2 species counts и точные OASis численные дельты в фигурах не перенесены таблично."
lede: "IgLM — **sequence infilling generator** для unpaired VH/VL. GPT-2 decoder обучается на перестановке span (ILM): маска 10–20 residues уходит в конец после `[SEP]`. Это не inverse folding, не structure diffusion и не affinity predictor. In silico developability / OASis / AF pLDDT $\\neq$ experimental binding."
