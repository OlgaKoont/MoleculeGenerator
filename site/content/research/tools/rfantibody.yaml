- title: 10. Почему авторы считают метод эффективным
  level: 2
  blocks:
  - title: Proposed mechanism
    level: 3
    blocks:
    - type: p
      text: Antibody-specific FT восстанавливает loop geometry, которой нет у vanilla RFdiffusion; hotspot+framework template удерживает epitope и Fv; MPNN заполняет sequence; RF2/AF3 отбрасывает inconsistent poses. [PAPER]
  - title: Author claim
    level: 3
    blocks:
    - type: p
      text: Atomically accurate de novo antibody design; VHH binders; cryo-EM agreement for some CDRs; maturation can reach nM. [PAPER]
  - title: Evidence
    level: 3
    blocks:
    - type: p
      text: 'Prospective binding 0–2% per target; initial Kd tens–hundreds nM; OrthoRep to single-digit nM; cryo-EM; TcdB neutralization after maturation. Retrospective: vanilla RF fails loops. [PAPER]'
  - title: Causal support
    level: 3
    blocks:
    - type: p
      text: 'Vanilla vs FT — qualitative/architectural + failure mode, не обязательно полный factorial wet-lab ablation. Success rate низкий: метод работает иногда, не как robust therapeutic engine. AF3 filter superiority — author statement, original campaign used RF2. [PAPER]+[INTERPRETATION]'
