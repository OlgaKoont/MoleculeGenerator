      - CDR backbone + orientation
      - fine-tuned RF diffusion weights
      - generator
    - - ProteinMPNN
      - inverse folding generator
      - designed backbone, CDR-only design mask
      - CDR sequences
      - pretrained MPNN (Ab settings in pipeline)
      - generator
    - - RoseTTAFold2 FT
      - structure/complex predictor
      - seq+template
      - structure, PAE/pLDDT-like confidence
      - fine-tuned predictor
      - evaluator, not generator
