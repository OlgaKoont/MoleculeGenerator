sections:
- title: 1. Что именно делает инструмент
  level: 2
  blocks:
  - type: p
    text: 'RFantibody — <strong>многостадийный workflow</strong>, не одна сеть. Генерируются CDR backbones и ориентация Fv относительно target при фиксированном antibody framework; затем CDR sequences; затем фильтр структуры. Форматы: VHH и scFv. De novo относительно CDR+dock, parent-based относительно framework. [PAPER]'
- title: 2. Архитектура в одном абзаце
  level: 2
  blocks:
  - type: p
    text: 'Antibody-fine-tuned RFdiffusion (SE(3) frames: Cα + N-Cα-C; Gaussian translations, Brownian SO(3); MSE on predicted x0) генерирует CDR + rigid-body dock, framework sequence+structure подаётся как invariant 2D template (distances/dihedrals), hotspots one-hot. ProteinMPNN проектирует только CDR sequences. Fine-tuned RoseTTAFold2 — self-consistency/PAE filter (авторы отмечают, что AF3 — лучший filter и не был доступен в начале проекта). Rosetta ddG — in silico. Experiment: yeast display ~9k или E. coli+SPR 95; OrthoRep maturation; cryo-EM. [PAPER]+[CODE modules]'
