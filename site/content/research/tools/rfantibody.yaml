- title: 12. Ablation
  level: 2
  blocks:
  - type: p
    text: 'Ключевая: vanilla RFdiffusion vs antibody FT на петлях. Полная wet-lab ablation MPNN vs alternative IF, RF2 vs AF3 на тех же 9k libraries — частично author-reported (AF3 better filter, not available at start). Статистика 0–2% already indicates high failure. [PAPER]'
- title: 13. What is not represented
  level: 2
  blocks:
  - type: ul
    items:
    - explicit solvent, protonation, glycans, Fc, developability NN, true ΔG, CDR humanness optimization, long MD. Side chains after MPNN still need packing. Target holo conformation assumed known.
- title: 14–15. Limitations and reproducibility
  level: 2
  blocks:
  - type: p
    text: 'License: repo LICENSE (BSD-like — verify file). Modules: src/ for rfdiffusion, proteinmpnn, rf2. Docker recommended. Paper vs code: campaign used RF2 filter; README/workflow may emphasize current recommended AF3 — записать как расхождение практики. Independent replication: NR in this pass.'
