- title: 4. Математическая модель
  level: 2
  blocks:
  - type: p
    text: Генератор 1 (diffusion) — class frame diffusion, см. <a href="/architectures/frame-diffusion.html">frame diffusion</a>. Не joint sequence diffusion. Генератор 2 — ProteinMPNN \(p(s_{\mathrm{CDR}}\mid x_{\mathrm{bb}})\). RF2 не семплирует дизайны, а предсказывает структуру для фильтра. Нельзя схлопывать три модели в одну likelihood.
- title: 5–6. Физика
  level: 2
  blocks:
  - type: p
    text: 'Состояние diffusion: backbone frames CDR + ориентация антитела к антигену. Framework atoms/sequence фиксированы шаблоном. Химия интерфейса: learned interface statistics + later Rosetta; нет explicit solvent/entropy в генераторе. Equivariance frames ≠ стабильность. [PAPER]+[INTERPRETATION]'
- title: 7. Training
  level: 2
  blocks:
  - type: p
    text: RFdiffusion antibody fine-tune on antibody and other loop-mediated complexes (точный mix — сверять SI). Vanilla RFdiffusion fails on antibody loops — qualitative ablation/motivation. ProteinMPNN и RF2 имеют собственные pretrain/FT. [PAPER]
- title: 8. Inference
  level: 2
  blocks:
  - type: p
    text: 'Pipeline scripts в репозитории: rfdiffusion → proteinmpnn → rf2. Quiver files (.qv) хранят дизайны и scores. Docker/uv environment. GPU required (tests A4000/H100). Candidate counts: experimental campaigns 95 or ~9000 displayed. Diffusion step count: NR here without config dump. [CODE]+[PAPER]'
