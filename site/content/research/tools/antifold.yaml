- title: 10. Почему, по мнению авторов, метод эффективен
  level: 2
  blocks:
  - title: Proposed mechanism
    level: 3
    blocks:
    - type: p
      text: Antibody-specific fine-tune + CDR-weighted loss + predicted OAS structures + coordinate noise учат распределение antibody sequences на antibody geometries, чего нет у general ESM-IF1. [PAPER]
  - title: Author claim
    level: 3
    blocks:
    - type: p
      text: Improved CDR recovery vs ESM-IF1/AbMPNN; better mutation ranking on some DMS; antigen context helps. [PAPER]
  - title: Evidence
    level: 3
    blocks:
    - type: p
      text: Retrospective AAR (CDRH3 60% vs ESM-IF1 43%, AbMPNN 56%); refold RMSD 0.95 vs native 0.63; Warszawski DMS Spearman 0.42; Hie variants group median rank 80%. No prospective wet-lab. [PAPER]
  - title: Causal support
    level: 3
    blocks:
    - type: p
      text: 'Ablation without pretrain / augmentations reported for validation AAR — directly supports fine-tune+augmentation for recovery. Binding claims are not supported: Spearman 0.42 is not Kd, and authors note performance is driven by de-selecting loss-of-binding variants. [PAPER]'
