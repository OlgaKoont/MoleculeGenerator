status: verified
last_reviewed: '2026-08-20'
sections:
- title: 1. Что именно делает инструмент
  level: 2
  blocks:
  - type: p
    text: 'AntiFold — antibody-specific inverse folding: по структуре Fv или VHH (IMGT-numbered, позиции 1–128) выдаёт per-residue logits и может сэмплировать последовательности на масках CDR/framework. Backbone фиксирован. De novo topology нет. Optional antigen chain добавляет координатный контекст, но модель не выполняет docking. [PAPER]+[CODE]'
- title: 2. Архитектура в одном абзаце
  level: 2
  blocks:
  - type: p
    text: 'Fine-tune ESM-IF1: 4-слойный GVP-GNN geometric encoder + 8-слойный Transformer encoder + 8-слойный AR decoder, rotation/translation invariant. Paired H+L конкатенируются с 10 gap tokens. Sampling — temperature categorical по выбранным IMGT-регионам (default CDR1 CDR2 CDR3, default T=0.20). [PAPER]+[CODE antifold/main.py]'
- title: 3. Модульная схема
  level: 2
  blocks:
  - type: table
    headers:
    - Module
    - Model class
    - Input
    - Output
    - Trained or frozen
    - Generator or evaluator
    rows:
    - - PDB/CIF loader + IMGT/ANARCI utilities
      - preprocessing
      - structure, chain IDs
      - atom tensors, region masks
      - not trained
      - preprocessing
    - - ESM-IF1 backbone (GVP+Transformer)
      - inverse folding NN
      - backbone ± antigen
      - token logits
      - fine-tuned (not frozen)
      - generator of sequence distribution
    - - Temperature sampler (sample_from_df_logits_HL / _H)
      - categorical sampling
      - logits, regions, T
      - FASTA variants
      - no extra train
      - generator
    - - Log-probability / log-odds table
      - score from same logits
      - sequence vs logits
      - per-position scores
      - same network
      - integrated ranker, not affinity
    - - ABodyBuilder2 OAS structures (train only)
      - external structure predictor
      - OAS sequences
      - predicted Fv coords
      - frozen wrt AntiFold train
      - training-data generator, not inference module
    - - Experimental binding assay
      - wet lab
      - expressed Ig
      - Kd/ELISA
      - external
      - absent in primary paper
- title: 4. Математическая модель
  level: 2
  blocks:
  - type: math
    latex: p_\theta(Y\mid X)=\prod_{i=1}^{L} p_\theta(y_i\mid y_{<i}; X)
    caption: \(Y\) — concatenated Fv sequence; \(X\) — backbone (and optional antigen) coordinates. AntiFold inherits ESM-IF1 AR factorization.
    source: '[PAPER] Høie et al.; ESM-IF1 Hsu et al.'
  - type: p
    text: 'Fine-tune tricks [PAPER]: span masking, shotgun masking, 3:1 CDR vs framework loss weight, layer-wise LR decay \(\alpha=0.85\), Gaussian noise 0.1 Å on predicted coordinates. Sampling temperature T default 0.20 [CODE].'
  - type: p
    text: Equation of UCB/diffusion here would be incorrect.
- title: 5. Физическое устройство состояния
  level: 2
  blocks:
  - type: p
    text: 'Вход: backbone atoms IMGT Fv; optional antigen heavy atoms as extra chain. Состояние генерации: discrete AA identities. Нет диффузии frames. Side chains в IF likelihood не пакуются явно (ESM-IF1 использует backbone geometry).'
- title: 6. Физико-химическая интерпретация
  level: 2
  blocks:
  - type: p
    text: 'Fold compatibility CDR-to-framework — implicit from antibody structures. Interface: optional antigen coords give steric/context, not ΔG. Antigen context improves CDR scores in paper — это structural statistics, не measured affinity. H-bonds/electrostatics — implicit. Solvent, glycans, protonation — absent.'
- title: 7. Training
  level: 2
  blocks:
  - type: p
    text: 2,074 SAbDab complexes + 147,458 OAS paired structures from ABodyBuilder2. Split 80/10/10 по 90% concatenated-CDR identity, как AbMPNN. Without ESM-IF1 pretrain, CDRH3 AAR 31.5% vs 58.4% with all augmentations (validation). [PAPER]
  - type: p
    text: 'Negative examples: token CE against native AA. Hardware: NR exactly in this pass.'
- title: 8. Inference
  level: 2
  blocks:
  - type: p
    text: 'CLI: antifold/main.py — pdb_file, heavy/light/nanobody/antigen chains, regions, num_seq_per_target, sampling_temp. Weights: models/model.pt (downloaded from OPIG) or --esm_if1_mode. Key files: antiscripts.py, esm_util_custom.py, if1_dataset.py. [CODE]'
