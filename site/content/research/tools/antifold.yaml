- title: 12. Ablation analysis
  level: 2
  blocks:
  - type: p
    text: 'Reported: w/o ESM-IF1 pretrain; augmentations stack to 58.4% CDRH3 AAR. Isolates sequence recovery, not pharmaceutical developability. Statistical tests on AAR differences: see paper tables; independent prospective test set of therapeutic mAbs — NR. [PAPER]'
- title: 13. What the model does not represent
  level: 2
  blocks:
  - type: ul
    items:
    - explicit solvent, protonation, glycans, metals, conformational entropy, expression, aggregation, immunogenicity, true ΔG, docking, backbone generation.
- title: 14. Evidence and limitations
  level: 2
  blocks:
  - type: p
    text: Сильная retrospective IF метрика. Нет prospective binding. Likelihood нельзя читать как affinity. Зависит от качества входной структуры и IMGT numbering. [PAPER]
