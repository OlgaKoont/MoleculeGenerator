sections:
- title: 1. Область определения
  level: 2
  blocks:
  - type: p
    text: Оптимизация мутантов при малом числе labels. Часто реализуется как AL, но логически это task-level protocol.
  - type: p
    text: Workflow around a surrogate. См. <a href="/architectures/active-learning.html">active learning</a> и <a href="/tools/evolvepro.html">EVOLVEpro</a>. Не отдельная NN.
- title: 2. Интуитивный принцип
  level: 2
  blocks:
  - type: p
    text: 10–100 measurements → fit simple model in a good feature space → propose next mutants.
- title: 3. Формальная математическая постановка
  level: 2
  blocks:
  - type: math
    latex: f_t=\arg\min_f \sum_{(x,y)\in D_t}\ell(f(e(x)),y),\quad B=\mathrm{select}(U,f_t)
    caption: Few-shot fit + selection. select may be greedy (EVOLVEpro) or BO.
    source: '[CODE]+[PAPER] EVOLVEpro'
  - type: p
    text: Это уравнение класса методов. Tool-specific отклонения — на страницах инструментов.
