    caption: Discrete diffusion transition matrices \(Q_t\). Tool-specific Q.
    source: '[PAPER] Austin D3PM; EvoDiff Alamdari et al.; DiffAb sequence transition'
  - type: p
    text: Это уравнение класса методов. Tool-specific отклонения — на страницах инструментов.
