inaccessible:
- AlphaFold2 SI Algorithm 22 (полный IPA block) намеренно не копируется; на странице — схематичный invariant-point attention, не постраничный SI.
- facebookresearch/esm (ESM-IF1 weights/code) в этом проходе не аудировался по commit; гиперпараметры Table A.1 и recovery — PMLR 162 Hsu et al. / bioRxiv 10.1101/2022.04.10.487779.
- tFold Nature Communications SI / TencentAI4S/tfold commit не аудированы; Evoformer-Single+IPA и SPR — Nat. Commun. HTML 10.1038/s41467-025-67361-9; 32+8 blocks tFold-Ag — bioRxiv 10.1101/2024.02.05.578892.
- RFdiffusion не помечен этим architecture id; RF 3-track как denoiser живёт на frame-diffusion.
