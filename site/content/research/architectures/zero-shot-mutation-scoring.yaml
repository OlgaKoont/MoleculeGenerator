sections:
- title: 1. Область определения
  level: 2
  blocks:
  - type: p
    text: Ранжирование substitutions без новых experimental labels по pretrained LM или IF likelihood.
  - type: p
    text: Evaluator / ranker, слабо generator (top-k list). Не AL. Не de novo.
- title: 2. Интуитивный принцип
  level: 2
  blocks:
  - type: p
    text: «Насколько мутация естественна» для модели. Естественность ≠ лучший Kd.
- title: 3. Формальная математическая постановка
  level: 2
  blocks:
  - type: math
    latex: \Delta \ell(i,a)=\log p(s_i=a\mid c)-\log p(s_i=s_i^{\mathrm{wt}}\mid c)
    caption: \(c\) — sequence context or backbone. High \(\Delta\ell\) is not predicted affinity.
    source: '[PAPER] Meier ESM-1v; Hie structural evolution / IF scoring'
  - type: p
    text: Это уравнение класса методов. Tool-specific отклонения — на страницах инструментов.
- title: 4. Представление данных
  level: 2
  blocks:
  - type: ul
    items:
    - parent sequence
    - optional backbone
    - 19 substitutions × sites
- title: 5. Физическое представление
  level: 2
  blocks:
  - type: p
    text: Identity change at a site. No complex ΔG.
- title: 6. Физико-химический смысл
  level: 2
  blocks:
  - type: table
    headers:
    - Feature
    - Interpretation
    - Encoded
    - Limitation
    rows:
    - - ΔLL
      - evolutionary or fold statistical preference
      - implicit
      - misses assay-specific binding
- title: 7. Что обучается
  level: 2
  blocks:
  - type: p
    text: Usually none task-specific.
- title: 8. Прямой проход
  level: 2
  blocks:
  - type: flow
    nodes:
    - enumerate mutants
    - score
    - wet-lab optional
    note: Схема класса, не копия paper figure.
- title: 9. Training procedure
  level: 2
  blocks:
  - type: p
    text: Pretrain only.
- title: 10. Inference and generation
  level: 2
  blocks:
  - type: p
    text: Forward passes / AR teacher forcing scores.
- title: 11. Conditioning
  level: 2
