sections:
- title: 1. Область определения
  level: 2
  blocks:
  - type: p
    text: SE(3)-equivariant сети преобразуют векторы/координаты согласованно с вращением входа.
  - type: p
    text: Inductive bias для structure generation (FrameDiff, DiffAb EpsilonNet, RF structure module). Equivariance ≠ physical correctness.
- title: 2. Интуитивный принцип
  level: 2
  blocks:
  - type: p
    text: Повернули комплекс — сеть должна повернуть предсказанные векторы так же.
- title: 3. Формальная математическая постановка
  level: 2
  blocks:
  - type: math
    latex: f(Rx+t)=R f(x)+t \quad \text{(for point clouds / frames appropriately)}
    caption: 'Equivariance on coordinates. Frames: \(R_i \mapsto R R_i\), origins \(\mapsto R t_i + t\).'
    source: '[PAPER] Thomas et al. TFN; Fuchs SE(3)-Transformer; Yim FrameDiff'
  - type: p
    text: Это уравнение класса методов. Tool-specific отклонения — на страницах инструментов.
