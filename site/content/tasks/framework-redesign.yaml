starting_inputs:
- parent VH/VL or CDRs
generated_objects:
- framework sequence / mutations
generator_classes:
- humanization
strategies:
- name: Iterative mutation humanization
  generates: Mutation set on framework
  representation: Sequence + gene classifiers
  examples:
  - humatch
  limitation: Humanness ≠ immunogenicity
  sampling: Greedy/iterative mutation
  novel_topology: Нет
  integrated_scoring: Humanness/pairing
  complexity_drivers: Число mutable positions
- name: Framework generation from CDRs
  generates: Whole V-region around CDRs
  representation: Sequence diffusion / AR diffusion
  examples:
  - hudiff
  - huabdiffusion
  limitation: Binding retention нужно измерять
  sampling: Diffusion
  novel_topology: Нет
  integrated_scoring: Nativeness
  complexity_drivers: Sampling steps
consequences:
- decision: CDR fixation
