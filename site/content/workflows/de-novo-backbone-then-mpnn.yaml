hardware_runtime: 'GPU practically required for diffusion. Runtime boundary: generation vs AF2
  filter must be separated. Exact hours NR.'
evidence_level: 'RFdiffusion: prospective general protein evidence. Vanilla model fails on antibody
  loops.'
failure_points:
- Hotspot mis-specification.
- Using vanilla RFdiffusion for antibodies.
- Treating pLDDT as affinity.
decision_criteria:
- Antibody? Переходите на RFantibody.
- Ligand atoms? RFdiffusionAA + LigandMPNN.
