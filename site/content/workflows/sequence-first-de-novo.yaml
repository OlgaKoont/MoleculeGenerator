- name: In-model ranking
  architecture_class: Likelihood
  what_happens: Sequences сортируются по model likelihood
  generation_or_evaluation: evaluation
  generator: null
  intermediate_object: Ranked sequences
  alternatives: []
  node_links: []
- name: Structure prediction
  architecture_class: External predictor
  what_happens: Независимая оценка fold plausibility
  generation_or_evaluation: external_evaluation
  generator: null
  intermediate_object: Predicted structures
  alternatives:
  - alphafold2
  node_links:
  - alphafold2
- name: Experimental assays
  architecture_class: null
  what_happens: Функция измеряется в wet-lab
  generation_or_evaluation: experiment
  generator: null
  intermediate_object: Assay hits
  alternatives: []
  node_links:
  - experimental-assays
hardware_runtime: Sequence LM обычно легче 3D diffusion. Точные GPU/runtime — NR в матрице.
evidence_level: 'Зависит от инструмента: ProGen2/ESM3 prospective function; EvoDiff in silico.'
failure_points:
- Likelihood принимает неструктурируемые sequences.
- Family tag слишком грубый.
- Нет antibody-specific evidence у общих LM.
decision_criteria:
- Нужен ли 3D control? Если да — не этот workflow.
- Есть ли family corpus для fine-tuning?
