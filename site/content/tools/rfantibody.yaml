detailed_architecture:
  summary_card:
    Base architecture: RFdiffusion (Ab) + ProteinMPNN + RF2
    Model type: Multi-stage generative workflow
    Representation: SE(3) frames, then residue graph
    Generation unit: CDR frames then amino-acid tokens
    Conditioning: Target, hotspots, fixed framework, CDR lengths
    Output: Sequence–structure antibody–target proposals
    Sampling: Diffusion trajectories + MPNN sampling
    Internal scorer: RF2 confidence / self-consistency
    Structure generation: Да (CDRs/backbone)
  input_representation: Target structure + epitope hotspots + fixed antibody framework + CDR length
    contigs. Framework coordinates are clamped; CDRs are generated.
  encoder: Equivariant RoseTTAFold-derived trunk as diffusion denoiser. ProteinMPNN is a separate
    encoder/decoder on the resulting backbone. RF2 is not a generator.
  latent_or_generative_state: Continuous noisy 3D frames for designed CDR residues, then discrete
    sequence tokens.
  conditioning_mechanism: Coordinate clamping of framework and target; hotspot residue constraints;
    contig specification of CDR lengths; VHH vs scFv format choice.
  generation_mechanism: 1) Зашумляются CDR frames. 2) Forward process — SE(3) noise as in RFdiffusion.
    3) Denoiser предсказывает cleaner frames. 4) Число sampling steps — implementation/default, exact
    default NR here. 5) Framework и target фиксируются. 6) Sequence назначается MPNN после backbone.
    7) RF2 фильтрует комплексы.
  training_objectives: Antibody-fine-tuned diffusion objective on structural data; MPNN CE; RF2 trained
    as structure/complex predictor. Do not collapse these losses into one 'affinity loss'.
  integrated_evaluation: RF2 is an integrated complex predictor/filter. AF3 is described as retrospective/recommended
    external filter. Neither is experimental affinity. Display/SPR remain mandatory for binding claims.
  architectural_limitations:
  - feature: Fixed framework
    limitation: Нет global Fv redesign.
  - feature: Diffusion with many steps
    limitation: Высокая inference cost.
  - feature: Hotspot-conditioned generation
    limitation: Ошибка epitope mapping почти фатальна.
  - feature: Integrated RF2 ranking
    limitation: Возможна miscalibration вне training distribution.
  - feature: No negative antigen examples as primary objective
    limitation: Специфичность не доказана генератором.
