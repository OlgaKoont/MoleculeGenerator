detailed_architecture:
  summary_card:
    Base architecture: ESM-IF1
    Model type: Inverse folding
    Representation: Residue graph + backbone coordinates
    Generation unit: Amino-acid token
    Conditioning: Backbone, chain identity, antigen context
    Output: Conditional sequence distribution
    Sampling: Temperature-based categorical sampling
    Internal scorer: Model log-likelihood
    Structure generation: Нет
  input_representation: 'На вход подаётся не «просто структура», а backbone-level residue graph: координаты
    тяжёлых атомов остова, маски проектируемых позиций, идентификаторы цепей и, опционально, antigen
    coordinates. Author-reported: Fv and VHH supported; optional antigen context.'
  encoder: 'Геометрический GVP encoder из ESM-IF1 кодирует локальные ориентации и расстояния. Implementation-derived
    interpretation: antibody fine-tune не меняет сам класс encoder, а адаптирует веса к SAbDab-like
    structures.'
  latent_or_generative_state: Дискретные amino-acid tokens. Геометрия не сэмплируется.
  conditioning_mechanism: Coordinate conditioning через geometric edges; residue-level masks; framework
    можно фиксировать; antigen — optional geometric context, не sequence-only prompt.
  generation_mechanism: Autoregressive decoding по residues либо masked redesign выбранных CDR/framework
    позиций. Backbone остаётся clamped.
  training_objectives: Cross-entropy sequence recovery. Negative non-binding antigens не используются
    как training signal (NR / not claimed).
  integrated_evaluation: 'Likelihood ranking is post hoc relative to geometry: it does not update
    backbone. No docking, no AF in-loop required. Zero-shot affinity correlation must not be read
    as demonstrated affinity improvement.'
  architectural_limitations:
  - feature: Fixed-backbone conditioning
    limitation: Нельзя исследовать новую CDR topology.
  - feature: Residue-level representation
    limitation: Full-atom interactions моделируются лишь косвенно.
  - feature: Training on antibody structures
    limitation: Dataset bias и слабое покрытие редких formats возможны.
  - feature: Likelihood ranker
    limitation: Learned score может быть miscalibrated вне training distribution.
