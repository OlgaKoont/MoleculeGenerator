detailed_architecture:
  summary_card:
    Base architecture: MPNN
    Model type: Inverse folding
    Representation: Residue kNN graph + backbone coordinates
    Generation unit: Amino-acid token
    Conditioning: Backbone, masks, biases, tied residues
    Output: Conditional sequence distribution
    Sampling: Autoregressive temperature sampling
    Internal scorer: Log-probability
    Structure generation: Нет
  input_representation: Только backbone geometry, не full-atom side chains (side chains are not generated
    as the primary object). Ligand atoms are not native — see LigandMPNN.
  encoder: Message passing on a geometric kNN graph constructed from backbone atoms.
  latent_or_generative_state: Discrete sequence; coordinates remain user-supplied.
  conditioning_mechanism: Masks, amino-acid composition bias, tied positions across symmetric subunits,
    multi-chain edges.
  generation_mechanism: Random decoding order autoregression. Runtime grows with chain length, not
    with diffusion steps.
  training_objectives: CE on native sequences given backbone. Not an affinity or ddG loss.
  integrated_evaluation: No structure predictor inside. Self-consistency folding is external. Likelihood
    is fold compatibility, not binding.
  architectural_limitations:
  - feature: Fixed backbone
    limitation: Не изобретает fold/interface geometry.
  - feature: General PDB prior
    limitation: Не antibody-specialized; CDR loops may be off-distribution.
  - feature: Autoregressive decoding
    limitation: Ошибки ранних residues влияют на последующие.
