detailed_architecture:
  summary_card:
    Base architecture: Equivariant joint diffusion
    Model type: CDR sequence–structure co-design
    Representation: Residue type + Cα + orientation
    Generation unit: Joint residue state
    Conditioning: Antigen–antibody complex, CDR mask, fixed framework
    Output: CDR sequence and geometry
    Sampling: Iterative denoising
    Internal scorer: Energy/structure metrics (evaluation)
    Structure generation: Да
  input_representation: 'Полный complex context: antigen residues и antibody framework как observed
    nodes; CDR nodes зашумлены. Это не sequence-only prompt.'
  encoder: Equivariant GNN/transformer denoiser operating on 3D residues (Author-reported). Pairwise
    geometric edges to antigen provide target conditioning.
  latent_or_generative_state: 'Joint discrete–continuous noisy state: amino-acid category, Cα coordinate,
    orientation frame.'
  conditioning_mechanism: Coordinate clamping of non-designed residues; residue masks; geometric edges
    to epitope; no classifier-guidance affinity head in the primary generator.
  generation_mechanism: '1) Зашумляются type, Cα и orientation designed residues. 2) Forward: discrete
    corruption + Gaussian/SO(3) noise. 3) Denoiser предсказывает cleaner type/geometry. 4) Sampling
    steps — paper/code default, exact number NR here. 5) Framework/antigen фиксированы. 6) Sequence
    и structure обновляются совместно. 7) Кандидат — decoded CDR on the given framework.'
  training_objectives: Combined diffusion losses. No experimental ddG labels required. Training on
    SAbDab-like complexes implies dataset bias.
  integrated_evaluation: Primary paper is retrospective/in silico. Energy scores are evaluation, not
    measured affinity. Repository archived/read-only.
  architectural_limitations:
  - feature: Requires complex structural context
    limitation: Не стартует от одной antigen sequence.
  - feature: Diffusion with many steps
    limitation: Высокая inference cost.
  - feature: SAbDab training
    limitation: Смещение по solved complexes и обычным formats.
  - feature: No prospective wet-lab in primary paper
    limitation: Нельзя считать therapeutic generator proven.
