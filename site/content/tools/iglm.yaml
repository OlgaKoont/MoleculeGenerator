detailed_architecture:
  summary_card:
    Base architecture: Autoregressive infilling Transformer
    Model type: Antibody sequence LM
    Representation: Tokens
    Generation unit: Amino-acid token
    Conditioning: Species, chain type, span context
    Output: Sequence
    Sampling: Autoregressive
    Internal scorer: Likelihood
    Structure generation: Нет
  input_representation: Sequence tokens only. No antigen, no coordinates, no paired VH/VL tokenisation
    in the base generator.
  generation_mechanism: Infilling uses both left and right context of a span, unlike left-to-right
    ProGen-style models.
  integrated_evaluation: Likelihood/naturalness only. Pairing, structure, developability and binding
    are external.
  architectural_limitations:
  - feature: Sequence-only generation
    limitation: Нет прямой геометрической согласованности.
  - feature: Independent chain generation
    limitation: Не обеспечивает joint VH/VL pairing.
  - feature: No antigen conditioning
    limitation: Не target-specific generator.
